        <div class="ritem-main"><div class="ritem-name">${nameHtml(line?line.producto:ev.producto)}</div><div class="ritem-meta">${meta}</div></div>
        <div><div class="ritem-qty">${now!==orig?`<s>${fmtQty(orig,kp)}</s>`:''}${fmtQty(now,kp)} <small>${unitOf(kp)}</small></div>
          ${editing?'':`<button class="corr-btn" onclick="startCorregir('${escapeHtml(u)}')">Corregir</button>`}</div>
      </div>${editing?corrBoxHtml(ev, kp, now):''}</div>`;
  }).join('');
}
function corrBoxHtml(ev, kp, now){
  return `<div class="corr-box">
    <label class="qty-label">Cantidad correcta de este escaneo (${unitOf(kp)}) — registraste ${fmtQty(now,kp)}</label>
    <input id="corr-qty" class="text-input" type="text" inputmode="${kp==='Kg'?'decimal':'numeric'}" autocomplete="off" placeholder="${kp==='Kg'?'0.00':'0'}">
    <select id="corr-motivo"><option value="">Motivo…</option>${MOTIVOS.map(m=>`<option>${m}</option>`).join('')}</select>
    <div class="qty-err" id="corr-err"></div>
    <div class="pcard-actions"><button class="btn btn-secondary" onclick="cancelCorregir()">Cancelar</button><button class="btn btn-primary" onclick="saveCorregir()">Guardar corrección</button></div>
  </div>`;
}
function startCorregir(u){
  if(S.current) cancelCard();
  S.corrigiendo=u; renderRecent();
  const i=document.getElementById('corr-qty'); if(i) setTimeout(()=>i.focus(),40);
}
function cancelCorregir(){ S.corrigiendo=null; renderRecent(); focusScan(); }
function saveCorregir(){
  if(S.closedInfo){ toast('Esta recepción ya se cerró'); cancelCorregir(); return; }
  const ev=S.events.find(e=>e.tipo==='scan' && e.detalle && e.detalle.uid===S.corrigiendo); if(!ev) return;
  const kp=kgpzOf(ev), before=scanQtyNow(ev), err=document.getElementById('corr-err');
  const nv=parseQty(document.getElementById('corr-qty').value, kp, true), motivo=document.getElementById('corr-motivo').value;
  if(nv==null){ err.textContent=kp==='Kg'?'Escribe el peso correcto (hasta 2 decimales, 0 si no era).':'Escribe las piezas correctas (0 si no era este producto).'; return; }
  if(nv===before){ err.textContent='Es la misma cantidad que ya tenía.'; return; }
  if(!motivo){ err.textContent='Elige el motivo.'; return; }
  recordEvent(makeEvent('ajuste', { sku_key:ev.sku_key, producto:ev.producto, cantidad:round2(nv-before), metodo:ev.metodo,
    detalle:{ ref:ev.detalle.uid, antes:before, despues:nv, motivo, kgpz:kp } }));
  S.corrigiendo=null; renderRecibir();
  toast(`✓ Corregido: ${fmtQty(before,kp)} → ${fmtQty(nv,kp)} ${unitOf(kp)}`);
  focusScan();
}

/* ── Sheets: Sin código (§7.3) and Pendientes (§6.3) ── */
function openSheet(title, html){
  document.getElementById('sheet-title').textContent=title;
  document.getElementById('sheet-body').innerHTML=html;
  document.getElementById('sheet').classList.add('open');
}
function closeSheet(){
  const s=document.getElementById('sheet'); if(!s.classList.contains('open')) return;
  s.classList.remove('open'); document.getElementById('sheet-body').innerHTML=''; focusScan();
}
function openSinCodigo(){
  openSheet('Buscar producto sin código', `<input id="sc-input" class="text-input" placeholder="Escribe parte del nombre (ej. almen 100)" autocomplete="off" autocorrect="off" spellcheck="false">
    <div id="sc-results" style="margin-top:10px"><div class="muted">Los productos del envío aparecen primero.</div></div>`);
  const i=document.getElementById('sc-input');
  let t=null; i.addEventListener('input', ()=>{ clearTimeout(t); t=setTimeout(()=>renderSearch(i.value), 120); });
  setTimeout(()=>i.focus(), 60);
}
let _searchHits=[];
function searchProducts(q){
  const words=normName(q).split(' ').filter(Boolean); if(!words.length) return [];
  const hit=n=>words.every(w=>n.includes(w));
  const inEnv=[], rest=[];
  for(const l of S.lines.values()) if(hit(l._n)) inEnv.push(l);
  for(const c of S.catalog.values()) if(hit(c._n) && !S.lines.has('name:'+c._n)) rest.push(c);
  const byName=(a,b)=>a._n.localeCompare(b._n);
  inEnv.sort(byName); rest.sort(byName);
  return inEnv.map(l=>({ p:l, env:true })).concat(rest.slice(0, Math.max(10, 40-inEnv.length)).map(c=>({ p:c, env:false })));
}
function renderSearch(q){
  const el=document.getElementById('sc-results'); if(!el) return;
  _searchHits=searchProducts(q);
  if(!String(q).trim()){ el.innerHTML='<div class="muted">Los productos del envío aparecen primero.</div>'; return; }
  if(!_searchHits.length){ el.innerHTML='<div class="muted">Sin resultados. Prueba con menos letras o otra palabra.</div>'; return; }
  // Still blind: never a quantity here
  el.innerHTML=_searchHits.map((h,i)=>{
    const pos=positionOf(h.p.barcode, h.p.producto);
    return `<button class="res-item ${h.env?'':'grey'}" onclick="pickSearch(${i})">${imgTag(h.p.barcode, h.p.producto, 'thumb')}
      <div style="flex:1;min-width:0"><div class="res-name">${nameHtml(h.p.producto)}</div>
      <div class="res-sub">${h.env?'<span class="tag green">viene en el envío</span> ':'no viene en el envío · '}${h.p.kgpz==='Kg'?'Kg':'Pz'}${pos?' · '+escapeHtml(pos.full):''}</div></div></button>`;
  }).join('');
}
async function pickSearch(i){
  const h=_searchHits[i]; if(!h) return;
  closeSheet();
  if(h.env) openCard({ ...h.p, enEnvio:true }, 'manual');
  else if(S.envio.sinArchivo) openCard(sinArchivoProduct(h.p), 'manual');
  else await notInEnvio(h.p, 'manual', {});
}
/* ── §6.2b Revisar ahora: once the file arrives, every check runs over what was scanned without it ── */
function revisarItems(){
  if(!S.envio || S.envio.sinArchivo) return [];
  const pre=new Set(), done=new Set();
  for(const e of S.events){
    if(e.tipo==='scan' && e.detalle && e.detalle.esperado===null) pre.add(e.sku_key);
    if((e.tipo==='confirmacion' && e.detalle && e.detalle.revisar) || (e.tipo==='ajuste' && e.detalle && e.detalle.origen==='revisar')) done.add(e.sku_key);
  }
  const out=[];
  for(const sku of pre){
    if(done.has(sku)) continue;
    const rec=recibidoDe(sku), line=S.lines.get(sku);
    if(!line){ if(rec>0){ const ne=S.noEsperados.get(sku); out.push({ sku, tipo:'no_esperado', producto:ne?ne.producto:sku, kgpz:ne?ne.kgpz:'Pz', barcode:sku.startsWith('name:')?'':sku, rec }); } continue; }
    const base={ sku, producto:line.producto, kgpz:line.kgpz, barcode:line.barcode, rec };
    if(overEnviado(line, rec)) out.push({ ...base, tipo:'sobrante' });
    else if(rec>0 && siblingsOf(line).length) out.push({ ...base, tipo:'hermano', sibs:siblingsOf(line) });
  }
  return out;
}
const REVISAR_TXT={ no_esperado:'No viene en el envío.', sobrante:'Registraste más de lo enviado.' };
function openRevisar(){
  const items=revisarItems();
  if(!items.length){ closeSheet(); toast('✓ Todo revisado'); renderRecibir(); return; }
  openSheet(`Revisar ahora · ${items.length}`, `<div class="muted" style="margin-bottom:10px">Esto se escaneó antes de subir el archivo. Revisa cada uno: recuéntalo o confirma que está bien.</div>`
    +items.map(it=>`<div class="ritem" style="margin-bottom:8px"><div class="ritem-row">${imgTag(it.barcode, it.producto, 'thumb')}
      <div class="ritem-main"><div class="ritem-name">${nameHtml(it.producto)}</div>
      <div class="ritem-meta" style="color:var(--orange);font-weight:700">${it.tipo==='hermano'?'También viene '+escapeHtml(it.sibs.map(s=>s.producto).join(', '))+'. ¿Contaste por separado?':REVISAR_TXT[it.tipo]}</div>
      <div class="ritem-meta">Registraste ${fmtQty(it.rec,it.kgpz)} ${unitOf(it.kgpz)}</div></div></div>
      <div class="pcard-actions"><button class="btn btn-secondary" onclick="openRecount('${escapeHtml(it.sku)}','revisar')">🔁 Recontar</button><button class="btn btn-primary" onclick="revisarConfirmo('${escapeHtml(it.sku)}','${it.tipo}')">Confirmo</button></div></div>`).join(''));
}
function revisarConfirmo(sku, tipo){
  const it=revisarItems().find(x=>x.sku===sku); if(!it) return;
  recordEvent(makeEvent('confirmacion', { sku_key:sku, producto:it.producto, cantidad:it.rec, detalle:{ revisar:tipo, recibido:it.rec, kgpz:it.kgpz } }));
  renderRecibir(); openRevisar();
}
function openPendientes(){
  if(S.envio.sinArchivo){ openSheet('Pendientes', '<div class="empty-hint">Los pendientes aparecen cuando subas el archivo del envío.</div>'); return; }
  const pend=[...S.lines.values()].filter(l=>!(recibidoDe(l.sku_key)>0)).map(l=>({ l, pos:positionOf(l.barcode, l.producto) }));
  pend.sort((a,b)=>(a.pos?a.pos.full:'~').localeCompare(b.pos?b.pos.full:'~', 'es', {numeric:true}) || a.l._n.localeCompare(b.l._n));

  openSheet(`Pendientes · ${pend.length}`, pend.length
    ? `<div class="muted" style="margin-bottom:10px">Productos del envío que aún no escaneas.</div>`+pend.map(({l,pos})=>`<div class="res-item" style="cursor:default">
        <div class="res-pos">${pos?escapeHtml(pos.letra):'—'}</div>${imgTag(l.barcode, l.producto, 'thumb')}
        <div style="flex:1;min-width:0"><div class="res-name">${nameHtml(l.producto)}</div><div class="res-sub">${pos?escapeHtml(pos.full)+' · ':''}${l.kgpz==='Kg'?'Kg':'Pz'}${l.barcode?'':' · sin código'}</div></div></div>`).join('')
    : `<div class="empty-hint">🎉 Ya escaneaste todos los productos del envío.</div>`);
}

/* ════════════════════════════════════════════════════════════════════════════════════
   RESUMEN Y CIERRE (§6.5, §7.6, §9) — enviado is revealed only here. Every difference is answered one
   by one ("Recontar" / "Confirmo la diferencia"); there is no confirm-all (rule 2).
   ════════════════════════════════════════════════════════════════════════════════════ */
const ESTADO_CLS={ 'Completo':'ok', 'Completo (variación de báscula)':'ok', 'Faltante':'bad', 'No esperado':'bad', 'Parcial':'mid', 'Sobrante':'mid' };
function estadoDe(kgpz, env, rec){
  if(!(rec>0)) return 'Faltante';
  const d=round2(rec-env);
  if(d===0) return 'Completo';
  if(kgpz==='Kg' && Math.abs(d)<=kgTol(env)+1e-9) return 'Completo (variación de báscula)';
  return d<0 ? 'Parcial' : 'Sobrante';
}
function summaryRows(){
  const rows=[];
  for(const l of [...S.lines.values()].sort((a,b)=>a.rowIndex-b.rowIndex)){
    const rec=recibidoDe(l.sku_key);
    rows.push({ sku:l.sku_key, producto:l.producto, barcode:l.barcode, kgpz:l.kgpz, env:l.esperado, rec, dif:round2(rec-l.esperado), estado:estadoDe(l.kgpz, l.esperado, rec), rowIndex:l.rowIndex });
  }
  for(const [sku, ne] of S.noEsperados){
    const rec=recibidoDe(sku);
    if(rec>0) rows.push({ sku, producto:ne.producto, barcode:sku.startsWith('name:')?'':sku, kgpz:ne.kgpz, env:0, rec, dif:rec, estado:'No esperado', rowIndex:1e9 });
  }
  return rows;
}
function isDelta(r){ return ESTADO_CLS[r.estado]!=='ok'; }
// A confirmation counts only while the received amount is the one that was confirmed
function ackOf(sku){ let a=null; for(const e of S.events) if(e.tipo==='confirmacion' && e.sku_key===sku && e.detalle && e.detalle.diferencia) a=e; return a; }
function isAcked(r){ const a=ackOf(r.sku); return !!a && round2(a.detalle.recibido)===r.rec; }
function kgStats(rows){
  const kg=(rows||summaryRows()).filter(r=>r.kgpz==='Kg' && r.env>0 && r.rec>0);
  return { n:kg.length, exact:kg.filter(r=>r.dif===0).length, whole:kg.filter(r=>Number.isInteger(r.rec)).length, rows:kg };
}
function kgSinVariacionConfirmado(){ return S.events.some(e=>e.tipo==='confirmacion' && e.detalle && e.detalle.kg_sin_variacion); }
// §7.6 badges carried by the reception (Recepciones, Admin, report CSV)
function receptionBadges(rows){
  const k=kgStats(rows), out=[];
  if(kgSinVariacionConfirmado()) out.push('Kg sin variación');
  if(k.n>=3 && k.whole>=0.8*k.n) out.push('Kg en números enteros');
  return out;
}
function receptoresDeSesion(){ const s=new Set(); for(const e of S.events) if(e.receptor && (e.tipo==='scan'||e.tipo==='ajuste')) s.add(e.receptor); if(!s.size && S.receptor) s.add(S.receptor); return [...s]; }

function sumRowHtml(r, inner){

function renderResumen(){
  const el=document.getElementById('resumen-body');
  const rows=summaryRows(), deltas=rows.filter(isDelta), oks=rows.filter(r=>!isDelta(r));
  const pend=deltas.filter(r=>!isAcked(r)), rev=revisarItems();
  // deltas first: unanswered on top, biggest gaps first
  deltas.sort((a,b)=>(isAcked(a)-isAcked(b)) || Math.abs(b.dif)-Math.abs(a.dif));
  let h=`<h2>Resumen y cierre</h2><div class="stat-grid">
    <div class="stat"><div class="stat-n">${S.lines.size}</div><div class="stat-l">productos en el envío</div></div>
    <div class="stat"><div class="stat-n">${oks.length}</div><div class="stat-l">completos</div></div>
    <div class="stat"><div class="stat-n">${deltas.length}</div><div class="stat-l">con diferencia</div></div>
    <div class="stat"><div class="stat-n" style="color:${pend.length?'var(--orange)':'var(--green-dark)'}">${pend.length}</div><div class="stat-l">por confirmar</div></div></div>`;
  if(OUTBOX.length) h+=`<div class="warn-box">Hay ${OUTBOX.length} registro(s) sin subir. Conéctate a internet para poder cerrar.</div>`;
  if(rev.length) h+=`<button class="btn btn-warn btn-block" style="margin-bottom:10px" onclick="backToRecibir();openRevisar()">⚠ Revisar ahora · ${rev.length}</button>`;
  if(deltas.length){
    h+=`<div class="section-title">Diferencias · ${deltas.length}</div><div class="muted" style="margin-bottom:8px">Contesta cada una: recuenta el producto o confirma la diferencia.</div>`;
    h+=deltas.map(r=>{ const ok=isAcked(r), a=ackOf(r.sku);
      return `<div class="sum-row ${ok?'acked':'delta'}">${sumRowHtml(r, ok
        ? `<div class="ritem-meta" style="margin-top:6px;color:var(--green-dark);font-weight:700">✓ Diferencia confirmada por ${escapeHtml(a.receptor||'')} · <button class="corr-btn" onclick="resumenRecontar('${escapeHtml(r.sku)}')">Recontar</button></div>`
        : `<div class="pcard-actions" style="grid-template-columns:1fr 1fr"><button class="btn btn-secondary" onclick="resumenRecontar('${escapeHtml(r.sku)}')">🔁 Recontar</button><button class="btn btn-warn" onclick="resumenConfirmo('${escapeHtml(r.sku)}')">Confirmo la diferencia</button></div>`)}</div>`; }).join('');
  } else h+=`<div class="warn-box ok">🎉 Todo llegó completo.</div>`;
  if(oks.length) h+=`<details style="margin-top:14px"><summary class="section-title" style="cursor:pointer">Completos · ${oks.length}</summary>${oks.map(r=>`<div class="sum-row">${sumRowHtml(r)}</div>`).join('')}</details>`;
  const can=!pend.length && !OUTBOX.length && !S.closing;
  h+=`<button class="btn btn-primary btn-block" style="margin-top:18px" ${can?'':'disabled'} onclick="cerrarRecepcion()">${S.closing?'Cerrando…':pend.length?`Faltan ${pend.length} diferencia(s) por contestar`:OUTBOX.length?'Subiendo registros…':'✅ Cerrar recepción'}</button>`;
  el.innerHTML=h;
}

function openRepesar(kgRows){

async function flushAndWait(){ for(let i=0;i<100 && _flushing;i++) await new Promise(r=>setTimeout(r,100)); await flushOutbox(); }
function fileSafe(s){ return normName(s).replace(/ /g,'-') || 'receptor'; }
async function cerrarRecepcion(){
  if(S.closing) return;
  let rows=summaryRows();
  if(rows.filter(isDelta).some(r=>!isAcked(r))) return;
  // §7.6 zero-variance check: ≥3 Kg lines and ≥80% match enviado exactly
  const k=kgStats(rows);
  if(k.n>=3 && k.exact>=0.8*k.n && !kgSinVariacionConfirmado()){
    const v=await showModal({ title:'¿Se pesaron todos los artículos correctamente?',
      html:'<p>Este recibo se reportará a gerencia sin discrepancias en kg.</p>',
      buttons:[{label:'Sí, los pesé todos', value:'si', kind:'primary'}, {label:'Volver a pesar', value:'pesar', kind:'secondary'}] });
    if(v==='pesar'){ openRepesar(k.rows); return; }
    if(v!=='si') return;
    recordEvent(makeEvent('confirmacion', { detalle:{ kg_sin_variacion:true, kg_lineas:k.n, kg_exactas:k.exact } }));
  }
  S.closing=true; renderResumen();
  try{
    await flushAndWait(); if(OUTBOX.length) throw new TypeError('offline');
    await syncServerEvents(); // scans from other phones
    rows=summaryRows();
    if(rows.filter(isDelta).some(r=>!isAcked(r))){ S.closing=false; renderResumen(); toast('Llegaron escaneos de otro teléfono: revisa las diferencias nuevas', 4000); return; }
    const now=serverNow(), badges=receptionBadges(rows), receptores=receptoresDeSesion();
    const path=`reportes/${S.hub}/${S.area}/${S.session.fecha}_${localHM(now).replace(':','-')}_${fileSafe(S.receptor)}.csv`;
    await sbUpload(path, buildReportCsv(rows, badges, receptores), 'text/csv; charset=utf-8');
    const deltas=rows.filter(isDelta);
    const ev=makeEvent('cerrar', { detalle:{ reporte:path, envio:S.envio._path, lineas:S.lines.size, recibidas:rows.filter(r=>r.env>0 && r.rec>0).length,
      diferencias:deltas.length, no_esperados:rows.filter(r=>r.estado==='No esperado').length, badges, receptores } });
    recordEvent(ev); S.closedInfo=closedState(); await flushAndWait();
    S.closing=false;
    toast(OUTBOX.length?'Recepción cerrada — se termina de subir al reconectar':'✓ Recepción cerrada', 3500);
    openRecepcion(Object.assign({ ts:ev.ts, fecha:S.session.fecha, receptor:S.receptor }, ev.detalle), 'inicio');
  }catch(e){
    S.closing=false; renderResumen();
    toast(isNetErr(e)?'Sin conexión: no se pudo cerrar. Intenta de nuevo con internet.':'No se pudo cerrar ('+e.message+')', 4500);
  }
}
/* ── Report CSV (§9): all cells quoted, CRLF; the BOM is added only on browser download ── */
const REPORT_COLS=['Hub','Área','Fecha','Receptor(es)','Producto','Código de barras','Kg/Pz','Posición','Armado','Enviado','Recibido','Diferencia','Estado','Notas (correcciones / confirmaciones)','Alertas'];
function csvCell(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }
function notasDe(sku, kgpz){
  const n=[];
  for(const e of S.events){
    if(e.sku_key!==sku || !e.detalle) continue;
    const d=e.detalle, u=unitOf(kgpz);
    if(e.tipo==='ajuste') n.push(`${d.motivo||'Corrección'}: ${fmtQty(d.antes,kgpz)}→${fmtQty(d.despues,kgpz)} ${u} (${e.receptor||''})`);
    else if(e.tipo==='confirmacion' && d.diferencia) n.push(`Diferencia confirmada con ${fmtQty(d.recibido,kgpz)} ${u} (${e.receptor||''})`);
    else if(e.tipo==='confirmacion' && d.revisar) n.push(`Revisado sin archivo (${e.receptor||''})`);
    else if(e.tipo==='scan' && d.reatribuido_de) n.push(`Escaneado como «${d.reatribuido_de.producto}»`);
    else if(e.tipo==='scan' && d.sobrante) n.push('Se registró arriba de lo enviado tras recontar');
  }
  const r=summaryRows().find(x=>x.sku===sku); if(r && isDelta(r)){ const o=origenDif(r); if(o) n.push(o); }
  return n.join(' · ');
}
function buildReportCsv(rows, badges, receptores){
  const head=REPORT_COLS.map(csvCell).join(',');
  const body=rows.map(r=>{ const pos=positionOf(r.barcode, r.producto), arm=armadoDe(r);
    return [hubName(S.hub), areaName(S.area), S.session.fecha, receptores.join(', '), r.producto, r.barcode, r.kgpz, pos?pos.full:'',
      arm==null?'—':fmtQty(arm,r.kgpz), r.env?fmtQty(r.env,r.kgpz):'0', fmtQty(r.rec,r.kgpz), fmtQty(r.dif,r.kgpz), r.estado, notasDe(r.sku, r.kgpz), badges.join(' · ')].map(csvCell).join(','); });
  return [head].concat(body).join('\r\n')+'\r\n';
}
/* ── §5.3 Armado enrichment (display only). Reads Armado's picks (read-only): the newest order_date within
   3 days of the reception that has rows for this hub. Per sku: latest row per ronda, rondas summed
   (Armado writes one row per confirm, so a re-confirm repeats the sku). Abarrotes only — Carnes isn't
   assembled in Armado yet. S.armado: Map sku→qty, or null = no data ("—"). ── */
const ARMADO_HUB={ 'test-hub':'MH Contry' }; // local tests borrow MH Contry's assembly
async function loadArmado(){
  S.armado=null; S.armadoFecha=null;
  if(S.area!=='abarrotes' || !S.session) return;
  const hub=ARMADO_HUB[S.hub]||hubName(S.hub), hasta=S.session.fecha;
  const desde=localDateStr(new Date(Date.parse(hasta+'T12:00:00Z')-3*86400000));
  try{
    const rows=await pgSelectAll('picks', `hub=eq.${encodeURIComponent(hub)}&order_date=gte.${desde}&order_date=lte.${hasta}&select=id,sku_key,cantidad,ronda,order_date,unidad`);
    if(!rows.length) return;
    const od=rows.reduce((m,r)=>r.order_date>m?r.order_date:m, '');
    const last=new Map(); // `${sku}|${ronda}` → row with the highest id
    for(const r of rows){ if(r.order_date!==od) continue; const k=r.sku_key+'|'+r.ronda, p=last.get(k); if(!p || r.id>p.id) last.set(k,r); }
    const m=new Map();
    for(const r of last.values()){
      const sku=String(r.sku_key||'').startsWith('norm:') ? 'name:'+String(r.sku_key).slice(5) : codeKey(r.sku_key);
      m.set(sku, round2((m.get(sku)||0)+(Number(r.cantidad)||0)));
    }
    S.armado=m; S.armadoFecha=od;
  }catch(_){ S.armado=null; }
}
function armadoDe(r){ if(!S.armado) return null; return S.armado.get(r.sku) ?? 0; }
// Where a difference comes from (§5.3) — only when there is Armado data
function origenDif(r){
  const a=armadoDe(r); if(a==null || !r.env) return '';
  const eq=(x,y)=>Math.abs(x-y)<=(r.kgpz==='Kg'?kgTol(r.env):0);
  if(!eq(a, r.env)) return `Armado ${fmtQty(a,r.kgpz)} ≠ enviado: error al registrar la salida en CH.`;
  if(!eq(r.env, r.rec) && eq(a, r.rec)) return 'Coincide con lo armado: error de registro, no físico.';
  if(!eq(r.env, r.rec)) return 'Armado = enviado ≠ recibido: pérdida física o error de recepción.';
  return '';
}

/* ── §6.4 Canastas (pre-sort): what was received, grouped by aisle letter. Read-only. ── */
function openCanastas(){
  const groups=new Map();
  const add=(sku, producto, barcode, kgpz)=>{
    const rec=recibidoDe(sku); if(!(rec>0)) return;
    const pos=positionOf(barcode, producto), k=pos?pos.letra:'Sin posición';
    if(!groups.has(k)) groups.set(k, []);
    groups.get(k).push({ producto, barcode, kgpz, rec, pos });
  };
  for(const l of S.lines.values()) add(l.sku_key, l.producto, l.barcode, l.kgpz);
  for(const [sku, ne] of S.noEsperados) add(sku, ne.producto, sku.startsWith('name:')?'':sku, ne.kgpz);
  const keys=[...groups.keys()].sort((a,b)=>a==='Sin posición'?1:b==='Sin posición'?-1:a.localeCompare(b,'es',{numeric:true}));
  if(!keys.length){ openSheet('Canastas', '<div class="empty-hint">Todavía no hay productos recibidos.</div>'); return; }
  openSheet('Canastas', `<div class="muted" style="margin-bottom:10px">Lo recibido agrupado por pasillo, para acomodarlo.</div>`
    +keys.map(k=>{ const it=groups.get(k).sort((a,b)=>(a.pos?a.pos.full:'').localeCompare(b.pos?b.pos.full:'','es',{numeric:true}));
      return `<details class="info-card" style="padding:10px 12px"><summary style="cursor:pointer;display:flex;align-items:center;gap:10px">
        <span class="res-pos" style="font-size:28px">${escapeHtml(k==='Sin posición'?'—':k)}</span><b style="flex:1">${escapeHtml(k==='Sin posición'?'Sin posición':(FREEZER_AISLE_RE.test(k)?'Congelador ':'Pasillo ')+k)}</b><span>${it.length} producto${it.length===1?'':'s'}</span></summary>
        ${it.map(x=>`<div class="ritem-row" style="margin-top:8px">${imgTag(x.barcode, x.producto, 'thumb')}<div class="ritem-main"><div class="ritem-name">${nameHtml(x.producto)}</div>
          <div class="ritem-meta">${x.pos?escapeHtml(x.pos.full):'sin posición'}</div></div><div class="ritem-qty">${fmtQty(x.rec,x.kgpz)} <small>${unitOf(x.kgpz)}</small></div></div>`).join('')}</details>`; }).join(''));
}

/* ════════════════════════════════════════════════════════════════════════════════════
   RECEPCIONES (§6.6) — this hub+área's closed receptions (last 30 days). Opening one shows the final
   report with big Recibido numbers, tick boxes, search, filters, sort and Descargar CSV.
   ════════════════════════════════════════════════════════════════════════════════════ */
let RV=null; // { info, rows, csv, f:{q,solo,estado,kgpz,pasillo,sort} }
async function listCerradas(slug, area, days=30){
  const desde=localDateStr(new Date(serverNow().getTime()-days*86400000));
  const q=`tipo=in.(cerrar,admin)&fecha=gte.${desde}${slug?`&hub=eq.${encodeURIComponent(slug)}`:''}${area?`&area=eq.${area}`:''}&select=*&order=id.desc`;
  const evs=await pgSelectAll('rec_events', q);
  // latest state per session: a later admin "reabrir" hides the close
  const seen=new Map();
  for(const e of evs){
    if(seen.has(e.session_id)) continue;
    if(e.tipo==='cerrar') seen.set(e.session_id, Object.assign({ ts:e.ts, fecha:e.fecha, hub:e.hub, area:e.area, receptor:e.receptor, session_id:e.session_id }, e.detalle||{}));
    else if(e.detalle && e.detalle.accion==='reabrir') seen.set(e.session_id, null);
  }
  return [...seen.values()].filter(Boolean);
}

      env:parseNum(g('Enviado')), rec:parseNum(g('Recibido')), dif:parseNum(g('Diferencia')), estado:g('Estado'), notas:g('Notas (correcciones / confirmaciones)'), _n:normName(g('Producto')) }; });
  let ticks=new Set(); try{ ticks=new Set(JSON.parse(localStorage.getItem('mr_ticks_'+info.reporte)||'[]')); }catch(_){}
  RV={ info, rows, csv, ticks, f:{ q:'', solo:false, estado:'', kgpz:'', pasillo:'', sort:'archivo' } };
  renderRecepcion();
}
function rvSet(k, v){ RV.f[k]=v; renderRecepcionRows(); }
function rvTick(i){
  RV.ticks.has(i)?RV.ticks.delete(i):RV.ticks.add(i);
  try{ localStorage.setItem('mr_ticks_'+RV.info.reporte, JSON.stringify([...RV.ticks])); }catch(_){}
  renderRecepcionRows();
}
function renderRecepcion(){
  const I=RV.info, pas=[...new Set(RV.rows.map(r=>r.pasillo).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es',{numeric:true}));
  const est=[...new Set(RV.rows.map(r=>r.estado))];
  document.getElementById('recep-body').innerHTML=`<h2>Recepción del ${fechaLarga(I.fecha)}</h2>
    <div class="info-card">Cerrada a las ${localHM(new Date(I.ts))} por ${escapeHtml((I.receptores||[I.receptor]).join(', '))}<br>
      ${I.lineas||0} productos · ${I.diferencias?`<b style="color:var(--orange)">${I.diferencias} con diferencia</b>`:'sin diferencias'}${I.no_esperados?` · ${I.no_esperados} no esperado(s)`:''}
      <div>${(I.badges||[]).map(b=>`<span class="badge-warn">${escapeHtml(b)}</span>`).join('')}</div></div>
    <button class="btn btn-secondary btn-block" onclick="descargarReporte()">⬇ Descargar CSV</button>
    <input class="text-input" style="margin-top:12px" placeholder="Buscar producto…" oninput="rvSet('q',this.value)" autocomplete="off">
    <div class="filters">
      <select onchange="rvSet('solo',this.value==='1')"><option value="">Todos</option><option value="1">Solo diferencias</option></select>
      <select onchange="rvSet('estado',this.value)"><option value="">Estado</option>${est.map(e=>`<option>${escapeHtml(e)}</option>`).join('')}</select>
      <select onchange="rvSet('kgpz',this.value)"><option value="">Kg/Pz</option><option>Kg</option><option>Pz</option></select>
      <select onchange="rvSet('pasillo',this.value)"><option value="">Pasillo</option>${pas.map(p=>`<option>${escapeHtml(p)}</option>`).join('')}</select>
      <select onchange="rvSet('sort',this.value)"><option value="archivo">Orden del archivo</option><option value="az">A-Z</option><option value="pasillo">Pasillo</option><option value="dif">Diferencia</option></select>
    </div>
    <div class="muted" id="rv-count" style="margin-bottom:8px"></div><div id="rv-rows"></div>`;
  renderRecepcionRows();
}
function renderRecepcionRows(){
  const f=RV.f, words=normName(f.q).split(' ').filter(Boolean);
  let rows=RV.rows.filter(r=>(!words.length || words.every(w=>r._n.includes(w)))
    && (!f.solo || !/^Completo/.test(r.estado)) && (!f.estado || r.estado===f.estado) && (!f.kgpz || r.kgpz===f.kgpz) && (!f.pasillo || r.pasillo===f.pasillo));
  const cmp={ archivo:(a,b)=>a.i-b.i, az:(a,b)=>a._n.localeCompare(b._n), pasillo:(a,b)=>(a.pos||'~').localeCompare(b.pos||'~','es',{numeric:true})||a.i-b.i, dif:(a,b)=>Math.abs(b.dif)-Math.abs(a.dif)||a.i-b.i }[f.sort];
  rows=rows.slice().sort(cmp);
  document.getElementById('rv-count').textContent=`${rows.length} producto(s) · ${RV.ticks.size} de ${RV.rows.length} marcados`;
  document.getElementById('rv-rows').innerHTML=rows.map(r=>{ const u=unitOf(r.kgpz), on=RV.ticks.has(r.i);
    return `<div class="sum-row ${on?'ticked':''} ${/^Completo/.test(r.estado)?'':'delta'}"><div class="ritem-row">
      <input type="checkbox" class="chk" ${on?'checked':''} onchange="rvTick(${r.i})">${imgTag(r.barcode, r.producto, 'thumb')}
      <div class="ritem-main"><div class="ritem-name">${nameHtml(r.producto)}</div><div class="ritem-meta">${escapeHtml(r.barcode||'sin código')}${r.pos?' · '+escapeHtml(r.pos):''}</div></div>
      <div style="text-align:right"><div style="font-size:30px;font-weight:900;color:var(--green-dark)">${fmtQty(r.rec,r.kgpz)}</div><div class="ritem-meta">${u} recibido</div></div></div>
      <div class="ritem-meta" style="margin-top:4px">Enviado ${fmtQty(r.env,r.kgpz)}${r.armado&&r.armado!=='—'?' · Armado '+escapeHtml(r.armado):''} · Dif ${r.dif>0?'+':''}${fmtQty(r.dif,r.kgpz)} · <span class="estado ${ESTADO_CLS[r.estado]||'mid'}">${escapeHtml(r.estado)}</span></div>
      ${r.notas?`<div class="ritem-meta">${escapeHtml(r.notas)}</div>`:''}</div>`; }).join('') || '<div class="empty-hint">Nada coincide con el filtro.</div>';
}
function descargarReporte(){
  const blob=new Blob(['﻿'+RV.csv], { type:'text/csv;charset=utf-8' });
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=RV.info.reporte.split('/').pop();
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);

/* ════════════════════════════════════════════════════════════════════════════════════
   ADMIN (§6.8) + ALERTAS (§6.9). PIN read from recibo/config/admin_pin.txt, kept in memory for this visit
   only. No hard deletes: every admin action on a reception is itself an event (tipo='admin').
   ════════════════════════════════════════════════════════════════════════════════════ */
const ADM={ ok:false, tab:'recep', hub:'mh-contry', area:'abarrotes', alertCount:0 };
const ADM_HUBS=()=>HUBS.filter(h=>h.slug!=='test-hub' || IS_LOCAL);
const DIAS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
async function pgUpsert(table, rows, onConflict){
  if(!/^rec_/.test(table)) throw new Error('Solo se escribe en tablas rec_*');
  const r=await sbReq(`${SB_URL}/rest/v1/${table}?on_conflict=${onConflict}`,{ method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},
    body:JSON.stringify(rows) });
  if(!r.ok) throw new Error(`${r.status}: ${await r.text()}`);
}
function downloadText(name, text){
  const blob=new Blob(['﻿'+text], { type:'text/csv;charset=utf-8' });
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
// An admin action on a reception, written straight to rec_events (admin works online)
async function adminEvent(base, detalle){
  await pgInsert('rec_events', [{ session_id:base.session_id, hub:base.hub, area:base.area, fecha:base.fecha, tipo:'admin',
    detalle:Object.assign({ uid:newUid() }, detalle), receptor:'Admin', device_id:DEVICE_ID, ts:serverNow().toISOString() }]);
}
function openAdmin(){
  closeSheet(); showScreen('screen-admin');

    document.getElementById('admin-body').innerHTML=`<h2>Admin</h2><p class="muted">Solo para Jose o a quien él le dé el PIN.</p>
      <div style="display:flex;gap:8px;margin-top:12px"><input id="adm-pin" class="text-input" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" onkeydown="if(event.key==='Enter')admLogin()">
      <button class="btn btn-primary" onclick="admLogin()">Entrar</button></div><div id="adm-err"></div>`;
    setTimeout(()=>{ const i=document.getElementById('adm-pin'); if(i) i.focus(); }, 60);
    return;
  }
  renderAdmin();
}
async function admLogin(){
  const v=String(document.getElementById('adm-pin').value||'').trim(), err=document.getElementById('adm-err');

function admTab(t){ ADM.tab=t; renderAdmin(); }
async function renderAdmin(){

function hubSelectHtml(id, val, withAll){

/* ── Recepciones: every hub+área, open and closed, by day (last 14 days) ── */
let _admRecep=[];
async function admRecepciones(){
  const desde=localDateStr(new Date(serverNow().getTime()-14*86400000));
  const evs=await pgSelectAll('rec_events', `tipo=in.(abrir,reemplazo,cerrar,admin)&fecha=gte.${desde}&select=id,session_id,hub,area,fecha,tipo,receptor,detalle,ts`);
  const by=new Map();
  for(const e of evs){
    if(e.hub==='test-hub' && !IS_LOCAL) continue;
    let r=by.get(e.session_id);
    if(!r){ r={ session_id:e.session_id, hub:e.hub, area:e.area, fecha:e.fecha, abierta:e.ts, receptores:new Set(), cerrada:null, sinArchivo:false, envio:null }; by.set(e.session_id, r); }
    if(e.receptor && e.receptor!=='Admin') r.receptores.add(e.receptor);
    const d=e.detalle||{};
    if(e.tipo==='abrir' || e.tipo==='reemplazo'){ if(d.envio) r.envio=d.envio; if(d.sin_archivo) r.sinArchivo=true; if(d.tras_sin_archivo) r.sinArchivo=false; }
    if(e.tipo==='cerrar') r.cerrada=Object.assign({ ts:e.ts, fecha:e.fecha, hub:e.hub, area:e.area, receptor:e.receptor, session_id:e.session_id }, d);
    if(e.tipo==='admin' && d.accion==='reabrir') r.cerrada=null;
  }
  _admRecep=[...by.values()].sort((a,b)=>b.fecha.localeCompare(a.fecha) || a.hub.localeCompare(b.hub) || a.area.localeCompare(b.area));
  let h='<div class="muted" style="margin-bottom:8px">Últimos 14 días. Una recepción abierta se reconstruye sola desde los eventos al abrirla en cualquier teléfono (Continuar recepción).</div>', day='';
  _admRecep.forEach((r,i)=>{
    if(r.fecha!==day){ day=r.fecha; h+=`<div class="section-title">${fechaLarga(day)}</div>`; }
    const c=r.cerrada;
    h+=`<div class="adm-row"><b>${escapeHtml(hubName(r.hub))} · ${areaName(r.area)}</b> — ${c?`<span class="tag green">✓ cerrada ${localHM(new Date(c.ts))}</span>`:`<span class="tag orange">abierta desde ${localHM(new Date(r.abierta))}</span>`}${r.sinArchivo?' <span class="tag red">sin archivo</span>':''}
      <div class="muted" style="font-size:12px">${escapeHtml([...r.receptores].join(', ')||'—')}${c?` · ${c.lineas||0} productos · ${c.diferencias||0} con diferencia`:''}</div>
      ${c?(c.badges||[]).map(b=>`<span class="badge-warn">${escapeHtml(b)}</span>`).join(''):''}
      <div class="btns">${c?`<button class="btn btn-secondary" onclick="openRecepcion(_admRecep[${i}].cerrada,'admin')">Ver</button>
        <button class="btn btn-secondary" onclick="admDescargar(${i})">⬇ CSV</button><button class="btn btn-warn" onclick="admReabrir(${i})">Reabrir</button>`:''}</div></div>`;
  });
  document.getElementById('adm-tab').innerHTML=h||'<div class="empty-hint">Sin recepciones.</div>';
}
async function admDescargar(i){
  const c=_admRecep[i].cerrada;
  try{ downloadText(c.reporte.split('/').pop(), await sbFetch(c.reporte)); }catch(e){ toast('No se pudo descargar'); }
}
async function admReabrir(i){
  const r=_admRecep[i];
  const v=await showModal({ title:`¿Reabrir ${hubName(r.hub)} · ${areaName(r.area)} del ${fechaLarga(r.fecha)}?`,
    html:'<p>Se podrá volver a escanear y cerrar. El reporte anterior se queda guardado como historial.</p>',
    buttons:[{label:'Sí, reabrir', value:'si', kind:'warn'}], cancel:true });
  if(v!=='si') return;
  try{ await adminEvent(r, { accion:'reabrir', reporte_anterior:r.cerrada.reporte }); toast('✓ Recepción reabierta'); renderAdmin(); }
  catch(e){ toast('No se pudo reabrir: '+e.message); }
}

/* ── Respaldos: every uploaded envío file stays in storage; an old one can be made active again ── */
let _admFiles=[];
async function admRespaldos(){
  const items=await sbList(`envios/${ADM.hub}/${ADM.area}/`);
  _admFiles=(items||[]).map(o=>o.name).filter(n=>/\.json$/.test(n)).sort().reverse();

async function admRestaurar(i){
  const src=`envios/${ADM.hub}/${ADM.area}/${_admFiles[i]}`;
  const v=await showModal({ title:'¿Hacer activo este archivo?', html:`<p>${escapeHtml(_admFiles[i])}</p>`, buttons:[{label:'Sí, hacer activo', value:'si', kind:'warn'}], cancel:true });
  if(v!=='si') return;
  try{
    const data=JSON.parse(await sbFetch(src)), now=serverNow();
    const dst=`envios/${ADM.hub}/${ADM.area}/${localDateStr(now)}__${now.getTime()}.json`;
    data.restaurado_de=src; data.restauradoAt=now.toISOString(); delete data._path;
    await sbUpload(dst, JSON.stringify(data), 'application/json');
    await adminEvent({ session_id:data.session_id, hub:ADM.hub, area:ADM.area, fecha:data.session_fecha }, { accion:'restaurar', de:src, nuevo:dst });
    toast('✓ Archivo activo'); renderAdmin();
  }catch(e){ toast('No se pudo: '+e.message); }
}

async function admGuardarCfg(hub, area, id){
  const el=document.getElementById('cfg-'+id), err=document.getElementById('cfgerr-'+id), f=n=>el.querySelector(`[data-f="${n}"]`);
  const dias=[...el.querySelectorAll('[data-dia]')].filter(x=>x.checked).map(x=>Number(x.dataset.dia));
  const row={ hub, area, activo:f('activo').checked, email:f('email').checked, modo:f('modo').value, dias,
    hora_limite:f('hora_limite').value||null, dias_gracia:Math.max(1, Number(f('dias_gracia').value)||3),
    pausado_hasta:f('pausado_hasta').value||null, updated_at:serverNow().toISOString() };
  if(row.activo && row.modo==='diario' && (!dias.length || !row.hora_limite)){ err.textContent='Para activarla, elige los días y la hora límite.'; return; }
  try{ await pgUpsert('rec_alert_config', [row], 'hub,area'); toast('✓ Guardado'); renderAdmin(); }
  catch(e){ err.textContent='No se pudo guardar: '+e.message; }
}

const CAMERA_FORMATS_NATIVE=['ean_13','ean_8','upc_a','upc_e','code_128'];
let _cameraStream=null, _cameraRAF=null, _cameraDetecting=false, _html5Qrcode=null, _html5QrcodeLoaded=false;
let _activeTrack=null, _torchMode=null, _torchOn=false, _cameraSession=0;
function loadHtml5Qrcode(){
  if(_html5QrcodeLoaded) return Promise.resolve();
  return new Promise((resolve, reject)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
    s.onload=()=>{ _html5QrcodeLoaded=true; resolve(); };
    s.onerror=()=>reject(new Error('load-failed'));
    document.head.appendChild(s);
  });
}
function showCameraError(e){
  const hint=document.getElementById('camera-hint'), name=e && e.name;
  if(name==='NotAllowedError' || name==='PermissionDeniedError') hint.textContent='Permite la cámara en la configuración del navegador.';
  else if(name==='NotFoundError' || name==='DevicesNotFoundError') hint.textContent='No se encontró una cámara en este dispositivo.';
  else if(name==='NotSupportedError') hint.textContent='Este navegador no soporta la cámara aquí. Usa el escáner o el teclado.';
  else hint.textContent='No se pudo abrir la cámara. Intenta de nuevo.';
}
function setTorchAvailability(caps){ document.getElementById('camera-torch-btn').style.display=(caps && caps.torch)?'inline-block':'none'; _torchOn=false; }
async function toggleTorch(){
  _torchOn=!_torchOn;
  try{
    if(_torchMode==='native' && _activeTrack) await _activeTrack.applyConstraints({ advanced:[{ torch:_torchOn }] });
    else if(_torchMode==='html5qrcode' && _html5Qrcode) await _html5Qrcode.applyVideoConstraints({ advanced:[{ torch:_torchOn }] });
  }catch(_){ _torchOn=!_torchOn; }
}
function onCameraDetect(code){ closeCamera(); processScan(code, 'camara'); }
async function openCamera(){
  const session=++_cameraSession;
  document.getElementById('camera-hint').textContent='';
  document.getElementById('camera-overlay').classList.add('open');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ showCameraError({ name:'NotSupportedError' }); return; }
  if('BarcodeDetector' in window) await startNativeDetector(session); else await startHtml5Qrcode(session);
}
async function startNativeDetector(session){
  try{
    const detector=new BarcodeDetector({ formats:CAMERA_FORMATS_NATIVE });
    const stream=await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
    if(session!==_cameraSession){ stream.getTracks().forEach(t=>t.stop()); return; }
    _cameraStream=stream;
    const video=document.getElementById('camera-video');
    video.style.display='block'; video.srcObject=_cameraStream; await video.play();
    _activeTrack=_cameraStream.getVideoTracks()[0]; _torchMode='native';
    try{ setTorchAvailability(_activeTrack.getCapabilities()); }catch(_){ setTorchAvailability(null); }
    _cameraDetecting=true;
    const loop=async()=>{
      if(!_cameraDetecting || session!==_cameraSession) return;
      try{ const codes=await detector.detect(video); if(codes && codes.length){ onCameraDetect(codes[0].rawValue); return; } }catch(_){}
      _cameraRAF=requestAnimationFrame(loop);
    };
    loop();
  }catch(e){ if(session===_cameraSession) showCameraError(e); }
}
async function startHtml5Qrcode(session){
  try{
    await loadHtml5Qrcode();
    if(session!==_cameraSession) return;
    document.getElementById('camera-html5-container').style.display='block';
    const F=Html5QrcodeSupportedFormats;
    const instance=new Html5Qrcode('camera-html5-container', { formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128], verbose:false });
    await instance.start({ facingMode:'environment' }, { fps:10, qrbox:{ width:280, height:140 } }, t=>onCameraDetect(t), ()=>{});
    if(session!==_cameraSession){ instance.stop().catch(()=>{}).finally(()=>{ try{ instance.clear(); }catch(_){} }); return; }
    _html5Qrcode=instance; _torchMode='html5qrcode';
    try{ setTorchAvailability(_html5Qrcode.getRunningTrackCapabilities()); }catch(_){ setTorchAvailability(null); }
  }catch(e){ if(session===_cameraSession) showCameraError(e); }
}
function closeCamera(){
  _cameraSession++;
  const ov=document.getElementById('camera-overlay'), wasOpen=ov.classList.contains('open');
  ov.classList.remove('open');
  document.getElementById('camera-hint').textContent='';
  _cameraDetecting=false;
  if(_cameraRAF){ cancelAnimationFrame(_cameraRAF); _cameraRAF=null; }
  if(_cameraStream){ _cameraStream.getTracks().forEach(t=>t.stop()); _cameraStream=null; }
  const video=document.getElementById('camera-video'); video.srcObject=null; video.style.display='none';
  if(_html5Qrcode){ const inst=_html5Qrcode; _html5Qrcode=null; inst.stop().catch(()=>{}).finally(()=>{ try{ inst.clear(); }catch(_){} }); }
  document.getElementById('camera-html5-container').style.display='none';
  document.getElementById('camera-torch-btn').style.display='none';
  _activeTrack=null; _torchMode=null; _torchOn=false;
  if(wasOpen) focusScan();
}

/* ── BOOT ── */
function registerServiceWorker(){
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
async function boot(){
  document.getElementById('app-ver').textContent=APP_VERSION+(IS_LOCAL?' · local (escribe en producción: usa Test hub)':'');
  registerServiceWorker();
  renderInicio(); // always Inicio, nothing pre-selected (rule 7)
  loadReceptores();
  await Promise.all([syncClock(), loadImageDB()]);
  _imgMemo.clear();
  flushOutbox(); // events left over from an earlier visit
}
boot();
</script>
