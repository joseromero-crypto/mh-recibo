<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Calii · MH Recibo</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Calii Theme v1 (Sorting Hub's ~/Desktop/sorting-hub/Claude outputs/THEME.md): white page, teal only for the
   primary action / the one key value (the basket), ink for attention, --c-danger for errors and deletes only.
   The app keeps its own class names; they point at the --c-* tokens. Old token names are aliases so inline
   styles written by JS (var(--orange), var(--red)…) follow the theme. */
:root{
  --c-teal:#00C3B3; --c-teal-dark:#006B62; --c-teal-light:#E0F7F5;
  --c-ink:#0E1A19; --c-muted:#5B6B69; --c-faint:#8A9997;
  --c-surface:#F2F5F5; --c-surface-hover:#E8EEED; --c-line:#E3E9E8; --c-white:#FFFFFF; --c-danger:#C62828;
  --r-xl:28px; --r-lg:22px; --r-md:16px; --r-sm:12px; --r-xs:8px; --r-pill:999px;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --shadow-pop:0 12px 40px rgba(14,26,25,.18);
  /* aliases used across the JS templates */
  --green:var(--c-teal); --green-dark:var(--c-teal-dark); --green-light:var(--c-teal-light);
  --red:var(--c-danger); --red-light:#FBEAEA;
  --orange:var(--c-ink); --orange-light:var(--c-surface);
  --yellow:var(--c-ink); --yellow-light:var(--c-surface);
  --gray-50:var(--c-white); --gray-100:var(--c-surface); --gray-200:var(--c-line); --gray-300:var(--c-line); --gray-400:var(--c-faint);
  --gray-500:var(--c-muted); --gray-600:var(--c-muted); --gray-700:var(--c-muted); --gray-900:var(--c-ink);
  --radius:var(--r-lg); --radius-sm:var(--r-md);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);font-size:15px;line-height:1.4;font-weight:500;background:var(--c-white);color:var(--c-ink);min-height:100dvh;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
svg{flex-shrink:0}
b,strong{font-weight:700}
.screen{display:none}
.screen.active{display:block}
.wrap{max-width:480px;margin:0 auto;padding:16px 20px 48px}
.hero{max-width:480px;margin:0 auto;padding:28px 20px 8px;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.brand-mark{width:22px;height:22px;border-radius:7px;background:var(--c-teal)}
.hero-logo{font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1}
.hero-sub{font-size:14px;color:var(--c-muted)}
.status-line{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--c-muted);margin:4px 0 10px}
.db-dot{width:8px;height:8px;border-radius:50%;background:transparent;border:1.5px solid var(--c-faint);flex-shrink:0}
.db-dot.ok{background:var(--c-teal);border-color:var(--c-teal)} .db-dot.loading{background:transparent} .db-dot.err{background:var(--c-danger);border-color:var(--c-danger)}
.clock-warn{background:var(--c-ink);color:var(--c-white);border-radius:var(--r-lg);padding:14px 16px;margin:12px 0;font-size:13px}
.clock-warn-title{font-weight:800}
.clock-warn-sub{margin-top:4px;opacity:.85}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--c-ink);color:var(--c-white);padding:12px 18px;border-radius:var(--r-lg);font-size:14px;font-weight:600;max-width:calc(100% - 32px);box-shadow:var(--shadow-pop);transition:opacity .2s,transform .2s;z-index:100;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.app-ver{text-align:center;font-size:11px;color:var(--c-faint);margin-top:24px}
.muted{color:var(--c-muted);font-size:14px;line-height:1.45}
h2{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:6px 0 10px}

/* Buttons — pills; teal = the primary action (one per view), ink = confirm / needs attention */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:var(--r-pill);padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;text-align:center;min-height:48px;line-height:1.25}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-block{display:flex;width:100%}
.btn-primary{background:var(--c-teal);color:var(--c-ink)}
.btn-secondary{background:var(--c-surface);color:var(--c-ink)}
.btn-secondary:hover{background:var(--c-surface-hover)}
.btn-danger{background:var(--c-danger);color:var(--c-white)}
.btn-warn{background:var(--c-ink);color:var(--c-white)}
.link-btn{background:none;border:none;color:var(--c-teal-dark);font-size:14px;font-weight:700;cursor:pointer;padding:12px 10px;display:block;margin:4px auto 0;text-align:center;min-height:44px}
.stack{display:flex;flex-direction:column;gap:8px}
.ico{display:inline-flex;align-items:center;justify-content:center}

/* INICIO (§6.1) */
.step{margin-top:20px}
.step-title{font-size:13px;font-weight:600;color:var(--c-muted);margin-bottom:8px}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.choice{background:var(--c-surface);border:none;border-radius:18px;padding:14px 16px;font-size:15px;font-weight:700;text-align:left;cursor:pointer;min-height:56px;letter-spacing:-.01em}
.choice:hover{background:var(--c-surface-hover)}
.choice.sel{background:var(--c-ink);color:var(--c-white)}
.choice.big{font-size:18px;text-align:center;padding:18px 12px}
.text-input{width:100%;min-height:56px;padding:14px 18px;font-size:17px;font-weight:600;border:2px solid var(--c-line);border-radius:var(--r-md);outline:none;background:var(--c-white)}
.text-input::placeholder{color:var(--c-faint);font-weight:500}
.text-input:focus{border-color:var(--c-teal)}
.note{background:var(--c-surface);border-radius:var(--r-md);padding:12px 14px;font-size:13px;margin-bottom:10px;color:var(--c-muted)}
.info-card{background:var(--c-surface);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;font-size:14px;line-height:1.5}
.info-card b{font-weight:800}
.slack-pre{background:var(--c-surface);border-radius:var(--r-lg);padding:14px;margin:0;font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;color:var(--c-ink)}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 10px;border-radius:var(--r-pill);background:var(--c-white);color:var(--c-ink);vertical-align:middle;max-width:100%;border:1.5px solid var(--c-line)}
.tag.orange{background:var(--c-ink);color:var(--c-white);border-color:var(--c-ink)}
.tag.green{background:var(--c-teal-light);color:var(--c-teal-dark);border-color:var(--c-teal-light)}
.tag.red{background:var(--c-danger);color:var(--c-white);border-color:var(--c-danger)}

/* Top bar */
.topbar{background:var(--c-white);display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1.5px solid var(--c-line);position:sticky;top:0;z-index:5}
.back{background:none;border:none;font-size:15px;font-weight:700;color:var(--c-teal-dark);padding:10px 6px;min-height:44px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.topbar-title{font-weight:700;font-size:15px;flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.err-box{background:var(--c-white);border:2px solid var(--c-danger);color:var(--c-danger);font-weight:600;border-radius:var(--r-md);padding:12px 14px;font-size:14px;margin:12px 0;line-height:1.45}
.warn-box{background:var(--c-surface);border-left:4px solid var(--c-ink);border-radius:var(--r-md);padding:12px 14px;font-size:14px;margin:12px 0;line-height:1.45}
.warn-box .btn{margin-top:10px}
.warn-box.ok{background:var(--c-teal-light);border-left-color:var(--c-teal);color:var(--c-teal-dark);font-weight:700}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.stat{background:var(--c-surface);border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column-reverse;gap:4px}
.stat-n{font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.stat-l{font-size:13px;font-weight:600;color:var(--c-muted)}

/* RECIBIR (§6.3) */
.rec-head{background:var(--c-white);padding:8px 14px 10px;border-bottom:1.5px solid var(--c-line);position:sticky;top:0;z-index:5}
.rec-head-top{display:flex;align-items:center;gap:8px}
.rec-title{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-sub{display:flex;justify-content:space-between;font-size:13px;color:var(--c-muted);margin:4px 2px 8px}
.rec-sub b{color:var(--c-ink);font-variant-numeric:tabular-nums}
.progress{height:6px;background:var(--c-surface);border-radius:3px;overflow:hidden}
.progress>div{height:100%;background:var(--c-teal);width:0;transition:width .3s}
.net-badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:var(--r-pill);white-space:nowrap}
.net-badge.ok{background:var(--c-teal-light);color:var(--c-teal-dark)}
.net-badge.pend{background:var(--c-ink);color:var(--c-white)}
.net-badge.off{background:var(--c-danger);color:var(--c-white)}
.scan-row{display:flex;gap:8px;margin:4px 0 10px}
.scan-input{flex:1;min-width:0;height:56px;padding:0 18px;font-size:17px;font-weight:600;border:2px solid var(--c-line);border-radius:var(--r-md);outline:none;background:var(--c-white)}
.scan-input::placeholder{color:var(--c-faint);font-weight:500}
.scan-input:focus{border-color:var(--c-teal)}
.icon-btn{width:56px;height:56px;flex-shrink:0;border:none;background:var(--c-surface);color:var(--c-ink);border-radius:var(--r-md);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.icon-btn.on{background:var(--c-ink);color:var(--c-white)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.row2 .btn{font-size:14px;padding:10px 8px}
.empty-hint{color:var(--c-muted);font-size:14px;text-align:center;padding:40px 20px;border-radius:var(--r-xl);background:var(--c-surface)}
.section-title{font-size:13px;font-weight:600;color:var(--c-muted);margin:20px 0 8px}

/* Product card: grey card, white inset photo, the basket is the one teal highlight; Registrar is ink */
.pcard{background:var(--c-surface);border-radius:var(--r-xl);padding:8px 8px 14px;margin-bottom:12px;border:2px solid transparent}
.pcard.noesp{border-color:var(--c-ink)}
.pcard>*:not(.pcard-top){margin-left:8px;margin-right:8px}
.pcard-top{display:flex;gap:8px;align-items:stretch}
.pcard-img{width:132px;height:132px;object-fit:contain;flex-shrink:0;border-radius:var(--r-lg);background:var(--c-white);padding:8px}
.pcard-noimg{width:132px;height:132px;flex-shrink:0;border-radius:var(--r-lg);background:var(--c-white);display:grid;place-items:center;color:var(--c-faint)}
.basket{flex:1;min-width:0;border-radius:var(--r-lg);background:var(--c-teal);color:var(--c-ink);padding:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.basket-l{font-size:12px;font-weight:600}
.basket-letter{font-size:72px;line-height:.95;font-weight:800;letter-spacing:-.045em;white-space:nowrap}
.basket-letter.long{font-size:44px}
.basket-pos{font-size:14px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.basket:has(.basket-none){background:var(--c-white)}
.basket-none{font-size:13px;color:var(--c-muted)}
.pcard-name{font-size:19px;font-weight:700;line-height:1.25;letter-spacing:-.01em;margin:14px 8px 6px}
mark{background:var(--c-teal-light);color:inherit;padding:0 4px;border-radius:6px;box-shadow:inset 0 -2px 0 var(--c-teal)}
.pcard-name mark{font-size:22px;font-weight:800}
.banner mark{background:var(--c-white);color:var(--c-ink);box-shadow:none}
.pcard-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pres-chip{font-size:15px;font-weight:800;background:var(--c-ink);color:var(--c-white);border-radius:var(--r-pill);padding:4px 12px}
.unit-chip{font-size:13px;font-weight:700;background:var(--c-white);border-radius:var(--r-pill);padding:4px 12px}
.unit-chip.kg{background:var(--c-ink);color:var(--c-white)}
.banner{border-radius:var(--r-md);padding:12px 14px;font-size:14px;font-weight:600;margin-bottom:10px;line-height:1.4}
.banner.red{background:var(--c-ink);color:var(--c-white)}
.banner.blue{background:var(--c-white);color:var(--c-ink);font-size:16px;font-weight:700}
.banner.gray{background:var(--c-white);color:var(--c-muted)}
.banner.yellow{background:var(--c-ink);color:var(--c-white)}
.cad-box{background:var(--c-white);border-radius:var(--r-md);padding:8px 8px 8px 14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.cad-main{flex:1;min-width:0;font-size:15px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.cad-main small{display:block;font-size:12px;font-weight:600;color:var(--c-muted);white-space:nowrap}
.sep-q{font-size:13px;font-weight:600;color:var(--c-muted);margin:2px 0 6px}
.sep-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sep-btns .choice{min-height:44px;padding:0 10px;text-align:center;font-size:14px;background:var(--c-white)}
.sep-btns .choice.sel{background:var(--c-ink);color:var(--c-white)}
.sep-row{display:flex;align-items:center;gap:10px;margin-top:8px}
.sep-row label{flex:1;font-size:14px;font-weight:700}
.sep-row .text-input{width:96px;flex-shrink:0;margin:0;text-align:center}
.sep-sum{font-size:13px;font-weight:700;margin-top:8px;min-height:18px}
.sib-row{display:flex;gap:8px;align-items:center;margin-top:8px;font-weight:600;font-size:13px}
.sib-row img,.sib-row .thumb-none{width:52px;height:52px;object-fit:contain;flex-shrink:0;border-radius:var(--r-xs);background:var(--c-white)}
.unit-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.unit-pick .choice{text-align:center;background:var(--c-white)}
.unit-pick .choice.sel{background:var(--c-ink)}
.look-item{display:flex;gap:10px;align-items:center;background:var(--c-surface);border:none;border-radius:18px;padding:8px 12px 8px 8px;width:100%;text-align:left;cursor:pointer;margin-top:6px;min-height:58px}
.look-item:hover{background:var(--c-surface-hover)}
.look-item img,.look-item .thumb-none{width:56px;height:56px;object-fit:contain;flex-shrink:0;border-radius:var(--r-sm);background:var(--c-white)}
.look-cta{font-size:13px;font-weight:700;color:var(--c-teal-dark);white-space:nowrap}
.qty-label{font-size:13px;font-weight:600;color:var(--c-muted);margin-bottom:6px;display:block}
.qty-input{width:100%;height:64px;font-size:32px;font-weight:800;padding:0 14px;border:2px solid var(--c-line);border-radius:var(--r-md);outline:none;text-align:center;background:var(--c-white);font-variant-numeric:tabular-nums}
.qty-input:focus{border-color:var(--c-teal)}
.qty-err{color:var(--c-danger);font-size:13px;font-weight:600;min-height:18px;margin-top:4px}
.pcard-actions{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:8px}
.pcard .btn-secondary{background:var(--c-white)}
.pcard .btn-primary{background:var(--c-ink);color:var(--c-white)}

/* Recent scans */
.rlist{display:flex;flex-direction:column;gap:6px}
.ritem{background:var(--c-surface);border-radius:18px;padding:8px 12px 8px 8px}
.ritem-row{display:flex;gap:10px;align-items:center}
.thumb{width:44px;height:44px;object-fit:contain;flex-shrink:0;border-radius:var(--r-sm);background:var(--c-white)}
.thumb-none{width:44px;height:44px;flex-shrink:0;border-radius:var(--r-sm);background:var(--c-white);display:grid;place-items:center;color:var(--c-faint)}
.ritem-main{flex:1;min-width:0}
.ritem-name{font-size:14px;font-weight:700;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ritem-meta{font-size:12px;color:var(--c-muted);margin-top:2px}
.ritem-qty{font-size:20px;font-weight:800;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ritem-qty s{font-size:13px;color:var(--c-muted);font-weight:600;margin-right:4px}
.ritem-qty small{font-size:12px;color:var(--c-muted);font-weight:600}
.corr-btn{background:var(--c-white);border:none;border-radius:var(--r-pill);font-size:13px;font-weight:700;padding:0 14px;min-height:36px;cursor:pointer;color:var(--c-ink)}
.corr-box{border-top:1.5px solid var(--c-line);margin-top:8px;padding-top:10px}
.corr-box .text-input{font-size:20px;font-weight:800;text-align:center;padding:10px}
.corr-box select{width:100%;height:48px;padding:0 14px;font-size:15px;font-weight:600;border:2px solid var(--c-line);border-radius:var(--r-md);background:var(--c-white);margin-top:6px}

/* Sheets (user-opened full-screen panels — not blocking modals) */
.sheet{display:none;position:fixed;inset:0;background:var(--c-white);z-index:40;flex-direction:column}
.sheet.open{display:flex}
.sheet-head{background:var(--c-white);display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1.5px solid var(--c-line)}
.sheet-title{flex:1;font-weight:800;font-size:18px;letter-spacing:-.02em}
.sheet-body{flex:1;overflow-y:auto;padding:14px 20px 40px;max-width:480px;width:100%;margin:0 auto}
.res-item{display:flex;gap:10px;align-items:center;background:var(--c-surface);border:none;border-radius:18px;padding:8px 14px 8px 8px;width:100%;text-align:left;cursor:pointer;margin-bottom:6px;min-height:58px}
.res-item:hover{background:var(--c-surface-hover)}
.res-item.grey{opacity:.5}
.res-name{font-size:14px;font-weight:700;line-height:1.25}
.res-sub{font-size:12px;color:var(--c-muted);margin-top:2px}
.res-pos{font-size:22px;font-weight:800;color:var(--c-teal-dark);min-width:44px;text-align:center}

/* Resumen / Recepciones */
.sum-row{background:var(--c-surface);border-radius:var(--r-lg);padding:12px;margin-bottom:8px;border-left:4px solid transparent}
.sum-row.delta{border-left-color:var(--c-ink)}
.sum-row.acked{border-left-color:var(--c-teal)}
.sum-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;text-align:center}
.sum-nums div{background:var(--c-white);border-radius:var(--r-sm);padding:8px 2px}
.sum-nums b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.sum-nums span{font-size:11px;font-weight:600;color:var(--c-muted)}
.sum-nums .big b{font-size:28px;color:var(--c-ink)}
.sum-row .btn-secondary{background:var(--c-white)}
.estado{font-size:12px;font-weight:700;padding:3px 10px;border-radius:var(--r-pill);white-space:nowrap}
.estado.ok{background:var(--c-teal-light);color:var(--c-teal-dark)}
.estado.bad{background:var(--c-ink);color:var(--c-white)}
.estado.mid{background:var(--c-white);color:var(--c-ink);box-shadow:inset 0 0 0 1.5px var(--c-ink)}
#rv-vistas{display:flex}
#rv-vistas .choice{flex:auto;padding:0 6px;font-size:12px;text-align:center;white-space:nowrap}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.filters select{height:40px;padding:0 12px;font-size:14px;font-weight:600;border:none;border-radius:var(--r-pill);background:var(--c-surface)}
.chk{width:30px;height:30px;flex-shrink:0;accent-color:var(--c-teal-dark)}
.sum-row.ticked{opacity:.5}
.badge-warn{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:var(--r-pill);background:var(--c-ink);color:var(--c-white);margin:2px 4px 2px 0}

/* Admin */

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
'use strict';
const APP_VERSION = 'v1 · tema Calii';

/* ════════════════════════════════════════════════════════════════════════════════════
   SUPABASE — shared project with Armado CH + Sorting Hub (plan §3). This app writes ONLY to bucket
   'recibo' and tables rec_*. Sorting Hub's bucket and masterview are read-only from here.
   ════════════════════════════════════════════════════════════════════════════════════ */
const SB_URL = 'https://uuqqtksxlgkztenojufm.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1cXF0a3N4bGdrenRlbm9qdWZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxODc0NDIsImV4cCI6MjA5Mzc2MzQ0Mn0.Ifj0QKO4oTcIz3IgSD3fMWwdQz_QG_561d4sQAgWG2U';
const BUCKET = 'recibo';                    // ours
const SORTING_BUCKET = 'sorting-hub';       // read-only: sorting/{slug}/*
const MV_BASE = `${SB_URL}/storage/v1/object/public/masterview/`; // shared catalog, read-only: latest.json, version.txt

const HUBS = [
  { name:'MH Contry',      slug:'mh-contry' },
  { name:'MH Cumbres',     slug:'mh-cumbres' },
  { name:'MH Guadalupe',   slug:'mh-guadalupe' },
  { name:'MH San Nicolás', slug:'mh-san-nicolas' },
  { name:'MH Avícola',     slug:'mh-avicola' },
  { name:'MH Zapopan',     slug:'mh-zapopan' },
  { name:'MH Condesa',     slug:'mh-condesa' },
];
// Local runs write to production (CLAUDE.md). On localhost a 'test-hub' is offered so every test write is
// isolated; it reads MH Contry's sorting so cards still show real basket letters.
const IS_LOCAL = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
if (IS_LOCAL) HUBS.push({ name:'Test hub (local)', slug:'test-hub' });
const SORTING_SLUG = { 'test-hub':'mh-contry' };
// §6.2b "Empezar sin archivo" — built (Phase 2) but switched off: receptors would get used to scanning before
// uploading and miss the real-time flags. Kept for emergencies / a future version.
const SIN_ARCHIVO_ENABLED = false;
const AREAS = [ { id:'abarrotes', name:'Abarrotes' }, { id:'carnes', name:'Carnes' } ];
function hubName(slug){ const h=HUBS.find(x=>x.slug===slug); return h?h.name:slug; }
function areaName(id){ const a=AREAS.find(x=>x.id===id); return a?a.name:id; }

/* ── FECHA Y HORA — copied from armado-CH (§9.1 of its handoff). Every date/time goes through here;
   never the device clock or its time zone. ── */
const TZ='America/Monterrey';
const TZ_FALLBACK_MIN=-360; // México no aplica horario de verano desde 2022 → UTC-6 fijo
let _fmtDate=null, _fmtHM=null;
try{
  _fmtDate=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});
  _fmtHM=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
  if(_fmtDate.format(new Date(0))!=='1969-12-31'){ _fmtDate=null; _fmtHM=null; } // autoprueba
}catch(_){ _fmtDate=null; _fmtHM=null; }
function _mtyParts(t){ // respaldo si el navegador no soporta timeZone en Intl
  const u=new Date(t.getTime()+TZ_FALLBACK_MIN*60000);
  return {y:u.getUTCFullYear(),m:u.getUTCMonth()+1,d:u.getUTCDate(),h:u.getUTCHours(),mi:u.getUTCMinutes()};
}
let _skewMs=0, _skewKnown=false;
function serverNow(){ return new Date(Date.now()+_skewMs); }
function skewMinutes(){ return Math.round(_skewMs/60000); }
async function syncClock(){
  try{
    const t0=Date.now();
    // HEAD on a table with anon SELECT exposes a readable Date header (the /rest/v1/ root answers 401 without one).
    const r=await fetch(`${SB_URL}/rest/v1/rec_events?select=id&limit=1`,{method:'HEAD',headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`}});
    const h=r.headers.get('Date');
    if(h){
      const srv=Date.parse(h);
      if(!isNaN(srv)){ _skewMs=srv+Math.round((Date.now()-t0)/2)-Date.now(); _skewKnown=true; }
    }
  }catch(_){ /* sin conexión → se usa el reloj del equipo, con la zona ya anclada */ }
  try{ renderClockWarning(); }catch(_){}
}
function localDateStr(d){
  const t=d||serverNow();
  if(_fmtDate) return _fmtDate.format(t); // en-CA → "YYYY-MM-DD"
  const p=_mtyParts(t); return `${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`;
}
function localHM(d){
  const t=d||serverNow();
  if(_fmtHM) return _fmtHM.format(t); // "HH:MM" 24 h
  const p=_mtyParts(t); return `${String(p.h).padStart(2,'0')}:${String(p.mi).padStart(2,'0')}`;
}
function todayStr(){ return localDateStr(); }
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
// "29 de octubre" from a YYYY-MM-DD (Monterrey) date string
function fechaLarga(ymd){ const [,m,d]=String(ymd).split('-').map(Number); return m?`${d} de ${MESES[m-1]}`:String(ymd); }
// Whole Monterrey days between two YYYY-MM-DD strings
function daysBetween(a,b){ return Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/86400000); }
function renderClockWarning(){
  const el=document.getElementById('clock-warning'); if(!el) return;
  const m=skewMinutes();
  if(!_skewKnown || Math.abs(m)<=5){ el.style.display='none'; el.innerHTML=''; return; }
  const h=Math.round(Math.abs(m)/60*10)/10;
  const cuanto = Math.abs(m)<60 ? `${Math.abs(m)} min` : `${h} h`;
  el.innerHTML=`<div class="clock-warn">
    <div class="clock-warn-title">El reloj de este teléfono está ${m>0?'atrasado':'adelantado'} ${cuanto}</div>
    <div class="clock-warn-sub">Tu recepción se guarda con la fecha y hora correctas — la app usa la hora del servidor. Aun así activa <b>Fecha y hora automática</b> en este equipo.</div>
  </div>`;
  el.style.display='block';
}

/* ── sbReq — copied from armado-CH v2.3: at most SB_MAX_INFLIGHT in flight, 429 waits and retries. ── */
const SB_MAX_INFLIGHT=8;
let _sbInflight=0; const _sbQueue=[];
function _sbAcquire(){ if(_sbInflight<SB_MAX_INFLIGHT){ _sbInflight++; return Promise.resolve(); } return new Promise(r=>_sbQueue.push(r)); }
function _sbRelease(){ const next=_sbQueue.shift(); if(next) next(); else _sbInflight--; }
async function sbReq(url, opts){
  for(let attempt=0;;attempt++){
    await _sbAcquire();
    let r; try{ r=await fetch(url, opts); } finally{ _sbRelease(); }
    if(r.status!==429 || attempt>=4) return r;
    const ra=Number(r.headers.get('Retry-After'));
    await new Promise(res=>setTimeout(res, (ra>0?ra*1000:500*2**attempt)+Math.random()*250));
  }
}
// Storage — writes are always to BUCKET ('recibo'); the bucket allows anon UPDATE so x-upsert works.
async function sbUpload(path, content, contentType='text/csv'){
  const r = await sbReq(`${SB_URL}/storage/v1/object/${BUCKET}/${path}`,{
    method:'POST',
    headers:{'Authorization':`Bearer ${SB_KEY}`,'Content-Type':contentType,'x-upsert':'true'},
    body: content
  });
  if(!r.ok){ const e=await r.text(); throw new Error(`${r.status}: ${e}`); }
}
// Delete envío files only (Borrar envío) — never reports or config
async function sbDeleteEnvio(paths){
  if(!paths.every(p=>/^envios\/[^/]+\/[^/]+\/[^/]+\.(json|csv)$/.test(p))) throw new Error('Solo se borran archivos de envíos');
  const r = await sbReq(`${SB_URL}/storage/v1/object/${BUCKET}`,{
    method:'DELETE',
    headers:{'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json'},
    body: JSON.stringify({ prefixes:paths })
  });
  if(!r.ok){ const e=await r.text(); throw new Error(`${r.status}: ${e}`); }
}
// Public read from any bucket (ours, Sorting Hub's sorting)
async function sbPublic(path, bucket=BUCKET){
  const r = await sbReq(`${SB_URL}/storage/v1/object/public/${bucket}/${path}`,{cache:'no-store'});
  if(!r.ok){ const e=new Error(`${r.status}`); e.status=r.status; throw e; }
  return r;
}
async function sbFetch(path, bucket=BUCKET){ return (await sbPublic(path, bucket)).text(); }
async function sbList(prefix){
  const r = await sbReq(`${SB_URL}/storage/v1/object/list/${BUCKET}`,{
    method:'POST',
    headers:{'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json'},
    body: JSON.stringify({prefix, limit:500, sortBy:{column:'name',order:'desc'}})
  });
  if(!r.ok) throw new Error(`${r.status}`);
  return r.json();
}
/* ── PostgREST (rec_* tables only for writes) ── */
async function pgInsert(table, rows){
  if(!/^rec_/.test(table)) throw new Error('Solo se escribe en tablas rec_*');
  const r = await sbReq(`${SB_URL}/rest/v1/${table}`,{
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},
    body: JSON.stringify(rows)
  });
  if(!r.ok) throw new Error(`${r.status}: ${await r.text()}`);
}
async function pgSelect(table, query){
  const r = await sbReq(`${SB_URL}/rest/v1/${table}?${query}`,{
    headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`}
  });
  if(!r.ok) throw new Error(`${r.status}`);
  return r.json();
}
// The project caps every PostgREST response at 1000 rows — page anything that can grow.
const PG_PAGE=1000;
async function pgSelectAll(table, query){
  const q=/(^|&)order=/.test(query)?query:query+'&order=id.asc'; // stable order, or offsets can skip/repeat rows
  let out=[];
  for(let off=0;;off+=PG_PAGE){
    const rows=await pgSelect(table, `${q}&limit=${PG_PAGE}&offset=${off}`);
    out=out.concat(rows);
    if(rows.length<PG_PAGE) return out;
  }
}
function isNetErr(e){ return e instanceof TypeError || /Failed to fetch|NetworkError|Load failed/i.test(String(e&&e.message)); }

/* ── BARCODES / HEADERS / NAMES — copied from armado-CH ── */
function bcMatch(scanned, system){
  if(!scanned||!system) return false;
  if(scanned===system) return true;
  const s1=scanned.replace(/^0+/,''), s2=system.replace(/^0+/,'');
  return s1.length>0 && s1===s2;
}
function cleanBC(raw){
  if(raw==null) return '';
  let s=String(raw).trim(); if(!s) return '';
  if(/[eE][+\-]?\d+$/.test(s)){ const n=Number(s); if(!isNaN(n)&&isFinite(n)) s=n.toFixed(0); }
  s=s.replace(/\.0+$/,''); if(s.includes('.')) s=s.split('.')[0];
  return s;
}
function normHeader(h){ return String(h||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function pickCol(row, ...names){
  const want=names.map(normHeader);
  for(const k of Object.keys(row||{})){ if(want.includes(normHeader(k))) return row[k]; }
  return undefined;
}
function bcKey(bc){ const s=String(bc||''); return s.replace(/^0+/,'') || s; }
function normName(s){
  if(!s) return '';
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
function stripBOM(text){ return text.charCodeAt(0)===0xFEFF ? text.slice(1) : text; }
// Ours: one export carries a barcode with an inner space ("083078 003623") — the scanner never sends it.
function codeKey(raw){ return bcKey(cleanBC(raw).replace(/\s+/g,'')); }
// sku_key (plan §3.1): bcKey(barcode), or 'name:'+normalized name when the line has no barcode
function skuKeyOf(barcode, producto){ const k=codeKey(barcode); return k ? k : 'name:'+normName(producto); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ── IMAGE DB (plan §3.3) — Masterview cache, loadImageDB, imgUrl/imgName and pickEntry copied from sorting-hub.
   Masterview is uploaded only in Invoice Reader; imgUrl/imgName read every entry shape. ── */
const S = { imgDb:{}, imgAlt:{}, hubCities:{}, imgCount:0 };
function normalizeImgDbKeys(db){
  const out={};
  for(const k in db){
    if(/^\d+$/.test(k)){ const s=bcKey(k); if(!(s in out)) out[s]=db[k]; }
    else out[k]=db[k];
  }
  return out;
}
// Masterview lives in Cache Storage, not localStorage: 2 MB would crowd the outbox and the session mirror
// near iPhone Safari's limit. sw.js keeps this cache across deploys.
const MV_CACHE='calii-masterview';
async function mvCacheRead(){
  try{
    const res=await (await caches.open(MV_CACHE)).match(MV_BASE+'latest.json');
    return res ? { v:res.headers.get('x-mv-version'), res } : null;
  }catch(_){ return null; }
}
async function mvCacheWrite(ver, text){
  try{
    const res=new Response(text,{ headers:{ 'Content-Type':'application/json', 'x-mv-version':ver } });
    await (await caches.open(MV_CACHE)).put(MV_BASE+'latest.json', res);
  }catch(_){}
}
function applyMasterview(j){
  S.imgDb=normalizeImgDbKeys(j.map);
  S.imgAlt=j.alt||{};
  S.hubCities=j.hubCities||{};
  S.imgCount=j.count||0;
}
function imgDbCount(){ return (S.imgCount||Math.round(Object.keys(S.imgDb).length/2)).toLocaleString('es-MX'); }
async function loadImageDB(){
  setDbStatus('loading','Cargando base de imágenes…');
  try{ localStorage.removeItem('mr_imgdb_cache'); }catch(_){} // old copy, replaced by MV_CACHE
  // 1. masterview/ (published by Invoice Reader) — tiny version.txt checked first, 2 MB body cached
  const cached=await mvCacheRead();
  try{
    const ver=(await fetch(MV_BASE+'version.txt',{cache:'no-store'}).then(r=>{ if(!r.ok) throw 0; return r.text(); })).trim();
    let j;
    if(cached && cached.v===ver){ j=await cached.res.clone().json(); }
    else{
      const text=await fetch(MV_BASE+'latest.json',{cache:'no-store'}).then(r=>{ if(!r.ok) throw 0; return r.text(); });
      j=JSON.parse(text);
      if(!j.map) throw 0;
      await mvCacheWrite(ver, text);
    }
    applyMasterview(j);
    setDbStatus('ok',`Base de imágenes (${imgDbCount()} productos)`);
    return;
  }catch(_){}
  // 2. Offline or mid-flight failure: the last Masterview this phone downloaded, whatever its version
  if(cached){
    try{
      applyMasterview(await cached.res.clone().json());
      setDbStatus('ok',`Base de imágenes (${imgDbCount()} productos)`);
      return;
    }catch(_){}
  }
  // 3. Fallback: the file bundled in the repo (the floor, not the source)
  try{
    const res=await fetch('./imagedb.json');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const j=await res.json();
    if(j.map) applyMasterview(j); else S.imgDb=normalizeImgDbKeys(j); // a phone's HTTP cache can still hold the old flat file
    setDbStatus('ok',`Base de imágenes incluida (${imgDbCount()} productos)`);
  }catch(e){ S.imgDb={}; setDbStatus('err','Sin imágenes'); }
}
// Reads every entry shape: Masterview barcode entries {url, name, sku, c}, name entries and the old
// bundled barcode entries as plain URL strings.
function imgUrl(entry){ return typeof entry==='string' ? entry : (entry && entry.url) || null; }
function imgName(entry){ return typeof entry==='string' ? null : (entry && entry.name) || null; }
// The hub's city comes from the published JSON only; undefined (old copy) skips all city logic.
// INI.hub, not S.hub: Recepciones shows photos without opening Recibir. test-hub borrows MH Contry's city.
function hubCity(){ return S.hubCities[SORTING_SLUG[INI.hub]||INI.hub]; }
// A barcode repeated inside one city stays on its map entry, even if alt lists that city too.
function pickEntry(key, city){
  const entry=S.imgDb[key];
  if(!city || (entry && entry.c && entry.c.includes(city))) return entry;
  return (S.imgAlt[key]||[]).find(e=>e.c && e.c.includes(city)) || entry;
}
// Advisory only (plan §4.2): the city when Masterview knows the barcode and it isn't sold there, else null
function noSeVendeEn(barcode){
  const city=hubCity(), k=codeKey(barcode), entry=city && k ? pickEntry(k, city) : null;
  return entry && entry.c && !entry.c.includes(city) ? city : null;
}
function setDbStatus(type,msg){
  const d=document.getElementById('db-dot'), l=document.getElementById('db-label'); if(!d||!l) return;
  d.className='db-dot '+(type==='ok'?'ok':type==='loading'?'loading':'err');
  l.textContent=msg;
}
// No photo beats a wrong photo. A barcode whose Masterview name shares no real word with the product's name is another
// product (767203598894: Totopos Nūbe in the order, Chips de camote in Masterview). "codigo" is filler so that the sin-archivo
// placeholder "Código {n}" counts as no name, like a call with no producto: nothing to compare, so the barcode photo stays.
const IMG_FILLER=new Set('de del la las el los con sin y para por en al un una a o e sabor tipo g gr grs gramos kg ml l lt lts litro litros pz pza pzas pieza piezas caja bolsa paquete pack codigo'.split(' '));
function nameWords(s){ return normName(s).split(' ').filter(w=>w&&!/\d/.test(w)&&!IMG_FILLER.has(w)); }
function nameClash(producto, mvName){
  const a=nameWords(producto), b=new Set(nameWords(mvName));
  return a.length>0 && b.size>0 && !a.some(w=>b.has(w)); // no name on either side = nothing to compare
}
function barcodeClash(entry, producto){ return !!imgUrl(entry) && nameClash(producto, imgName(entry)); }
// Lookup as in armado-CH getImgUrl (bcKey → exact name → none) plus the hub's city, memoised
// because the "Sin código" type-ahead asks for dozens of photos per keystroke.
const _imgMemo=new Map();
function getImgUrl(barcode, producto){
  const city=hubCity(), memoKey=(city||'')+'|'+(barcode||'')+'|'+(producto||'');
  if(_imgMemo.has(memoKey)) return _imgMemo.get(memoKey);
  const res=_getImgUrl(barcode, producto, city);
  if(Object.keys(S.imgDb).length) _imgMemo.set(memoKey,res);
  return res;
}
function _getImgUrl(barcode, producto, city){
  const bk=codeKey(barcode), name=normName(producto||'');
  const entry=bk ? pickEntry(bk, city) : null;
  const byCode=barcodeClash(entry, producto) ? null : imgUrl(entry); // url:null entries fall through to the name
  if(byCode) return byCode;
  return (name?imgUrl(S.imgDb[name]):null)||null; // exact name only: first-word and prefix guesses showed other products
}

/* ════════════════════════════════════════════════════════════════════════════════════
   SMALL HELPERS (ours)
   ════════════════════════════════════════════════════════════════════════════════════ */
// device_id identifies the phone in rec_events. It never decides which page opens (rule 7).
const DEVICE_ID=(()=>{ try{ let d=localStorage.getItem('mr_device_id'); if(!d){ d='d'+Math.random().toString(36).slice(2,10); localStorage.setItem('mr_device_id',d); } return d; }catch(_){ return 'd-nostorage'; } })();
function newUid(){ return DEVICE_ID+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7); }
function normKgPz(v){ return /^kg$/i.test(String(v||'').trim()) ? 'Kg' : 'Pz'; }
function unitOf(kgpz){ return kgpz==='Kg' ? 'kg' : 'pz'; }
function round2(n){ return Math.round(Number(n)*100)/100; }
function fmtQty(n, kgpz){ return kgpz==='Kg' ? round2(n).toFixed(2) : String(Math.round(Number(n))); }
// Export numbers: "24.6", "1,234.5", "3,5" → Number; empty → 0; garbage → NaN
function parseNum(v){
  let s=String(v==null?'':v).trim().replace(/\s/g,''); if(!s) return 0;
  if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s=s.replace(/,/g,''); else s=s.replace(',','.');
  const n=Number(s); return isFinite(n) ? n : NaN;
}
// Presentation = the last size/weight/count token of the name ("500g", "1kg", "150pz", "(4pz de 60g)")
const PRES_RE=/\(\s*\d+\s*(?:pz|pzs|piezas)\b[^)]*\)|\d+(?:[.,]\d+)?\s?(?:kg|gr|g|mg|ml|lt|l|oz|pzs|pz|piezas)(?![a-z])/gi;
function presentacion(name){
  const s=String(name||''); let m, last=null; PRES_RE.lastIndex=0;
  while((m=PRES_RE.exec(s))) last={i:m.index, t:m[0]};
  return last;
}
function nameHtml(name){
  const s=String(name||''), p=presentacion(s);
  if(!p) return escapeHtml(s);
  return escapeHtml(s.slice(0,p.i))+'<mark>'+escapeHtml(p.t)+'</mark>'+escapeHtml(s.slice(p.i+p.t.length));
}
// §7.2 family key: the name without size/weight/count tokens ("Oreo 210g" ~ "Oreo 114g")
const SIZE_RE=/\d+(?:[.,]\d+)?\s?(?:kg|kgs|gr|grs|g|mg|ml|lt|lts|l|oz|pzs|pz|piezas)(?![a-z])/gi;
function familyKey(name){
  // grades count as size too: "41/50" shrimp, "95/5" ground beef
  const s=String(name||'').replace(/\([^)]*\d[^)]*\)/g,' ').replace(SIZE_RE,' ').replace(/\b\d+\s*\/\s*\d+\b/g,' ');
  return normName(s).replace(/\b(de|con|x)$/,'').trim();
}
function imgTag(barcode, producto, cls){
  const u=getImgUrl(barcode, producto);
  return u ? `<img class="${cls}" src="${escapeHtml(u)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'${cls==='thumb'?'thumb-none':'pcard-noimg'}',innerHTML:'<svg width=&quot;22&quot; height=&quot;22&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; aria-hidden=&quot;true&quot;><path d=&quot;M21 8 12 3 3 8v8l9 5 9-5z&quot;/><path d=&quot;m3 8 9 5 9-5M12 13v8&quot;/></svg>'}))">`
           : `<div class="${cls==='thumb'?'thumb-none':'pcard-noimg'}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg></div>`;
}

/* ════════════════════════════════════════════════════════════════════════════════════
   SORTING POSITIONS (plan §3.2) — read-only from bucket sorting-hub, cached per hub like Sorting Hub does.
   items: [[producto, barcode, pasillo, estante, nivel, posDentro, temp], …]
   ════════════════════════════════════════════════════════════════════════════════════ */
S.sortBC=new Map(); S.sortName=new Map(); S.sortStatus='loading'; S.sortUpdatedAt=null;
async function loadSorting(slug){
  const src=SORTING_SLUG[slug]||slug, CK='mr_sorting_'+src;
  let cached=null; try{ cached=JSON.parse(localStorage.getItem(CK)||'null'); }catch(_){}
  let data=null, status='ok';
  try{
    const r=await fetch(`${SB_URL}/storage/v1/object/public/${SORTING_BUCKET}/sorting/${src}/version.txt`,{cache:'no-store'});
    if(r.ok){
      const v=(await r.text()).trim();
      if(cached && cached.v===v) data=cached.data;
      else{
        data=await (await sbPublic(`sorting/${src}/latest.json`, SORTING_BUCKET)).json();
        try{
          for(const k of Object.keys(localStorage)) if(k.startsWith('mr_sorting_') && k!==CK) localStorage.removeItem(k);
          localStorage.setItem(CK, JSON.stringify({v, data}));
        }catch(_){}
      }
    } else if(r.status===400 || r.status===404){ status='none'; } // this hub never published a sorting file
    else { data=cached&&cached.data; status=data?'offline':'err'; }
  }catch(_){ data=cached&&cached.data; status=data?'offline':'err'; }
  const bc=new Map(), nm=new Map();
  for(const it of (data&&data.items)||[]){
    const k=codeKey(it[1]); if(k && !bc.has(k)) bc.set(k,it);
    const n=normName(it[0]); if(n && !nm.has(n)) nm.set(n,it);
  }
  S.sortBC=bc; S.sortName=nm; S.sortStatus=status; S.sortUpdatedAt=data&&data.updatedAt;
}
// B01–B16 are freezer aisles (Sorting Hub §12.1)
const FREEZER_AISLE_RE=/^B\d{2}$/;
function positionOf(barcode, producto){
  const it=S.sortBC.get(codeKey(barcode)) || S.sortName.get(normName(producto));
  if(!it) return null;
  const pasillo=String(it[2]||'').trim().toUpperCase(), estante=String(it[3]||'').trim(), nivel=String(it[4]||'').trim(), dentro=String(it[5]||'').trim();
  if(!pasillo) return null;
  return { letra:pasillo, full:[pasillo,estante,nivel].filter(Boolean).join('-')+(dentro?` · ${dentro}`:''),
           palabra: FREEZER_AISLE_RE.test(pasillo)?'Congelador':'Canasta' };
}

/* ════════════════════════════════════════════════════════════════════════════════════
   MODAL — only where the plan allows one (§6.3 unknown code, §6.7 re-upload, §7.1, §7.2-qty, §7.4, §7.6).
   Blocking: no backdrop dismiss.
   ════════════════════════════════════════════════════════════════════════════════════ */
let _modalResolve=null;
function showModal({title, html='', buttons, cancel=false}){
  return new Promise(res=>{
    _modalResolve=res;
    document.getElementById('modal-body').innerHTML=(title?`<div class="modal-title">${escapeHtml(title)}</div>`:'')+html;
    const act=document.getElementById('modal-actions');
    act.innerHTML=buttons.map((b,i)=>`<button class="btn btn-${b.kind||'secondary'} btn-block" data-i="${i}">${escapeHtml(b.label)}</button>`).join('')
      +(cancel?`<button class="link-btn" data-cancel="1">Cancelar</button>`:'');
    const done=v=>{ document.getElementById('modal-bg').classList.remove('open'); _modalResolve=null; res(v); setTimeout(focusScan,30); };
    act.querySelectorAll('button').forEach(btn=>btn.onclick=()=>done(btn.dataset.cancel?null:buttons[Number(btn.dataset.i)].value));
    // Choices inside the body (e.g. §7.1 look-alikes) answer the modal too: data-mv="value"
    document.getElementById('modal-body').querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>done(b.dataset.mv));
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
    document.getElementById('modal-bg').classList.add('open');
  });
}
function modalOpen(){ return document.getElementById('modal-bg').classList.contains('open'); }

/* ════════════════════════════════════════════════════════════════════════════════════
   INICIO (§6.1) — hub → área → receptor, nothing pre-selected, nothing stored (rule 7).
   ════════════════════════════════════════════════════════════════════════════════════ */
const INI={ hub:null, area:null, receptor:null, active:undefined }; // memory only
let RECEPTORES; // undefined = loading · null = no config file yet · 'offline' · { slug: [names] }
let _activeTok=0;
async function loadReceptores(){
  try{ RECEPTORES=JSON.parse(await sbFetch('config/receptores.json')); }
  catch(e){ RECEPTORES = isNetErr(e) ? 'offline' : null; }
  if(document.getElementById('screen-inicio').classList.contains('active')) renderInicio();
}
function receptoresDeHub(slug){ return (RECEPTORES && typeof RECEPTORES==='object' && Array.isArray(RECEPTORES[slug])) ? RECEPTORES[slug] : null; }
function iniPick(k, v){
  INI[k]=v;
  if(k==='hub'){ INI.area=null; INI.receptor=null; }
  if(k==='area'){ INI.receptor=null; }
  INI.active=undefined;
  renderInicio();
  if(INI.receptor) refreshActive();
  const steps=document.querySelectorAll('#inicio-body .step'); const last=steps[steps.length-1];
  if(last) setTimeout(()=>last.scrollIntoView({behavior:'smooth', block:'nearest'}),30);
}
function iniPickReceptor(i){ iniPick('receptor', receptoresDeHub(INI.hub)[i]); }
function iniFreeName(){
  const v=String(document.getElementById('free-name').value||'').trim().replace(/\s+/g,' ');
  if(v.length<2){ toast('Escribe tu nombre'); return; }
  iniPick('receptor', v);
}
function renderInicio(){
  const b=document.getElementById('inicio-body'); if(!b) return;
  let h=`<div class="step"><div class="step-title">1 · Hub</div><div class="choice-grid">`
    +HUBS.map(x=>`<button class="choice ${INI.hub===x.slug?'sel':''}" onclick="iniPick('hub','${x.slug}')">${escapeHtml(x.name)}</button>`).join('')+`</div></div>`;
  if(INI.hub){
    h+=`<div class="step"><div class="step-title">2 · Área</div><div class="choice-grid">`
      +AREAS.map(a=>`<button class="choice big ${INI.area===a.id?'sel':''}" onclick="iniPick('area','${a.id}')">${a.name}</button>`).join('')+`</div></div>`;
  }
  if(INI.hub && INI.area){
    h+=`<div class="step"><div class="step-title">3 · ¿Quién recibe?</div>`;
    const list=receptoresDeHub(INI.hub);
    if(RECEPTORES===undefined) h+=`<div class="muted">Cargando receptores…</div>`;
    else if(list && list.length){
      h+=`<div class="choice-grid">`+list.map((n,i)=>`<button class="choice ${INI.receptor===n?'sel':''}" onclick="iniPickReceptor(${i})">${escapeHtml(n)}</button>`).join('')+`</div>`;
    } else {
      // Temporary until Admin → Receptores writes recibo/config/receptores.json (§6.8)
      h+=`<div class="note">${RECEPTORES==='offline'?'Sin conexión para cargar la lista de receptores.':'Aún no hay lista de receptores para este hub.'} Escribe tu nombre (temporal).</div>`
        +`<div style="display:flex;gap:8px"><input id="free-name" class="text-input" placeholder="Tu nombre" autocomplete="off" value="${escapeHtml(INI.receptor||'')}" onkeydown="if(event.key==='Enter')iniFreeName()"><button class="btn btn-primary" onclick="iniFreeName()">OK</button></div>`;
    }
    h+=`</div>`;
  }
  if(INI.hub && INI.area && INI.receptor){
    h+=`<div class="step"><div class="step-title">4 · Envío de ${escapeHtml(hubName(INI.hub))} · ${areaName(INI.area)}</div>${inicioActionsHtml()}
      <button class="link-btn" onclick="openRecepciones()">Recepciones cerradas (para registrar en el sistema)</button></div>`;
  }
  h+=`<button class="link-btn" style="color:var(--gray-500);margin-top:28px" onclick="openAdmin()">Admin</button>`;
  b.innerHTML=h;
}
function inicioActionsHtml(){
  const a=INI.active;
  const subir=`<button class="btn btn-secondary btn-block" onclick="openSubir()">Subir envío</button>`;
  // §6.2b — the truck arrived before its file (mostly Carnes)
  const sinArch=SIN_ARCHIVO_ENABLED ? `<button class="btn btn-secondary btn-block" onclick="startSinArchivo()">Empezar sin archivo</button>` : '';
  if(a===undefined) return `<div class="muted">Buscando el envío activo…</div>`;
  if(a.offline && !a.data) return `<div class="warn-box">Sin conexión. Conéctate a internet para cargar el envío.</div><button class="btn btn-secondary btn-block" onclick="refreshActive()">Reintentar</button>`;
  if(a.none) return `<div class="info-card">Todavía no hay un envío cargado para este hub y área.</div><div class="stack"><button class="btn btn-primary btn-block" onclick="openSubir()">Subir envío</button>${sinArch}</div>`;
  const d=a.data, today=todayStr();
  if(d.sinArchivo && !a.closed){
    return `<div class="info-card"><b>Recepción sin archivo</b>, empezada el ${fechaLarga(d.fecha)} a las ${localHM(new Date(d.uploadedAt))}${d.receptor?' por '+escapeHtml(d.receptor):''}.
      <div class="muted" style="margin-top:4px">Sube el envío cuando esté listo: lo escaneado se conserva y se revisa.</div></div>
      <div class="stack"><button class="btn btn-primary btn-block" onclick="continuarRecepcion()">Continuar recepción</button>${a.offline?'':subir}</div>`;
  }
  let info=`<b>Envío cargado el ${fechaLarga(d.fecha)}</b>, ${localHM(new Date(d.uploadedAt))} · ${d.stats.lineas} productos`
    +`<div class="muted" style="font-size:12px;margin-top:2px">${escapeHtml(d.sourceFile||'')}${d.receptor?' · subido por '+escapeHtml(d.receptor):''}</div>`;
  const ps=a.parciales||[];
  if(ps.length && !a.closed){
    const u=ps[ps.length-1], ud=localDateStr(new Date(u.ts)), dd=u.detalle||{};
    info+=`<div style="margin-top:6px"><span class="tag orange">Recepción parcial · ${ps.length} entrega${ps.length===1?'':'s'} cerrada${ps.length===1?'':'s'}</span></div>
      <div class="muted" style="font-size:13px;margin-top:4px">Última: ${ud===today?'hoy':'el '+fechaLarga(ud)} a las ${localHM(new Date(u.ts))}${dd.lineas?` · ${dd.recibidas_total||0} de ${dd.lineas} productos recibidos`:''}. Continúa con lo que falta.</div>`;
  } else if(d.session_fecha && d.session_fecha<today && !a.closed) info+=`<div style="margin-top:6px"><span class="tag orange">Recepción abierta desde el ${fechaLarga(d.session_fecha)}</span></div>`;
  if(a.offline) info+=`<div style="margin-top:6px"><span class="tag red">Sin conexión — copia guardada en este teléfono</span></div>`;
  if(a.closed){
    // §6.7 — no scanning against a closed file
    return `<div class="info-card"><b>El archivo cargado ya se recibió el ${fechaLarga(localDateStr(new Date(a.closed)))}.</b></div>`
      +`<div class="stack"><button class="btn btn-secondary btn-block" onclick="verResumenCerrado()">Ver resumen</button>${subir.replace('btn-secondary','btn-primary')}${d.fecha<today?sinArch:''}</div>`;
  }
  return `<div class="info-card">${info}</div><div class="stack"><button class="btn btn-primary btn-block" onclick="continuarRecepcion()">Continuar recepción</button>${a.offline?'':subir}${(!a.offline && d.session_fecha<today)?sinArch:''}</div>`
    +(a.offline?'':`<button class="link-btn" style="color:var(--red)" onclick="borrarEnvio()">Borrar este envío</button>`);
}
async function refreshActive(){
  const tok=++_activeTok; INI.active=undefined; renderInicio();
  let res; try{ res=await findActiveEnvio(INI.hub, INI.area); }catch(e){ res={offline:true}; }
  if(tok!==_activeTok) return;
  INI.active=res; renderInicio();
}
function goInicio(){
  closeCamera(); closeSheet();
  showScreen('screen-inicio'); renderInicio();
  if(INI.receptor) refreshActive();
}
// Borrar envío: a file uploaded by mistake (wrong hub, a test). Typed "borrar" confirms. The reception's events stay
// (append-only) and an admin 'borrar' event ends it; the .json/.csv are removed and Inicio shows no envío (an older
// file never comes back on its own; Admin → Respaldos can restore one).
async function borrarEnvio(){
  const a=INI.active; if(!a || !a.data || a.closed || a.offline) return;
  const d=a.data;
  let scans=0; try{ scans=(await pgSelect('rec_events', `session_id=eq.${encodeURIComponent(d.session_id)}&tipo=eq.scan&select=id`)).length; }catch(e){ toast('Sin conexión: conéctate para borrar el envío'); return; }
  scans+=OUTBOX.filter(e=>e.session_id===d.session_id && e.tipo==='scan').length;
  const v=await showModal({ title:'¿Borrar este envío?',
    html:`<p><b>${escapeHtml(d.sourceFile||'Envío sin archivo')}</b><br>Cargado el ${fechaLarga(d.fecha)} a las ${localHM(new Date(d.uploadedAt))}${d.receptor?' por '+escapeHtml(d.receptor):''}.</p>`
      +(scans?`<p style="color:var(--c-ink);font-weight:700">Esta recepción tiene ${scans} escaneo${scans===1?'':'s'}: se descartan.</p>`:'')
      +`<p>Úsalo solo si el archivo se subió por error. Escribe <b>borrar</b> para confirmar.</p>
        <input id="del-confirm" class="text-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="escribe aquí">`,
    buttons:[{label:'Borrar envío', value:'del', kind:'danger'}], cancel:true });
  if(v!=='del') return;
  const typed=(document.getElementById('del-confirm')||{}).value||'';
  if(typed.trim().toLowerCase()!=='borrar'){ toast('No se borró: escribe «borrar» para confirmar', 3500); return; }
  const paths=[d._path||a.path].concat(d.csvPath?[d.csvPath]:[]);
  try{
    await pgInsert('rec_events', [{ session_id:d.session_id, hub:INI.hub, area:INI.area, fecha:d.session_fecha||d.fecha, tipo:'admin',
      detalle:{ uid:newUid(), accion:'borrar', envio:paths[0], csv:d.csvPath||null, archivo:d.sourceFile||'', escaneos:scans },
      receptor:INI.receptor, device_id:DEVICE_ID, ts:serverNow().toISOString() }]);
    await sbDeleteEnvio(paths);
    OUTBOX=OUTBOX.filter(e=>e.session_id!==d.session_id); saveOutbox();
    try{ localStorage.removeItem(mirrorPrefix(INI.hub, INI.area)+(d.session_fecha||d.fecha)); }catch(_){}
    toast('✓ Envío borrado');
  }catch(e){ toast(isNetErr(e)?'Sin conexión: no se borró. Intenta de nuevo.':'No se pudo borrar ('+e.message+')', 4500); }
  refreshActive();
}
function continuarRecepcion(){ const a=INI.active; if(a && a.data) openRecibir(a.data, { parciales:(a.parciales||[]).length }); }

/* ── Active envío (§6.7): the newest envios/{slug}/{area}/*.json ── */
async function findActiveEnvio(slug, area){
  let items;
  try{ items=await sbList(`envios/${slug}/${area}/`); }
  catch(e){ const m=latestMirror(slug, area); return m ? {offline:true, data:m.envio} : {offline:true}; }
  const names=(items||[]).map(o=>o.name).filter(n=>/\.json$/.test(n)).sort().reverse();
  if(!names.length) return {none:true};
  const path=`envios/${slug}/${area}/${names[0]}`;
  const data=JSON.parse(await sbFetch(path)); data._path=path;
  // Borrar envío: after a delete, an older file must not come back as active — show nothing until a new upload
  const del=await pgSelect('rec_events', `hub=eq.${encodeURIComponent(slug)}&area=eq.${area}&tipo=eq.admin&detalle->>accion=eq.borrar&select=ts&order=id.desc&limit=1`);
  if(del.length && Date.parse(del[0].ts)>Date.parse(data.uploadedAt)) return {none:true};
  const closed=await sessionClosedAt(data.session_id);
  return { path, data, closed, parciales: closed ? [] : await sessionParciales(data.session_id) };
}
// Entregas parciales already closed in an open reception (Inicio shows them; unreachable → none)
async function sessionParciales(sessionId){
  try{ return await pgSelect('rec_events', `session_id=eq.${encodeURIComponent(sessionId)}&tipo=eq.parcial&select=ts,detalle&order=ts.asc`); }
  catch(_){ return []; }
}
async function sessionClosedAt(sessionId){
  // A 'cerrar' event closes the reception; a later admin 'reabrir' (§6.8) opens it again.
  // Unreachable → treated as open (never blocks resuming).
  try{
    const r=await pgSelect('rec_events', `session_id=eq.${encodeURIComponent(sessionId)}&tipo=in.(cerrar,admin)&select=ts,tipo,detalle&order=id.desc&limit=20`);
    for(const e of r){
      if(e.tipo==='cerrar' || (e.detalle && e.detalle.accion==='borrar')) return e.ts;
      if(e.detalle && e.detalle.accion==='reabrir') return null;
    }
    return null;
  }catch(_){ return null; }
}
async function sessionHasScans(sessionId){
  if(OUTBOX.some(e=>e.session_id===sessionId && e.tipo==='scan')) return true;
  const r=await pgSelect('rec_events', `session_id=eq.${encodeURIComponent(sessionId)}&tipo=eq.scan&select=id&limit=1`);
  return r.length>0;
}

/* ════════════════════════════════════════════════════════════════════════════════════
   SUBIR ENVÍO (§5.2, §6.2)
   ════════════════════════════════════════════════════════════════════════════════════ */
let SUBIR=null; // { file, parsed, acks:Set, busy, error }
let PENDING_UPLOAD=null; // the file chosen before "Primero cerrar la recepción actual" (§6.7)
function resumePendingUpload(){
  if(!PENDING_UPLOAD) return;
  SUBIR=Object.assign(PENDING_UPLOAD, { busy:false, error:null }); PENDING_UPLOAD=null;
  document.getElementById('subir-title').textContent=`${hubName(INI.hub)} · ${areaName(INI.area)}`;
  showScreen('screen-subir'); renderSubir();
}
function openSubir(){
  SUBIR=null;
  document.getElementById('subir-title').textContent=`${hubName(INI.hub)} · ${areaName(INI.area)}`;
  document.getElementById('subir-result').innerHTML='';
  document.getElementById('envio-file').value='';
  showScreen('screen-subir');
}
async function onEnvioFile(input){
  const file=input.files && input.files[0]; if(!file) return;
  let text; try{ text=await file.text(); }catch(e){ text=''; }
  SUBIR={ file, parsed:parseEnvio(text), acks:new Set(), busy:false, error:null };
  renderSubir();
}
// §5.2 — verified on both fixtures (Abarrotes 105 lines / Carnes 132 lines, 26 Kg)
function parseEnvio(text){
  const out={ errors:[], warnings:[], lines:[], catalogo:[], stats:null, newestEnvio:null };
  const p=Papa.parse(stripBOM(String(text||'')), { header:true, dynamicTyping:false, skipEmptyLines:true });
  const fields=(p.meta && p.meta.fields)||[];
  const col=name=>fields.find(f=>normHeader(stripBOM(f))===normHeader(name));
  const C={ producto:col('Producto'), barcode:col('Código de barras'), kgpz:col('Kg/Pz'), envio:col('Envío (kg o pz)'),
            temp:col('Temp'), categoria:col('Categoría'), act:col('Actualización envío'), por:col('Envío registrado por'),
            reqConf:col('Requiere confirmar'), vida:col('Vida anaquel usuarios (min. días)') };
  const missing=[['Producto',C.producto],['Código de barras',C.barcode],['Kg/Pz',C.kgpz],['Envío (kg o pz)',C.envio]].filter(x=>!x[1]).map(x=>x[0]);
  if(missing.length){
    out.errors.push(`Al archivo le falta${missing.length>1?'n las columnas':' la columna'} ${missing.map(m=>`«${m}»`).join(', ')}. ¿Es la exportación de Envío del sistema?`);
    return out;
  }
  const bySku=new Map(); let badNums=0, dupes=0;
  (p.data||[]).forEach((r, rowIndex)=>{
    const producto=String(r[C.producto]||'').trim(); if(!producto) return;
    const barcode=cleanBC(r[C.barcode]).replace(/\s+/g,'');
    const kgpz=normKgPz(r[C.kgpz]);
    const esperado=parseNum(r[C.envio]);
    if(isNaN(esperado)){ badNums++; return; }
    const sku_key=skuKeyOf(barcode, producto);
    const vd=C.vida?parseInt(String(r[C.vida]||'').trim(),10):NaN, vida_dias=vd>=0?vd:null;
    if(!(esperado>0)){ out.catalogo.push([producto, barcode, kgpz, vida_dias]); return; }
    if(bySku.has(sku_key)){ // same product on two lines — counted together (never seen in real files)
      const l=bySku.get(sku_key); l.esperado=round2(l.esperado+esperado); dupes++; return;
    }
    const line={ rowIndex, producto, barcode, sku_key, kgpz, esperado:round2(esperado), vida_dias,
      temp:String(C.temp?r[C.temp]||'':'').trim(), categoria:String(C.categoria?r[C.categoria]||'':'').trim(),
      actualizacion_envio:String(C.act?r[C.act]||'':'').trim(), envio_registrado_por:String(C.por?r[C.por]||'':'').trim(),
      _reqConf:C.reqConf?String(r[C.reqConf]||'').trim().toLowerCase():'' };
    bySku.set(sku_key, line); out.lines.push(line);
  });
  if(!out.lines.length){
    out.errors.push('El archivo no trae ningún producto con «Envío (kg o pz)» mayor a 0. ¿Es el envío de este hub?');
    return out;
  }
  if(badNums) out.errors.push(`${badNums} renglón(es) tienen un número de envío que no se puede leer. Descarga el archivo otra vez.`);
  // Requiere confirmar flips to FALSE once the reception is registered in the system — a hint, never a filter.
  if(C.reqConf && out.lines.every(l=>l._reqConf==='false'))
    out.warnings.push({ id:'confirmado', html:'<b>Este envío parece ya confirmado en el sistema.</b> ¿Es el archivo correcto?' });
  let newest=null;
  for(const l of out.lines){ const t=Date.parse(l.actualizacion_envio); if(!isNaN(t) && (newest===null || t>newest)) newest=t; }
  if(newest!==null){
    out.newestEnvio=new Date(newest).toISOString();
    const age=daysBetween(localDateStr(new Date(newest)), todayStr());
    if(age>2) out.warnings.push({ id:'viejo', html:`<b>El envío del archivo se registró el ${fechaLarga(localDateStr(new Date(newest)))}</b> (hace ${age} días). ¿Es el envío correcto?` });
  }
  if(dupes) out.warnings.push({ id:'dupes', html:`${dupes} producto(s) aparecen en más de un renglón; se van a recibir juntos.` });
  out.lines.forEach(l=>delete l._reqConf);
  out.stats={ lineas:out.lines.length, kg:out.lines.filter(l=>l.kgpz==='Kg').length,
              sinCodigo:out.lines.filter(l=>!l.barcode).length, catalogo:out.catalogo.length, renglones:(p.data||[]).length };
  return out;
}
function renderSubir(){
  const el=document.getElementById('subir-result'); if(!SUBIR){ el.innerHTML=''; return; }
  const P=SUBIR.parsed;
  let h=`<div class="info-card" style="margin-top:14px"><b>${escapeHtml(SUBIR.file.name)}</b></div>`;
  if(P.errors.length){ el.innerHTML=h+P.errors.map(e=>`<div class="err-box">${escapeHtml(e)}</div>`).join(''); return; }
  const s=P.stats, reg=P.newestEnvio?new Date(P.newestEnvio):null;
  // Line counts only — the blind count never shows quantities (§2.3)
  h+=`<div class="stat-grid">
      <div class="stat"><div class="stat-n">${s.lineas}</div><div class="stat-l">productos en el envío</div></div>
      <div class="stat"><div class="stat-n">${s.kg}</div><div class="stat-l">se pesan (Kg)</div></div>
      <div class="stat"><div class="stat-n">${s.sinCodigo}</div><div class="stat-l">sin código de barras</div></div>
      <div class="stat"><div class="stat-n">${reg?fechaLarga(localDateStr(reg)).replace(/ de /,' '):'—'}</div><div class="stat-l">envío registrado${reg?' · '+localHM(reg):''}</div></div>
    </div>`;
  for(const w of P.warnings){
    const ok=SUBIR.acks.has(w.id);
    h+=`<div class="warn-box ${ok?'ok':''}">${w.html}${ok?'<div style="margin-top:6px;font-weight:700">✓ Confirmado</div>'
      :`<button class="btn btn-warn btn-block" onclick="SUBIR.acks.add('${w.id}');renderSubir()">Sí, es el archivo correcto</button>`}</div>`;
  }
  if(SUBIR.error) h+=`<div class="err-box">${escapeHtml(SUBIR.error)}</div>`;
  const ready=P.warnings.every(w=>SUBIR.acks.has(w.id)) && !SUBIR.busy;
  h+=`<button class="btn btn-primary btn-block" style="margin-top:12px" ${ready?'':'disabled'} onclick="startUpload()">${SUBIR.busy?'Subiendo…':'Cargar envío y empezar a recibir'}</button>`;
  el.innerHTML=h;
}
async function startUpload(){
  if(!SUBIR || SUBIR.busy) return;
  SUBIR.busy=true; SUBIR.error=null; renderSubir();
  try{ await doUpload(); }
  catch(e){ SUBIR.error=(isNetErr(e)?'Sin conexión: no se pudo subir el archivo. ':'No se pudo subir el archivo ('+e.message+'). ')+'Intenta de nuevo.'; }
  if(SUBIR){ SUBIR.busy=false; renderSubir(); }
}
async function doUpload(){
  const P=SUBIR.parsed, slug=INI.hub, area=INI.area;
  const now=serverNow(), epochMs=now.getTime(), fecha=localDateStr(now);
  // §6.7 — does this file belong to the reception already open for this hub+área?
  const prev=await findActiveEnvio(slug, area);
  if(prev.offline) throw new TypeError('offline');
  let reuse=false;
  if(prev.data && !prev.closed && prev.data.sinArchivo) reuse=true; // §6.2b — the file of the reception already started
  else if(prev.data && !prev.closed){
    if(await sessionHasScans(prev.data.session_id)){
      const v=await showModal({ title:'Esta recepción ya tiene productos escaneados',
        html:`<p>Lo escaneado es conteo físico: se conserva y se vuelve a comparar contra el archivo nuevo.</p>`,
        buttons:[{label:'Reemplazar el archivo y conservar lo escaneado', value:'replace', kind:'primary'},
                 {label:'Primero cerrar la recepción actual', value:'close', kind:'secondary'}], cancel:true });
      // "Primero cerrar": keep the chosen file so it can be loaded right after closing
      if(v==='close'){ PENDING_UPLOAD=SUBIR; SUBIR=null; openRecibir(prev.data, { noStale:true }); openResumen(); return; }
      if(v!=='replace') return;
      reuse=true;
    } else if(prev.data.session_fecha===fecha) reuse=true; // same day, nothing scanned → simply replaces
  }
  const session_id = reuse ? prev.data.session_id : `${slug}__${area}__${fecha}__${epochMs}`;
  const session_fecha = reuse ? prev.data.session_fecha : fecha;
  const base=`envios/${slug}/${area}/${fecha}__${epochMs}`;
  const data={ v:1, hub:slug, area, fecha, epochMs, uploadedAt:now.toISOString(), receptor:INI.receptor,
    sourceFile:SUBIR.file.name, csvPath:base+'.csv', session_id, session_fecha,
    stats:P.stats, newestEnvio:P.newestEnvio, lines:P.lines, catalogo:P.catalogo };
  await sbUpload(base+'.csv', SUBIR.file, 'text/csv; charset=utf-8'); // raw, verbatim
  await sbUpload(base+'.json', JSON.stringify(data), 'application/json'); // written last: its presence makes it active
  data._path=base+'.json';
  const fileName=SUBIR.file.name; SUBIR=null;
  const wasSinArchivo=reuse && prev.data.sinArchivo;
  openRecibir(data, { revisar:wasSinArchivo });
  recordEvent(makeEvent(reuse?'reemplazo':'abrir', { detalle:{ envio:base+'.json', csv:base+'.csv', archivo:fileName,
    lineas:P.stats.lineas, anterior:reuse?prev.path:undefined, tras_sin_archivo:wasSinArchivo||undefined } }));
  toast(wasSinArchivo?'✓ Archivo cargado — revisando lo escaneado':reuse?'✓ Archivo reemplazado — lo escaneado se conserva':'✓ Envío cargado. Empieza a escanear.');
}
// §6.2b — start receiving before the file exists. A placeholder envío JSON makes the reception visible to
// other phones; the real upload later reuses its session_id.
async function startSinArchivo(){
  if(!SIN_ARCHIVO_ENABLED) return;
  const slug=INI.hub, area=INI.area, now=serverNow(), epochMs=now.getTime(), fecha=localDateStr(now);
  let prev; try{ prev=await findActiveEnvio(slug, area); }catch(_){ prev={offline:true}; }
  if(prev.offline){ toast('Sin conexión: conéctate para empezar la recepción'); return; }
  if(prev.data && !prev.closed && prev.data.session_fecha===fecha){ toast('Ya hay una recepción abierta hoy: continúala'); refreshActive(); return; }
  const session_id=`${slug}__${area}__${fecha}__${epochMs}`, base=`envios/${slug}/${area}/${fecha}__${epochMs}`;
  const data={ v:1, hub:slug, area, fecha, epochMs, uploadedAt:now.toISOString(), receptor:INI.receptor, sinArchivo:true,
    sourceFile:'', session_id, session_fecha:fecha, stats:{ lineas:0, kg:0, sinCodigo:0, catalogo:0, renglones:0 }, lines:[],
    // the previous file's whole catalog names the products (and their Kg/Pz) until today's file arrives
    catalogo:prev.data ? (prev.data.catalogo||[]).concat((prev.data.lines||[]).map(l=>[l.producto, l.barcode, l.kgpz])) : [] };
  try{ await sbUpload(base+'.json', JSON.stringify(data), 'application/json'); }
  catch(e){ toast(isNetErr(e)?'Sin conexión: intenta de nuevo':'No se pudo empezar ('+e.message+')'); return; }
  data._path=base+'.json';
  openRecibir(data);
  recordEvent(makeEvent('abrir', { detalle:{ envio:base+'.json', sin_archivo:true } }));
  toast('Recepción sin archivo: empieza a escanear');
}

/* ════════════════════════════════════════════════════════════════════════════════════
   EVENTS + OUTBOX (§8) — rec_events is append-only and the source of truth. Every event carries a
   client uid (detalle.uid) so a retried insert or the local mirror never double-counts.
   ════════════════════════════════════════════════════════════════════════════════════ */
const OUTBOX_KEY='mr_outbox', DEAD_KEY='mr_outbox_failed';
let OUTBOX=(()=>{ try{ return JSON.parse(localStorage.getItem(OUTBOX_KEY)||'[]'); }catch(_){ return []; } })();
let _outboxPersisted=true;
function saveOutbox(){ try{ localStorage.setItem(OUTBOX_KEY, JSON.stringify(OUTBOX)); _outboxPersisted=true; }catch(_){ _outboxPersisted=false; } }
const NET={ ok:true };
function makeEvent(tipo, f={}){
  return { session_id:S.session.id, hub:S.hub, area:S.area, fecha:S.session.fecha, tipo,
    sku_key:f.sku_key??null, producto:f.producto??null, cantidad:f.cantidad??null, metodo:f.metodo??null,
    detalle:Object.assign({ uid:newUid() }, f.detalle||{}), receptor:S.receptor, device_id:DEVICE_ID,
    ts:serverNow().toISOString() };
}
function recordEvent(ev){
  OUTBOX.push(ev); saveOutbox();
  if(!_outboxPersisted) toast('La memoria del teléfono está llena: no cierres la app hasta que se suba todo', 5000);
  addEvents([ev]); saveMirror();
  flushOutbox();
}
let _flushing=false;
async function flushOutbox(){
  if(_flushing || !OUTBOX.length){ renderNet(); return; }
  _flushing=true; renderNet();
  try{
    while(OUTBOX.length){
      const batch=OUTBOX.slice(0,100);
      try{ await pgInsert('rec_events', batch); }
      catch(e){
        if(isNetErr(e)) throw e;
        // A row the server rejects must not block every scan behind it: retry one by one, park the bad ones.
        for(const ev of batch){
          try{ await pgInsert('rec_events', [ev]); }
          catch(e2){ if(isNetErr(e2)) throw e2; parkDead(ev, e2); }
        }
      }
      const sent=new Set(batch.map(e=>e.detalle.uid));
      OUTBOX=OUTBOX.filter(e=>!sent.has(e.detalle.uid)); saveOutbox();
      NET.ok=true;
    }
  }catch(e){ NET.ok=false; }
  finally{
    _flushing=false; renderNet();
    // the close button depends on an empty outbox
    if(document.getElementById('screen-resumen').classList.contains('active') && !S.closing) renderResumen();
  }
}
function parkDead(ev, err){
  try{ const d=JSON.parse(localStorage.getItem(DEAD_KEY)||'[]'); d.push({ev, err:String(err&&err.message)}); localStorage.setItem(DEAD_KEY, JSON.stringify(d)); }catch(_){}
  console.error('rec_events rechazó un evento', ev, err);
}
function renderNet(){
  const el=document.getElementById('net-badge'); if(!el) return;
  const n=OUTBOX.length, off=!NET.ok || navigator.onLine===false;
  if(n){ el.className='net-badge '+(off?'off':'pend'); el.textContent=(off?'Sin conexión · ':'Subiendo · ')+n; }
  else if(off){ el.className='net-badge off'; el.textContent='Sin conexión'; }
  else { el.className='net-badge ok'; el.textContent='✓ Guardado'; }
}
window.addEventListener('online', ()=>{ NET.ok=true; flushOutbox(); });
window.addEventListener('offline', renderNet);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') flushOutbox(); });
setInterval(()=>{ if(OUTBOX.length) flushOutbox(); }, 15000);

/* ── Local mirror (§8): mr_session_{slug}_{area}_{fecha} = { envio, events }. Protects work; never picks a page. ── */
function mirrorPrefix(slug, area){ return `mr_session_${slug}_${area}_`; }
let _mirrorT=null;
function saveMirror(){
  clearTimeout(_mirrorT);
  _mirrorT=setTimeout(()=>{
    if(!S.session) return;
    const pre=mirrorPrefix(S.hub, S.area), key=pre+S.session.fecha;
    try{
      for(const k of Object.keys(localStorage)) if(k.startsWith(pre) && k!==key) localStorage.removeItem(k);
      localStorage.setItem(key, JSON.stringify({ envio:S.envio, events:S.events }));
    }catch(_){}
  }, 300);
}
function latestMirror(slug, area){
  try{
    const pre=mirrorPrefix(slug, area);
    const keys=Object.keys(localStorage).filter(k=>k.startsWith(pre)).sort();
    if(!keys.length) return null;
    const m=JSON.parse(localStorage.getItem(keys[keys.length-1])||'null');
    return m && m.envio ? m : null;
  }catch(_){ return null; }
}

/* ── Fold (§8): session state = scans + ajustes summed per sku_key. ── */
function addEvents(evs){
  let added=false;
  for(const e of evs||[]){
    const u=(e.detalle&&e.detalle.uid) || ('id'+e.id);
    if(S.eventUids.has(u)) continue;
    S.eventUids.add(u); S.events.push(e); added=true;
  }
  if(added){ S.events.sort((a,b)=>String(a.ts).localeCompare(String(b.ts))); fold(); }
  return added;
}
function fold(){
  const rec=new Map(), adj=new Map(), noEsp=new Map(), sep=new Map();
  for(const e of S.events){
    if(e.tipo!=='scan' && e.tipo!=='ajuste') continue;
    const q=Number(e.cantidad)||0;
    rec.set(e.sku_key, round2((rec.get(e.sku_key)||0)+q));
    if(e.tipo==='ajuste' && e.detalle && e.detalle.ref) adj.set(e.detalle.ref, round2((adj.get(e.detalle.ref)||0)+q));
    if(e.tipo==='ajuste' && e.detalle && e.detalle.ref && e.detalle.separar) sep.set(e.detalle.ref, e.detalle.separar); // latest wins
    if(e.tipo==='scan' && !S.lines.has(e.sku_key) && !noEsp.has(e.sku_key))
      noEsp.set(e.sku_key, { producto:e.producto, kgpz:(e.detalle&&e.detalle.kgpz)||'Pz' });
  }
  S.recibido=rec; S.adjByRef=adj; S.sepByRef=sep; S.noEsperados=noEsp; // noEsperados feed the Phase 3 summary
}
function recibidoDe(sku){ return S.recibido.get(sku)||0; }

/* ════════════════════════════════════════════════════════════════════════════════════
   RECIBIR (§6.3) — blind: the enviado number is never rendered on this screen.
   ════════════════════════════════════════════════════════════════════════════════════ */
Object.assign(S, { hub:null, area:null, receptor:null, envio:null, session:null, lines:new Map(), catalog:new Map(),
  catByCode:new Map(), events:[], eventUids:new Set(), recibido:new Map(), adjByRef:new Map(), noEsperados:new Map(),
  current:null, corrigiendo:null });
function setEnvio(data){
  S.envio=data;
  S.lines=new Map(data.lines.map(l=>[l.sku_key, Object.assign(l, { _n:normName(l.producto) })]));
  S.sibCache=new Map();
  for(const l of S.lines.values()) l._fw=famWords(l.producto);
}
function openRecibir(data, opts={}){
  S.hub=INI.hub; S.area=INI.area; S.receptor=INI.receptor;
  S.session={ id:data.session_id, fecha:data.session_fecha };
  setEnvio(data);
  S.events=[]; S.eventUids=new Set(); S.current=null; S.corrigiendo=null; S.separando=null; S.staleAsked=false; S.recentAll=false; S.resumenOrder=new Map(); S.lastId=0; S.closedInfo=null; S.armado=null; S.conParciales=!!opts.parciales;
  buildCatalog();
  const m=latestMirror(S.hub, S.area);
  if(m && m.envio && m.envio.session_id===S.session.id) addEvents(m.events);
  addEvents(OUTBOX.filter(e=>e.session_id===S.session.id));
  fold();
  document.getElementById('rec-hub').textContent=hubName(S.hub);
  document.getElementById('rec-area').textContent=areaName(S.area);
  document.getElementById('rec-receptor').textContent=S.receptor;
  showScreen('screen-recibir');
  renderRecibir(); focusScan();
  loadSorting(S.hub).then(()=>{ buildCatalog(); renderRecibir(); });
  syncServerEvents().then(()=>{ if(opts.revisar && revisarItems().length) openRevisar(); });
  flushOutbox();
  if(!opts.noStale) staleCheck();
}
/* ── §6.7 stale warning: the active file was uploaded on an earlier day. Ignorar lasts for that file today. ── */
function staleIgnored(){ try{ return localStorage.getItem('mr_stale_ign_'+S.envio._path)===todayStr(); }catch(_){ return S.staleIgnMem===S.envio._path+todayStr(); } }
async function staleCheck(){
  if(!S.envio || S.envio.sinArchivo || !(S.envio.fecha<todayStr()) || staleIgnored() || modalOpen()) return true;
  if(S.conParciales || parciales().length) return true;
  S.staleAsked=true;
  const v=await showModal({ title:`Estás trabajando con el archivo cargado el ${fechaLarga(S.envio.fecha)}.`,
    html:'<p>Carga el archivo de hoy.</p>',
    buttons:[{label:'Cargar archivo de hoy', value:'subir', kind:'primary'}, {label:'Ignorar', value:'ign', kind:'secondary'}] });
  if(v==='subir'){ S.current=null; openSubir(); return false; }
  try{ localStorage.setItem('mr_stale_ign_'+S.envio._path, todayStr()); }catch(_){ S.staleIgnMem=S.envio._path+todayStr(); }
  return true;
}
// §8 multi-device: one full read on open, then every 15 s only rows newer than the last id seen
// (rec_events is append-only, so id=gt.{last} never misses a row once it is visible).
async function syncServerEvents(){
  if(!S.session) return;
  const sid=S.session.id, since=S.lastId||0;
  try{
    const rows=await pgSelectAll('rec_events', `session_id=eq.${encodeURIComponent(sid)}${since?`&id=gt.${since}`:''}&select=*`);
    if(!S.session || S.session.id!==sid) return;
    for(const r of rows) if(r.id>(S.lastId||0)) S.lastId=r.id;
    const fresh=rows.filter(r=>!S.eventUids.has((r.detalle&&r.detalle.uid)||('id'+r.id)));
    if(addEvents(rows)){ saveMirror(); await onRemoteEvents(fresh); renderRecibir(); if(screenActive('screen-resumen') && !S.closing) renderResumen(); }
    if(!NET.ok){ NET.ok=true; renderNet(); }
  }catch(_){ NET.ok=false; renderNet(); }
}
function screenActive(id){ return document.getElementById(id).classList.contains('active'); }
// What other phones did: closed the reception, reopened it (admin), or replaced the file
async function onRemoteEvents(evs){
  for(const e of evs){
    if(e.tipo==='parcial'){
      toast(`${e.receptor||'Otro teléfono'} cerró la entrega parcial ${(e.detalle&&e.detalle.entrega)||''}`, 4000);
      const c=S.corrigiendo && S.events.find(x=>x.detalle && x.detalle.uid===S.corrigiendo);
      if(c && enEntregaCerrada(c)) S.corrigiendo=null;
    }
    if(e.tipo==='reemplazo' && e.detalle && e.detalle.envio && e.detalle.envio!==S.envio._path){
      try{
        const data=JSON.parse(await sbFetch(e.detalle.envio)); data._path=e.detalle.envio;
        if(data.session_id!==S.session.id) continue;
        setEnvio(data); buildCatalog(); fold();
        toast(`${e.receptor||'Otro teléfono'} cargó un archivo nuevo — lo escaneado se conserva`, 4000);
        if(S.current && S.current.p.enEnvio!==undefined){ const l=S.lines.get(S.current.p.sku_key); if(l) S.current.p=Object.assign({}, l, { enEnvio:true }); }
      }catch(_){}
    }
  }
  S.closedInfo=closedState();
  if(S.closedInfo && S.current){ S.current=null; }
}
// Latest of cerrar / admin reabrir in this session's events
function closedState(){
  let st=null;
  for(const e of S.events){
    if(e.tipo==='cerrar') st=Object.assign({ ts:e.ts, fecha:e.fecha, hub:e.hub, area:e.area, receptor:e.receptor, session_id:e.session_id }, e.detalle||{});
    else if(e.tipo==='admin' && e.detalle && e.detalle.accion==='reabrir') st=null;
    else if(e.tipo==='admin' && e.detalle && e.detalle.accion==='borrar') return { borrada:true, ts:e.ts, receptor:e.receptor };
  }
  return st;
}
setInterval(()=>{
  if(!S.session || document.visibilityState!=='visible') return;
  if(screenActive('screen-recibir') || screenActive('screen-resumen')) syncServerEvents();
}, 15000);
function leaveRecibir(){ S.current=null; flushOutbox(); goInicio(); }

// Catalog = every product we can name: the file's non-envío rows + this hub's sorting. Used by
// "Sin código" (§7.3) and to name a scanned barcode that isn't in the envío (§7.1).
function buildCatalog(){
  const cat=new Map(), byCode=new Map();
  const add=(producto, barcode, kgpz, vida_dias)=>{
    const sku=skuKeyOf(barcode, producto); if(!producto || cat.has(sku) || S.lines.has(sku)) return;
    const c={ sku_key:sku, producto, barcode, kgpz:kgpz||'Pz', kgpzKnown:!!kgpz, vida_dias:vida_dias??null, _n:normName(producto) };
    cat.set(sku, c); if(barcode) byCode.set(codeKey(barcode), c);
  };
