    // §6.7 — no scanning against a closed file
    return `<div class="info-card"><b>El archivo cargado ya se recibió el ${fechaLarga(localDateStr(new Date(a.closed)))}.</b></div>`
      +`<div class="stack"><button class="btn btn-secondary btn-block" onclick="verResumenCerrado()">Ver resumen</button>${subir.replace('btn-secondary','btn-primary')}${d.fecha<today?sinArch:''}</div>`;
  }
  return `<div class="info-card">${info}</div><div class="stack"><button class="btn btn-primary btn-block" onclick="continuarRecepcion()">Continuar recepción</button>${a.offline?'':subir}${(!a.offline && d.session_fecha<today)?sinArch:''}</div>`
    +(a.offline?'':`<button class="link-btn" style="color:var(--red)" onclick="borrarEnvio()">Borrar este envío</button>`);
}
async function refreshActive(){
  const tok=++_activeTok; INI.active=undefined; renderInicio();
  let res; try{ res=await findActiveEnvio(INI.hub, INI.area); }catch(e){ res={offline:true}; }
  if(tok!==_activeTok) return;
  INI.active=res; renderInicio();
}
function goInicio(){
  closeCamera(); closeSheet();
  showScreen('screen-inicio'); renderInicio();
  if(INI.origen==='pd'){ if(INI.receptor) pdLoad(); if(INI.area) refreshActive(); }
  else if(INI.receptor) refreshActive();
}
// Borrar envío: a file uploaded by mistake (wrong hub, a test). Typed "borrar" confirms. The reception's events stay
// (append-only) and an admin 'borrar' event ends it; the .json/.csv are removed and Inicio shows no envío (an older
// file never comes back on its own; Admin → Respaldos can restore one).
async function borrarEnvio(){
  const a=INI.active; if(!a || !a.data || a.closed || a.offline) return;
  const d=a.data;
  let scans=0; try{ scans=(await pgSelect('rec_events', `session_id=eq.${encodeURIComponent(d.session_id)}&tipo=eq.scan&select=id`)).length; }catch(e){ toast('Sin conexión: conéctate para borrar el envío'); return; }
  scans+=OUTBOX.filter(e=>e.session_id===d.session_id && e.tipo==='scan').length;
  const pd=d.origen==='proveedor', o=d.orden||{}, ocs=[].concat(o.num_oc||[]).filter(Boolean);
  const quien=`${d.receptor?' por '+escapeHtml(d.receptor):''}`;
  const head=pd
    ? `<p><b>${escapeHtml(o.proveedor||areaName(INI.area))}</b>${ocs.length?' · OC '+escapeHtml(ocs.join(', ')):''}<br>Empezada el ${fechaLarga(d.fecha)} a las ${localHM(new Date(d.uploadedAt))}${quien}.</p>`
    : `<p><b>${escapeHtml(d.sourceFile||'Envío sin archivo')}</b><br>Cargado el ${fechaLarga(d.fecha)} a las ${localHM(new Date(d.uploadedAt))}${quien}.</p>`;
  const v=await showModal({ title:pd?'¿Borrar esta recepción?':'¿Borrar este envío?',
    html:head
      +(scans?`<p style="color:var(--c-ink);font-weight:700">Esta recepción tiene ${scans} escaneo${scans===1?'':'s'}: se descartan.</p>`:'')
      +(pd?`<p>Úsalo solo si la empezaste por error (otro proveedor u otra orden). La orden sigue cargada: podrás empezarla de nuevo. Escribe <b>borrar</b> para confirmar.</p>`
          :`<p>Úsalo solo si el archivo se subió por error. Escribe <b>borrar</b> para confirmar.</p>`)
      +`<input id="del-confirm" class="text-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="escribe aquí">`,
    buttons:[{label:pd?'Borrar recepción':'Borrar envío', value:'del', kind:'danger'}], cancel:true });
  if(v!=='del') return;
  const typed=(document.getElementById('del-confirm')||{}).value||'';
  if(typed.trim().toLowerCase()!=='borrar'){ toast('No se borró: escribe «borrar» para confirmar', 3500); return; }
  const paths=[d._path||a.path].concat(d.csvPath?[d.csvPath]:[]);
  try{
    await pgInsert('rec_events', [{ session_id:d.session_id, hub:INI.hub, area:INI.area, fecha:d.session_fecha||d.fecha, tipo:'admin',
      detalle:{ uid:newUid(), accion:'borrar', envio:paths[0], csv:d.csvPath||null, archivo:d.sourceFile||'', escaneos:scans },
      receptor:INI.receptor, device_id:DEVICE_ID, ts:serverNow().toISOString() }]);
    await sbDeleteEnvio(paths);
    OUTBOX=OUTBOX.filter(e=>e.session_id!==d.session_id); saveOutbox();
    try{ localStorage.removeItem(mirrorPrefix(INI.hub, INI.area)+(d.session_fecha||d.fecha)); }catch(_){}
    toast(pd?'✓ Recepción borrada':'✓ Envío borrado');
  }catch(e){ toast(isNetErr(e)?'Sin conexión: no se borró. Intenta de nuevo.':'No se pudo borrar ('+e.message+')', 4500); }
  refreshActive();
  if(pd && INI.origen==='pd') pdLoad({ prov:o.proveedor||null }); // the supplier list still showed it as «recepción abierta»
}
function continuarRecepcion(){ const a=INI.active; if(a && a.data) openRecibir(a.data, { parciales:(a.parciales||[]).length }); }

/* ── Active envío (§6.7): the newest envios/{slug}/{area}/*.json ── */
async function findActiveEnvio(slug, area){
  let items;
  try{ items=await sbList(`envios/${slug}/${area}/`); }
  catch(e){ const m=latestMirror(slug, area); return m ? {offline:true, data:m.envio} : {offline:true}; }
  const names=(items||[]).map(o=>o.name).filter(n=>/\.json$/.test(n)).sort().reverse();
  if(!names.length) return {none:true};
  const path=`envios/${slug}/${area}/${names[0]}`;
  const data=JSON.parse(await sbFetch(path)); data._path=path;
  // Borrar envío: after a delete, an older file must not come back as active — show nothing until a new upload
  const del=await pgSelect('rec_events', `hub=eq.${encodeURIComponent(slug)}&area=eq.${area}&tipo=eq.admin&detalle->>accion=eq.borrar&select=ts&order=id.desc&limit=1`);
  if(del.length && Date.parse(del[0].ts)>Date.parse(data.uploadedAt)) return {none:true};
  const closed=await sessionClosedAt(data.session_id);
  return { path, data, closed, parciales: closed ? [] : await sessionParciales(data.session_id) };
}
// Entregas parciales already closed in an open reception (Inicio shows them; unreachable → none)
async function sessionParciales(sessionId){
  try{ return await pgSelect('rec_events', `session_id=eq.${encodeURIComponent(sessionId)}&tipo=eq.parcial&select=ts,detalle&order=ts.asc`); }
  catch(_){ return []; }
}
async function sessionClosedAt(sessionId){
  // A 'cerrar' event closes the reception; a later admin 'reabrir' (§6.8) opens it again.
  // Unreachable → treated as open (never blocks resuming).
  try{
    const r=await pgSelect('rec_events', `session_id=eq.${encodeURIComponent(sessionId)}&tipo=in.(cerrar,admin)&select=ts,tipo,detalle&order=id.desc&limit=20`);
    for(const e of r){
      if(e.tipo==='cerrar' || (e.detalle && e.detalle.accion==='borrar')) return e.ts;
      if(e.detalle && e.detalle.accion==='reabrir') return null;
    }
    return null;
  }catch(_){ return null; }
}
async function sessionHasScans(sessionId){
  if(OUTBOX.some(e=>e.session_id===sessionId && e.tipo==='scan')) return true;
  const r=await pgSelect('rec_events', `session_id=eq.${encodeURIComponent(sessionId)}&tipo=eq.scan&select=id&limit=1`);
  return r.length>0;
}

/* ════════════════════════════════════════════════════════════════════════════════════
   PROVEEDOR DIRECTO (proveedorDirecto-plan.md) — supplier deliveries straight to the hub. Orders come read-only from
   the Apps Script bridge (proveedor/apps-script.gs, plan §5). Each supplier is stored as an internal área
   'pd-{provSlug}' (§6.0) so the hub+área machinery works unchanged; receptors only ever see the supplier's name.
   ════════════════════════════════════════════════════════════════════════════════════ */
const PD_URL='https://script.google.com/macros/s/AKfycbyRm-_zx8282SNSSNDNi5LK7NFesGlB4BUSTSFZSfSinIWI6kysbtR6wLZ-76sviUbOFQ/exec'; // Apps Script /exec (plan §5)
// Public by design: the app has no login, so this only stops casual calls. The bridge is read-only (spreadsheets.readonly)
// and returns no phone numbers (decision 2026-11-13).
const PD_TOKEN='9306d8e2e82845304cabcfec4d8b87602365f808';
// Localhost reads the gitignored fixture unless ?pdlive=1 (and PD_URL is set). test-hub borrows MH Contry's orders.
const PD_FIXTURE = IS_LOCAL && !DEMO && (!PD_URL || !/[?&]pdlive=1/.test(location.search));
const PD_HUB={ 'test-hub':'mh-contry' };
const PD_NAMES={}; // 'pd-lala' → 'LALA' (filled from every read; areaName uses it)
function provSlug(name){ return normName(name).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'proveedor'; }
function pdArea(name){ const a='pd-'+provSlug(name); PD_NAMES[a]=name; return a; }
function isPdArea(a){ return /^pd-/.test(String(a||'')); }
function pdKey(o){ return o.num_oc || (provSlug(o.proveedor)+'|'+o.fecha_entrega); }
const DOW=['dom','lun','mar','mié','jue','vie','sáb'];
function dowCorto(ymd){ return DOW[new Date(ymd+'T12:00:00Z').getUTCDay()]; }
// «entrega hoy» · «programada jue 14» · «atrasada: era el lun 10»
function pdFechaLabel(ymd){
  const t=todayStr(), d=Number(String(ymd).slice(8,10));
  if(ymd===t) return 'entrega hoy';
  return ymd>t ? `programada ${dowCorto(ymd)} ${d}` : `atrasada: era el ${dowCorto(ymd)} ${d}`;
}
function sameName(a,b){ return normName(a)===normName(b); }

// GET the bridge (or the fixture). `prov` narrows to one supplier; `fresh` skips the script's 30 s cache.
async function pdFetch(slug, { prov=null, fresh=false }={}){
  const hub=PD_HUB[slug]||slug;
  let d;
  if(PD_FIXTURE){
    const r=await fetch(`fixtures/proveedor_${hub}.json`, { cache:'no-store' });
    if(!r.ok) throw new Error(r.status===404 ? `No hay fixture para ${hub}` : String(r.status));
    d=await r.json();
  } else {
    if(!PD_URL) throw new Error('La conexión con las órdenes de proveedor aún no está configurada');
    const q=new URLSearchParams({ token:PD_TOKEN, hub }); if(prov) q.set('proveedor', prov); if(fresh) q.set('fresh','1');
    const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(), 30000);
    try{ d=await (await fetch(`${PD_URL}?${q}`, { signal:ctl.signal, cache:'no-store' })).json(); }
    catch(e){ throw e.name==='AbortError' ? new TypeError('timeout') : e; }
    finally{ clearTimeout(to); }
    if(d && d.error) throw new Error(d.error==='token' ? 'Token de órdenes inválido' : d.error);
  }
  d.ordenes=d.ordenes||[]; d.contactos=d.contactos||{}; d.proveedores=d.proveedores||[];
  if(prov){ // the fixture holds every supplier; the script already narrowed it
    d.ordenes=d.ordenes.filter(o=>sameName(o.proveedor, prov));
    d.catalogo=(d.catalogo||[]).filter(c=>sameName(c.proveedor, prov));
  }
  d.ordenes.forEach(o=>pdArea(o.proveedor));
  return d;
}
// Supplier receptions of this hub (one query): open ones per área, and which orders a closed reception already covers.
async function pdSesiones(slug){
  const desde=addDaysStr(todayStr(), -30);
  const rows=await pgSelectAll('rec_events', `hub=eq.${encodeURIComponent(slug)}&area=like.pd-*&fecha=gte.${desde}&tipo=in.(abrir,reemplazo,cerrar,admin)&select=session_id,area,fecha,tipo,detalle,ts,receptor&order=id.asc`);
  const by=new Map();
  for(const e of rows){
    const s=by.get(e.session_id) || { id:e.session_id, area:e.area, fecha:e.fecha, abierta:e.ts, receptor:e.receptor, ocs:[], proveedor:'', closed:null, borrada:false };
    const d=e.detalle||{};
    if(e.tipo==='abrir' || e.tipo==='reemplazo'){ if(d.ocs) s.ocs=d.ocs; if(d.proveedor){ s.proveedor=d.proveedor; PD_NAMES[e.area]=d.proveedor; } }
    if(e.tipo==='cerrar'){ s.closed=e.ts; if(d.ocs) s.ocs=d.ocs; }
    if(e.tipo==='admin' && d.accion==='reabrir') s.closed=null;
    if(e.tipo==='admin' && d.accion==='borrar') s.borrada=true;
    by.set(e.session_id, s);
  }
  const abiertas=new Map(), recibidas=new Map();
  for(const s of by.values()){
    if(s.borrada) continue;
    if(s.closed){ for(const k of s.ocs) recibidas.set(k, localDateStr(new Date(s.closed))); }
    else abiertas.set(s.area, s); // newest wins (rows are in id order)
  }
  return { abiertas, recibidas };
}
function addDaysStr(ymd, n){ const d=new Date(ymd+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }

/* ── Inicio state for Proveedor directo (memory only, rule 7) ── */
// INI.pd: undefined = loading · { error } · { data, abiertas, recibidas }
// INI.prov: chosen supplier name · INI.ocSel: Set of pdKey · INI.otro: search text (null = closed)
let _pdTok=0;
async function pdLoad({ prov=null, fresh=false }={}){
  const tok=++_pdTok, slug=INI.hub;
  if(!prov){ INI.pd=undefined; renderInicio(); }
  else if(INI.pd && INI.pd.data){ INI.pd.releyendo=true; renderInicio(); }
  try{
    const [data, ses]=await Promise.all([ pdFetch(slug, { prov, fresh }), pdSesiones(slug).catch(()=>({ abiertas:new Map(), recibidas:new Map(), offline:true })) ]);
    if(tok!==_pdTok || slug!==INI.hub) return;
    if(prov && INI.pd && INI.pd.data){ // merge the supplier's fresh lines into the full answer
      const full=INI.pd.data;
      full.ordenes=full.ordenes.filter(o=>!sameName(o.proveedor, prov)).concat(data.ordenes)
        .sort((a,b)=>a.fecha_entrega.localeCompare(b.fecha_entrega) || a.proveedor.localeCompare(b.proveedor,'es'));
      Object.assign(full.contactos, data.contactos);
      full.leido=data.leido; full.catalogo=data.catalogo;
      INI.pd={ data:full, abiertas:ses.abiertas, recibidas:ses.recibidas, offlineSes:!!ses.offline };
    } else INI.pd={ data, abiertas:ses.abiertas, recibidas:ses.recibidas, offlineSes:!!ses.offline };
    if(INI.prov) pdDefaultSel();
  }catch(e){
    if(tok!==_pdTok) return;
    if(prov && INI.pd && INI.pd.data){ INI.pd.releyendo=false; toast(isNetErr(e)?'Sin conexión: no se pudo volver a leer la orden':'No se pudo leer la orden ('+e.message+')', 4000); }
    else INI.pd={ error: isNetErr(e) ? 'Sin conexión: no se pudieron leer las órdenes de proveedor.' : 'No se pudieron leer las órdenes ('+e.message+').' };
  }
  renderInicio();
}
function pdOrdenesDe(prov){ return ((INI.pd&&INI.pd.data&&INI.pd.data.ordenes)||[]).filter(o=>sameName(o.proveedor, prov)); }
function pdRecibida(o){ return INI.pd && INI.pd.recibidas && INI.pd.recibidas.get(pdKey(o)); }
// Default tick: every not-received OC of the nearest pending date (today first, then late, then early)
function pdDefaultSel(){
  const pend=pdOrdenesDe(INI.prov).filter(o=>!pdRecibida(o));
  INI.ocSel=new Set();
  if(!pend.length) return;
  const t=todayStr();
  const best=pend.map(o=>o.fecha_entrega).sort((a,b)=>Math.abs(daysBetween(t,a))-Math.abs(daysBetween(t,b)) || a.localeCompare(b))[0];
  pend.filter(o=>o.fecha_entrega===best).forEach(o=>INI.ocSel.add(pdKey(o)));
}
function pdPickProv(name){
  INI.prov=name; INI.area=pdArea(name); INI.otro=null; INI.active=undefined;
  pdDefaultSel(); renderInicio(); refreshActive();
  setTimeout(()=>{ const el=document.getElementById('pd-panel'); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); },30);
}
function pdPickProvIdx(i){ pdPickProv(INI._provList[i]); }
function pdCambiarProv(){ INI.prov=null; INI.area=null; INI.active=undefined; INI.ocSel=null; renderInicio(); }
function pdToggleOc(k){ if(INI.ocSel.has(k)) INI.ocSel.delete(k); else INI.ocSel.add(k); renderInicio(); }
function pdReleer(){ if(INI.prov) pdLoad({ prov:INI.prov, fresh:true }); else pdLoad({ fresh:true }); }
function pdOtro(v){ INI.otro=v; renderInicio(); const el=document.getElementById('pd-otro'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }

// Contacts (plan §3.3): Comercial from Encargados + Comprador from the order. Phones only become tel: links.
function pdContactos(prov){
  const d=(INI.pd&&INI.pd.data)||{}, ords=pdOrdenesDe(prov);
  const c=Object.entries(d.contactos||{}).find(([k])=>sameName(k, prov));
  const comercial=(ords.find(o=>o.comercial)||{}).comercial || (c&&c[1].comercial) || '';
  const comprador=(ords.find(o=>o.comprador)||{}).comprador || (c&&c[1].comprador) || '';
  return { comercial, comprador };
}
const NOMBRE_TITLE=s=>String(s||'').toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase());
// «Contacta a Catalina (comercial) o Borjas (compras)». No Comercial → the abastecimiento Slack channel.
function pdContactoHtml(prov){ return pdContactoFrom(pdContactos(prov)); }

function isPd(){ return !!(S.envio && S.envio.origen==='proveedor'); }
function pdBotones(){ return isPd() && S.envio.modo==='botones'; }
// Temp from the sheet: «Ambiente», «1» (refrigerado), «-18» (congelado)
function tempLabel(t){
  const s=String(t||'').trim(); if(!s) return '';
  if(/^amb/i.test(s)) return 'Ambiente';
  const n=Number(s); if(!isFinite(n)) return '';
  if(n>=15) return 'Ambiente'; // the sheet writes 24 for bread and the like
  return (n<=-5?'Congelado ':'Refrigerado ')+String(n).replace('-','−')+' °C';
}
// Contact line (names only: the bridge returns no phone numbers). `links` stays for callers; always empty now.
function pdContactoFrom({ comercial, comprador }){
  const comp=comprador?NOMBRE_TITLE(comprador):'';
  const txt = comercial ? `contacta a <b>${escapeHtml(comercial)}</b> (comercial)${comp?` o <b>${escapeHtml(comp)}</b> (compras)`:''}`
    : `contacta al equipo comercial en el canal de abastecimiento en Slack${comp?` o a <b>${escapeHtml(comp)}</b> (compras)`:''}`;
  return { txt, links:'' };
}
function pdStepHtml(){
  const P=INI.pd;
  if(P===undefined) return `<div class="muted">Leyendo las órdenes de proveedor…</div>`;
  if(P.error) return `<div class="err-box">${escapeHtml(P.error)}</div><button class="btn btn-secondary btn-block" onclick="pdLoad({fresh:true})">Reintentar</button>`;
  if(INI.prov) return pdPanelHtml();
  const d=P.data, t=todayStr();
  // one row per supplier: open reception on top, then pending orders by nearest date, then fully received
  const provs=new Map();
  for(const o of d.ordenes){
    const k=normName(o.proveedor); if(!provs.has(k)) provs.set(k, { name:o.proveedor, pend:[], rec:[] });
    (pdRecibida(o)?provs.get(k).rec:provs.get(k).pend).push(o);
  }
  const abiertas=[...P.abiertas.values()].map(s=>({ s, name:s.proveedor||PD_NAMES[s.area]||s.area }));
  abiertas.forEach(a=>provs.delete(normName(a.name)));
  const near=o=>Math.abs(daysBetween(t,o.fecha_entrega))*2+(o.fecha_entrega>t?1:0);
  const pend=[...provs.values()].filter(p=>p.pend.length).sort((a,b)=>Math.min(...a.pend.map(near))-Math.min(...b.pend.map(near)) || a.name.localeCompare(b.name,'es'));
  const rec=[...provs.values()].filter(p=>!p.pend.length);
  INI._provList=[];
  const btn=(name, sub, cls='')=>{ INI._provList.push(name); return `<button class="choice pd-prov ${cls}" onclick="pdPickProvIdx(${INI._provList.length-1})"><span>${escapeHtml(name)}</span><span class="pd-sub">${sub}</span></button>`; };
  let h='';
  if(abiertas.length) h+=`<div class="pd-list">`+abiertas.map(a=>btn(a.name, `<span class="tag orange">recepción abierta</span> desde ${a.s.fecha===t?'hoy':fechaLarga(a.s.fecha)} ${localHM(new Date(a.s.abierta))}`)).join('')+`</div>`;
  if(pend.length) h+=`<div class="pd-list">`+pend.map(p=>{
      const best=p.pend.slice().sort((a,b)=>near(a)-near(b))[0], same=p.pend.filter(o=>o.fecha_entrega===best.fecha_entrega);
      const n=new Set(same.flatMap(o=>o.lineas.map(l=>l.codigo||l.producto))).size;
      const extra=p.pend.length>same.length?` · +${p.pend.length-same.length} orden${p.pend.length-same.length===1?'':'es'} más`:'';
      return btn(p.name, `${n} producto${n===1?'':'s'} · ${pdFechaLabel(best.fecha_entrega)}${extra}`);
    }).join('')+`</div>`;
  if(!abiertas.length && !pend.length) h+=`<div class="info-card">No hay órdenes de proveedor abiertas para este hub.</div>`;
  if(rec.length) h+=`<div class="pd-list">`+rec.map(p=>btn(p.name, `recibida ${fechaLarga(pdRecibida(p.rec[p.rec.length-1]))}`, 'pd-done')).join('')+`</div>`;
  // «Otro proveedor» (plan §6.1): any supplier from the sheet; no order → the §3.5 message
  if(INI.otro==null) h+=`<button class="btn btn-secondary btn-block" style="margin-top:8px" onclick="pdOtro('')">Otro proveedor</button>`;
  else {
    const q=normName(INI.otro), hits=q.length<2?[]:d.proveedores.filter(p=>normName(p).includes(q)).slice(0,8);
    h+=`<div style="margin-top:8px"><input id="pd-otro" class="text-input" placeholder="Busca el proveedor" autocomplete="off" value="${escapeHtml(INI.otro)}" oninput="pdOtro(this.value)"></div>`
      +(hits.length?`<div class="pd-list" style="margin-top:6px">`+hits.map(p=>btn(p, pdOrdenesDe(p).length?'con orden':'sin orden cargada')).join('')+`</div>`
        :q.length>=2?`<div class="muted" style="margin-top:6px">Ningún proveedor coincide.</div>`:'');
  }
  h+=`<button class="link-btn" onclick="pdReleer()">Volver a leer las órdenes</button>`;
  if(P.offlineSes) h+=`<div class="muted">Sin conexión para revisar recepciones abiertas.</div>`;
  return h;
}
function pdPanelHtml(){
  const prov=INI.prov, a=INI.active, t=todayStr(), P=INI.pd;
  let h=`<div id="pd-panel" class="info-card" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b style="font-size:18px">${escapeHtml(prov)}</b><button class="link-btn" style="margin:0;padding:8px 4px" onclick="pdCambiarProv()">Cambiar</button></div>`;
  const releer=`<button class="btn btn-secondary btn-block" ${P.releyendo?'disabled':''} onclick="pdReleer()">${P.releyendo?'Leyendo la orden…':'Volver a leer la orden'}</button>`;
  if(a===undefined) return h+`<div class="muted">Buscando recepciones abiertas…</div>`;
  if(a.offline && !a.data) return h+`<div class="warn-box">Sin conexión. Conéctate a internet para empezar la recepción.</div><button class="btn btn-secondary btn-block" onclick="refreshActive()">Reintentar</button>`;
  // an open reception of this supplier → continue it (one at a time per supplier)
  if(a.data && !a.closed){
    const d=a.data;
    return h+`<div class="info-card"><b>Recepción abierta</b> desde ${d.session_fecha===t?'hoy':'el '+fechaLarga(d.session_fecha)}, ${localHM(new Date(d.uploadedAt))}${d.receptor?' · '+escapeHtml(d.receptor):''}
        <div class="muted" style="font-size:13px;margin-top:2px">${d.stats.lineas} productos · ${(d.orden&&d.orden.ocs||[]).map(o=>o.num_oc?'OC '+escapeHtml(o.num_oc):pdFechaLabel(o.fecha_entrega)).join(', ')}</div></div>
      <div class="stack"><button class="btn btn-primary btn-block" onclick="continuarRecepcion()">Continuar recepción</button></div>
      ${a.offline?'':`<button class="link-btn" style="color:var(--red)" onclick="borrarEnvio()">Borrar esta recepción</button>`}`;
  }
  const ords=pdOrdenesDe(prov), c=pdContactoHtml(prov);
  const pend=ords.filter(o=>!pdRecibida(o)), rec=ords.filter(o=>pdRecibida(o));
  if(!pend.length){
    // §3.5 — no order, no reception
    h+=`<div class="warn-box"><b>No hay orden cargada para ${escapeHtml(prov)}.</b> No puedes empezar la recepción hasta que aparezca: ${c.txt}.${c.links}</div>`;
    if(rec.length) h+=`<div class="muted" style="font-size:13px;margin-bottom:8px">${rec.map(o=>`${o.num_oc?'OC '+escapeHtml(o.num_oc):pdFechaLabel(o.fecha_entrega)}: recibida ${fechaLarga(pdRecibida(o))}`).join(' · ')}</div>`;
    return h+releer+`<div class="muted" style="font-size:12px;margin-top:6px;text-align:center">Leída ${P.data.leido?localHM(new Date(P.data.leido)):''}</div>`;
  }
  // which orders arrived (§6.1: several OCs → tick; default = the nearest date)
  if(pend.length>1 || rec.length){
    h+=`<div class="step-title" style="margin-top:4px">¿Qué orden llegó?</div><div class="pd-list">`
      +pend.map(o=>{ const k=pdKey(o), on=INI.ocSel.has(k);
        return `<label class="pd-oc ${on?'sel':''}"><input type="checkbox" class="chk" ${on?'checked':''} onchange="pdToggleOc('${escapeHtml(k).replace(/'/g,'&#39;')}')"><span><b>${o.num_oc?'OC '+escapeHtml(o.num_oc):'Orden'}</b> · ${o.lineas.length} producto${o.lineas.length===1?'':'s'}<br><span class="pd-sub">${pdFechaLabel(o.fecha_entrega)}</span></span></label>`; }).join('')
      +rec.map(o=>`<div class="pd-oc pd-done"><span><b>${o.num_oc?'OC '+escapeHtml(o.num_oc):'Orden'}</b><br><span class="pd-sub">recibida ${fechaLarga(pdRecibida(o))}</span></span></div>`).join('')+`</div>`;
  } else {
    const o=pend[0];
    h+=`<div class="info-card" style="margin-bottom:8px"><b>${o.num_oc?'OC '+escapeHtml(o.num_oc):'Orden'}</b> · ${o.lineas.length} producto${o.lineas.length===1?'':'s'}<div class="muted" style="font-size:13px">${pdFechaLabel(o.fecha_entrega)}</div></div>`;
  }
  const sel=pend.filter(o=>INI.ocSel.has(pdKey(o)));
  const fechas=[...new Set(sel.map(o=>o.fecha_entrega))].filter(f=>f!==t).sort();
  // §3.4 — early or late is fine, but say so (inline, not a modal)
  if(fechas.length) h+=`<div class="warn-box">La orden de <b>${escapeHtml(prov)}</b> está programada para el <b>${fechas.map(f=>`${dowCorto(f)} ${fechaLarga(f)}`).join(' y el ')}</b>. Puedes empezar la recepción; ${c.txt} para confirmar que sea correcta.${c.links}</div>`;
  h+=`<button class="btn btn-primary btn-block" style="margin-top:8px" ${sel.length&&!INI.pdBusy?'':'disabled'} onclick="pdEmpezar()">${INI.pdBusy?'Preparando la recepción…':'Empezar recepción'}</button>`;
  h+=`<button class="link-btn" ${P.releyendo?'disabled':''} onclick="pdReleer()">${P.releyendo?'Leyendo la orden…':'Volver a leer la orden'}</button>`;
  return h;
}

// Empezar recepción (§6.2): re-read the supplier (fresh), write the snapshot = the reception's envío, open Recibir.
async function pdEmpezar(){
  if(INI.pdBusy || !INI.prov) return;
  const slug=INI.hub, prov=INI.prov, area=pdArea(prov), keys=new Set(INI.ocSel||[]);
  INI.pdBusy=true; renderInicio();
  try{
    const prev=await findActiveEnvio(slug, area);
    if(prev.offline) throw new TypeError('offline');
    if(prev.data && !prev.closed){ toast('Ya hay una recepción abierta de este proveedor: continúala'); INI.active=prev; return; }
    const d=await pdFetch(slug, { prov, fresh:true });
    const ocs=d.ordenes.filter(o=>keys.has(pdKey(o)));
    if(ocs.length!==keys.size){ // the order changed in the sheet since the list was read
      INI.pd.data.ordenes=INI.pd.data.ordenes.filter(o=>!sameName(o.proveedor, prov)).concat(d.ordenes);
      pdDefaultSel(); toast('La orden cambió en el archivo de compras: revisa y vuelve a empezar', 4500); return;
    }
    const now=serverNow(), fecha=localDateStr(now);
    const session_id=`${slug}__${area}__${fecha}__${now.getTime()}`;
    const data=pdBuildEnvio({ slug, prov, area, ocs, d, session_id, session_fecha:fecha, receptor:INI.receptor, comercial:pdContactos(prov).comercial, comprador:pdContactos(prov).comprador, modo:'botones' });
    await sbUpload(data._path, JSON.stringify(data), 'application/json');
    INI.area=area;
    openRecibir(data);
    recordEvent(makeEvent('abrir', { detalle:{ envio:data._path, origen:'proveedor', proveedor:prov, ocs:data.orden.ocs.map(o=>o.key),
      num_oc:data.orden.num_oc, fechas_entrega:data.orden.fechas_entrega, lineas:data.lines.length } }));
    toast(`✓ Recepción de ${prov}. Revisa cada producto de la orden.`);
  }catch(e){
    toast(isNetErr(e)?'Sin conexión: no se pudo empezar. Intenta de nuevo.':'No se pudo empezar ('+e.message+')', 4500);
  }finally{ INI.pdBusy=false; if(screenActive('screen-inicio')) renderInicio(); }
}
// The reception's envío = a copy of the ticked OCs (§6.2): lines summed per sku_key, catalog for products not ordered.
function pdBuildEnvio({ slug, prov, area, ocs, d, session_id, session_fecha, receptor, comercial, comprador, modo }){
    const now=serverNow(), epochMs=now.getTime(), fecha=localDateStr(now);
    const by=new Map();
    for(const o of ocs) for(const l of o.lineas){
      const barcode=cleanBC(l.codigo).replace(/\s+/g,''), sku_key=skuKeyOf(barcode, l.producto);
      const x=by.get(sku_key);
      if(x){ x.esperado=round2(x.esperado+Number(l.pedido)); if((l.caducidad_min||'')>(x.caducidad_min||'')) x.caducidad_min=l.caducidad_min; continue; }
      by.set(sku_key, { rowIndex:by.size, producto:l.producto, barcode, sku_key, kgpz:normKgPz(l.kgpz), esperado:round2(Number(l.pedido)),
        vida_dias:null, caducidad_min:l.caducidad_min||'', temp:String(l.temp||''), sku_marca:l.sku_marca||'', categoria:'' });
    }
    const lines=[...by.values()];
    const catalogo=(d.catalogo||[]).filter(c=>!by.has(skuKeyOf(cleanBC(c.codigo), c.producto))).map(c=>[c.producto, cleanBC(c.codigo), normKgPz(c.kgpz), null]);
    const base=`envios/${slug}/${area}/${fecha}__${epochMs}`;
    const ocInfo=ocs.map(o=>({ num_oc:o.num_oc||'', fecha_entrega:o.fecha_entrega, key:pdKey(o) }));
    // modo 'botones': the order is shown and each line is answered with a tap (Completo / Faltante / Excedente /
    // Rechazo). Receptions started before it have no modo and keep the blind count.
    const data={ v:1, origen:'proveedor', modo:modo||undefined, hub:slug, area, fecha, epochMs, uploadedAt:now.toISOString(), receptor,
      sourceFile:'', session_id, session_fecha,
      // names only: phones stay in the bridge's live answer (never stored)
      orden:{ proveedor:prov, ocs:ocInfo, num_oc:ocInfo.map(o=>o.num_oc).filter(Boolean), fechas_entrega:[...new Set(ocs.map(o=>o.fecha_entrega))].sort(),
              leido:d.leido||null, comercial, comprador },
      stats:{ lineas:lines.length, kg:lines.filter(l=>l.kgpz==='Kg').length, sinCodigo:lines.filter(l=>!l.barcode).length, catalogo:catalogo.length, renglones:ocs.reduce((n,o)=>n+o.lineas.length,0) },
      lines, catalogo };
    data._path=base+'.json';
    return data;
}
const pdFirma=lines=>lines.map(l=>l.sku_key+'='+l.esperado+'@'+(l.caducidad_min||'')).sort().join('|');

/* ── Recibir extras (§6.3): live contacts, re-read, other open orders of the same supplier ── */
async function pdRecibirLive(){
  if(!isPd()) return;
  const sid=S.session.id, prov=S.envio.orden.proveedor;
  try{
    const [d, ses]=await Promise.all([ pdFetch(S.hub, { prov }), pdSesiones(S.hub).catch(()=>null) ]);
    if(!S.session || S.session.id!==sid) return;
    S.pdLeido=d.leido;
    pdOtrasDe(d, ses); renderRecibir();
  }catch(_){}
}
function pdOtrasDe(d, ses){
  const keys=new Set(S.envio.orden.ocs.map(o=>o.key));
  S.pdOtras=d.ordenes.filter(o=>!keys.has(pdKey(o)) && !(ses && ses.recibidas.has(pdKey(o))));
}
// «Volver a leer la orden»: same OCs, fresh from the sheet. A change writes a new snapshot in the same session
// (reemplazo, orden_releida) and every line is recomputed; the counts never move (they are physical).
// Reads the same OCs fresh (plus extraKey) → { data, cambio, d, ses } or { gone:true, d, ses } when they left the sheet
async function pdLeerOrden(extraKey){
  const sid=S.session.id, prov=S.envio.orden.proveedor, slug=S.hub, area=S.area;
  const [d, ses]=await Promise.all([ pdFetch(slug, { prov, fresh:true }), pdSesiones(slug).catch(()=>null) ]);
  if(!S.session || S.session.id!==sid) return null;
  S.pdLeido=d.leido;
  const keys=new Set(S.envio.orden.ocs.map(o=>o.key)); if(extraKey) keys.add(extraKey);
  const ocs=d.ordenes.filter(o=>keys.has(pdKey(o)));
  if(!ocs.length) return { gone:true, d, ses };
  const data=pdBuildEnvio({ slug, prov, area, ocs, d, session_id:sid, session_fecha:S.session.fecha, receptor:S.receptor,
    comercial:S.envio.orden.comercial, comprador:S.envio.orden.comprador, modo:S.envio.modo });
  return { data, d, ses, cambio: pdFirma(data.lines)!==pdFirma(S.envio.lines) || ocs.length!==S.envio.orden.ocs.length };
}
// Writes the re-read order as the reception's new snapshot (same session, reemplazo orden_releida)
async function pdAplicarOrden(r){
  const data=r.data, prov=S.envio.orden.proveedor;
  await sbUpload(data._path, JSON.stringify(data), 'application/json');
  const anterior=S.envio._path;
  setEnvio(data); buildCatalog(); fold(); pdOtrasDe(r.d, r.ses);
  if(S.current && !S.current.recount){ const l=S.lines.get(S.current.p.sku_key); S.current.p = l ? Object.assign({}, l, { enEnvio:true }) : Object.assign({}, S.current.p, { enEnvio:false, pns:true }); S.current.exc=null; }
  recordEvent(makeEvent('reemplazo', { detalle:{ envio:data._path, anterior, orden_releida:true, ocs:data.orden.ocs.map(o=>o.key),
    num_oc:data.orden.num_oc, fechas_entrega:data.orden.fechas_entrega, lineas:data.lines.length, proveedor:prov } }));
}
async function pdReleerRecepcion(extraKey){
  if(!isPd() || S.pdBusy) return;
  if(S.closedInfo){ toast('Esta recepción ya se cerró'); return; }
  const sid=S.session.id;
  S.pdBusy=true; renderRecibir();
  try{
    const r=await pdLeerOrden(extraKey); if(!r) return;
    if(r.gone){ pdOtrasDe(r.d, r.ses); toast('La orden ya no aparece en el archivo de compras. Se conserva la copia actual.', 5000); return; }
    if(!r.cambio){ pdOtrasDe(r.d, r.ses); toast('La orden no cambió'); return; }
    await pdAplicarOrden(r);
    toast(extraKey?'✓ Orden agregada: todo se volvió a comparar':'✓ Orden actualizada: todo se volvió a comparar', 3500);
  }catch(e){
    toast(isNetErr(e)?'Sin conexión: no se pudo leer la orden':'No se pudo leer la orden ('+e.message+')', 4500);
  }finally{ S.pdBusy=false; if(S.session && S.session.id===sid) renderRecibir(); }
}
// «Parece que la orden no corresponde»: 3 of the first 5 products scanned aren't in it (advisory, §6.3)
function pdOrdenDudosa(){
  const seen=[];
  for(const e of S.events){ if(e.tipo!=='scan' || seen.includes(e.sku_key)) continue; seen.push(e.sku_key); if(seen.length===5) break; }
  return seen.filter(k=>!S.lines.has(k)).length>=3;
}
function pdRecibirBannerHtml(){
  const o=S.envio.orden, c=pdContactoFrom(o);
  let h='';
  if(pdOrdenDudosa()) h+=`<div class="warn-box"><b>Parece que la orden no corresponde a esta entrega.</b> ${c.txt.replace(/^c/,'C')}.${c.links}
    <button class="btn btn-warn btn-block" ${S.pdBusy?'disabled':''} onclick="pdReleerRecepcion()">${S.pdBusy?'Leyendo la orden…':'Volver a leer la orden'}</button></div>`;
  for(const x of (S.pdOtras||[])) h+=`<div class="note">También hay otra orden de <b>${escapeHtml(o.proveedor)}</b>: ${x.num_oc?'OC '+escapeHtml(x.num_oc)+' · ':''}${x.lineas.length} producto${x.lineas.length===1?'':'s'} · ${pdFechaLabel(x.fecha_entrega)}. Si también llegó, agrégala.
    <button class="btn btn-secondary btn-block" style="margin-top:8px;background:var(--c-white)" ${S.pdBusy?'disabled':''} onclick="pdReleerRecepcion('${escapeHtml(pdKey(x)).replace(/'/g,'&#39;')}')">Agregar a esta recepción</button></div>`;
  return h+facStripHtml(S.session.id);
}

/* ════════════════════════════════════════════════════════════════════════════════════
   SUBIR ENVÍO (§5.2, §6.2)
   ════════════════════════════════════════════════════════════════════════════════════ */
let SUBIR=null; // { file, parsed, acks:Set, busy, error }
let PENDING_UPLOAD=null; // the file chosen before "Primero cerrar la recepción actual" (§6.7)
function resumePendingUpload(){
  if(!PENDING_UPLOAD) return;
  SUBIR=Object.assign(PENDING_UPLOAD, { busy:false, error:null }); PENDING_UPLOAD=null;
  document.getElementById('subir-title').textContent=`${hubName(INI.hub)} · ${areaName(INI.area)}`;
  showScreen('screen-subir'); renderSubir();
}
function openSubir(){
  SUBIR=null;
  document.getElementById('subir-title').textContent=`${hubName(INI.hub)} · ${areaName(INI.area)}`;
  document.getElementById('subir-result').innerHTML='';
  document.getElementById('envio-file').value='';
  showScreen('screen-subir');
}
async function onEnvioFile(input){
  const file=input.files && input.files[0]; if(!file) return;
  let text; try{ text=await file.text(); }catch(e){ text=''; }
  SUBIR={ file, parsed:parseEnvio(text), acks:new Set(), busy:false, error:null };
  renderSubir();
}
// §5.2 — verified on both fixtures (Abarrotes 105 lines / Carnes 132 lines, 26 Kg)
function parseEnvio(text){
  const out={ errors:[], warnings:[], lines:[], catalogo:[], stats:null, newestEnvio:null };
  const p=Papa.parse(stripBOM(String(text||'')), { header:true, dynamicTyping:false, skipEmptyLines:true });
  const fields=(p.meta && p.meta.fields)||[];
  const col=name=>fields.find(f=>normHeader(stripBOM(f))===normHeader(name));
  const C={ producto:col('Producto'), barcode:col('Código de barras'), kgpz:col('Kg/Pz'), envio:col('Envío (kg o pz)'),
            temp:col('Temp'), categoria:col('Categoría'), act:col('Actualización envío'), por:col('Envío registrado por'),
            reqConf:col('Requiere confirmar'), vida:col('Vida anaquel usuarios (min. días)') };
  const missing=[['Producto',C.producto],['Código de barras',C.barcode],['Kg/Pz',C.kgpz],['Envío (kg o pz)',C.envio]].filter(x=>!x[1]).map(x=>x[0]);
  if(missing.length){
    out.errors.push(`Al archivo le falta${missing.length>1?'n las columnas':' la columna'} ${missing.map(m=>`«${m}»`).join(', ')}. ¿Es la exportación de Envío del sistema?`);
    return out;
  }
  const bySku=new Map(); let badNums=0, dupes=0;
  (p.data||[]).forEach((r, rowIndex)=>{
    const producto=String(r[C.producto]||'').trim(); if(!producto) return;
    const barcode=cleanBC(r[C.barcode]).replace(/\s+/g,'');
    const kgpz=normKgPz(r[C.kgpz]);
    const esperado=parseNum(r[C.envio]);
    if(isNaN(esperado)){ badNums++; return; }
    const sku_key=skuKeyOf(barcode, producto);
    const vd=C.vida?parseInt(String(r[C.vida]||'').trim(),10):NaN, vida_dias=vd>=0?vd:null;
    if(!(esperado>0)){ out.catalogo.push([producto, barcode, kgpz, vida_dias]); return; }
    if(bySku.has(sku_key)){ // same product on two lines — counted together (never seen in real files)
      const l=bySku.get(sku_key); l.esperado=round2(l.esperado+esperado); dupes++; return;
    }
    const line={ rowIndex, producto, barcode, sku_key, kgpz, esperado:round2(esperado), vida_dias,
      temp:String(C.temp?r[C.temp]||'':'').trim(), categoria:String(C.categoria?r[C.categoria]||'':'').trim(),
      actualizacion_envio:String(C.act?r[C.act]||'':'').trim(), envio_registrado_por:String(C.por?r[C.por]||'':'').trim(),
      _reqConf:C.reqConf?String(r[C.reqConf]||'').trim().toLowerCase():'' };
    bySku.set(sku_key, line); out.lines.push(line);
  });
  if(!out.lines.length){
    out.errors.push('El archivo no trae ningún producto con «Envío (kg o pz)» mayor a 0. ¿Es el envío de este hub?');
    return out;
  }
  if(badNums) out.errors.push(`${badNums} renglón(es) tienen un número de envío que no se puede leer. Descarga el archivo otra vez.`);
  // Requiere confirmar flips to FALSE once the reception is registered in the system — a hint, never a filter.
  if(C.reqConf && out.lines.every(l=>l._reqConf==='false'))
    out.warnings.push({ id:'confirmado', html:'<b>Este envío parece ya confirmado en el sistema.</b> ¿Es el archivo correcto?' });
  let newest=null;
  for(const l of out.lines){ const t=Date.parse(l.actualizacion_envio); if(!isNaN(t) && (newest===null || t>newest)) newest=t; }
  if(newest!==null){
    out.newestEnvio=new Date(newest).toISOString();
    const age=daysBetween(localDateStr(new Date(newest)), todayStr());
    if(age>2) out.warnings.push({ id:'viejo', html:`<b>El envío del archivo se registró el ${fechaLarga(localDateStr(new Date(newest)))}</b> (hace ${age} días). ¿Es el envío correcto?` });
  }
  if(dupes) out.warnings.push({ id:'dupes', html:`${dupes} producto(s) aparecen en más de un renglón; se van a recibir juntos.` });
  out.lines.forEach(l=>delete l._reqConf);
  out.stats={ lineas:out.lines.length, kg:out.lines.filter(l=>l.kgpz==='Kg').length,
              sinCodigo:out.lines.filter(l=>!l.barcode).length, catalogo:out.catalogo.length, renglones:(p.data||[]).length };
  return out;
}
function renderSubir(){
  const el=document.getElementById('subir-result'); if(!SUBIR){ el.innerHTML=''; return; }
  const P=SUBIR.parsed;
  let h=`<div class="info-card" style="margin-top:14px"><b>${escapeHtml(SUBIR.file.name)}</b></div>`;
  if(P.errors.length){ el.innerHTML=h+P.errors.map(e=>`<div class="err-box">${escapeHtml(e)}</div>`).join(''); return; }
  const s=P.stats, reg=P.newestEnvio?new Date(P.newestEnvio):null;
  // Line counts only — the blind count never shows quantities (§2.3)
  h+=`<div class="stat-grid">
      <div class="stat"><div class="stat-n">${s.lineas}</div><div class="stat-l">productos en el envío</div></div>
      <div class="stat"><div class="stat-n">${s.kg}</div><div class="stat-l">se pesan (Kg)</div></div>
      <div class="stat"><div class="stat-n">${s.sinCodigo}</div><div class="stat-l">sin código de barras</div></div>
      <div class="stat"><div class="stat-n">${reg?fechaLarga(localDateStr(reg)).replace(/ de /,' '):'—'}</div><div class="stat-l">envío registrado${reg?' · '+localHM(reg):''}</div></div>
    </div>`;
  for(const w of P.warnings){
    const ok=SUBIR.acks.has(w.id);
    h+=`<div class="warn-box ${ok?'ok':''}">${w.html}${ok?'<div style="margin-top:6px;font-weight:700">✓ Confirmado</div>'
      :`<button class="btn btn-warn btn-block" onclick="SUBIR.acks.add('${w.id}');renderSubir()">Sí, es el archivo correcto</button>`}</div>`;
  }
  if(SUBIR.error) h+=`<div class="err-box">${escapeHtml(SUBIR.error)}</div>`;
  const ready=P.warnings.every(w=>SUBIR.acks.has(w.id)) && !SUBIR.busy;
  h+=`<button class="btn btn-primary btn-block" style="margin-top:12px" ${ready?'':'disabled'} onclick="startUpload()">${SUBIR.busy?'Subiendo…':'Cargar envío y empezar a recibir'}</button>`;
  el.innerHTML=h;
}
async function startUpload(){
  if(!SUBIR || SUBIR.busy) return;
  SUBIR.busy=true; SUBIR.error=null; renderSubir();
  try{ await doUpload(); }
  catch(e){ SUBIR.error=(isNetErr(e)?'Sin conexión: no se pudo subir el archivo. ':'No se pudo subir el archivo ('+e.message+'). ')+'Intenta de nuevo.'; }
  if(SUBIR){ SUBIR.busy=false; renderSubir(); }
}
async function doUpload(){
  const P=SUBIR.parsed, slug=INI.hub, area=INI.area;
  const now=serverNow(), epochMs=now.getTime(), fecha=localDateStr(now);
  // §6.7 — does this file belong to the reception already open for this hub+área?
  const prev=await findActiveEnvio(slug, area);
  if(prev.offline) throw new TypeError('offline');
  let reuse=false;
  if(prev.data && !prev.closed && prev.data.sinArchivo) reuse=true; // §6.2b — the file of the reception already started
  else if(prev.data && !prev.closed){
    if(await sessionHasScans(prev.data.session_id)){
      const v=await showModal({ title:'Esta recepción ya tiene productos escaneados',
        html:`<p>Lo escaneado es conteo físico: se conserva y se vuelve a comparar contra el archivo nuevo.</p>`,
        buttons:[{label:'Reemplazar el archivo y conservar lo escaneado', value:'replace', kind:'primary'},
                 {label:'Primero cerrar la recepción actual', value:'close', kind:'secondary'}], cancel:true });
      // "Primero cerrar": keep the chosen file so it can be loaded right after closing
      if(v==='close'){ PENDING_UPLOAD=SUBIR; SUBIR=null; openRecibir(prev.data, { noStale:true }); openResumen(); return; }
      if(v!=='replace') return;
      reuse=true;
    } else if(prev.data.session_fecha===fecha) reuse=true; // same day, nothing scanned → simply replaces
  }
  const session_id = reuse ? prev.data.session_id : `${slug}__${area}__${fecha}__${epochMs}`;
  const session_fecha = reuse ? prev.data.session_fecha : fecha;
  const base=`envios/${slug}/${area}/${fecha}__${epochMs}`;
  const data={ v:1, hub:slug, area, fecha, epochMs, uploadedAt:now.toISOString(), receptor:INI.receptor,
    sourceFile:SUBIR.file.name, csvPath:base+'.csv', session_id, session_fecha,
    stats:P.stats, newestEnvio:P.newestEnvio, lines:P.lines, catalogo:P.catalogo };
  await sbUpload(base+'.csv', SUBIR.file, 'text/csv; charset=utf-8'); // raw, verbatim
  await sbUpload(base+'.json', JSON.stringify(data), 'application/json'); // written last: its presence makes it active
  data._path=base+'.json';
  const fileName=SUBIR.file.name; SUBIR=null;
  const wasSinArchivo=reuse && prev.data.sinArchivo;
  openRecibir(data, { revisar:wasSinArchivo });
  recordEvent(makeEvent(reuse?'reemplazo':'abrir', { detalle:{ envio:base+'.json', csv:base+'.csv', archivo:fileName,
    lineas:P.stats.lineas, anterior:reuse?prev.path:undefined, tras_sin_archivo:wasSinArchivo||undefined } }));
  toast(wasSinArchivo?'✓ Archivo cargado — revisando lo escaneado':reuse?'✓ Archivo reemplazado — lo escaneado se conserva':'✓ Envío cargado. Empieza a escanear.');
}
// §6.2b — start receiving before the file exists. A placeholder envío JSON makes the reception visible to
// other phones; the real upload later reuses its session_id.
async function startSinArchivo(){
  if(!SIN_ARCHIVO_ENABLED) return;
  const slug=INI.hub, area=INI.area, now=serverNow(), epochMs=now.getTime(), fecha=localDateStr(now);
  let prev; try{ prev=await findActiveEnvio(slug, area); }catch(_){ prev={offline:true}; }
  if(prev.offline){ toast('Sin conexión: conéctate para empezar la recepción'); return; }
  if(prev.data && !prev.closed && prev.data.session_fecha===fecha){ toast('Ya hay una recepción abierta hoy: continúala'); refreshActive(); return; }
  const session_id=`${slug}__${area}__${fecha}__${epochMs}`, base=`envios/${slug}/${area}/${fecha}__${epochMs}`;
  const data={ v:1, hub:slug, area, fecha, epochMs, uploadedAt:now.toISOString(), receptor:INI.receptor, sinArchivo:true,
    sourceFile:'', session_id, session_fecha:fecha, stats:{ lineas:0, kg:0, sinCodigo:0, catalogo:0, renglones:0 }, lines:[],
    // the previous file's whole catalog names the products (and their Kg/Pz) until today's file arrives
    catalogo:prev.data ? (prev.data.catalogo||[]).concat((prev.data.lines||[]).map(l=>[l.producto, l.barcode, l.kgpz])) : [] };
  try{ await sbUpload(base+'.json', JSON.stringify(data), 'application/json'); }
  catch(e){ toast(isNetErr(e)?'Sin conexión: intenta de nuevo':'No se pudo empezar ('+e.message+')'); return; }
  data._path=base+'.json';
  openRecibir(data);
  recordEvent(makeEvent('abrir', { detalle:{ envio:base+'.json', sin_archivo:true } }));
  toast('Recepción sin archivo: empieza a escanear');
}

/* ════════════════════════════════════════════════════════════════════════════════════
   EVENTS + OUTBOX (§8) — rec_events is append-only and the source of truth. Every event carries a
   client uid (detalle.uid) so a retried insert or the local mirror never double-counts.
   ════════════════════════════════════════════════════════════════════════════════════ */
const OUTBOX_KEY='mr_outbox', DEAD_KEY='mr_outbox_failed';
let OUTBOX=(()=>{ try{ return JSON.parse(localStorage.getItem(OUTBOX_KEY)||'[]'); }catch(_){ return []; } })();
let _outboxPersisted=true;
function saveOutbox(){ try{ localStorage.setItem(OUTBOX_KEY, JSON.stringify(OUTBOX)); _outboxPersisted=true; }catch(_){ _outboxPersisted=false; } }
const NET={ ok:true };
function makeEvent(tipo, f={}){
  return { session_id:S.session.id, hub:S.hub, area:S.area, fecha:S.session.fecha, tipo,
    sku_key:f.sku_key??null, producto:f.producto??null, cantidad:f.cantidad??null, metodo:f.metodo??null,
    detalle:Object.assign({ uid:newUid() }, f.detalle||{}), receptor:S.receptor, device_id:DEVICE_ID,
    ts:serverNow().toISOString() };
}
function recordEvent(ev){
  OUTBOX.push(ev); saveOutbox();
  if(!_outboxPersisted) toast('La memoria del teléfono está llena: no cierres la app hasta que se suba todo', 5000);
  addEvents([ev]); saveMirror();
  flushOutbox();
}
let _flushing=false;
async function flushOutbox(){
  if(_flushing || !OUTBOX.length){ renderNet(); return; }
  _flushing=true; renderNet();
  try{
    while(OUTBOX.length){
      const batch=OUTBOX.slice(0,100);
      try{ await pgInsert('rec_events', batch); }
      catch(e){
        if(isNetErr(e)) throw e;
        // A row the server rejects must not block every scan behind it: retry one by one, park the bad ones.
        for(const ev of batch){
          try{ await pgInsert('rec_events', [ev]); }
          catch(e2){ if(isNetErr(e2)) throw e2; parkDead(ev, e2); }
        }
      }
      const sent=new Set(batch.map(e=>e.detalle.uid));
      OUTBOX=OUTBOX.filter(e=>!sent.has(e.detalle.uid)); saveOutbox();
      NET.ok=true;
    }
  }catch(e){ NET.ok=false; }
  finally{
    _flushing=false; renderNet();
    // the close button depends on an empty outbox
    if(document.getElementById('screen-resumen').classList.contains('active') && !S.closing) renderResumen();
  }
}
function parkDead(ev, err){
  try{ const d=JSON.parse(localStorage.getItem(DEAD_KEY)||'[]'); d.push({ev, err:String(err&&err.message)}); localStorage.setItem(DEAD_KEY, JSON.stringify(d)); }catch(_){}
  console.error('rec_events rechazó un evento', ev, err);
}
function renderNet(){
  const el=document.getElementById('net-badge'); if(!el) return;
  const n=OUTBOX.length, off=!NET.ok || navigator.onLine===false;
  if(n){ el.className='net-badge '+(off?'off':'pend'); el.textContent=(off?'Sin conexión · ':'Subiendo · ')+n; }
  else if(off){ el.className='net-badge off'; el.textContent='Sin conexión'; }
  else { el.className='net-badge ok'; el.textContent='✓ Guardado'; }
}
window.addEventListener('online', ()=>{ NET.ok=true; flushOutbox(); });
window.addEventListener('offline', renderNet);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') flushOutbox(); });
setInterval(()=>{ if(OUTBOX.length) flushOutbox(); }, 15000);

/* ── Local mirror (§8): mr_session_{slug}_{area}_{fecha} = { envio, events }. Protects work; never picks a page. ── */
function mirrorPrefix(slug, area){ return `mr_session_${slug}_${area}_`; }
let _mirrorT=null;
function saveMirror(){
  clearTimeout(_mirrorT);
  _mirrorT=setTimeout(()=>{
    if(!S.session) return;
    const pre=mirrorPrefix(S.hub, S.area), key=pre+S.session.fecha;
    try{
      for(const k of Object.keys(localStorage)) if(k.startsWith(pre) && k!==key) localStorage.removeItem(k);
      localStorage.setItem(key, JSON.stringify({ envio:S.envio, events:S.events }));
    }catch(_){}
  }, 300);
}
function latestMirror(slug, area){
  try{
    const pre=mirrorPrefix(slug, area);
    const keys=Object.keys(localStorage).filter(k=>k.startsWith(pre)).sort();
    if(!keys.length) return null;
    const m=JSON.parse(localStorage.getItem(keys[keys.length-1])||'null');
    return m && m.envio ? m : null;
  }catch(_){ return null; }
}

/* ── Fold (§8): session state = scans + ajustes summed per sku_key. ── */
function addEvents(evs){
  let added=false;
  for(const e of evs||[]){
    const u=(e.detalle&&e.detalle.uid) || ('id'+e.id);
    if(S.eventUids.has(u)) continue;
    S.eventUids.add(u); S.events.push(e); added=true;
  }
  if(added){ S.events.sort((a,b)=>String(a.ts).localeCompare(String(b.ts))); fold(); }
  return added;
}
function fold(){
  const rec=new Map(), adj=new Map(), noEsp=new Map(), sep=new Map();
  for(const e of S.events){
    if(e.tipo!=='scan' && e.tipo!=='ajuste') continue;
    const q=Number(e.cantidad)||0;
    rec.set(e.sku_key, round2((rec.get(e.sku_key)||0)+q));
    if(e.tipo==='ajuste' && e.detalle && e.detalle.ref) adj.set(e.detalle.ref, round2((adj.get(e.detalle.ref)||0)+q));
    if(e.tipo==='ajuste' && e.detalle && e.detalle.ref && e.detalle.separar) sep.set(e.detalle.ref, e.detalle.separar); // latest wins
    if(e.tipo==='scan' && !S.lines.has(e.sku_key) && !noEsp.has(e.sku_key))
      noEsp.set(e.sku_key, { producto:e.producto, kgpz:(e.detalle&&e.detalle.kgpz)||'Pz' });
  }
  S.recibido=rec; S.adjByRef=adj; S.sepByRef=sep; S.noEsperados=noEsp; // noEsperados feed the Phase 3 summary
}
function recibidoDe(sku){ return S.recibido.get(sku)||0; }

/* ════════════════════════════════════════════════════════════════════════════════════
   RECIBIR (§6.3) — blind: the enviado number is never rendered on this screen.
   ════════════════════════════════════════════════════════════════════════════════════ */
Object.assign(S, { hub:null, area:null, receptor:null, envio:null, session:null, lines:new Map(), catalog:new Map(),
  catByCode:new Map(), events:[], eventUids:new Set(), recibido:new Map(), adjByRef:new Map(), noEsperados:new Map(),
  current:null, corrigiendo:null });
function setEnvio(data){
  S.envio=data;
  S.lines=new Map(data.lines.map(l=>[l.sku_key, Object.assign(l, { _n:normName(l.producto) })]));
  S.sibCache=new Map();
  for(const l of S.lines.values()) l._fw=famWords(l.producto);
}
function openRecibir(data, opts={}){
  S.hub=INI.hub; S.area=INI.area; S.receptor=INI.receptor;
  S.session={ id:data.session_id, fecha:data.session_fecha };
  setEnvio(data);
  S.events=[]; S.eventUids=new Set(); S.current=null; S.corrigiendo=null; S.separando=null; S.staleAsked=false; S.recentAll=false; S.resumenOrder=new Map(); S.lastId=0; S.closedInfo=null; S.armado=null; S.conParciales=!!opts.parciales;
  buildCatalog();
  const m=latestMirror(S.hub, S.area);
  if(m && m.envio && m.envio.session_id===S.session.id) addEvents(m.events);
  addEvents(OUTBOX.filter(e=>e.session_id===S.session.id));
  fold();
  document.getElementById('rec-hub').textContent=hubName(S.hub);
  document.getElementById('rec-area').textContent=areaName(S.area);
  document.getElementById('rec-receptor').textContent=S.receptor;
  showScreen('screen-recibir');
  renderRecibir(); focusScan();
  loadSorting(S.hub).then(()=>{ buildCatalog(); renderRecibir(); });
  S.pdOtras=[]; S.pdBusy=false; S.pdTab='scan'; S.pdEdit=null; S.pdForm=null; S.pdFoco=null; const pq=document.getElementById('pd-q'); if(pq) pq.value='';
  syncServerEvents().then(()=>{ if(opts.revisar && revisarItems().length) openRevisar(); });
  pdRecibirLive();
  if(isPd()) facInit(S.session.id, S.hub);
  flushOutbox();
  if(!opts.noStale) staleCheck();
}
/* ── §6.7 stale warning: the active file was uploaded on an earlier day. Ignorar lasts for that file today. ── */
function staleIgnored(){ try{ return localStorage.getItem('mr_stale_ign_'+S.envio._path)===todayStr(); }catch(_){ return S.staleIgnMem===S.envio._path+todayStr(); } }
async function staleCheck(){
  // Proveedor directo: the snapshot is the order, not a daily file — never ask to upload today's
  if(!S.envio || S.envio.sinArchivo || S.envio.origen==='proveedor' || !(S.envio.fecha<todayStr()) || staleIgnored() || modalOpen()) return true;
  if(S.conParciales || parciales().length) return true;
  S.staleAsked=true;
  const v=await showModal({ title:`Estás trabajando con el archivo cargado el ${fechaLarga(S.envio.fecha)}.`,
    html:'<p>Carga el archivo de hoy.</p>',
    buttons:[{label:'Cargar archivo de hoy', value:'subir', kind:'primary'}, {label:'Ignorar', value:'ign', kind:'secondary'}] });
  if(v==='subir'){ S.current=null; openSubir(); return false; }
  try{ localStorage.setItem('mr_stale_ign_'+S.envio._path, todayStr()); }catch(_){ S.staleIgnMem=S.envio._path+todayStr(); }
  return true;
}
// §8 multi-device: one full read on open, then every 15 s only rows newer than the last id seen
// (rec_events is append-only, so id=gt.{last} never misses a row once it is visible).
async function syncServerEvents(){
  if(!S.session) return;
  const sid=S.session.id, since=S.lastId||0;
  try{
    const rows=await pgSelectAll('rec_events', `session_id=eq.${encodeURIComponent(sid)}${since?`&id=gt.${since}`:''}&select=*`);
    if(!S.session || S.session.id!==sid) return;
    for(const r of rows) if(r.id>(S.lastId||0)) S.lastId=r.id;
    const fresh=rows.filter(r=>!S.eventUids.has((r.detalle&&r.detalle.uid)||('id'+r.id)));
    if(addEvents(rows)){ saveMirror(); await onRemoteEvents(fresh); renderRecibir(); if(screenActive('screen-resumen') && !S.closing) renderResumen(); }
    if(!NET.ok){ NET.ok=true; renderNet(); }
  }catch(_){ NET.ok=false; renderNet(); }
}
function screenActive(id){ return document.getElementById(id).classList.contains('active'); }
// What other phones did: closed the reception, reopened it (admin), or replaced the file
async function onRemoteEvents(evs){
  for(const e of evs){
    if(e.tipo==='parcial'){
      toast(`${e.receptor||'Otro teléfono'} cerró la entrega parcial ${(e.detalle&&e.detalle.entrega)||''}`, 4000);
      const c=S.corrigiendo && S.events.find(x=>x.detalle && x.detalle.uid===S.corrigiendo);
      if(c && enEntregaCerrada(c)) S.corrigiendo=null;
    }
    if(e.tipo==='reemplazo' && e.detalle && e.detalle.envio && e.detalle.envio!==S.envio._path){
      try{
        const data=JSON.parse(await sbFetch(e.detalle.envio)); data._path=e.detalle.envio;
        if(data.session_id!==S.session.id) continue;
        setEnvio(data); buildCatalog(); fold();
        toast(`${e.receptor||'Otro teléfono'} cargó un archivo nuevo — lo escaneado se conserva`, 4000);
        if(S.current && S.current.p.enEnvio!==undefined){ const l=S.lines.get(S.current.p.sku_key); if(l) S.current.p=Object.assign({}, l, { enEnvio:true }); }
      }catch(_){}
    }
  }
  S.closedInfo=closedState();
  if(S.closedInfo && S.current){ S.current=null; }
}
// Latest of cerrar / admin reabrir in this session's events
function closedState(){
  let st=null;
  for(const e of S.events){
    if(e.tipo==='cerrar') st=Object.assign({ ts:e.ts, fecha:e.fecha, hub:e.hub, area:e.area, receptor:e.receptor, session_id:e.session_id }, e.detalle||{});
    else if(e.tipo==='admin' && e.detalle && e.detalle.accion==='reabrir') st=null;
    else if(e.tipo==='admin' && e.detalle && e.detalle.accion==='borrar') return { borrada:true, ts:e.ts, receptor:e.receptor };
  }
  return st;
}
setInterval(()=>{
  if(!S.session || document.visibilityState!=='visible') return;
  if(screenActive('screen-recibir') || screenActive('screen-resumen')) syncServerEvents();
}, 15000);
function leaveRecibir(){ S.current=null; flushOutbox(); goInicio(); }

// Catalog = every product we can name: the file's non-envío rows + this hub's sorting. Used by
// "Sin código" (§7.3) and to name a scanned barcode that isn't in the envío (§7.1).
function buildCatalog(){
  const cat=new Map(), byCode=new Map();
  const add=(producto, barcode, kgpz, vida_dias)=>{
    const sku=skuKeyOf(barcode, producto); if(!producto || cat.has(sku) || S.lines.has(sku)) return;
    const c={ sku_key:sku, producto, barcode, kgpz:kgpz||'Pz', kgpzKnown:!!kgpz, vida_dias:vida_dias??null, _n:normName(producto) };
    cat.set(sku, c); if(barcode) byCode.set(codeKey(barcode), c);
  };
  for(const r of (S.envio&&S.envio.catalogo)||[]) add(r[0], r[1], r[2], r[3]);
  for(const it of S.sortBC.values()) add(String(it[0]||'').trim(), cleanBC(it[1]), null);
  S.catalog=cat; S.catByCode=byCode;
}
function renderRecibir(){
  const total=S.lines.size; let got=0;
  for(const k of S.lines.keys()) if(recibidoDe(k)>0) got++;
  const sinArch=!!S.envio.sinArchivo;
  if(sinArch){
    const n=[...S.recibido.values()].filter(q=>q>0).length;
    document.getElementById('rec-progress').innerHTML=`<b>${n}</b> productos escaneados · <span class="tag orange">sin archivo</span>`;
    document.getElementById('rec-bar').style.width='0%';
    document.getElementById('pend-count').textContent='';
  } else {
    const np=parciales().length;
    document.getElementById('rec-progress').innerHTML=`<b>${got}</b> / ${total} productos recibidos${np?` · <span class="tag orange">entrega ${np+1}</span>`:''}`;
    document.getElementById('rec-bar').style.width=(total?Math.round(got*100/total):0)+'%';
    document.getElementById('pend-count').textContent=`(${total-got})`;
  }
  let banner='';
  if(sinArch) banner+=`<div class="note"><b>Recibiendo sin archivo.</b> Escanea y cuenta normal; cuando el envío esté listo, súbelo desde Inicio → Subir envío y la app revisará todo lo escaneado.</div>`;
  const rev=sinArch?[]:revisarItems();
  if(rev.length) banner+=`<button class="btn btn-warn btn-block" style="margin-bottom:10px" onclick="openRevisar()">Revisar ahora · ${rev.length}</button>`;
  if(isPd()) banner+=pdRecibirBannerHtml();
  if(S.sortStatus==='none') banner+=`<div class="note">${escapeHtml(hubName(S.hub))} todavía no tiene archivo en Sorting Hub: las tarjetas no mostrarán canasta.</div>`;
  else if(S.sortStatus==='err') banner+=`<div class="note">No se pudo cargar el sorting de este hub: las tarjetas no mostrarán canasta.</div>`;
  if(S.closedInfo && S.closedInfo.borrada) banner=`<div class="err-box"><b>Este envío se borró</b> (${escapeHtml(S.closedInfo.receptor||'')}, ${localHM(new Date(S.closedInfo.ts))}). Ya no se puede escanear.
    <button class="btn btn-secondary btn-block" style="margin-top:8px" onclick="goInicio()">← Volver a Inicio</button></div>`;
  else if(S.closedInfo) banner=`<div class="err-box"><b>Esta recepción ya se cerró</b> (${escapeHtml(S.closedInfo.receptor||'')}, ${localHM(new Date(S.closedInfo.ts))}). Ya no se puede escanear.
    <button class="btn btn-secondary btn-block" style="margin-top:8px" onclick="openRecepcion(S.closedInfo,'inicio')">Ver resumen</button></div>`;
  const otros=receptoresDeSesion().filter(r=>r!==S.receptor);
  document.getElementById('rec-receptor').textContent=S.receptor+(otros.length?` (+${otros.length})`:'');
  document.getElementById('rec-banner').innerHTML=banner;
  document.getElementById('rec-footer').innerHTML = S.closedInfo ? '' : sinArch
    ? `<div class="muted" style="text-align:center">Para cerrar la recepción, primero sube el archivo del envío.</div>`
    : (isPd()?'':`<button class="btn btn-secondary btn-block" style="margin-bottom:10px" onclick="openParcial()">Cerrar entrega parcial (sigo después)</button>`)
      +`<button class="btn btn-primary btn-block" onclick="openResumen()">${isPd()?'Terminar revisión física':'Terminé todo: revisar y cerrar'}</button>`
      +(isPd()?`<button class="link-btn" ${S.pdBusy?'disabled':''} onclick="pdReleerRecepcion()">${S.pdBusy?'Leyendo la orden…':'Volver a leer la orden'}</button>`:'');
  const B=pdBotones();
  for(const id of ['rec-row2','rec-canastas','card-area','recent-title','recent-list']) document.getElementById(id).style.display=B?'none':'';
  document.getElementById('pd-lista').style.display=B?'':'none';
  if(B){
    const rs=pdBRows().filter(r=>!r.pns), done=rs.filter(r=>!r.pend).length;
    document.getElementById('rec-progress').innerHTML=`<b>${done}</b> / ${rs.length} productos revisados`;
    document.getElementById('rec-bar').style.width=(rs.length?Math.round(done*100/rs.length):0)+'%';
    if(!S.closedInfo) document.getElementById('rec-footer').innerHTML=`<button class="btn btn-primary btn-block" onclick="openResumen()">Terminar revisión física</button>`
      +`<button class="link-btn" ${S.pdBusy?'disabled':''} onclick="pdReleerRecepcion()">${S.pdBusy?'Leyendo la orden…':'Volver a leer la orden'}</button>`;
    pdBListRender();
  }
  renderCard(); renderRecent(); renderNet();
}

/* ── Scan input wiring (copied from sorting-hub): Enter, or a 300 ms pause, submits. ── */
const SCAN_AUTO_SUBMIT_MS=300;
let _scanT=null, _lastScan={ code:'', time:0 };
function stripScanArtifacts(raw){ return String(raw||'').replace(/[\r\n\t\x1d]/g,'').trim(); }
function extractEmbeddedGTIN(digitsOnly){ // GS1-128: a long scan may embed a 14-digit GTIN after AI "01"
  if(digitsOnly.length<=14) return null;
  const idx=digitsOnly.indexOf('01'); if(idx===-1) return null;
  const gtin=digitsOnly.slice(idx+2, idx+16);
  return gtin.length===14 ? gtin : null;
}

/* ── Resolve a code to a product (§6.3) ── */
function resolveCode(raw){
  const k=codeKey(raw); if(!k) return null;
  if(S.lines.has(k)) return { line:S.lines.get(k) };
  const known=S.catByCode.get(k) || (()=>{ const n=imgName(pickEntry(k, hubCity())); return n ? { sku_key:k, producto:n, barcode:k, kgpz:'Pz' } : null; })();
  if(known){
    // A barcode the export left blank on an envío line: same product name → that line.
    const byName=S.lines.get('name:'+normName(known.producto));
    if(byName) return { line:byName };
    return { product:known };
  }
  return null;
}
async function processScan(raw, metodo){
  const code=stripScanArtifacts(raw); if(!code || overlayOpen()) return;
  if(code.length<4){ toast('Escaneo incompleto — vuelve a escanear'); return; } // no real barcode is this short
  if(S.closedInfo){ toast('Esta recepción ya se cerró'); return; }
  const now=Date.now();
  if(code===_lastScan.code && now-_lastScan.time<1500) return; // debounce a double trigger
  _lastScan={ code, time:now };
  // §6.7 — also at the first scan of the day (a page left open overnight)
  if(!S.staleAsked && !(await staleCheck())) return;
  let r=resolveCode(code);
  if(!r){ const g=extractEmbeddedGTIN(code.replace(/\D/g,'')); if(g) r=resolveCode(g); }
  const det={ codigo:code, teclado:metodo==='teclado'||undefined };
  const m=metodo==='teclado' ? 'scanner' : metodo;
  if(pdBotones()){ pdBScan(r, code); return; }
  if(r && r.line){ vibrate(true); openCard({ ...r.line, enEnvio:true }, m, det); return; }
  // §6.2b — no file yet: nothing can be flagged; the unit is asked on the card
  if(r && r.product && S.envio.sinArchivo){ vibrate(true); openCard(sinArchivoProduct(r.product), m, det); return; }
  vibrate(false);
  if(r && r.product){ await notInEnvio(r.product, m, det); return; }
  // §6.3.3 — unknown barcode
  const v=await showModal({ title:'Código no reconocido', html:`<p>Vuelve a escanear o búscalo por nombre.</p><p style="font-size:12px;color:var(--gray-500)">Código: ${escapeHtml(code)}</p>`,
    buttons:[{label:'Volver a escanear', value:'again', kind:'primary'}, {label:'Código incorrecto en sistema · buscar por nombre', value:'search', kind:'secondary'}]
      .concat(S.envio.sinArchivo?[{label:'Registrar este código sin nombre', value:'raw', kind:'secondary'}]:[]) });
  if(v==='search') codigoIncorrecto({ codigo:code, sistema:null });
  // §6.2b — without a file an unknown code can still be counted; the file names it later (same sku_key)
  if(v==='raw'){ const k=codeKey(code); openCard(sinArchivoProduct({ sku_key:k, producto:'Código '+k, barcode:k }), m, det); }
}
function vibrate(ok){ try{ if(navigator.vibrate) navigator.vibrate(ok?70:[60,50,60]); }catch(_){} }
/* ── Families (§7.2): envío lines grouped by familyKey; built in openRecibir ── */
// Hermanos = envío lines easy to mix up with p. Beyond the plan's "same name, other size" (familyKey), the real
// Contry file showed two more cases worth flagging, always within the same product type (first word):
//  · one name contains the other: "Frijoles bayos refritos Isadora" ~ "… bajos en grasa Isadora"
//  · same words but one swapped (flavor/variant): "Mermelada de higo St Dalfour" ~ "… de fresa St Dalfour"
function famWords(name){ return new Set(familyKey(name).split(' ').filter(w=>w.length>=2)); }
function isSibling(a, b){
  const fa=familyKey(a.producto), fb=familyKey(b.producto);
  if(fa.length>=4 && fa===fb) return true;
  // both extra rules need the same product type (first word): "Barbacoa de res" vs "Flautas de res" is not a mix-up
  if(fa.split(' ')[0]!==fb.split(' ')[0]) return false;
  const wa=a._fw||famWords(a.producto), wb=b._fw||famWords(b.producto);
  const [x,y]=wa.size<=wb.size?[wa,wb]:[wb,wa];
  let miss=0; for(const w of x) if(!y.has(w)) miss++;
  if(x.size>=3 && miss===0) return true;
  return x.size>=4 && x.size===y.size && miss===1;
}
function siblingsOf(p){
  if(S.sibCache.has(p.sku_key)) return S.sibCache.get(p.sku_key);
  const out=[...S.lines.values()].filter(l=>l.sku_key!==p.sku_key && isSibling(p, l));
  S.sibCache.set(p.sku_key, out);
  return out;
}
// §7.1 look-alikes: same family first, then envío lines sharing ≥2 significant words
function lookAlikes(p){
  const out=siblingsOf(p).slice(0,3); if(out.length>=3) return out;
  const words=new Set(normName(p.producto).split(' ').filter(w=>w.length>=4 && !/\d/.test(w)));
  if(words.size<2) return out;
  const scored=[];
  for(const l of S.lines.values()){
    if(out.includes(l) || l.sku_key===p.sku_key) continue;
    let n=0; for(const w of new Set(l._n.split(' '))) if(words.has(w)) n++;
    if(n>=2) scored.push({ l, n });
  }
  scored.sort((a,b)=>b.n-a.n || a.l._n.localeCompare(b.l._n));
  return out.concat(scored.slice(0,3-out.length).map(x=>x.l));
}
// §7.1 — not in the envío: photo of what was scanned + up to 3 envío look-alikes ("Era este otro")
async function notInEnvio(p, metodo, det){
  // Proveedor directo (§6.3): not in the order → card «No solicitado · se rechaza», Pedido 0. No modal, no call.
  if(isPd()){ openCard({ ...p, enEnvio:false }, metodo, det); return; }
  const looks=lookAlikes(p);
  const looksHtml=looks.length ? `<p style="margin:12px 0 0;font-weight:700;color:var(--gray-900)">¿Era alguno de estos? Sí vienen en el envío:</p>`
    +looks.map((l,i)=>{ const pos=positionOf(l.barcode, l.producto);
      return `<button class="look-item" data-mv="look:${i}">${imgTag(l.barcode, l.producto, 'thumb')}<div style="flex:1;min-width:0"><div class="res-name">${nameHtml(l.producto)}</div>`
        +`<div class="res-sub">${pos?escapeHtml(pos.palabra+' '+pos.full):'sin posición'}</div></div><span class="look-cta">Era este otro</span></button>`; }).join('') : '';
  const noVende=noSeVendeEn(p.barcode);
  const v=await showModal({ title:'Este producto no viene en el envío.',
    html:`<div class="modal-prod">${imgTag(p.barcode, p.producto, 'thumb')}<div class="res-name">${nameHtml(p.producto)}</div></div>`
      +(noVende?`<p style="margin:12px 0 0;font-weight:700;color:var(--gray-900)">Este producto no se vende en ${escapeHtml(noVende)}</p>`:'')+looksHtml,
    buttons:[{label:'Volver a escanear', value:'again', kind:'primary'}, {label:'Sí, llegó este producto', value:'yes', kind:'danger'}]
      .concat(det && det.codigo && !det.codigo_incorrecto ? [{label:'Código incorrecto en sistema · buscar por nombre', value:'mal', kind:'secondary'}] : []) });
  if(v==='yes') openCard({ ...p, enEnvio:false }, metodo, det);
  else if(v==='mal') codigoIncorrecto({ codigo:det.codigo, sistema:p });
  else if(v && v.startsWith('look:')){
    const l=looks[Number(v.slice(5))];
    // The scan is re-attributed to the chosen envío line; detalle keeps what was actually scanned
    if(l) openCard({ ...l, enEnvio:true }, metodo, Object.assign({}, det, { reatribuido_de:{ sku_key:p.sku_key, producto:p.producto } }));
  }
}

/* ── Product card ── */
// §6.2b — without a file the unit isn't known: the receptor picks Pz / Kg on the card

/* ── Caducidad mínima + Separar: «Vida anaquel usuarios (min. días)» from the envío file + the day it's received

   "Dañadas" then say how many OF THAT TOTAL get separated for merma (MNA), so every hub records 5 received + 1
   dañada the same way. Separated pieces never lower Recibido (rule 8). Stored on the scan: fecha_corta +
   fecha_corta_pz, danadas. Old scans have fecha_corta alone = the whole scan. ── */
function vidaDiasOf(p){ const l=S.lines.get(p.sku_key), v=l?l.vida_dias:p.vida_dias; return Number.isFinite(v)?v:null; }
function caducidadMin(p){
  if(isPd()){ const l=S.lines.get(p.sku_key); return (l && l.caducidad_min) || null; } // straight from the order (Fecha + V Anaquel)
  const d=vidaDiasOf(p); return d==null ? null : new Date(Date.parse(todayStr()+'T12:00:00Z')+d*86400000).toISOString().slice(0,10); }
function dmy(ymd){ const [y,m,d]=String(ymd).split('-'); return d?`${d}/${m}/${y}`:String(ymd||''); }

}
const SEP_LABEL={ fc:'Fecha corta', dan:'Dañadas' };
function sepHtml(c){

  return `<div class="sep-q">De ese total, ¿alguna se separa?</div>
    <div class="sep-btns" ${kinds.length<2?'style="grid-template-columns:1fr"':''}>${kinds.map(k=>`<button class="choice ${k in sep?'sel':''}" onclick="toggleSep('${k}')">${SEP_LABEL[k]}</button>`).join('')}</div>
    ${kinds.filter(k=>k in sep).map(k=>`<div class="sep-row"><label for="sep-${k}">${SEP_LABEL[k]}, de ese total</label><input id="sep-${k}" class="text-input" type="text" inputmode="${kg?'decimal':'numeric'}" autocomplete="off" placeholder="${kg?'0.00':'0'}"></div>`).join('')}
    <div class="sep-sum" id="sep-sum"></div>`;
}
function toggleSep(k){

// Says back what will be stored, so nobody has to guess whether the total includes the separated pieces
function updSepSum(){
  const c=S.current, el=document.getElementById('sep-sum'); if(!c || !el) return;
  const ks=Object.keys(c.sep||{}); if(!ks.length){ el.textContent=''; return; }
  const u=unitOf(c.p.kgpz), t=parseQty(c.val, c.p.kgpz), n=round2(ks.reduce((a,k)=>a+(parseQty(c.sep[k], c.p.kgpz)||0),0));
  el.textContent = t==null ? 'Primero escribe el total que llegó.' : `Se reciben ${fmtQty(t,c.p.kgpz)} ${u}. De esas, a MNA: ${fmtQty(n,c.p.kgpz)} ${u}.`;
}
// A scan's separated pieces, never above what the scan holds now (Corregir can lower it)
function separadasDe(ev){
  const d=ev.detalle||{}, s=S.sepByRef.get(d.uid), now=Math.max(0, scanQtyNow(ev));
  const fc=s?s.fecha_corta:(d.fecha_corta?(d.fecha_corta_pz??now):0), dan=s?s.danadas:d.danadas;
  return { fc:Math.min(fc||0, now), dan:Math.min(dan||0, now) };
}
function sepSum(sku, k, entrega){
  const ps=entrega?parciales():null; let n=0;
  for(const e of S.events) if(e.tipo==='scan' && e.sku_key===sku && (!entrega || entregaDe(e, ps)===entrega)) n+=separadasDe(e)[k];
  return round2(n);
}
function fechaCortaDe(sku){ return Math.min(sepSum(sku,'fc'), Math.max(0, recibidoDe(sku))); }
function danadasDe(sku){ return Math.min(sepSum(sku,'dan'), Math.max(0, recibidoDe(sku))); }
function separarDe(sku){ return Math.min(round2(sepSum(sku,'fc')+sepSum(sku,'dan')), Math.max(0, recibidoDe(sku))); }
function caducidadDe(sku){ let c=''; for(const e of S.events) if(e.tipo==='scan' && e.sku_key===sku && e.detalle && e.detalle.caducidad_min && (!c || separadasDe(e).fc>0)) c=e.detalle.caducidad_min; return c; }
