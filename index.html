  for(const r of (S.envio&&S.envio.catalogo)||[]) add(r[0], r[1], r[2], r[3]);
  for(const it of S.sortBC.values()) add(String(it[0]||'').trim(), cleanBC(it[1]), null);
  S.catalog=cat; S.catByCode=byCode;
}
function renderRecibir(){
  const total=S.lines.size; let got=0;
  for(const k of S.lines.keys()) if(recibidoDe(k)>0) got++;
  const sinArch=!!S.envio.sinArchivo;
  if(sinArch){
    const n=[...S.recibido.values()].filter(q=>q>0).length;
    document.getElementById('rec-progress').innerHTML=`<b>${n}</b> productos escaneados · <span class="tag orange">sin archivo</span>`;
    document.getElementById('rec-bar').style.width='0%';
    document.getElementById('pend-count').textContent='';
  } else {
    const np=parciales().length;
    document.getElementById('rec-progress').innerHTML=`<b>${got}</b> / ${total} productos recibidos${np?` · <span class="tag orange">entrega ${np+1}</span>`:''}`;
    document.getElementById('rec-bar').style.width=(total?Math.round(got*100/total):0)+'%';
    document.getElementById('pend-count').textContent=`(${total-got})`;
  }
  let banner='';
  if(sinArch) banner+=`<div class="note"><b>Recibiendo sin archivo.</b> Escanea y cuenta normal; cuando el envío esté listo, súbelo desde Inicio → Subir envío y la app revisará todo lo escaneado.</div>`;
  const rev=sinArch?[]:revisarItems();
  if(rev.length) banner+=`<button class="btn btn-warn btn-block" style="margin-bottom:10px" onclick="openRevisar()">Revisar ahora · ${rev.length}</button>`;
  if(S.sortStatus==='none') banner+=`<div class="note">${escapeHtml(hubName(S.hub))} todavía no tiene archivo en Sorting Hub: las tarjetas no mostrarán canasta.</div>`;
  else if(S.sortStatus==='err') banner+=`<div class="note">No se pudo cargar el sorting de este hub: las tarjetas no mostrarán canasta.</div>`;
  if(S.closedInfo && S.closedInfo.borrada) banner=`<div class="err-box"><b>Este envío se borró</b> (${escapeHtml(S.closedInfo.receptor||'')}, ${localHM(new Date(S.closedInfo.ts))}). Ya no se puede escanear.
    <button class="btn btn-secondary btn-block" style="margin-top:8px" onclick="goInicio()">← Volver a Inicio</button></div>`;
  else if(S.closedInfo) banner=`<div class="err-box"><b>Esta recepción ya se cerró</b> (${escapeHtml(S.closedInfo.receptor||'')}, ${localHM(new Date(S.closedInfo.ts))}). Ya no se puede escanear.
    <button class="btn btn-secondary btn-block" style="margin-top:8px" onclick="openRecepcion(S.closedInfo,'inicio')">Ver resumen</button></div>`;
  const otros=receptoresDeSesion().filter(r=>r!==S.receptor);
  document.getElementById('rec-receptor').textContent=S.receptor+(otros.length?` (+${otros.length})`:'');
  document.getElementById('rec-banner').innerHTML=banner;
  document.getElementById('rec-footer').innerHTML = S.closedInfo ? '' : sinArch
    ? `<div class="muted" style="text-align:center">Para cerrar la recepción, primero sube el archivo del envío.</div>`
    : `<button class="btn btn-secondary btn-block" style="margin-bottom:10px" onclick="openParcial()">Cerrar entrega parcial (sigo después)</button>
       <button class="btn btn-primary btn-block" onclick="openResumen()">Terminé todo: revisar y cerrar</button>`;
  renderCard(); renderRecent(); renderNet();
}

/* ── Scan input wiring (copied from sorting-hub): Enter, or a 300 ms pause, submits. ── */
const SCAN_AUTO_SUBMIT_MS=300;
let _scanT=null, _lastScan={ code:'', time:0 };
function stripScanArtifacts(raw){ return String(raw||'').replace(/[\r\n\t\x1d]/g,'').trim(); }
function extractEmbeddedGTIN(digitsOnly){ // GS1-128: a long scan may embed a 14-digit GTIN after AI "01"
  if(digitsOnly.length<=14) return null;
  const idx=digitsOnly.indexOf('01'); if(idx===-1) return null;
  const gtin=digitsOnly.slice(idx+2, idx+16);
  return gtin.length===14 ? gtin : null;
}
const scanEl=document.getElementById('scan-input');
scanEl.addEventListener('keydown', e=>{
  if(e.key==='Enter'){ e.preventDefault(); clearTimeout(_scanT); const v=scanEl.value; scanEl.value=''; processScan(v, scanMetodo()); }
});
scanEl.addEventListener('input', ()=>{
  clearTimeout(_scanT); const v=scanEl.value; if(!v) return;
  // Typing by hand (keyboard toggled on) waits for Enter; a scanner's burst auto-submits on the pause.
  if(scanEl.getAttribute('inputmode')!=='none') return;
  _scanT=setTimeout(()=>{ scanEl.value=''; processScan(v, 'scanner'); }, SCAN_AUTO_SUBMIT_MS);
});
scanEl.addEventListener('blur', ()=>setTimeout(()=>{ if(document.activeElement===document.body) focusScan(); }, 60));
document.getElementById('screen-recibir').addEventListener('click', e=>{
  if(!e.target.closest('button, a, input, select, label, textarea')) focusScan();
});
function scanMetodo(){ return scanEl.getAttribute('inputmode')==='none' ? 'scanner' : 'teclado'; }
function toggleKeyboard(){
  const on=scanEl.getAttribute('inputmode')==='none';
  scanEl.setAttribute('inputmode', on?'numeric':'none');
  document.getElementById('kb-toggle').classList.toggle('on', on);
  scanEl.placeholder=on?'Escribe el código y pulsa Enter':'Escanea un código…';
  scanEl.blur(); setTimeout(()=>scanEl.focus(), 30);
}
function overlayOpen(){ return modalOpen() || document.getElementById('sheet').classList.contains('open') || document.getElementById('camera-overlay').classList.contains('open'); }
// The scan field gets focus back unless something the receptor is typing into is open.
function focusScan(){
  const go=()=>{
    if(!document.getElementById('screen-recibir').classList.contains('active') || overlayOpen() || S.corrigiendo) return;
    if(S.current){ const q=document.getElementById('qty-input'); if(q && document.activeElement!==q) q.focus(); return; }
    if(document.activeElement!==scanEl) scanEl.focus();
  };
  go(); setTimeout(go, 30);
}

/* ── Resolve a code to a product (§6.3) ── */
function resolveCode(raw){
  const k=codeKey(raw); if(!k) return null;
  if(S.lines.has(k)) return { line:S.lines.get(k) };
  const known=S.catByCode.get(k) || (()=>{ const n=imgName(pickEntry(k, hubCity())); return n ? { sku_key:k, producto:n, barcode:k, kgpz:'Pz' } : null; })();
  if(known){
    // A barcode the export left blank on an envío line: same product name → that line.
    const byName=S.lines.get('name:'+normName(known.producto));
    if(byName) return { line:byName };
    return { product:known };
  }
  return null;
}
async function processScan(raw, metodo){
  const code=stripScanArtifacts(raw); if(!code || overlayOpen()) return;
  if(code.length<4){ toast('Escaneo incompleto — vuelve a escanear'); return; } // no real barcode is this short
  if(S.closedInfo){ toast('Esta recepción ya se cerró'); return; }
  const now=Date.now();
  if(code===_lastScan.code && now-_lastScan.time<1500) return; // debounce a double trigger
  _lastScan={ code, time:now };
  // §6.7 — also at the first scan of the day (a page left open overnight)
  if(!S.staleAsked && !(await staleCheck())) return;
  let r=resolveCode(code);
  if(!r){ const g=extractEmbeddedGTIN(code.replace(/\D/g,'')); if(g) r=resolveCode(g); }
  const det={ codigo:code, teclado:metodo==='teclado'||undefined };
  const m=metodo==='teclado' ? 'scanner' : metodo;
  if(r && r.line){ vibrate(true); openCard({ ...r.line, enEnvio:true }, m, det); return; }
  // §6.2b — no file yet: nothing can be flagged; the unit is asked on the card
  if(r && r.product && S.envio.sinArchivo){ vibrate(true); openCard(sinArchivoProduct(r.product), m, det); return; }
  vibrate(false);
  if(r && r.product){ await notInEnvio(r.product, m, det); return; }
  // §6.3.3 — unknown barcode
  const v=await showModal({ title:'Código no reconocido', html:`<p>Vuelve a escanear o búscalo por nombre.</p><p style="font-size:12px;color:var(--gray-500)">Código: ${escapeHtml(code)}</p>`,
    buttons:[{label:'Volver a escanear', value:'again', kind:'primary'}, {label:'Código incorrecto en sistema · buscar por nombre', value:'search', kind:'secondary'}]
      .concat(S.envio.sinArchivo?[{label:'Registrar este código sin nombre', value:'raw', kind:'secondary'}]:[]) });
  if(v==='search') codigoIncorrecto({ codigo:code, sistema:null });
  // §6.2b — without a file an unknown code can still be counted; the file names it later (same sku_key)
  if(v==='raw'){ const k=codeKey(code); openCard(sinArchivoProduct({ sku_key:k, producto:'Código '+k, barcode:k }), m, det); }
}
function vibrate(ok){ try{ if(navigator.vibrate) navigator.vibrate(ok?70:[60,50,60]); }catch(_){} }
/* ── Families (§7.2): envío lines grouped by familyKey; built in openRecibir ── */
// Hermanos = envío lines easy to mix up with p. Beyond the plan's "same name, other size" (familyKey), the real
// Contry file showed two more cases worth flagging, always within the same product type (first word):
//  · one name contains the other: "Frijoles bayos refritos Isadora" ~ "… bajos en grasa Isadora"
//  · same words but one swapped (flavor/variant): "Mermelada de higo St Dalfour" ~ "… de fresa St Dalfour"
function famWords(name){ return new Set(familyKey(name).split(' ').filter(w=>w.length>=2)); }
function isSibling(a, b){
  const fa=familyKey(a.producto), fb=familyKey(b.producto);
  if(fa.length>=4 && fa===fb) return true;
  // both extra rules need the same product type (first word): "Barbacoa de res" vs "Flautas de res" is not a mix-up
  if(fa.split(' ')[0]!==fb.split(' ')[0]) return false;
  const wa=a._fw||famWords(a.producto), wb=b._fw||famWords(b.producto);
  const [x,y]=wa.size<=wb.size?[wa,wb]:[wb,wa];
  let miss=0; for(const w of x) if(!y.has(w)) miss++;
  if(x.size>=3 && miss===0) return true;
  return x.size>=4 && x.size===y.size && miss===1;
}
function siblingsOf(p){
  if(S.sibCache.has(p.sku_key)) return S.sibCache.get(p.sku_key);
  const out=[...S.lines.values()].filter(l=>l.sku_key!==p.sku_key && isSibling(p, l));
  S.sibCache.set(p.sku_key, out);
  return out;
}
// §7.1 look-alikes: same family first, then envío lines sharing ≥2 significant words
function lookAlikes(p){
  const out=siblingsOf(p).slice(0,3); if(out.length>=3) return out;
  const words=new Set(normName(p.producto).split(' ').filter(w=>w.length>=4 && !/\d/.test(w)));
  if(words.size<2) return out;
  const scored=[];
  for(const l of S.lines.values()){
    if(out.includes(l) || l.sku_key===p.sku_key) continue;
    let n=0; for(const w of new Set(l._n.split(' '))) if(words.has(w)) n++;
    if(n>=2) scored.push({ l, n });
  }
  scored.sort((a,b)=>b.n-a.n || a.l._n.localeCompare(b.l._n));
  return out.concat(scored.slice(0,3-out.length).map(x=>x.l));
}
// §7.1 — not in the envío: photo of what was scanned + up to 3 envío look-alikes ("Era este otro")
async function notInEnvio(p, metodo, det){
  const looks=lookAlikes(p);
  const looksHtml=looks.length ? `<p style="margin:12px 0 0;font-weight:700;color:var(--gray-900)">¿Era alguno de estos? Sí vienen en el envío:</p>`
    +looks.map((l,i)=>{ const pos=positionOf(l.barcode, l.producto);
      return `<button class="look-item" data-mv="look:${i}">${imgTag(l.barcode, l.producto, 'thumb')}<div style="flex:1;min-width:0"><div class="res-name">${nameHtml(l.producto)}</div>`
        +`<div class="res-sub">${pos?escapeHtml(pos.palabra+' '+pos.full):'sin posición'}</div></div><span class="look-cta">Era este otro</span></button>`; }).join('') : '';
  const noVende=noSeVendeEn(p.barcode);
  const v=await showModal({ title:'Este producto no viene en el envío.',
    html:`<div class="modal-prod">${imgTag(p.barcode, p.producto, 'thumb')}<div class="res-name">${nameHtml(p.producto)}</div></div>`
      +(noVende?`<p style="margin:12px 0 0;font-weight:700;color:var(--gray-900)">Este producto no se vende en ${escapeHtml(noVende)}</p>`:'')+looksHtml,
    buttons:[{label:'Volver a escanear', value:'again', kind:'primary'}, {label:'Sí, llegó este producto', value:'yes', kind:'danger'}]
      .concat(det && det.codigo && !det.codigo_incorrecto ? [{label:'Código incorrecto en sistema · buscar por nombre', value:'mal', kind:'secondary'}] : []) });
  if(v==='yes') openCard({ ...p, enEnvio:false }, metodo, det);
  else if(v==='mal') codigoIncorrecto({ codigo:det.codigo, sistema:p });
  else if(v && v.startsWith('look:')){
    const l=looks[Number(v.slice(5))];
    // The scan is re-attributed to the chosen envío line; detalle keeps what was actually scanned
    if(l) openCard({ ...l, enEnvio:true }, metodo, Object.assign({}, det, { reatribuido_de:{ sku_key:p.sku_key, producto:p.producto } }));
  }
}

/* ── Product card ── */
// §6.2b — without a file the unit isn't known: the receptor picks Pz / Kg on the card
function sinArchivoProduct(p){ return p.kgpzKnown ? { ...p, enEnvio:null } : { ...p, enEnvio:null, kgpz:null, kgpzUnknown:true }; }
// Recontar (§6.2b Revisar ahora, §6.5): the receptor types the TOTAL counted now; stored as an ajuste
function openRecount(sku, origen, after){
  const l=S.lines.get(sku), ne=S.noEsperados.get(sku);
  const p=l ? { ...l, enEnvio:true } : { sku_key:sku, producto:ne?ne.producto:sku, barcode:sku.startsWith('name:')?'':sku, kgpz:ne?ne.kgpz:'Pz', enEnvio:false };
  if(!document.getElementById('screen-recibir').classList.contains('active')) showScreen('screen-recibir');
  closeSheet();
  S.current={ p, metodo:'recuento', det:{ recuento:true, origen }, recount:true, after };
  renderCard();
  const q=document.getElementById('qty-input'); if(q) setTimeout(()=>q.focus(), 40);
  document.getElementById('card-area').scrollIntoView({ block:'start', behavior:'smooth' });
}
function openCard(p, metodo, det={}){
  const prev=S.current;
  if(prev && prev.p.sku_key!==p.sku_key) toast(`No se registró «${prev.p.producto}» (sin cantidad)`, 3000);
  S.current={ p, metodo, det };
  renderCard();
  const q=document.getElementById('qty-input'); if(q) setTimeout(()=>q.focus(), 40);
  document.getElementById('card-area').scrollIntoView({ block:'start', behavior:'smooth' });
}
function cancelCard(){ S.current=null; renderCard(); focusScan(); }
/* ── Caducidad mínima + Separar: «Vida anaquel usuarios (min. días)» from the envío file + the day it's received
   (server, Monterrey) is shown on the card. The quantity is ALWAYS the total that arrived; "Fecha corta" and
   "Dañadas" then say how many OF THAT TOTAL get separated for merma (MNA), so every hub records 5 received + 1
   dañada the same way. Separated pieces never lower Recibido (rule 8). Stored on the scan: fecha_corta +
   fecha_corta_pz, danadas. Old scans have fecha_corta alone = the whole scan. ── */
function vidaDiasOf(p){ const l=S.lines.get(p.sku_key), v=l?l.vida_dias:p.vida_dias; return Number.isFinite(v)?v:null; }
function caducidadMin(p){ const d=vidaDiasOf(p); return d==null ? null : new Date(Date.parse(todayStr()+'T12:00:00Z')+d*86400000).toISOString().slice(0,10); }
function dmy(ymd){ const [y,m,d]=String(ymd).split('-'); return d?`${d}/${m}/${y}`:String(ymd||''); }
function cadBoxHtml(c){
  const cad=c.recount?null:caducidadMin(c.p); if(!cad) return '';
  return `<div class="cad-box"><div class="cad-main"><small>Caducidad mínima</small>${dmy(cad)}</div></div>`;
}
const SEP_LABEL={ fc:'Fecha corta', dan:'Dañadas' };
function sepHtml(c){
  if(c.recount) return '';
  const sep=c.sep||(c.sep={}), kinds=(caducidadMin(c.p)?['fc']:[]).concat('dan'), kg=c.p.kgpz==='Kg';
  return `<div class="sep-q">De ese total, ¿alguna se separa?</div>
    <div class="sep-btns" ${kinds.length<2?'style="grid-template-columns:1fr"':''}>${kinds.map(k=>`<button class="choice ${k in sep?'sel':''}" onclick="toggleSep('${k}')">${SEP_LABEL[k]}</button>`).join('')}</div>
    ${kinds.filter(k=>k in sep).map(k=>`<div class="sep-row"><label for="sep-${k}">${SEP_LABEL[k]}, de ese total</label><input id="sep-${k}" class="text-input" type="text" inputmode="${kg?'decimal':'numeric'}" autocomplete="off" placeholder="${kg?'0.00':'0'}"></div>`).join('')}
    <div class="sep-sum" id="sep-sum"></div>`;
}
function toggleSep(k){
  const c=S.current; if(!c) return;
  if(k in c.sep) delete c.sep[k]; else c.sep[k]='';
  renderCard();
  const i=document.getElementById(k in c.sep?'sep-'+k:'qty-input'); if(i) i.focus();
}
// Says back what will be stored, so nobody has to guess whether the total includes the separated pieces
function updSepSum(){
  const c=S.current, el=document.getElementById('sep-sum'); if(!c || !el) return;
  const ks=Object.keys(c.sep||{}); if(!ks.length){ el.textContent=''; return; }
  const u=unitOf(c.p.kgpz), t=parseQty(c.val, c.p.kgpz), n=round2(ks.reduce((a,k)=>a+(parseQty(c.sep[k], c.p.kgpz)||0),0));
  el.textContent = t==null ? 'Primero escribe el total que llegó.' : `Se reciben ${fmtQty(t,c.p.kgpz)} ${u}. De esas, a MNA: ${fmtQty(n,c.p.kgpz)} ${u}.`;
}
// A scan's separated pieces, never above what the scan holds now (Corregir can lower it)
function separadasDe(ev){
  const d=ev.detalle||{}, s=S.sepByRef.get(d.uid), now=Math.max(0, scanQtyNow(ev));
  const fc=s?s.fecha_corta:(d.fecha_corta?(d.fecha_corta_pz??now):0), dan=s?s.danadas:d.danadas;
  return { fc:Math.min(fc||0, now), dan:Math.min(dan||0, now) };
}
function sepSum(sku, k, entrega){
  const ps=entrega?parciales():null; let n=0;
  for(const e of S.events) if(e.tipo==='scan' && e.sku_key===sku && (!entrega || entregaDe(e, ps)===entrega)) n+=separadasDe(e)[k];
  return round2(n);
}
function fechaCortaDe(sku){ return Math.min(sepSum(sku,'fc'), Math.max(0, recibidoDe(sku))); }
function danadasDe(sku){ return Math.min(sepSum(sku,'dan'), Math.max(0, recibidoDe(sku))); }
function separarDe(sku){ return Math.min(round2(sepSum(sku,'fc')+sepSum(sku,'dan')), Math.max(0, recibidoDe(sku))); }
function caducidadDe(sku){ let c=''; for(const e of S.events) if(e.tipo==='scan' && e.sku_key===sku && e.detalle && e.detalle.caducidad_min && (!c || separadasDe(e).fc>0)) c=e.detalle.caducidad_min; return c; }
function renderCard(){
  const el=document.getElementById('card-area');
  const c=S.current;
  if(!c){ el.innerHTML=S.events.some(e=>e.tipo==='scan')?'':'<div class="empty-hint">Escanea el primer producto para empezar.</div>'; return; }
  const p=c.p, kg=p.kgpz==='Kg', pos=positionOf(p.barcode, p.producto), pres=presentacion(p.producto), ya=recibidoDe(p.sku_key);
  const focusId=document.activeElement && document.activeElement.id, hadFocus=focusId==='qty-input';
  const sibs=p.enEnvio===false?[]:siblingsOf(p);
  const top = c.recount ? `<div class="banner yellow"><b>Recontar:</b> cuenta otra vez todo lo que llegó de este producto, también lo separado, y escribe el total.</div>`
    : p.enEnvio===false ? '<div class="banner red">No viene en el envío — se registra como <b>No esperado</b></div>'
    : p.enEnvio===null ? '<div class="banner gray">Sin archivo: se revisará cuando subas el envío.</div>' : '';
  el.innerHTML=`<div class="pcard ${p.enEnvio===false?'noesp':''}">
    ${top}
    <div class="pcard-top">
      ${imgTag(p.barcode, p.producto, 'pcard-img')}
      <div class="basket">${pos
        ? `<div class="basket-l">${pos.palabra}</div><div class="basket-letter ${pos.letra.length>2?'long':''}">${escapeHtml(pos.letra)}</div><div class="basket-pos">${escapeHtml(pos.full)}</div>`
        : `<div class="basket-none">Sin posición en el sorting de ${escapeHtml(hubName(S.hub))}</div>`}</div>
    </div>
    <div class="pcard-name">${nameHtml(p.producto)}</div>
    <div class="pcard-tags">${pres?`<span class="pres-chip">${escapeHtml(pres.t)}</span>`:''}${p.kgpz?`<span class="unit-chip ${kg?'kg':''}">${kg?'Kg':'Pz'}</span>`:''}${p.barcode?'':'<span class="tag">sin código</span>'}</div>
    <div id="sibling-slot">${sibs.length?`<div class="banner yellow">Ojo: también vienen ${sibs.map(s=>'<b>'+escapeHtml(s.producto)+'</b>').join(', ')}. Cuenta por separado.
      ${sibs.slice(0,3).map(s=>`<div class="sib-row">${imgTag(s.barcode, s.producto, 'thumb')}<span>${nameHtml(s.producto)}</span></div>`).join('')}</div>`:''}</div>
    ${p.kgpzUnknown?`<div class="qty-label">¿Cómo se recibe?</div><div class="unit-pick">${['Pz','Kg'].map(u=>`<button class="choice ${p.kgpz===u?'sel':''}" onclick="pickUnit('${u}')">${u==='Kg'?'Por peso (Kg)':'Por pieza (Pz)'}</button>`).join('')}</div>`:''}
    ${ya>0?`<div class="banner gray">Ya registraste ${fmtQty(ya,p.kgpz||'Kg')} ${p.kgpz?unitOf(p.kgpz):''} de este producto.</div>`:''}
    ${kg?'<div class="banner blue">Pésalo en la báscula</div>':''}
    ${cadBoxHtml(c)}
    <label class="qty-label" for="qty-input">${c.recount?(kg?'Total en kg (báscula)':'Total de piezas contadas ahora'):kg?'Total recibido en kg (báscula), también lo dañado o de fecha corta':'Total recibido: todas las que llegaron, también dañadas o de fecha corta'}</label>
    <input id="qty-input" class="qty-input" type="text" inputmode="${kg?'decimal':'numeric'}" autocomplete="off" placeholder="${kg?'0.00':'0'}">
    <div class="qty-err" id="qty-err"></div>
    ${sepHtml(c)}
    <div class="pcard-actions"><button class="btn btn-secondary" onclick="cancelCard()">Cancelar</button><button class="btn btn-primary" onclick="confirmCard()">Registrar</button></div>
    ${c.det && c.det.codigo && !c.recount ? `<button class="link-btn" onclick="codigoIncorrecto()">¿No es este producto? Código incorrecto en sistema · buscar por nombre</button>` : ''}
  </div>`;
  const q=document.getElementById('qty-input');
  q.value=c.val||''; // background re-renders (sorting loaded, server sync) keep what was typed
  wireQtyInput(q);
  for(const k of Object.keys(c.sep||{})){ const i=document.getElementById('sep-'+k); if(i) wireSepInput(i, k); }
  updSepSum();
  if(hadFocus) q.focus(); else if(/^sep-/.test(focusId||'')){ const i=document.getElementById(focusId); if(i) i.focus(); }
}
// A scanner burst that lands in the quantity field is a new scan, not a quantity.
let _qtyScanT=null;
function wireQtyInput(q){
  q.addEventListener('keydown', e=>{
    if(e.key!=='Enter') return;
    e.preventDefault(); clearTimeout(_qtyScanT);
    if(/^\d{8,}$/.test(q.value.trim())){ const v=q.value; q.value=''; if(S.current) S.current.val=''; processScan(v,'scanner'); return; }
    confirmCard();
  });
  q.addEventListener('input', ()=>{
    if(S.current) S.current.val=q.value;
    document.getElementById('qty-err').textContent=''; updSepSum();
    clearTimeout(_qtyScanT);
    if(/^\d{8,}$/.test(q.value.trim())) _qtyScanT=setTimeout(()=>{ const v=q.value; q.value=''; if(S.current) S.current.val=''; processScan(v,'scanner'); }, SCAN_AUTO_SUBMIT_MS);
  });
}
function wireSepInput(i, k){
  i.value=S.current.sep[k]||'';
  const burst=()=>{ const v=i.value; i.value=''; if(S.current) S.current.sep[k]=''; processScan(v,'scanner'); };
  i.addEventListener('keydown', e=>{
    if(e.key!=='Enter') return;
    e.preventDefault(); clearTimeout(_qtyScanT);
    if(/^\d{8,}$/.test(i.value.trim())) burst(); else confirmCard();
  });
  i.addEventListener('input', ()=>{
    if(S.current) S.current.sep[k]=i.value;
    document.getElementById('qty-err').textContent=''; updSepSum();
    clearTimeout(_qtyScanT);
    if(/^\d{8,}$/.test(i.value.trim())) _qtyScanT=setTimeout(burst, SCAN_AUTO_SUBMIT_MS);
  });
}
// Pz: whole pieces · Kg: up to 2 decimals (§7.4). allowZero for corrections.
function parseQty(raw, kgpz, allowZero=false){
  const s=String(raw||'').trim().replace(',','.');
  if(kgpz==='Kg' ? !/^\d+(\.\d{1,2})?$/.test(s) && !/^\.\d{1,2}$/.test(s) : !/^\d+$/.test(s)) return null;
  const n=round2(Number(s));
  return (n>0 || (allowZero && n===0)) ? n : null;
}
function pickUnit(u){ if(!S.current) return; S.current.p.kgpz=u; renderCard(); const q=document.getElementById('qty-input'); if(q) q.focus(); }
// §7.6 scale tolerance: ±5% of enviado or ±0.10 kg, whichever is larger
function kgTol(esperado){ return Math.max(0.05*esperado, 0.10); }
function overEnviado(line, total){ return line.kgpz==='Kg' ? total > round2(line.esperado+kgTol(line.esperado)) : total > line.esperado; }
function clearQty(c){ const q=document.getElementById('qty-input'); if(q){ q.value=''; c.val=''; } }
// "¿Seguro que son 40 pz?" — Corregir (the safe answer) is the primary button and clears the field
async function typoOk(c, qty){
  const p=c.p, u=unitOf(p.kgpz);
  const v=await showModal({ title:`¿Seguro que son ${fmtQty(qty,p.kgpz)} ${u}?`,
    html:`<p>Es mucho más de lo normal para este producto. Revisa que no le sobre un número (por ejemplo 40 en vez de 4).</p>`,
    buttons:[{label:'Corregir', value:'no', kind:'primary'}, {label:`Sí, son ${fmtQty(qty,p.kgpz)} ${u}`, value:'yes', kind:'secondary'}] });
  if(v!=='yes'){ clearQty(c); return false; }
  c.typoOk=qty; return true;
}
// §7.2-qty + §7.4 — blocking only to stop a wrong number; the enviado number is never shown (still blind).
async function guardQty(c, qty){
  const p=c.p, line=p.enEnvio ? S.lines.get(p.sku_key) : null, kg=p.kgpz==='Kg', u=unitOf(p.kgpz);
  const total = c.recount ? qty : round2(recibidoDe(p.sku_key)+qty);
  if(line){
    // Typo guard first (40 instead of 4, 120 instead of 12): the most likely cause of a big number
    // The fixed limits (50 kg / 200 pz) only count when the number is also well above what was sent: the real
    // Carnes file has a 65.11 kg line, and a correct 63.81 kg weighing must not be questioned.
    const e=line.esperado, big = qty>3*e || (qty>(kg?50:200) && qty>1.5*e);
    if(big && c.typoOk!==qty && !(await typoOk(c, qty))) return false;
    if(overEnviado(line, total)){
      if(!c.overWarned){
        c.overWarned=true;
        await showModal({ title:'Esta cantidad es mayor a lo enviado. Vuelve a contar.',
          html:`<p>Cuenta otra vez ${kg?'(pésalo de nuevo)':'pieza por pieza'} y escribe la cantidad.</p>`,
          buttons:[{label:'Volver a contar', value:'again', kind:'primary'}] });
        clearQty(c);
        return false;
      }
      c.det.sobrante=true; // counted twice and still above: stored and flagged Sobrante for the summary
    }
    // §7.2-qty: sibling in the envío and more than one piece
    if(!kg && qty>1 && siblingsOf(p).length && c.sibOk!==qty){
      // Name the presentation when it's what differs; the whole name when the siblings share it (flavors)
      const pres=presentacion(p.producto), sameSize=!pres || siblingsOf(p).some(s=>{ const q=presentacion(s.producto); return q && normName(q.t)===normName(pres.t); });
      const v=await showModal({ title:`¿Revisaste pieza por pieza que las ${qty} son ${sameSize?p.producto:pres.t}?`,
        html:`<p>En este envío también viene ${siblingsOf(p).map(s=>'<b>'+escapeHtml(s.producto)+'</b>').join(', ')}.</p>`,
        buttons:[{label:'Sí, todas', value:'yes', kind:'primary'}, {label:'Voy a revisar', value:'no', kind:'secondary'}] });
      if(v!=='yes') return false;
      c.sibOk=qty; c.det.hermano_revisado=true;
    }
  } else {
    const big = kg ? qty>50 : qty>200;
    if(big && c.typoOk!==qty && !(await typoOk(c, qty))) return false;
  }
  return true;
}
async function confirmCard(){
  const c=S.current; if(!c || c.busy) return;
  const q=document.getElementById('qty-input'), err=document.getElementById('qty-err');
  if(!c.p.kgpz){ err.textContent='Elige si se recibe por pieza o por peso.'; return; }
  const qty=parseQty(q.value, c.p.kgpz, c.recount);
  if(qty==null){
    err.textContent=c.p.kgpz==='Kg' ? 'Escribe el peso de la báscula (hasta 2 decimales).' : 'Escribe las piezas contadas (número entero).';
    q.focus(); return;
  }
  const sp={};
  for(const k of Object.keys(c.sep||{})){
    sp[k]=parseQty(c.sep[k], c.p.kgpz);
    if(sp[k]==null){ err.textContent=`Escribe cuántas son de «${SEP_LABEL[k]}», o quita ese botón.`; document.getElementById('sep-'+k).focus(); return; }
  }
  const sepN=round2((sp.fc||0)+(sp.dan||0));
  if(sepN>qty){ err.textContent='Las separadas no pueden ser más que el total. En Total van todas las que llegaron, también las separadas.'; q.focus(); return; }
  c.busy=true;
  const ok=await guardQty(c, qty);
  c.busy=false;
  if(S.current!==c) return;
  if(!ok){ const q2=document.getElementById('qty-input'); if(q2){ q2.focus(); q2.select(); } return; }
  const p=c.p;
  if(c.recount){
    const before=recibidoDe(p.sku_key);
    recordEvent(makeEvent('ajuste', { sku_key:p.sku_key, producto:p.producto, cantidad:round2(qty-before), metodo:'recuento',
      detalle:Object.assign({ antes:before, despues:qty, motivo:'Recuento', kgpz:p.kgpz }, c.det) }));
    toast(`✓ Recontado: ${fmtQty(qty,p.kgpz)} ${unitOf(p.kgpz)} · ${p.producto}`);
  } else {
    const cad=caducidadMin(p);
    recordEvent(makeEvent('scan', { sku_key:p.sku_key, producto:p.producto, cantidad:qty, metodo:c.metodo,
      detalle:Object.assign({ esperado:p.enEnvio, kgpz:p.kgpz }, cad?{ caducidad_min:cad }:{}, c.det, sp.fc?{ fecha_corta:true, fecha_corta_pz:sp.fc }:{}, sp.dan?{ danadas:sp.dan }:{}) }));
    toast(`✓ ${fmtQty(qty,p.kgpz)} ${unitOf(p.kgpz)} · ${p.producto}${sepN?` · separar ${fmtQty(sepN,p.kgpz)} para MNA`:''}`);
  }
  S.current=null;
  renderRecibir();
  focusScan();
  if(c.after) c.after();
}

/* ── Últimos 10 escaneos + Corregir (ajuste event, never a delete — rule 4) ── */
const MOTIVOS=['Conté mal','Escaneé el producto equivocado','Lo registré dos veces','Otro'];
function scanQtyNow(ev){ return round2((Number(ev.cantidad)||0)+(S.adjByRef.get(ev.detalle&&ev.detalle.uid)||0)); }
function kgpzOf(ev){ const l=S.lines.get(ev.sku_key); return l ? l.kgpz : ((ev.detalle&&ev.detalle.kgpz)||'Pz'); }
function renderRecent(){
  const el=document.getElementById('recent-list');
  const all=S.events.filter(e=>e.tipo==='scan');
  // Last 10 by default; "Ver todos" lets an older scan be corrected without waiting for the summary
  const scans=(S.recentAll?all:all.slice(-10)).reverse();
  if(!scans.length){ el.innerHTML='<div class="muted" style="font-size:13px">Todavía no hay escaneos.</div>'; return; }
  const more=all.length>10 ? `<button class="link-btn" onclick="S.recentAll=!S.recentAll;renderRecent()">${S.recentAll?'Ver solo los últimos 10':`Ver todos los escaneos (${all.length})`}</button>` : '';
  el.innerHTML=scans.map(ev=>{
    const u=ev.detalle&&ev.detalle.uid, kp=kgpzOf(ev), now=scanQtyNow(ev), orig=round2(ev.cantidad), line=S.lines.get(ev.sku_key);
    const meta=[localHM(new Date(ev.ts)), ev.receptor!==S.receptor?escapeHtml(ev.receptor):'', ev.metodo==='manual'?'sin código':ev.metodo==='codigo_incorrecto'?'<span style="color:var(--orange);font-weight:700">código incorrecto</span>':ev.metodo==='camara'?'cámara':'', line?'':'<span style="color:var(--c-ink);font-weight:700">no esperado</span>', sepMeta(ev, kp)].filter(Boolean).join(' · ');
    const editing=S.corrigiendo===u, sepEdit=S.separando===u;
    return `<div class="ritem"><div class="ritem-row">
        ${line?imgTag(line.barcode, line.producto, 'thumb'):imgTag(ev.sku_key.startsWith('name:')?'':ev.sku_key, ev.producto, 'thumb')}
        <div class="ritem-main"><div class="ritem-name">${nameHtml(line?line.producto:ev.producto)}</div><div class="ritem-meta">${meta}</div></div>
        <div><div class="ritem-qty">${now!==orig?`<s>${fmtQty(orig,kp)}</s>`:''}${fmtQty(now,kp)} <small>${unitOf(kp)}</small></div>
          ${editing||sepEdit?'':enEntregaCerrada(ev)?`<div class="ritem-meta">entrega ${entregaDe(ev)} cerrada</div>`:`<button class="corr-btn" onclick="startCorregir('${escapeHtml(u)}')">Corregir</button>${now>0?` <button class="corr-btn" onclick="startSeparar('${escapeHtml(u)}')">Separar</button>`:''}`}</div>
      </div>${editing?corrBoxHtml(ev, kp, now):sepEdit?sepBoxHtml(ev, kp, now):''}</div>`;
  }).join('')+more;
}
function sepMeta(ev, kp){
  const s=separadasDe(ev), t=[s.fc>0?`${fmtQty(s.fc,kp)} fecha corta`:'', s.dan>0?`${fmtQty(s.dan,kp)} dañadas`:''].filter(Boolean).join(' · ');
  return t?`<span style="color:var(--orange);font-weight:700">${t}</span>`:'';
}
// Separar: damage or a short date found after the scan. The total doesn't change: cantidad 0 ajuste (rule 4)
function sepBoxHtml(ev, kp, now){
  const s=separadasDe(ev), im=kp==='Kg'?'decimal':'numeric', v=n=>n>0?fmtQty(n,kp):'';
  return `<div class="corr-box">
    <label class="qty-label">De las ${fmtQty(now,kp)} ${unitOf(kp)} de este escaneo, ¿cuántas se separan para MNA? El total recibido no cambia.</label>
    ${ev.detalle.caducidad_min?`<div class="sep-row"><label for="sepe-fc">Fecha corta</label><input id="sepe-fc" class="text-input" type="text" inputmode="${im}" autocomplete="off" value="${v(s.fc)}" placeholder="0"></div>`:''}
    <div class="sep-row"><label for="sepe-dan">Dañadas</label><input id="sepe-dan" class="text-input" type="text" inputmode="${im}" autocomplete="off" value="${v(s.dan)}" placeholder="0"></div>
    <div class="qty-err" id="sepe-err"></div>
    <div class="pcard-actions"><button class="btn btn-secondary" onclick="cancelSeparar()">Cancelar</button><button class="btn btn-primary" onclick="saveSeparar()">Guardar</button></div>
  </div>`;
}
function startSeparar(u){
  if(S.current) cancelCard();
  S.corrigiendo=null; S.separando=u; renderRecent();
  const i=document.getElementById('sepe-dan'); if(i) setTimeout(()=>i.focus(),40);
}
function cancelSeparar(){ S.separando=null; renderRecent(); focusScan(); }
function saveSeparar(){
  if(S.closedInfo){ toast('Esta recepción ya se cerró'); cancelSeparar(); return; }
  const ev=S.events.find(e=>e.tipo==='scan' && e.detalle && e.detalle.uid===S.separando); if(!ev) return;
  if(enEntregaCerrada(ev)){ toast('Esa entrega ya se cerró', 4000); cancelSeparar(); return; }
  const kp=kgpzOf(ev), now=scanQtyNow(ev), cur=separadasDe(ev), err=document.getElementById('sepe-err');
  const read=id=>{ const i=document.getElementById(id); return !i || !i.value.trim() ? 0 : parseQty(i.value, kp, true); };
  const fc=read('sepe-fc'), dan=read('sepe-dan');
  if(fc==null || dan==null){ err.textContent=kp==='Kg'?'Escribe el peso (hasta 2 decimales).':'Escribe piezas enteras.'; return; }
  if(round2(fc+dan)>now){ err.textContent=`Las separadas no pueden ser más que las ${fmtQty(now,kp)} ${unitOf(kp)} de este escaneo.`; return; }
  if(fc===cur.fc && dan===cur.dan){ err.textContent='Es lo mismo que ya tenía.'; return; }
  recordEvent(makeEvent('ajuste', { sku_key:ev.sku_key, producto:ev.producto, cantidad:0, metodo:ev.metodo,
    detalle:{ ref:ev.detalle.uid, separar:{ fecha_corta:fc, danadas:dan }, motivo:'Separadas', kgpz:kp } }));
  S.separando=null; renderRecibir();
  toast(`✓ Separar ${fmtQty(round2(fc+dan),kp)} ${unitOf(kp)} para MNA · el total no cambió`);
  focusScan();
}
function corrBoxHtml(ev, kp, now){
  return `<div class="corr-box">
    <label class="qty-label">Cantidad correcta de este escaneo (${unitOf(kp)}) — registraste ${fmtQty(now,kp)}</label>
    <input id="corr-qty" class="text-input" type="text" inputmode="${kp==='Kg'?'decimal':'numeric'}" autocomplete="off" placeholder="${kp==='Kg'?'0.00':'0'}">
    <select id="corr-motivo"><option value="">Motivo…</option>${MOTIVOS.map(m=>`<option>${m}</option>`).join('')}</select>
    <div class="qty-err" id="corr-err"></div>
    <div class="pcard-actions"><button class="btn btn-secondary" onclick="cancelCorregir()">Cancelar</button><button class="btn btn-primary" onclick="saveCorregir()">Guardar corrección</button></div>
  </div>`;
}
function startCorregir(u){
  if(S.current) cancelCard();
  S.separando=null; S.corrigiendo=u; renderRecent();
  const i=document.getElementById('corr-qty'); if(i) setTimeout(()=>i.focus(),40);
}
function cancelCorregir(){ S.corrigiendo=null; renderRecent(); focusScan(); }
function saveCorregir(){
  if(S.closedInfo){ toast('Esta recepción ya se cerró'); cancelCorregir(); return; }
  const ev=S.events.find(e=>e.tipo==='scan' && e.detalle && e.detalle.uid===S.corrigiendo); if(!ev) return;
  if(enEntregaCerrada(ev)){ toast('Esa entrega ya se cerró: recuenta el producto en «Revisar y cerrar»', 4000); cancelCorregir(); return; }
  const kp=kgpzOf(ev), before=scanQtyNow(ev), err=document.getElementById('corr-err');
  const nv=parseQty(document.getElementById('corr-qty').value, kp, true), motivo=document.getElementById('corr-motivo').value;
  if(nv==null){ err.textContent=kp==='Kg'?'Escribe el peso correcto (hasta 2 decimales, 0 si no era).':'Escribe las piezas correctas (0 si no era este producto).'; return; }
  if(nv===before){ err.textContent='Es la misma cantidad que ya tenía.'; return; }
  if(!motivo){ err.textContent='Elige el motivo.'; return; }
  recordEvent(makeEvent('ajuste', { sku_key:ev.sku_key, producto:ev.producto, cantidad:round2(nv-before), metodo:ev.metodo,
    detalle:{ ref:ev.detalle.uid, antes:before, despues:nv, motivo, kgpz:kp } }));
  S.corrigiendo=null; renderRecibir();
  toast(`✓ Corregido: ${fmtQty(before,kp)} → ${fmtQty(nv,kp)} ${unitOf(kp)}`);
  focusScan();
}

/* ── Sheets: Sin código (§7.3) and Pendientes (§6.3) ── */
function openSheet(title, html){
  document.getElementById('sheet-title').textContent=title;
  document.getElementById('sheet-body').innerHTML=html;
  document.getElementById('sheet').classList.add('open');
}
function closeSheet(){
  const s=document.getElementById('sheet'); if(!s.classList.contains('open')) return;
  s.classList.remove('open'); document.getElementById('sheet-body').innerHTML=''; S.codigoMal=null; focusScan();
}
function openSinCodigo(mal){
  S.codigoMal=mal||null;
  openSheet(mal?'Código incorrecto en sistema':'Buscar producto sin código', (mal?`<div class="note" style="margin-bottom:10px">El código <b>${escapeHtml(mal.codigo)}</b>${mal.sistema?` aparece en el sistema como <b>${escapeHtml(mal.sistema.producto)}</b>`:' no está en el sistema'}. Busca por nombre el producto que tienes en la mano: se cuenta como ese y el código se reporta a comercial.</div>`:'')+`<input id="sc-input" class="text-input" placeholder="Escribe parte del nombre (ej. almen 100)" autocomplete="off" autocorrect="off" spellcheck="false">
    <div id="sc-results" style="margin-top:10px"><div class="muted">Los productos del envío aparecen primero.</div></div>`);
  const i=document.getElementById('sc-input');
  let t=null; i.addEventListener('input', ()=>{ clearTimeout(t); t=setTimeout(()=>renderSearch(i.value), 120); });
  setTimeout(()=>i.focus(), 60);
}
let _searchHits=[];
function searchProducts(q){
  const words=normName(q).split(' ').filter(Boolean); if(!words.length) return [];
  const hit=n=>words.every(w=>n.includes(w));
  const inEnv=[], rest=[];
  for(const l of S.lines.values()) if(hit(l._n)) inEnv.push(l);
  for(const c of S.catalog.values()) if(hit(c._n) && !S.lines.has('name:'+c._n)) rest.push(c);
  const byName=(a,b)=>a._n.localeCompare(b._n);
  inEnv.sort(byName); rest.sort(byName);
  return inEnv.map(l=>({ p:l, env:true })).concat(rest.slice(0, Math.max(10, 40-inEnv.length)).map(c=>({ p:c, env:false })));
}
function renderSearch(q){
  const el=document.getElementById('sc-results'); if(!el) return;
  _searchHits=searchProducts(q);
  if(!String(q).trim()){ el.innerHTML='<div class="muted">Los productos del envío aparecen primero.</div>'; return; }
  if(!_searchHits.length){ el.innerHTML='<div class="muted">Sin resultados. Prueba con menos letras o otra palabra.</div>'; return; }
  // Still blind: never a quantity here
  el.innerHTML=_searchHits.map((h,i)=>{
    const pos=positionOf(h.p.barcode, h.p.producto);
    return `<button class="res-item ${h.env?'':'grey'}" onclick="pickSearch(${i})">${imgTag(h.p.barcode, h.p.producto, 'thumb')}
      <div style="flex:1;min-width:0"><div class="res-name">${nameHtml(h.p.producto)}</div>
      <div class="res-sub">${h.env?'<span class="tag green">viene en el envío</span> ':'no viene en el envío · '}${h.p.kgpz==='Kg'?'Kg':'Pz'}${pos?' · '+escapeHtml(pos.full):''}</div></div></button>`;
  }).join('');
}
async function pickSearch(i){
  const h=_searchHits[i]; if(!h) return;
  const mal=S.codigoMal;
  closeSheet();
  // Wrong barcode in the system: count the product in hand; the scan keeps what was scanned vs what the system has
  const det=(mal && codeKey(mal.codigo)!==codeKey(h.p.barcode||'')) ? { codigo:mal.codigo, codigo_incorrecto:{ escaneado:mal.codigo,
    codigo_sistema:h.p.barcode||'', sistema_dice:mal.sistema?mal.sistema.producto:null, sistema_dice_codigo:mal.sistema?(mal.sistema.barcode||null):null } } : {};
  const m=mal?'codigo_incorrecto':'manual';
  if(h.env) openCard({ ...h.p, enEnvio:true }, m, det);
  else if(S.envio.sinArchivo) openCard(sinArchivoProduct(h.p), m, det);
  else await notInEnvio(h.p, m, det);
}
// §7.3+ "Código incorrecto en sistema": what was scanned doesn't match the product in hand → search by name.
// From the card (the code points to another product) or from the not-in-envío / unknown-code modals.
function codigoIncorrecto(mal){
  if(!mal){ const c=S.current; if(!c || !c.det || !c.det.codigo) return; mal={ codigo:c.det.codigo, sistema:c.p }; S.current=null; renderCard(); }
  openSinCodigo(mal);
}
/* ── §6.2b Revisar ahora: once the file arrives, every check runs over what was scanned without it ── */
function revisarItems(){
  if(!S.envio || S.envio.sinArchivo) return [];
  const pre=new Set(), done=new Set();
  for(const e of S.events){
    if(e.tipo==='scan' && e.detalle && e.detalle.esperado===null) pre.add(e.sku_key);
    if((e.tipo==='confirmacion' && e.detalle && e.detalle.revisar) || (e.tipo==='ajuste' && e.detalle && e.detalle.origen==='revisar')) done.add(e.sku_key);
  }
  const out=[];
  for(const sku of pre){
    if(done.has(sku)) continue;
    const rec=recibidoDe(sku), line=S.lines.get(sku);
    if(!line){ if(rec>0){ const ne=S.noEsperados.get(sku); out.push({ sku, tipo:'no_esperado', producto:ne?ne.producto:sku, kgpz:ne?ne.kgpz:'Pz', barcode:sku.startsWith('name:')?'':sku, rec }); } continue; }
    const base={ sku, producto:line.producto, kgpz:line.kgpz, barcode:line.barcode, rec };
    if(overEnviado(line, rec)) out.push({ ...base, tipo:'sobrante' });
    else if(rec>0 && siblingsOf(line).length) out.push({ ...base, tipo:'hermano', sibs:siblingsOf(line) });
  }
  return out;
}
const REVISAR_TXT={ no_esperado:'No viene en el envío.', sobrante:'Registraste más de lo enviado.' };
function openRevisar(){
  const items=revisarItems();
  if(!items.length){ closeSheet(); toast('✓ Todo revisado'); renderRecibir(); return; }
  openSheet(`Revisar ahora · ${items.length}`, `<div class="muted" style="margin-bottom:10px">Esto se escaneó antes de subir el archivo. Revisa cada uno: recuéntalo o confirma que está bien.</div>`
    +items.map(it=>`<div class="ritem" style="margin-bottom:8px"><div class="ritem-row">${imgTag(it.barcode, it.producto, 'thumb')}
      <div class="ritem-main"><div class="ritem-name">${nameHtml(it.producto)}</div>
      <div class="ritem-meta" style="color:var(--orange);font-weight:700">${it.tipo==='hermano'?'También viene '+escapeHtml(it.sibs.map(s=>s.producto).join(', '))+'. ¿Contaste por separado?':REVISAR_TXT[it.tipo]}</div>
      <div class="ritem-meta">Registraste ${fmtQty(it.rec,it.kgpz)} ${unitOf(it.kgpz)}</div></div></div>
      <div class="pcard-actions"><button class="btn btn-secondary" onclick="openRecount('${escapeHtml(it.sku)}','revisar')">Recontar</button><button class="btn btn-primary" onclick="revisarConfirmo('${escapeHtml(it.sku)}','${it.tipo}')">Confirmo</button></div></div>`).join(''));
}
function revisarConfirmo(sku, tipo){
  const it=revisarItems().find(x=>x.sku===sku); if(!it) return;
  recordEvent(makeEvent('confirmacion', { sku_key:sku, producto:it.producto, cantidad:it.rec, detalle:{ revisar:tipo, recibido:it.rec, kgpz:it.kgpz } }));
  renderRecibir(); openRevisar();
}
function openPendientes(){
  if(S.envio.sinArchivo){ openSheet('Pendientes', '<div class="empty-hint">Los pendientes aparecen cuando subas el archivo del envío.</div>'); return; }
  const pend=[...S.lines.values()].filter(l=>!(recibidoDe(l.sku_key)>0)).map(l=>({ l, pos:positionOf(l.barcode, l.producto) }));
  pend.sort((a,b)=>(a.pos?a.pos.full:'~').localeCompare(b.pos?b.pos.full:'~', 'es', {numeric:true}) || a.l._n.localeCompare(b.l._n));
  // Products only — no quantities (blind), so the receptor hunts for boxes without being told how many.
  openSheet(`Pendientes · ${pend.length}`, pend.length
    ? `<div class="muted" style="margin-bottom:10px">Productos del envío que aún no escaneas.</div>`+pend.map(({l,pos})=>`<div class="res-item" style="cursor:default">
        <div class="res-pos">${pos?escapeHtml(pos.letra):'—'}</div>${imgTag(l.barcode, l.producto, 'thumb')}
        <div style="flex:1;min-width:0"><div class="res-name">${nameHtml(l.producto)}</div><div class="res-sub">${pos?escapeHtml(pos.full)+' · ':''}${l.kgpz==='Kg'?'Kg':'Pz'}${l.barcode?'':' · sin código'}</div></div></div>`).join('')
    : `<div class="empty-hint">Ya escaneaste todos los productos del envío.</div>`);
}

/* ════════════════════════════════════════════════════════════════════════════════════
   RESUMEN Y CIERRE (§6.5, §7.6, §9) — enviado is revealed only here. Every difference is answered one
   by one ("Recontar" / "Confirmo la diferencia"); there is no confirm-all (rule 2).
   ════════════════════════════════════════════════════════════════════════════════════ */
const ESTADO_CLS={ 'Completo':'ok', 'Completo (variación de báscula)':'ok', 'Faltante':'bad', 'No esperado':'bad', 'Parcial':'mid', 'Sobrante':'mid' };
function estadoDe(kgpz, env, rec){
  if(!(rec>0)) return 'Faltante';
  const d=round2(rec-env);
  if(d===0) return 'Completo';
  if(kgpz==='Kg' && Math.abs(d)<=kgTol(env)+1e-9) return 'Completo (variación de báscula)';
  return d<0 ? 'Parcial' : 'Sobrante';
}
function summaryRows(){
  const rows=[];
  for(const l of [...S.lines.values()].sort((a,b)=>a.rowIndex-b.rowIndex)){
    const rec=recibidoDe(l.sku_key);
    rows.push({ sku:l.sku_key, producto:l.producto, barcode:l.barcode, kgpz:l.kgpz, env:l.esperado, rec, dif:round2(rec-l.esperado), estado:estadoDe(l.kgpz, l.esperado, rec), rowIndex:l.rowIndex });
  }
  for(const [sku, ne] of S.noEsperados){
    const rec=recibidoDe(sku);
    if(rec>0) rows.push({ sku, producto:ne.producto, barcode:sku.startsWith('name:')?'':sku, kgpz:ne.kgpz, env:0, rec, dif:rec, estado:'No esperado', rowIndex:1e9 });
  }
  return rows;
}
function isDelta(r){ return ESTADO_CLS[r.estado]!=='ok'; }
// A confirmation counts only while the received amount is the one that was confirmed
function ackOf(sku){ let a=null; for(const e of S.events) if(e.tipo==='confirmacion' && e.sku_key===sku && e.detalle && e.detalle.diferencia) a=e; return a; }
function isAcked(r){ const a=ackOf(r.sku); return !!a && round2(a.detalle.recibido)===r.rec; }
function kgStats(rows){
  const kg=(rows||summaryRows()).filter(r=>r.kgpz==='Kg' && r.env>0 && r.rec>0);
  return { n:kg.length, exact:kg.filter(r=>r.dif===0).length, whole:kg.filter(r=>Number.isInteger(r.rec)).length, rows:kg };
}
function kgSinVariacionConfirmado(){ return S.events.some(e=>e.tipo==='confirmacion' && e.detalle && e.detalle.kg_sin_variacion); }
// §7.6 badges carried by the reception (Recepciones, Admin, report CSV)
function receptionBadges(rows){
  const k=kgStats(rows), out=[];
  if(kgSinVariacionConfirmado()) out.push('Kg sin variación');
  if(k.n>=3 && k.whole>=0.8*k.n) out.push('Kg en números enteros');
  return out;
}
function receptoresDeSesion(){ const s=new Set(); for(const e of S.events) if(e.receptor && (e.tipo==='scan'||e.tipo==='ajuste')) s.add(e.receptor); if(!s.size && S.receptor) s.add(S.receptor); return [...s]; }

function openResumen(){
  if(!S.session) return;
  if(S.closedInfo && S.closedInfo.borrada){ toast('Este envío se borró'); goInicio(); return; }
  if(S.closedInfo){ openRecepcion(S.closedInfo,'inicio'); return; }
  if(S.envio.sinArchivo){ toast('Sube el archivo del envío antes de cerrar la recepción', 3500); return; }
  S.current=null; S.corrigiendo=null; closeSheet();
  S.resumenOrder=new Map(summaryRows().filter(isDelta).sort((a,b)=>(isAcked(a)-isAcked(b)) || Math.abs(b.dif)-Math.abs(a.dif)).map((r,i)=>[r.sku,i]));
  document.getElementById('resumen-title').textContent=`${hubName(S.hub)} · ${areaName(S.area)}`;
  showScreen('screen-resumen'); renderResumen();
  Promise.all([syncServerEvents(), loadArmado()]).then(()=>{ if(screenActive('screen-resumen')) renderResumen(); });
}
function backToRecibir(){ showScreen('screen-recibir'); renderRecibir(); focusScan(); }
function sumRowHtml(r, inner, org){
  const pos=positionOf(r.barcode, r.producto), u=unitOf(r.kgpz), sign=r.dif>0?'+':'';
  return `<div class="ritem-row">${imgTag(r.barcode, r.producto, 'thumb')}<div class="ritem-main"><div class="ritem-name">${nameHtml(r.producto)}</div>
      <div class="ritem-meta">${pos?escapeHtml(pos.full)+' · ':''}${r.kgpz}${r.barcode?'':' · sin código'}</div></div>
      <span class="estado ${ESTADO_CLS[r.estado]}">${escapeHtml(r.estado)}</span></div>
    ${(()=>{ const a=armadoDe(r), oo=org&&org.get(r.sku), o=oo&&oo.cat!=='sin_armado'?origenTexto(oo):''; const fc=fechaCortaDe(r.sku), dn=danadasDe(r.sku), sp=separarDe(r.sku); return (a!=null?`<div class="ritem-meta" style="margin-top:4px">Armado en CH: <b>${fmtQty(a,r.kgpz)}</b> ${u}</div>`:'')+(o?`<div class="ritem-meta" style="color:var(--c-ink);font-weight:700">${escapeHtml(o)}</div>`:'')+(fc>0?`<div class="ritem-meta" style="color:var(--orange);font-weight:700">${fmtQty(fc,r.kgpz)} ${u} con fecha corta (caducidad antes del ${dmy(caducidadDe(r.sku))}): separar para MNA</div>`:'')
      +(dn>0?`<div class="ritem-meta" style="color:var(--orange);font-weight:700">${fmtQty(dn,r.kgpz)} ${u} dañadas: separar para MNA</div>`:'')
      // 4 + 1 dañada when 5 arrived: the total was typed without the separated pieces
      +(isDelta(r) && r.dif<0 && sp>0 && round2(r.rec+sp)>=r.env?`<div class="ritem-meta" style="color:var(--c-ink);font-weight:700">¿Las separadas están en el total? Si no, usa Recontar y escribe todas las que llegaron.</div>`:''); })()}
    <div class="sum-nums"><div><b>${r.env?fmtQty(r.env,r.kgpz):'—'}</b><span>Enviado (${u})</span></div><div class="big"><b>${fmtQty(r.rec,r.kgpz)}</b><span>Recibido (${u})</span></div>
      <div><b style="color:${r.dif?'var(--c-ink)':'inherit'}">${sign}${fmtQty(r.dif,r.kgpz)}</b><span>Diferencia</span></div></div>${inner||''}`;
}
function renderResumen(){
  const el=document.getElementById('resumen-body');
  const rows=summaryRows(), deltas=rows.filter(isDelta), oks=rows.filter(r=>!isDelta(r));
  const pend=deltas.filter(r=>!isAcked(r)), rev=revisarItems(), org=origenesResumen(rows);
  // Order is fixed when the summary opens (unanswered first, biggest gaps first) and does NOT move as rows are
  // answered — otherwise the next row slides under the thumb and tapping one spot confirms everything (rule 2).
  const ord=r=>S.resumenOrder.has(r.sku) ? S.resumenOrder.get(r.sku) : 1e6;
  deltas.sort((a,b)=>ord(a)-ord(b) || Math.abs(b.dif)-Math.abs(a.dif));
  let h=`<h2>Resumen y cierre</h2><div class="stat-grid">
    <div class="stat"><div class="stat-n">${S.lines.size}</div><div class="stat-l">productos en el envío</div></div>
    <div class="stat"><div class="stat-n">${oks.length}</div><div class="stat-l">completos</div></div>
    <div class="stat"><div class="stat-n">${deltas.length}</div><div class="stat-l">con diferencia</div></div>
    <div class="stat"><div class="stat-n" style="color:${pend.length?'var(--orange)':'var(--green-dark)'}">${pend.length}</div><div class="stat-l">por confirmar</div></div></div>`;
  if(OUTBOX.length) h+=`<div class="warn-box">Hay ${OUTBOX.length} registro(s) sin subir. Conéctate a internet para poder cerrar.</div>`;
  const seps=rows.filter(r=>separarDe(r.sku)>0); // complete lines sit in the collapsed list, so name them here
  if(seps.length) h+=`<div class="warn-box"><b>Separar para merma (MNA) · ${seps.length}</b><br>Fecha corta y dañadas ya están en el total recibido y no cuentan como faltante. Después de registrar la recepción, regístralas como merma y sepáralas.
    ${seps.map(r=>{ const u=unitOf(r.kgpz), f=fechaCortaDe(r.sku), d=danadasDe(r.sku); return `<div style="margin-top:4px">${escapeHtml(r.producto)}: ${[f>0?`<b>${fmtQty(f,r.kgpz)} ${u}</b> fecha corta`:'', d>0?`<b>${fmtQty(d,r.kgpz)} ${u}</b> dañadas`:''].filter(Boolean).join(' · ')}</div>`; }).join('')}</div>`;
  if(rev.length) h+=`<button class="btn btn-warn btn-block" style="margin-bottom:10px" onclick="backToRecibir();openRevisar()">Revisar ahora · ${rev.length}</button>`;
  if(deltas.length){
    h+=`<div class="section-title">Diferencias · ${deltas.length}</div><div class="muted" style="margin-bottom:8px">Contesta cada una: recuenta el producto o confirma la diferencia.</div>`;
    h+=deltas.map(r=>{ const ok=isAcked(r), a=ackOf(r.sku);
      return `<div class="sum-row ${ok?'acked':'delta'}">${sumRowHtml(r, ok
        ? `<div class="ritem-meta" style="margin-top:6px;color:var(--green-dark);font-weight:700">✓ Diferencia confirmada por ${escapeHtml(a.receptor||'')} · <button class="corr-btn" onclick="resumenRecontar('${escapeHtml(r.sku)}')">Recontar</button></div>`
        : `<div class="pcard-actions" style="grid-template-columns:1fr 1fr"><button class="btn btn-secondary" onclick="resumenRecontar('${escapeHtml(r.sku)}')">Recontar</button><button class="btn btn-warn" onclick="resumenConfirmo('${escapeHtml(r.sku)}')">Confirmo la diferencia</button></div>`, org)}</div>`; }).join('');
  } else h+=`<div class="warn-box ok">Todo llegó completo.</div>`;
  if(oks.length) h+=`<details style="margin-top:14px"><summary class="section-title" style="cursor:pointer">Completos · ${oks.length}</summary>${oks.map(r=>`<div class="sum-row">${sumRowHtml(r)}</div>`).join('')}</details>`;
  const can=!pend.length && !OUTBOX.length && !S.closing;
  h+=`<button class="btn btn-primary btn-block" style="margin-top:18px" ${can?'':'disabled'} onclick="cerrarRecepcion()">${S.closing?'Cerrando…':pend.length?`Faltan ${pend.length} diferencia(s) por contestar`:OUTBOX.length?'Subiendo registros…':'Cerrar recepción'}</button>`;
  el.innerHTML=h;
}
function resumenRecontar(sku){ openRecount(sku, 'resumen', openResumen); }
function resumenConfirmo(sku){
  const r=summaryRows().find(x=>x.sku===sku); if(!r) return;
  recordEvent(makeEvent('confirmacion', { sku_key:sku, producto:r.producto, cantidad:r.rec,
    detalle:{ diferencia:true, estado:r.estado, recibido:r.rec, enviado:r.env, kgpz:r.kgpz } }));
  renderResumen();
}
// §7.6 "Volver a pesar": the Kg lines, each with Recontar
function openRepesar(kgRows){
  openSheet('Volver a pesar', `<div class="muted" style="margin-bottom:10px">Pesa cada artículo en la báscula y escribe el peso que marca.</div>`
    +kgRows.map(r=>`<div class="ritem" style="margin-bottom:8px"><div class="ritem-row">${imgTag(r.barcode, r.producto, 'thumb')}<div class="ritem-main"><div class="ritem-name">${nameHtml(r.producto)}</div></div>
      <button class="corr-btn" onclick="resumenRecontar('${escapeHtml(r.sku)}')">Pesar</button></div></div>`).join(''));
}
async function flushAndWait(){ for(let i=0;i<100 && _flushing;i++) await new Promise(r=>setTimeout(r,100)); await flushOutbox(); }
function fileSafe(s){ return normName(s).replace(/ /g,'-') || 'receptor'; }
async function cerrarRecepcion(){
  if(S.closing) return;
  let rows=summaryRows();
  if(rows.filter(isDelta).some(r=>!isAcked(r))) return;
  // §7.6 zero-variance check: ≥3 Kg lines and ≥80% match enviado exactly
  const k=kgStats(rows);
  if(k.n>=3 && k.exact>=0.8*k.n && !kgSinVariacionConfirmado()){
    const v=await showModal({ title:'¿Se pesaron todos los artículos correctamente?',
      html:'<p>Este recibo se reportará a gerencia sin discrepancias en kg.</p>',
      buttons:[{label:'Sí, los pesé todos', value:'si', kind:'primary'}, {label:'Volver a pesar', value:'pesar', kind:'secondary'}] });
    if(v==='pesar'){ openRepesar(k.rows); return; }
    if(v!=='si') return;
    recordEvent(makeEvent('confirmacion', { detalle:{ kg_sin_variacion:true, kg_lineas:k.n, kg_exactas:k.exact } }));
  }
  S.closing=true; renderResumen();
  try{
    await flushAndWait(); if(OUTBOX.length) throw new TypeError('offline');
    await syncServerEvents(); // scans from other phones
    rows=summaryRows();
    if(rows.filter(isDelta).some(r=>!isAcked(r))){ S.closing=false; renderResumen(); toast('Llegaron escaneos de otro teléfono: revisa las diferencias nuevas', 4000); return; }
    const now=serverNow(), badges=receptionBadges(rows), receptores=receptoresDeSesion();
    const path=`reportes/${S.hub}/${S.area}/${S.session.fecha}_${localHM(now).replace(':','-')}_${fileSafe(S.receptor)}.csv`;
    await sbUpload(path, buildReportCsv(rows, badges, receptores), 'text/csv; charset=utf-8');
    const deltas=rows.filter(isDelta), org=origenesResumen(rows), origenes={};
    for(const o of org.values()) origenes[o.cat]=(origenes[o.cat]||0)+1;
    const ev=makeEvent('cerrar', { detalle:{ reporte:path, envio:S.envio._path, lineas:S.lines.size, recibidas:rows.filter(r=>r.env>0 && r.rec>0).length,
      diferencias:deltas.length, no_esperados:rows.filter(r=>r.estado==='No esperado').length, badges, receptores,
      fecha_corta:rows.filter(r=>fechaCortaDe(r.sku)>0).length||undefined, danadas:rows.filter(r=>danadasDe(r.sku)>0).length||undefined,
      entregas:parciales().length?parciales().length+1:undefined, origenes,
      errores:deltas.map(r=>{ const o=org.get(r.sku), a=armadoDe(r); return { sku_key:r.sku, producto:r.producto, kgpz:r.kgpz, armado:a, enviado:r.env, recibido:r.rec, origen:o.cat, par:o.par||undefined }; }) } });
    recordEvent(ev); S.closedInfo=closedState(); await flushAndWait();
    S.closing=false;
    toast(OUTBOX.length?'Recepción cerrada — se termina de subir al reconectar':'✓ Recepción cerrada', 3500);
    openRecepcion(Object.assign({ ts:ev.ts, fecha:S.session.fecha, hub:S.hub, area:S.area, session_id:S.session.id, receptor:S.receptor }, ev.detalle), 'inicio');
  }catch(e){
    S.closing=false; renderResumen();
    toast(isNetErr(e)?'Sin conexión: no se pudo cerrar. Intenta de nuevo con internet.':'No se pudo cerrar ('+e.message+')', 4500);
  }
}
/* ── Entregas parciales: hubs that get a big shipment (Condesa, Zapopan…) receive it tarima by tarima. Each
   tarima is closed as a 'parcial' event + its own report; the reception stays open and totals keep adding up,
   so a line received 5/9 only has 4 left (the over-enviado guard compares the running total). Scans of a
   closed entrega can't be edited with Corregir; the final Resumen still recounts with an ajuste. ── */
const tsMs=e=>Date.parse(e.ts);
function parciales(){ return S.events.filter(e=>e.tipo==='parcial').sort((a,b)=>tsMs(a)-tsMs(b)); }
// 1-based entrega an event belongs to: one more than the parciales closed before it
function entregaDe(ev, ps=parciales()){ const t=tsMs(ev); return 1+ps.filter(p=>tsMs(p)<t).length; }
function enEntregaCerrada(ev){ const ps=parciales(); return ps.length>0 && entregaDe(ev, ps)<=ps.length; }
// sku → qty per entrega: Map(entrega → Map(sku → qty))
function porEntrega(){
  const ps=parciales(), out=new Map();
  for(const e of S.events){
    if(e.tipo!=='scan' && e.tipo!=='ajuste') continue;
    const n=entregaDe(e, ps); if(!out.has(n)) out.set(n, new Map());
    const m=out.get(n); m.set(e.sku_key, round2((m.get(e.sku_key)||0)+(Number(e.cantidad)||0)));
  }
  return out;
}
function entregaActualRows(){
  const n=parciales().length+1, m=porEntrega().get(n)||new Map(), rows=[];
  for(const [sku, q] of m){
    if(!q) continue;
    const l=S.lines.get(sku), ne=S.noEsperados.get(sku);
    rows.push({ sku, producto:l?l.producto:ne?ne.producto:sku, barcode:l?l.barcode:(sku.startsWith('name:')?'':sku), kgpz:l?l.kgpz:ne?ne.kgpz:'Pz', q, total:recibidoDe(sku), esperado:!!l, corta:sepSum(sku,'fc',n), dan:sepSum(sku,'dan',n) });
  }
  return rows.sort((a,b)=>normName(a.producto).localeCompare(normName(b.producto)));
}
function openParcial(){
  if(!S.session || S.closedInfo) return;
  if(S.envio.sinArchivo){ toast('Sube el archivo del envío antes de cerrar una entrega', 3500); return; }
  S.current=null; S.corrigiendo=null;
  const n=parciales().length+1, rows=entregaActualRows(), total=S.lines.size;
  let got=0; for(const k of S.lines.keys()) if(recibidoDe(k)>0) got++;
  if(!rows.length){ toast(n>1?`Todavía no escaneas nada en la entrega ${n}`:'Todavía no hay escaneos'); return; }
  // Blind: quantities received only, never what was sent
  openSheet(`Entrega parcial ${n}`, `<div class="muted" style="margin-bottom:10px">Lo que escaneaste en esta entrega (tarima). Al cerrarla queda guardada y la recepción sigue abierta para lo que falta, hoy u otro día.</div>
    <div class="stat-grid">
      <div class="stat"><div class="stat-n">${rows.length}</div><div class="stat-l">productos en esta entrega</div></div>
      <div class="stat"><div class="stat-n">${got} / ${total}</div><div class="stat-l">del envío ya recibidos</div></div></div>
    ${OUTBOX.length?`<div class="warn-box">Hay ${OUTBOX.length} registro(s) sin subir. Conéctate a internet para poder cerrar la entrega.</div>`:''}
    ${rows.map(r=>`<div class="ritem"><div class="ritem-row">${imgTag(r.barcode, r.producto, 'thumb')}<div class="ritem-main"><div class="ritem-name">${nameHtml(r.producto)}</div>
      <div class="ritem-meta">${r.esperado?'':'<span style="color:var(--c-ink);font-weight:700">no esperado</span>'}${r.corta?`<span style="color:var(--orange);font-weight:700">${r.esperado?'':' · '}${fmtQty(r.corta,r.kgpz)} con fecha corta</span>`:''}${r.dan?`<span style="color:var(--orange);font-weight:700">${r.esperado&&!r.corta?'':' · '}${fmtQty(r.dan,r.kgpz)} dañadas</span>`:''}</div></div>
      <div class="ritem-qty">${fmtQty(r.q,r.kgpz)} <small>${unitOf(r.kgpz)}</small></div></div></div>`).join('')}
    <button class="btn btn-primary btn-block" id="parcial-btn" style="margin-top:16px" onclick="cerrarParcial()">Cerrar entrega parcial ${n}</button>
    <div class="muted" style="margin-top:8px;text-align:center">Cuando llegue lo demás, entra de nuevo y toca «Continuar recepción». Al terminar todo, usa «Terminé todo: revisar y cerrar».</div>`);
}
const PARCIAL_COLS=['Hub','Área','Fecha','Entrega','Fecha de entrega','Receptor(es)','Producto','Código de barras','Kg/Pz','Posición','Recibido','Recibido acumulado','Fecha corta','Caducidad mínima','Dañadas'];
function buildParcialCsv(n, hoy, rows, receptores){
  const head=PARCIAL_COLS.map(csvCell).join(',');
  const body=rows.map(r=>{ const pos=positionOf(r.barcode, r.producto);
    return [hubName(S.hub), areaName(S.area), S.session.fecha, n, hoy, receptores.join(', '), r.producto, r.barcode, r.kgpz, pos?pos.full:'',
      fmtQty(r.q,r.kgpz), fmtQty(r.total,r.kgpz), r.corta?fmtQty(r.corta,r.kgpz):'', caducidadDe(r.sku)?dmy(caducidadDe(r.sku)):'', r.dan?fmtQty(r.dan,r.kgpz):''].map(csvCell).join(','); });
  return [head].concat(body).join('\r\n')+'\r\n';
}
async function cerrarParcial(){
  if(S.closing || S.closedInfo) return;
  S.closing=true;
  const btn=document.getElementById('parcial-btn'); if(btn){ btn.disabled=true; btn.textContent='Cerrando entrega…'; }
  try{
    await flushAndWait(); if(OUTBOX.length) throw new TypeError('offline');
    await syncServerEvents(); // another phone may have scanned or closed this entrega already
    if(S.closedInfo){ S.closing=false; closeSheet(); renderRecibir(); return; }
    const n=parciales().length+1, rows=entregaActualRows();
    if(!rows.length){ S.closing=false; closeSheet(); toast('Otro teléfono ya cerró esta entrega'); renderRecibir(); return; }
    const now=serverNow(), hoy=localDateStr(now), ps=parciales();
    const receptores=[...new Set(S.events.filter(e=>(e.tipo==='scan'||e.tipo==='ajuste') && e.receptor && entregaDe(e, ps)===n).map(e=>e.receptor))];
    if(!receptores.length) receptores.push(S.receptor);
    const path=`reportes/${S.hub}/${S.area}/${S.session.fecha}_parcial-${n}_${hoy}_${localHM(now).replace(':','-')}_${fileSafe(S.receptor)}.csv`;
    await sbUpload(path, buildParcialCsv(n, hoy, rows, receptores), 'text/csv; charset=utf-8');
    let got=0; for(const k of S.lines.keys()) if(recibidoDe(k)>0) got++;
    const ev=makeEvent('parcial', { detalle:{ entrega:n, reporte:path, envio:S.envio._path, fecha_entrega:hoy, productos:rows.length,
      recibidas_total:got, lineas:S.lines.size, receptores } });
    recordEvent(ev); await flushAndWait();
    S.closing=false; closeSheet();
    toast(OUTBOX.length?`Entrega ${n} cerrada — se termina de subir al reconectar`:`✓ Entrega parcial ${n} cerrada`, 3500);
    openRecepcion(Object.assign({ ts:ev.ts, fecha:S.session.fecha, hub:S.hub, area:S.area, session_id:S.session.id, receptor:S.receptor, parcial:true }, ev.detalle), 'inicio');
  }catch(e){
    S.closing=false;
    if(btn){ btn.disabled=false; btn.textContent=`Cerrar entrega parcial ${parciales().length+1}`; }
    toast(isNetErr(e)?'Sin conexión: no se pudo cerrar la entrega. Intenta de nuevo con internet.':'No se pudo cerrar la entrega ('+e.message+')', 4500);
  }
}

/* ── Report CSV (§9): all cells quoted, CRLF; the BOM is added only on browser download ── */
const REPORT_COLS=['Hub','Área','Fecha','Receptor(es)','Producto','Código de barras','Kg/Pz','Posición','Armado','Enviado','Recibido','Diferencia','Estado','Notas (correcciones / confirmaciones)','Alertas','Fecha corta','Caducidad mínima','Origen de la diferencia','Dañadas'];
function csvCell(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }
function notasDe(sku, kgpz, o){
  const n=[];
  for(const e of S.events){
    if(e.sku_key!==sku || !e.detalle) continue;
    const d=e.detalle, u=unitOf(kgpz), sp=e.tipo==='scan'?separadasDe(e):null;
    if(e.tipo==='ajuste' && d.separar) continue; // shows through the scan it edits
    if(e.tipo==='ajuste') n.push(`${d.motivo||'Corrección'}: ${fmtQty(d.antes,kgpz)}→${fmtQty(d.despues,kgpz)} ${u} (${e.receptor||''})`);
    else if(e.tipo==='confirmacion' && d.diferencia) n.push(`Diferencia confirmada con ${fmtQty(d.recibido,kgpz)} ${u} (${e.receptor||''})`);
    else if(e.tipo==='confirmacion' && d.revisar) n.push(`Revisado sin archivo (${e.receptor||''})`);
    else if(e.tipo==='scan' && d.reatribuido_de) n.push(`Escaneado como «${d.reatribuido_de.producto}»`);
    else if(e.tipo==='scan' && d.sobrante) n.push('Se registró arriba de lo enviado tras recontar');
    if(sp && sp.fc>0) n.push(`Fecha corta: ${fmtQty(sp.fc,kgpz)} ${u} con caducidad antes del ${dmy(d.caducidad_min)} (${e.receptor||''})`);
    if(sp && sp.dan>0) n.push(`Dañadas: ${fmtQty(sp.dan,kgpz)} ${u} (${e.receptor||''})`);
    if(e.tipo==='scan' && d.codigo_incorrecto) n.push(`Código incorrecto en sistema: se escaneó ${d.codigo_incorrecto.escaneado}, el sistema tiene ${d.codigo_incorrecto.codigo_sistema||'(sin código)'}`);
  }
  if(o && o.nota) n.push(o.nota);
  return n.join(' · ');
}
function buildReportCsv(rows, badges, receptores){
  // With partial closes, one extra column per entrega (what came in each tarima); they add up to Recibido
  const np=parciales().length, pe=np?porEntrega():null, ent=np?Array.from({length:np+1}, (_,i)=>i+1):[];
  const head=REPORT_COLS.concat(ent.map(n=>'Entrega '+n)).map(csvCell).join(',');
  const org=origenesResumen(rows);
  const body=rows.map(r=>{ const pos=positionOf(r.barcode, r.producto), arm=armadoDe(r), o=org.get(r.sku);
    return [hubName(S.hub), areaName(S.area), S.session.fecha, receptores.join(', '), r.producto, r.barcode, r.kgpz, pos?pos.full:'',
      arm==null?'—':fmtQty(arm,r.kgpz), r.env?fmtQty(r.env,r.kgpz):'0', fmtQty(r.rec,r.kgpz), fmtQty(r.dif,r.kgpz), r.estado, notasDe(r.sku, r.kgpz, o), badges.join(' · '),
      fechaCortaDe(r.sku)>0?fmtQty(fechaCortaDe(r.sku),r.kgpz):'', caducidadDe(r.sku)?dmy(caducidadDe(r.sku)):'', o?ORIGEN[o.cat]:'', danadasDe(r.sku)>0?fmtQty(danadasDe(r.sku),r.kgpz):'']
      .concat(ent.map(n=>fmtQty((pe.get(n)&&pe.get(n).get(r.sku))||0, r.kgpz))).map(csvCell).join(','); });
  return [head].concat(body).join('\r\n')+'\r\n';
}
/* ── §5.3 Armado enrichment (display only). Reads Armado's picks (read-only). Abarrotes is assembled one day and received
   the next morning, and that day's assembly starts before the reception closes, so only orders dated BEFORE the reception
   count, and the one that shipped is the one whose picks cover the most envío lines (real data: 98–100 %, any other ≤15 %).
   Per sku: latest row per ronda, rondas summed (Armado writes one row per confirm, so a re-confirm repeats the sku).
   Abarrotes only — Carnes isn't assembled in Armado yet. S.armado: Map sku→qty, or null = no data ("—"). ── */
const ARMADO_DIAS=10, ARMADO_MIN_COINCIDE=0.8; // Condesa and Zapopan take days; below the share it isn't this shipment
const ARMADO_HUB={ 'test-hub':'MH Contry' }; // local tests borrow MH Contry's assembly
async function loadArmado(){
  S.armado=null; S.armadoFecha=null;
  if(S.area!=='abarrotes' || !S.session) return;
  if(!S.lines.size) return;
  const hub=ARMADO_HUB[S.hub]||hubName(S.hub), hasta=S.session.fecha;
  const desde=localDateStr(new Date(Date.parse(hasta+'T12:00:00Z')-ARMADO_DIAS*86400000));
  try{
    const rows=await pgSelectAll('picks', `hub=eq.${encodeURIComponent(hub)}&order_date=gte.${desde}&order_date=lt.${hasta}&select=id,sku_key,cantidad,ronda,order_date,unidad`);
    const porOrden=new Map();
    for(const r of rows){
      if(!porOrden.has(r.order_date)) porOrden.set(r.order_date, new Map());
      const last=porOrden.get(r.order_date), k=r.sku_key+'|'+r.ronda, p=last.get(k); if(!p || r.id>p.id) last.set(k,r); // `${sku}|${ronda}` → row with the highest id
    }
    let best=null, bestPct=0, bestOd=null;
    for(const [od,last] of porOrden){
      const m=new Map();
      for(const r of last.values()){
        const sku=String(r.sku_key||'').startsWith('norm:') ? 'name:'+String(r.sku_key).slice(5) : codeKey(r.sku_key);
        m.set(sku, round2((m.get(sku)||0)+(Number(r.cantidad)||0)));
      }
      const pct=[...S.lines.keys()].filter(k=>m.get(k)>0).length/S.lines.size;
      if(pct>bestPct){ best=m; bestPct=pct; bestOd=od; }
    }
    if(bestPct<ARMADO_MIN_COINCIDE) return;
    S.armado=best; S.armadoFecha=bestOd;
  }catch(_){ S.armado=null; }
}
function armadoDe(r){ if(!S.armado) return null; return S.armado.get(r.sku) ?? 0; }
/* ── Where a difference comes from (§5.3). The system decides, not the receptor: A = armado en CH, E = enviado
   (what CH captured), R = recibido. A=R≠E → captura en CH · A=E≠R → armado (de más / faltante) · all three
   differ → revisar · no Armado data → only E vs R. Then mix-ups: a short line and an over line of the same
   product family that cancel out exactly (Pepsi Light 600ml −8 / 2.5L +8, Coca light +1 / zero −1, Lala entera /
   deslactosada) are ONE error: armado when A=E on both sides (the picker grabbed the other one), captura when A=R
   on both (picked right, captured the wrong product). ── */
const ORIGEN={
  cruce_armado:'Error de armado: producto cruzado (presentación o variante)',
  sobrante_armado:'Error de armado: llegó de más',
  faltante:'Faltante: armado o traslado',
  cruce_captura:'Error de captura en CH: se capturó otro producto',
  captura:'Error de captura en CH',
  cruce:'Producto cruzado (sin datos de armado)',
  revisar:'Revisar: armado, enviado y recibido no coinciden',
  sin_armado:'Sin datos de armado',
};
const ORIGEN_ORDEN=Object.keys(ORIGEN);
// Looser than isSibling (which wants ≥4 words for a swapped one): an exact +n/−n pair is evidence enough
function mixUpScore(a, b){
  if(isSibling(a, b)) return 100;
  const fa=familyKey(a.producto), fb=familyKey(b.producto);
  if(!fa || fa.split(' ')[0]!==fb.split(' ')[0]) return 0;
  const wa=famWords(a.producto), wb=famWords(b.producto); let shared=0; for(const w of wa) if(wb.has(w)) shared++;
  return shared>=2 && shared>=Math.min(wa.size, wb.size)-1 ? shared : 0;
}
// rows: the deltas, each { sku, producto, kgpz, arm (null = no Armado data), env, rec, dif } → Map sku → { cat, nota, par }
function clasificarDiferencias(rows){
  const eq=(r,x,y)=>Math.abs(x-y)<=(r.kgpz==='Kg'?kgTol(Math.max(r.env, r.rec)):0)+1e-9, out=new Map();
  for(const r of rows){
    const cat = r.arm==null ? 'sin_armado' : eq(r, r.arm, r.rec) ? 'captura' : eq(r, r.arm, r.env) ? (r.rec>r.env?'sobrante_armado':'faltante') : 'revisar';
    out.set(r.sku, { cat, nota:'' });
  }
  const used=new Set();
  for(const n of rows.filter(r=>r.dif<0)){
    let best=null, score=0;
    for(const p of rows){ if(!(p.dif>0) || used.has(p.sku) || p.kgpz!==n.kgpz || !eq(n, -n.dif, p.dif)) continue;
      const s=mixUpScore(n, p); if(s>score){ best=p; score=s; } }
    if(!best) continue;
    const cn=out.get(n.sku).cat, cp=out.get(best.sku).cat;
    const cat = cn==='faltante' && cp==='sobrante_armado' ? 'cruce_armado' : cn==='captura' && cp==='captura' ? 'cruce_captura' : cn==='sin_armado' && cp==='sin_armado' ? 'cruce' : null;
    if(!cat) continue;
    used.add(best.sku);
    const q=`${fmtQty(best.dif,n.kgpz)} ${unitOf(n.kgpz)}`;
    const nota = cat==='cruce_armado' ? `Se armó ${best.producto} en lugar de ${n.producto} (${q})`
      : cat==='cruce_captura' ? `En CH se armó ${best.producto} pero se capturó ${n.producto} (${q})`
      : `Llegó ${best.producto} en lugar de ${n.producto} (${q})`;
    out.set(n.sku, { cat, nota, par:best.sku }); out.set(best.sku, { cat, nota, par:n.sku });
  }
  return out;
}
function origenesResumen(rows){ return clasificarDiferencias(rows.filter(isDelta).map(r=>Object.assign({}, r, { arm:armadoDe(r) }))); }
function origenTexto(o){ return o ? [ORIGEN[o.cat], o.nota].filter(Boolean).join(': ') : ''; }

/* ── Mensaje para Slack: the daily discrepancy post the auxiliares wrote by hand, now in one fixed format so
   mistakes can be tracked by where they come from. Built from the closed report (works for old reports too). ── */
// Two paragraphs in one copy: 1) the items with a difference, one line each with A/E/R and a short cause tag;
// 2) for the CH coordinator, how many errors of each kind and the weakest step. Short: a daily wall gets ignored.
// People tagged at the start of paragraph 2: recibo/config/slack.json { tags:[…] }, edited in Admin → Slack. Use the Slack
// @username (or a first name that's unique in Slack): a pasted "@Alberto Mendoza" tagged @alberto and left "Mendoza" as text.

  catch(_){ if(!SLACK_TAGS) SLACK_TAGS=SLACK_TAGS_DEFAULT; }
  return SLACK_TAGS;
}
const SLACK_CAUSAS=[ // [key, categories, tag on the item line, how paragraph 2 names it, the weakness it points to]
  ['conteo', ['sobrante_armado'], 'conteo al armar', 'conteo al armar', 'no se cuentan bien las piezas al armar'],
  ['presentacion', ['cruce_armado'], 'presentación al armar', 'presentación o variante cruzada al armar', 'no se revisa la presentación o variante al armar'],
  ['captura', ['captura','cruce_captura'], 'captura CH', 'captura al registrar la salida en CH', 'errores de tecleo o de producto al capturar la salida'],
  ['faltante', ['faltante'], 'faltante', 'faltante (armado o traslado)', 'faltan piezas que sí se registraron como armadas: conteo al armar o traslado'],
  ['fecha_corta', [], 'fecha corta', 'fecha corta', 'no se revisa la caducidad al armar'], // counted from r.corta, not from a difference
  ['danadas', [], 'dañadas', 'piezas dañadas (armado o traslado)', 'llegan piezas dañadas: revisar el estado al armar y el empaque'], // counted from r.dan
  ['revisar', ['revisar'], 'revisar', 'sin conclusión (armado, enviado y recibido no coinciden)', null],
  ['sin_armado', ['cruce','sin_armado'], 'sin datos de armado', 'sin datos de armado', null],
];
// The words of b that a doesn't have: "Refresco Pepsi Light 600ml" vs "… 2.5L" → "2.5L"
function nombreDif(a, b){
  const wa=new Set(normName(a).split(' ')), d=String(b).split(/\s+/).filter(w=>w && !wa.has(normName(w)));
  return d.length ? d.join(' ') : b;
}
function slackMensaje(info, rvRows, tags){
  const sign=(d,k)=>(d>0?'+':'')+fmtQty(d,k);
  const rows=rvRows.filter(r=>!/^Completo/.test(r.estado)).map(r=>({ sku:'r'+r.i, producto:r.producto, kgpz:r.kgpz,
    arm:r.armado===''||r.armado==='—'?null:parseNum(r.armado), env:r.env||0, rec:r.rec||0, dif:r.dif||0 }));
  const org=clasificarDiferencias(rows), bySku=new Map(rows.map(r=>[r.sku,r]));
  const nums=r=>`${sign(r.dif,r.kgpz)} ${unitOf(r.kgpz)} · ${r.arm==null?'':`A${fmtQty(r.arm,r.kgpz)} `}E${fmtQty(r.env,r.kgpz)} R${fmtQty(r.rec,r.kgpz)}`;
  const items=[], casos=new Map();
  for(const [key, cats, tag] of SLACK_CAUSAS){
    const done=new Set();
    for(const r of rows){ const o=org.get(r.sku); if(!cats.includes(o.cat) || done.has(r.sku)) continue;
      casos.set(key, (casos.get(key)||0)+1); // a mix-up pair is one error
      if(!o.par){ done.add(r.sku); items.push(`• ${r.producto}: ${nums(r)} → ${tag}`); continue; }
      const p=bySku.get(o.par), [neg,pos]=r.dif<0?[r,p]:[p,r]; done.add(neg.sku); done.add(pos.sku);
      // the note goes on the product that physically arrived wrong (armado) or was captured wrong (captura)
      if(o.cat==='cruce_captura') items.push(`• ${neg.producto}: ${nums(neg)} → ${tag}`, `• ${pos.producto}: ${nums(pos)} → ${tag} (se capturó como ${nombreDif(pos.producto, neg.producto)})`);
      else items.push(`• ${neg.producto}: ${nums(neg)} → ${tag} (llegó ${nombreDif(neg.producto, pos.producto)} en su lugar)`, `• ${pos.producto}: ${nums(pos)} → ${tag}`);
    }
  }
  // Short-dated products can be complete lines too, so they're listed apart from the differences
  const cortas=rvRows.filter(r=>r.corta>0);
  if(cortas.length) casos.set('fecha_corta', cortas.length);
  for(const r of cortas) items.push(`• ${r.producto}: ${fmtQty(r.corta,r.kgpz)} ${unitOf(r.kgpz)}${r.cad?` con caducidad antes del ${r.cad}`:''} → fecha corta, separar para MNA`);
  const danadas=rvRows.filter(r=>r.dan>0);
  if(danadas.length) casos.set('danadas', danadas.length);
  for(const r of danadas) items.push(`• ${r.producto}: ${fmtQty(r.dan,r.kgpz)} ${unitOf(r.kgpz)} → dañadas, separar para MNA`);
  const total=[...casos.values()].reduce((a,b)=>a+b,0), quien=(info.receptores||[info.receptor]).filter(Boolean).join(', ');
  const out=[`*${hubName(info.hub)} · ${areaName(info.area)} · ${fechaLarga(info.fecha)}*: ${rows.length?`${rows.length} producto(s) con diferencia`:'sin diferencias'}${cortas.length?` · ${cortas.length} con fecha corta`:''}${danadas.length?` · ${danadas.length} con dañadas`:''}${quien?' · recibió '+quien:''}`, ...items];
  if(items.some(l=>/ A\d| E\d/.test(l))) out.push('_A armado · E enviado · R recibido_');
  // Paragraph 2: the diagnosis for the CH coordinator
  if(total){
    const partes=SLACK_CAUSAS.filter(c=>casos.get(c[0])).map(c=>`${casos.get(c[0])} de ${c[3]}`);
    const conCausa=SLACK_CAUSAS.filter(c=>c[4] && casos.get(c[0])), max=Math.max(0, ...conCausa.map(c=>casos.get(c[0])));
    const peores=conCausa.filter(c=>casos.get(c[0])===max);
    let d=tags && tags.length ? tags.join(' ')+' ' : `*Para coordinación CH:* `;
    d+=`${total} error(es) de ${info.lineas||rvRows.length} productos: ${partes.join(', ')}. `;
    if(peores.length) d+=`${peores.length>1?'Puntos más débiles':'Punto más débil'}: ${peores.map(c=>c[4]).join('; ')}.`;
    out.push('', d.trim());
  }
  return out.join('\n');
}
