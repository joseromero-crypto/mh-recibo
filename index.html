<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Calii · MH Recibo</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#00c3b3">
<style>
:root{
  --green:#00c3b3; --green-dark:#007a6e; --green-light:#E0F7F5;
  --red:#C62828; --red-light:#FFEBEE;
  --orange:#E65100; --orange-light:#FFF3E0;
  --yellow:#F9A825; --yellow-light:#FFF8E1;
  --gray-50:#FAFAFA; --gray-100:#F5F5F5; --gray-200:#EEEEEE; --gray-300:#E0E0E0; --gray-400:#BDBDBD;
  --gray-500:#9E9E9E; --gray-600:#757575; --gray-700:#616161; --gray-900:#212121;
  --radius:14px; --radius-sm:8px;
  --shadow-sm:0 1px 4px rgba(0,0,0,.10); --shadow-md:0 4px 16px rgba(0,0,0,.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--gray-100);color:var(--gray-900);min-height:100dvh;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
.screen{display:none}
.screen.active{display:block}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 48px}
.hero{background:linear-gradient(150deg,var(--green-dark) 0%,var(--green) 100%);color:white;padding:40px 24px 28px;text-align:center}
.hero-logo{font-size:30px;font-weight:900;letter-spacing:-1px}
.hero-sub{font-size:14px;opacity:.85;margin-top:4px}
.status-line{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--gray-600);margin:10px 0}
.db-dot{width:8px;height:8px;border-radius:50%;background:var(--gray-400);flex-shrink:0}
.db-dot.ok{background:var(--green)} .db-dot.loading{background:var(--yellow)} .db-dot.err{background:var(--red)}
.clock-warn{background:var(--orange-light);border:1px solid var(--orange);border-radius:var(--radius-sm);padding:10px 12px;margin:12px 0;font-size:13px}
.clock-warn-title{font-weight:800;color:var(--orange)}
.clock-warn-sub{margin-top:4px;color:var(--gray-700)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--gray-900);color:white;padding:12px 18px;border-radius:24px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);box-shadow:var(--shadow-md);transition:transform .25s;z-index:100;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.app-ver{text-align:center;font-size:11px;color:var(--gray-400);margin-top:24px}
.muted{color:var(--gray-600);font-size:14px;line-height:1.4}
h2{font-size:20px;font-weight:800;margin:4px 0 8px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:var(--radius-sm);padding:14px 16px;font-size:16px;font-weight:700;cursor:pointer;text-align:center;min-height:48px}
.btn:disabled{opacity:.45;cursor:default}
.btn-block{display:flex;width:100%}
.btn-primary{background:var(--green);color:white}
.btn-primary:active{background:var(--green-dark)}
.btn-secondary{background:white;color:var(--gray-900);border:2px solid var(--gray-300)}
.btn-danger{background:var(--red);color:white}
.btn-warn{background:var(--orange);color:white}
.link-btn{background:none;border:none;color:var(--green-dark);font-size:14px;font-weight:700;text-decoration:underline;cursor:pointer;padding:10px;display:block;margin:4px auto 0}
.stack{display:flex;flex-direction:column;gap:10px}

/* INICIO (§6.1) */
.step{margin-top:18px}
.step-title{font-size:12px;font-weight:800;color:var(--gray-600);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{background:white;border:2px solid transparent;border-radius:var(--radius);padding:14px 12px;font-size:15px;font-weight:700;text-align:left;cursor:pointer;box-shadow:var(--shadow-sm);min-height:52px}
.choice.sel{border-color:var(--green);background:var(--green-light)}
.choice.big{font-size:18px;text-align:center;padding:18px 12px}
.text-input{width:100%;padding:14px;font-size:16px;border:2px solid var(--gray-300);border-radius:var(--radius-sm);outline:none;background:white}
.text-input:focus{border-color:var(--green)}
.note{background:var(--yellow-light);border:1px solid var(--yellow);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;margin-bottom:10px;color:var(--gray-700)}
.info-card{background:white;border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:14px 16px;margin-bottom:12px;font-size:14px;line-height:1.45}
.info-card b{font-weight:800}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:12px;background:var(--gray-200);color:var(--gray-700);vertical-align:middle}
.tag.orange{background:var(--orange-light);color:var(--orange)}
.tag.green{background:var(--green-light);color:var(--green-dark)}
.tag.red{background:var(--red-light);color:var(--red)}

/* Top bar (Subir) */
.topbar{background:white;display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--gray-200);position:sticky;top:0;z-index:5}
.back{background:none;border:none;font-size:15px;font-weight:700;color:var(--green-dark);padding:8px 6px;cursor:pointer;white-space:nowrap}
.topbar-title{font-weight:800;font-size:15px;flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.err-box{background:var(--red-light);border:1px solid var(--red);color:var(--red);border-radius:var(--radius-sm);padding:12px;font-size:14px;margin:12px 0;line-height:1.4}
.warn-box{background:var(--orange-light);border:1px solid var(--orange);border-radius:var(--radius-sm);padding:12px;font-size:14px;margin:12px 0;line-height:1.4}
.warn-box .btn{margin-top:10px}
.warn-box.ok{background:var(--green-light);border-color:var(--green)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.stat{background:var(--gray-50);border-radius:var(--radius-sm);padding:10px}
.stat-n{font-size:22px;font-weight:900}
.stat-l{font-size:12px;color:var(--gray-600)}

/* RECIBIR (§6.3) */
.rec-head{background:white;padding:8px 12px 10px;border-bottom:1px solid var(--gray-200);position:sticky;top:0;z-index:5}
.rec-head-top{display:flex;align-items:center;gap:8px}
.rec-title{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-sub{display:flex;justify-content:space-between;font-size:13px;color:var(--gray-600);margin:4px 2px 6px}
.rec-sub b{color:var(--gray-900)}
.progress{height:6px;background:var(--gray-200);border-radius:3px;overflow:hidden}
.progress>div{height:100%;background:var(--green);width:0;transition:width .3s}
.net-badge{font-size:11px;font-weight:800;padding:4px 8px;border-radius:12px;white-space:nowrap}
.net-badge.ok{background:var(--green-light);color:var(--green-dark)}
.net-badge.pend{background:var(--orange-light);color:var(--orange)}
.net-badge.off{background:var(--red-light);color:var(--red)}
.scan-row{display:flex;gap:8px;margin:4px 0 8px}
.scan-input{flex:1;min-width:0;padding:14px;font-size:16px;border:2px solid var(--gray-300);border-radius:var(--radius-sm);outline:none;background:white}
.scan-input:focus{border-color:var(--green)}
.icon-btn{width:52px;flex-shrink:0;border:2px solid var(--gray-300);background:white;border-radius:var(--radius-sm);font-size:20px;cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.row2 .btn{font-size:15px;padding:12px 8px}
.empty-hint{color:var(--gray-500);font-size:14px;text-align:center;padding:28px 16px}
.section-title{font-size:12px;font-weight:800;color:var(--gray-600);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px}

/* Product card */
.pcard{background:white;border-radius:var(--radius);box-shadow:var(--shadow-md);padding:16px;margin-bottom:12px;border:3px solid var(--green)}
.pcard.noesp{border-color:var(--red)}
.pcard-top{display:flex;gap:12px;align-items:flex-start}
.pcard-img{width:132px;height:132px;object-fit:contain;flex-shrink:0;border-radius:var(--radius-sm);background:var(--gray-50)}
.pcard-noimg{width:132px;height:132px;flex-shrink:0;border-radius:var(--radius-sm);background:var(--gray-100);display:grid;place-items:center;font-size:44px}
.basket{flex:1;text-align:center;min-width:0}
.basket-l{font-size:11px;font-weight:800;color:var(--gray-600);text-transform:uppercase;letter-spacing:.5px}
.basket-letter{font-size:84px;line-height:1;font-weight:900;color:var(--green-dark);word-break:break-all}
.basket-letter.long{font-size:56px}
.basket-pos{font-size:15px;font-weight:700;color:var(--gray-700);margin-top:2px}
.basket-none{font-size:13px;color:var(--gray-500);padding-top:30px}
.pcard-name{font-size:18px;font-weight:800;line-height:1.25;margin:12px 0 6px}
mark{background:var(--yellow-light);color:inherit;padding:0 3px;border-radius:4px;box-shadow:inset 0 -2px 0 var(--yellow)}
.pcard-name mark{font-size:22px;font-weight:900}
.pcard-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pres-chip{font-size:16px;font-weight:900;background:var(--yellow-light);border:2px solid var(--yellow);border-radius:8px;padding:3px 10px}
.unit-chip{font-size:14px;font-weight:800;background:var(--gray-200);border-radius:8px;padding:5px 10px}
.unit-chip.kg{background:#E3F2FD;color:#1565C0}
.banner{border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;font-weight:700;margin-bottom:10px}
.banner.red{background:var(--red-light);color:var(--red)}
.banner.blue{background:#E3F2FD;color:#1565C0;font-size:16px}
.banner.gray{background:var(--gray-100);color:var(--gray-700);font-weight:600}
.banner.yellow{background:var(--yellow-light);border:2px solid var(--yellow);color:var(--gray-900)}
.sib-row{display:flex;gap:8px;align-items:center;margin-top:8px;font-weight:600;font-size:13px}
.sib-row img,.sib-row .thumb-none{width:52px;height:52px;object-fit:contain;flex-shrink:0;border-radius:6px;background:white}
.unit-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.unit-pick .choice{text-align:center}
.look-item{display:flex;gap:10px;align-items:center;background:white;border:2px solid var(--gray-300);border-radius:var(--radius-sm);padding:8px;width:100%;text-align:left;cursor:pointer;margin-top:6px}
.look-item img,.look-item .thumb-none{width:56px;height:56px;object-fit:contain;flex-shrink:0}
.look-cta{font-size:12px;font-weight:800;color:var(--green-dark);white-space:nowrap}
.qty-label{font-size:13px;font-weight:800;color:var(--gray-700);margin-bottom:6px;display:block}
.qty-input{width:100%;font-size:32px;font-weight:900;padding:10px 14px;border:3px solid var(--gray-300);border-radius:var(--radius-sm);outline:none;text-align:center}
.qty-input:focus{border-color:var(--green)}
.qty-err{color:var(--red);font-size:13px;font-weight:700;min-height:18px;margin-top:4px}
.pcard-actions{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:8px}

/* Recent scans */
.rlist{display:flex;flex-direction:column;gap:6px}
.ritem{background:white;border-radius:var(--radius-sm);box-shadow:var(--shadow-sm);padding:8px 10px}
.ritem-row{display:flex;gap:10px;align-items:center}
.thumb{width:44px;height:44px;object-fit:contain;flex-shrink:0;border-radius:6px;background:var(--gray-50)}
.thumb-none{width:44px;height:44px;flex-shrink:0;border-radius:6px;background:var(--gray-100);display:grid;place-items:center;font-size:18px}
.ritem-main{flex:1;min-width:0}
.ritem-name{font-size:13px;font-weight:700;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ritem-meta{font-size:11px;color:var(--gray-500);margin-top:2px}
.ritem-qty{font-size:20px;font-weight:900;text-align:right;white-space:nowrap}
.ritem-qty s{font-size:13px;color:var(--gray-500);font-weight:600;margin-right:4px}
.ritem-qty small{font-size:11px;color:var(--gray-500);font-weight:700}
.corr-btn{background:none;border:1px solid var(--gray-300);border-radius:6px;font-size:12px;font-weight:700;padding:6px 8px;cursor:pointer;color:var(--gray-700)}
.corr-box{border-top:1px solid var(--gray-200);margin-top:8px;padding-top:8px}
.corr-box .text-input{font-size:20px;font-weight:800;text-align:center;padding:10px}
.corr-box select{width:100%;padding:10px;font-size:15px;border:2px solid var(--gray-300);border-radius:var(--radius-sm);background:white;margin-top:6px}

/* Sheets (user-opened full-screen panels — not blocking modals) */
.sheet{display:none;position:fixed;inset:0;background:var(--gray-100);z-index:40;flex-direction:column}
.sheet.open{display:flex}
.sheet-head{background:white;display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--gray-200)}
.sheet-title{flex:1;font-weight:800;font-size:16px}
.sheet-body{flex:1;overflow-y:auto;padding:12px 16px 40px;max-width:480px;width:100%;margin:0 auto}
.res-item{display:flex;gap:10px;align-items:center;background:white;border:none;border-radius:var(--radius-sm);box-shadow:var(--shadow-sm);padding:8px 10px;width:100%;text-align:left;cursor:pointer;margin-bottom:6px}
.res-item.grey{opacity:.55;background:var(--gray-50)}
.res-name{font-size:14px;font-weight:700;line-height:1.25}
.res-sub{font-size:11px;color:var(--gray-500);margin-top:2px}
.res-pos{font-size:22px;font-weight:900;color:var(--green-dark);min-width:44px;text-align:center}

/* Resumen / Recepciones */
.sum-row{background:white;border-radius:var(--radius-sm);box-shadow:var(--shadow-sm);padding:10px;margin-bottom:8px}
.sum-row.delta{border-left:5px solid var(--orange)}
.sum-row.acked{border-left:5px solid var(--green)}
.sum-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;text-align:center}
.sum-nums div{background:var(--gray-50);border-radius:6px;padding:6px 2px}
.sum-nums b{display:block;font-size:20px;font-weight:900}
.sum-nums span{font-size:11px;color:var(--gray-600)}
.sum-nums .big b{font-size:28px;color:var(--green-dark)}
.estado{font-size:11px;font-weight:800;padding:3px 8px;border-radius:12px;white-space:nowrap}
.estado.ok{background:var(--green-light);color:var(--green-dark)}
.estado.bad{background:var(--red-light);color:var(--red)}
.estado.mid{background:var(--orange-light);color:var(--orange)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.filters select{padding:8px;font-size:13px;border:2px solid var(--gray-300);border-radius:var(--radius-sm);background:white}
.chk{width:30px;height:30px;flex-shrink:0;accent-color:var(--green)}
.sum-row.ticked{opacity:.5}
.badge-warn{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:12px;background:#EDE7F6;color:#4527A0;margin:2px 4px 2px 0}

/* Admin */
.tabs{display:flex;gap:6px;overflow-x:auto;margin:4px 0 14px;padding-bottom:4px}
.tabs .choice{flex-shrink:0;min-height:40px;padding:8px 12px;font-size:14px}
.adm-row{background:white;border-radius:var(--radius-sm);box-shadow:var(--shadow-sm);padding:10px 12px;margin-bottom:8px;font-size:14px;line-height:1.4}
.adm-row .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.adm-row .btns .btn{min-height:38px;padding:8px 12px;font-size:13px}
.day-chk{display:inline-flex;align-items:center;gap:3px;font-size:13px;margin-right:8px}
.adm-field{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;flex-wrap:wrap}
.adm-field input[type=time],.adm-field input[type=date],.adm-field input[type=number],.adm-field select{padding:6px 8px;font-size:14px;border:2px solid var(--gray-300);border-radius:6px}
textarea.text-input{min-height:110px;font-size:15px}

/* Modal (only where plan §7.5 / §6.3 / §6.7 allow one) */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
.modal{background:white;border-radius:var(--radius);padding:20px;width:100%;max-width:420px;max-height:90dvh;overflow-y:auto;box-shadow:var(--shadow-md)}
.modal-title{font-size:19px;font-weight:900;margin-bottom:10px;line-height:1.3}
.modal p{font-size:15px;line-height:1.4;margin-bottom:10px;color:var(--gray-700)}
.modal-actions{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.modal-prod{display:flex;gap:12px;align-items:center;background:var(--gray-50);border-radius:var(--radius-sm);padding:10px;margin:8px 0}
.modal-prod img,.modal-prod .thumb-none{width:72px;height:72px;object-fit:contain;flex-shrink:0}

/* Camera (copied from sorting-hub) */
.camera-overlay{display:none;position:fixed;inset:0;background:black;z-index:70;flex-direction:column}
.camera-overlay.open{display:flex}
.camera-overlay video{flex:1;width:100%;height:100%;object-fit:cover;background:black}
.camera-controls{position:absolute;top:16px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;z-index:2}
.camera-btn{width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.55);color:white;border:none;font-size:20px;cursor:pointer}
.camera-hint{position:absolute;bottom:32px;left:0;right:0;text-align:center;color:white;font-size:14px;padding:0 24px;z-index:2}
</style>
</head>
<body>

<!-- ═══════════ INICIO (§6.1) ═══════════ -->
<div class="screen active" id="screen-inicio">
  <div class="hero"><div class="hero-logo">MH Recibo</div><div class="hero-sub">Recepción de envíos de CH Guadalupe</div></div>
  <div class="wrap">
    <div id="clock-warning" style="display:none"></div>
    <div class="status-line"><span class="db-dot" id="db-dot"></span><span id="db-label">Cargando base de imágenes…</span></div>
    <div id="inicio-body"></div>
    <div class="app-ver" id="app-ver"></div>
  </div>
</div>

<!-- ═══════════ SUBIR ENVÍO (§6.2) ═══════════ -->
<div class="screen" id="screen-subir">
  <div class="topbar"><button class="back" onclick="goInicio()">← Inicio</button><div class="topbar-title" id="subir-title"></div></div>
  <div class="wrap">
    <h2>Subir envío</h2>
    <p class="muted">Descarga del sistema la exportación de <b>Envío</b> de este hub y área (archivo CSV) y elígela aquí.</p>
    <label class="btn btn-primary btn-block" style="margin-top:14px">📄 Elegir archivo CSV<input type="file" id="envio-file" accept=".csv,text/csv" onchange="onEnvioFile(this)" hidden></label>
    <div id="subir-result"></div>
  </div>
</div>

<!-- ═══════════ RECIBIR (§6.3) — blind count ═══════════ -->
<div class="screen" id="screen-recibir">
  <div class="rec-head">
    <div class="rec-head-top">
      <button class="back" onclick="leaveRecibir()">← Inicio</button>
      <div class="rec-title"><b id="rec-hub"></b> · <span id="rec-area"></span></div>
      <span class="net-badge" id="net-badge"></span>
    </div>
    <div class="rec-sub"><span id="rec-progress"></span><span id="rec-receptor"></span></div>
    <div class="progress"><div id="rec-bar"></div></div>
  </div>
  <div class="wrap">
    <div id="rec-banner"></div>
    <div class="scan-row">
      <input type="text" id="scan-input" class="scan-input" inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Escanea un código…">
      <button class="icon-btn" id="kb-toggle" onclick="toggleKeyboard()" title="Escribir el código">⌨</button>
      <button class="icon-btn" onclick="openCamera()" title="Escanear con la cámara">📷</button>
    </div>
    <div class="row2">
      <button class="btn btn-secondary" onclick="openSinCodigo()">🔎 Sin código</button>
      <button class="btn btn-secondary" onclick="openPendientes()">📋 Pendientes <span id="pend-count"></span></button>
    </div>
    <button class="btn btn-secondary btn-block" style="margin:-4px 0 12px;font-size:15px;padding:10px" onclick="openCanastas()">🧺 Canastas (lo recibido por pasillo)</button>
    <div id="card-area"></div>
    <div class="section-title">Últimos escaneos</div>
    <div id="recent-list" class="rlist"></div>
    <div id="rec-footer" style="margin-top:20px"></div>
  </div>
</div>

<!-- ═══════════ RESUMEN Y CIERRE (§6.5) — the expected quantities are revealed here ═══════════ -->
<div class="screen" id="screen-resumen">
  <div class="topbar"><button class="back" onclick="backToRecibir()">← Seguir escaneando</button><div class="topbar-title" id="resumen-title"></div></div>
  <div class="wrap" id="resumen-body"></div>
</div>

/* ── sbReq — copied from armado-CH v2.3: at most SB_MAX_INFLIGHT in flight, 429 waits and retries. ── */
const SB_MAX_INFLIGHT=8;
let _sbInflight=0; const _sbQueue=[];
function _sbAcquire(){ if(_sbInflight<SB_MAX_INFLIGHT){ _sbInflight++; return Promise.resolve(); } return new Promise(r=>_sbQueue.push(r)); }
function _sbRelease(){ const next=_sbQueue.shift(); if(next) next(); else _sbInflight--; }
async function sbReq(url, opts){
  for(let attempt=0;;attempt++){
    await _sbAcquire();
    let r; try{ r=await fetch(url, opts); } finally{ _sbRelease(); }
    if(r.status!==429 || attempt>=4) return r;
    const ra=Number(r.headers.get('Retry-After'));
    await new Promise(res=>setTimeout(res, (ra>0?ra*1000:500*2**attempt)+Math.random()*250));
  }
}

/* ── BARCODES / HEADERS / NAMES — copied from armado-CH ── */
function bcMatch(scanned, system){
  if(!scanned||!system) return false;
  if(scanned===system) return true;
  const s1=scanned.replace(/^0+/,''), s2=system.replace(/^0+/,'');
  return s1.length>0 && s1===s2;
}
function cleanBC(raw){
  if(raw==null) return '';
  let s=String(raw).trim(); if(!s) return '';
  if(/[eE][+\-]?\d+$/.test(s)){ const n=Number(s); if(!isNaN(n)&&isFinite(n)) s=n.toFixed(0); }
  s=s.replace(/\.0+$/,''); if(s.includes('.')) s=s.split('.')[0];
  return s;
}
function normHeader(h){ return String(h||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function pickCol(row, ...names){
  const want=names.map(normHeader);
  for(const k of Object.keys(row||{})){ if(want.includes(normHeader(k))) return row[k]; }
  return undefined;
}
function bcKey(bc){ const s=String(bc||''); return s.replace(/^0+/,'') || s; }
function normName(s){
  if(!s) return '';
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
function stripBOM(text){ return text.charCodeAt(0)===0xFEFF ? text.slice(1) : text; }
// Ours: one export carries a barcode with an inner space ("083078 003623") — the scanner never sends it.
function codeKey(raw){ return bcKey(cleanBC(raw).replace(/\s+/g,'')); }
// sku_key (plan §3.1): bcKey(barcode), or 'name:'+normalized name when the line has no barcode
function skuKeyOf(barcode, producto){ const k=codeKey(barcode); return k ? k : 'name:'+normName(producto); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ── IMAGE DB (plan §3.3) — loader copied from armado-CH; imgUrl/imgName from sorting-hub read both the
   plain-string and {url,name} entry shapes. ── */
const S = { imgDb:{} };
function normalizeImgDbKeys(db){
  const out={};
  for(const k in db){
    if(/^\d+$/.test(k)){ const s=bcKey(k); if(!(s in out)) out[s]=db[k]; }
    else out[k]=db[k];
  }
  return out;
}
function imgUrl(entry){ return typeof entry==='string' ? entry : (entry && entry.url) || null; }
function imgName(entry){ return typeof entry==='string' ? null : (entry && entry.name) || null; }
async function loadImageDB(){
  setDbStatus('loading','Cargando base de imágenes…');
  const CK='mr_imgdb_cache';
  const base=`${SB_URL}/storage/v1/object/public/${ARMADO_BUCKET}/imagedb/`;
  // 1. Armado's published imagedb/latest.json — tiny version.txt first, the 1.3 MB body cached
  try{
    const ver=(await fetch(base+'version.txt',{cache:'no-store'}).then(r=>{ if(!r.ok) throw 0; return r.text(); })).trim();
    let cached=null; try{ cached=JSON.parse(localStorage.getItem(CK)||'null'); }catch(_){}
    let map;
    if(cached && cached.v===ver && cached.map){ map=cached.map; }
    else{
      const j=await fetch(base+'latest.json',{cache:'no-store'}).then(r=>{ if(!r.ok) throw 0; return r.json(); });
      map=j.map||j;
      try{ localStorage.setItem(CK, JSON.stringify({v:ver, map})); }catch(_){}
    }
    S.imgDb=normalizeImgDbKeys(map);
    setDbStatus('ok',`Base de imágenes (${Math.round(Object.keys(S.imgDb).length/2).toLocaleString('es-MX')} productos)`);
    return;
  }catch(_){}
  // 2. Fallback: the file bundled in the repo (the floor, not the source)
  try{
    const res=await fetch('./imagedb.json');
    if(!res.ok) throw new Error('HTTP '+res.status);
    S.imgDb=normalizeImgDbKeys(await res.json());
    setDbStatus('ok',`Base de imágenes incluida (${Math.round(Object.keys(S.imgDb).length/2).toLocaleString('es-MX')} productos)`);
  }catch(e){ S.imgDb={}; setDbStatus('err','Sin imágenes'); }
}
function setDbStatus(type,msg){
  const d=document.getElementById('db-dot'), l=document.getElementById('db-label'); if(!d||!l) return;
  d.className='db-dot '+(type==='ok'?'ok':type==='loading'?'loading':'err');
  l.textContent=msg;
}
// Lookup identical to armado-CH getImgUrl (bcKey → exact name → first word → prefix ≥5 chars), memoised
// because the "Sin código" type-ahead asks for dozens of photos per keystroke.
const _imgMemo=new Map();
function getImgUrl(barcode, producto){
  const memoKey=(barcode||'')+'|'+(producto||'');
  if(_imgMemo.has(memoKey)) return _imgMemo.get(memoKey);
  const res=_getImgUrl(barcode, producto);
  if(Object.keys(S.imgDb).length) _imgMemo.set(memoKey,res);
  return res;
}
function _getImgUrl(barcode, producto){
  const bk=codeKey(barcode), name=normName(producto||'');
  if(bk&&S.imgDb[bk]) return imgUrl(S.imgDb[bk]);
  if(name&&S.imgDb[name]) return imgUrl(S.imgDb[name]);
  const fw=name.split(' ')[0];
  if(fw.length>3&&S.imgDb[fw]) return imgUrl(S.imgDb[fw]);
  // a wrong image is worse than none, so require ≥5 chars before guessing
  for(const k of Object.keys(S.imgDb)){
    if(k.length>5 && name.startsWith(k)) return imgUrl(S.imgDb[k]);
    if(fw.length>=5 && k.length>5 && k.startsWith(fw)) return imgUrl(S.imgDb[k]);
  }
  return null;
}

// Export numbers: "24.6", "1,234.5", "3,5" → Number; empty → 0; garbage → NaN
function parseNum(v){
  let s=String(v==null?'':v).trim().replace(/\s/g,''); if(!s) return 0;
  if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s=s.replace(/,/g,''); else s=s.replace(',','.');
  const n=Number(s); return isFinite(n) ? n : NaN;
}
// Presentation = the last size/weight/count token of the name ("500g", "1kg", "150pz", "(4pz de 60g)")
const PRES_RE=/\(\s*\d+\s*(?:pz|pzs|piezas)\b[^)]*\)|\d+(?:[.,]\d+)?\s?(?:kg|gr|g|mg|ml|lt|l|oz|pzs|pz|piezas)(?![a-z])/gi;
function presentacion(name){
  const s=String(name||''); let m, last=null; PRES_RE.lastIndex=0;
  while((m=PRES_RE.exec(s))) last={i:m.index, t:m[0]};
  return last;
}
function nameHtml(name){
  const s=String(name||''), p=presentacion(s);
  if(!p) return escapeHtml(s);
  return escapeHtml(s.slice(0,p.i))+'<mark>'+escapeHtml(p.t)+'</mark>'+escapeHtml(s.slice(p.i+p.t.length));
}
// §7.2 family key: the name without size/weight/count tokens ("Oreo 210g" ~ "Oreo 114g")
const SIZE_RE=/\d+(?:[.,]\d+)?\s?(?:kg|kgs|gr|grs|g|mg|ml|lt|lts|l|oz|pzs|pz|piezas)(?![a-z])/gi;
function familyKey(name){
  const s=String(name||'').replace(/\([^)]*\d[^)]*\)/g,' ').replace(SIZE_RE,' ');
  return normName(s).replace(/\b(de|con|x)$/,'').trim();
}
function imgTag(barcode, producto, cls){
  const u=getImgUrl(barcode, producto);
  return u ? `<img class="${cls}" src="${escapeHtml(u)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'${cls==='thumb'?'thumb-none':'pcard-noimg'}',textContent:'📦'}))">`
           : `<div class="${cls==='thumb'?'thumb-none':'pcard-noimg'}">📦</div>`;

/* ════════════════════════════════════════════════════════════════════════════════════
   SORTING POSITIONS (plan §3.2) — read-only from bucket sorting-hub, cached per hub like Sorting Hub does.
   items: [[producto, barcode, pasillo, estante, nivel, posDentro, temp], …]
   ════════════════════════════════════════════════════════════════════════════════════ */
S.sortBC=new Map(); S.sortName=new Map(); S.sortStatus='loading'; S.sortUpdatedAt=null;
async function loadSorting(slug){
  const src=SORTING_SLUG[slug]||slug, CK='mr_sorting_'+src;
  let cached=null; try{ cached=JSON.parse(localStorage.getItem(CK)||'null'); }catch(_){}
  let data=null, status='ok';
  try{
    const r=await fetch(`${SB_URL}/storage/v1/object/public/${SORTING_BUCKET}/sorting/${src}/version.txt`,{cache:'no-store'});
    if(r.ok){
      const v=(await r.text()).trim();
      if(cached && cached.v===v) data=cached.data;
      else{
        data=await (await sbPublic(`sorting/${src}/latest.json`, SORTING_BUCKET)).json();
        try{
          for(const k of Object.keys(localStorage)) if(k.startsWith('mr_sorting_') && k!==CK) localStorage.removeItem(k);
          localStorage.setItem(CK, JSON.stringify({v, data}));
        }catch(_){}
      }
    } else if(r.status===400 || r.status===404){ status='none'; } // this hub never published a sorting file
    else { data=cached&&cached.data; status=data?'offline':'err'; }
  }catch(_){ data=cached&&cached.data; status=data?'offline':'err'; }
  const bc=new Map(), nm=new Map();
  for(const it of (data&&data.items)||[]){
    const k=codeKey(it[1]); if(k && !bc.has(k)) bc.set(k,it);
    const n=normName(it[0]); if(n && !nm.has(n)) nm.set(n,it);
  }
  S.sortBC=bc; S.sortName=nm; S.sortStatus=status; S.sortUpdatedAt=data&&data.updatedAt;
}
// B01–B16 are freezer aisles (Sorting Hub §12.1)
const FREEZER_AISLE_RE=/^B\d{2}$/;
function positionOf(barcode, producto){
  const it=S.sortBC.get(codeKey(barcode)) || S.sortName.get(normName(producto));
  if(!it) return null;
  const pasillo=String(it[2]||'').trim().toUpperCase(), estante=String(it[3]||'').trim(), nivel=String(it[4]||'').trim(), dentro=String(it[5]||'').trim();
  if(!pasillo) return null;
  return { letra:pasillo, full:[pasillo,estante,nivel].filter(Boolean).join('-')+(dentro?` · ${dentro}`:''),
           palabra: FREEZER_AISLE_RE.test(pasillo)?'Congelador':'Canasta' };
}

/* ════════════════════════════════════════════════════════════════════════════════════
   MODAL — only where the plan allows one (§6.3 unknown code, §6.7 re-upload, §7.1, §7.2-qty, §7.4, §7.6).
   Blocking: no backdrop dismiss.
   ════════════════════════════════════════════════════════════════════════════════════ */
let _modalResolve=null;
function showModal({title, html='', buttons, cancel=false}){
  return new Promise(res=>{
    _modalResolve=res;
    document.getElementById('modal-body').innerHTML=(title?`<div class="modal-title">${escapeHtml(title)}</div>`:'')+html;
    const act=document.getElementById('modal-actions');
    act.innerHTML=buttons.map((b,i)=>`<button class="btn btn-${b.kind||'secondary'} btn-block" data-i="${i}">${escapeHtml(b.label)}</button>`).join('')
      +(cancel?`<button class="link-btn" data-cancel="1">Cancelar</button>`:'');
    const done=v=>{ document.getElementById('modal-bg').classList.remove('open'); _modalResolve=null; res(v); setTimeout(focusScan,30); };
    act.querySelectorAll('button').forEach(btn=>btn.onclick=()=>done(btn.dataset.cancel?null:buttons[Number(btn.dataset.i)].value));
    // Choices inside the body (e.g. §7.1 look-alikes) answer the modal too: data-mv="value"
    document.getElementById('modal-body').querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>done(b.dataset.mv));
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
    document.getElementById('modal-bg').classList.add('open');
  });
}
function modalOpen(){ return document.getElementById('modal-bg').classList.contains('open'); }

function inicioActionsHtml(){

      <div class="muted" style="margin-top:4px">Sube el envío cuando esté listo: lo escaneado se conserva y se revisa.</div></div>

async function refreshActive(){
  const tok=++_activeTok; INI.active=undefined; renderInicio();
  let res; try{ res=await findActiveEnvio(INI.hub, INI.area); }catch(e){ res={offline:true}; }
  if(tok!==_activeTok) return;
  INI.active=res; renderInicio();
}
function goInicio(){
  closeCamera(); closeSheet();
  showScreen('screen-inicio'); renderInicio();
  if(INI.receptor) refreshActive();
}
function continuarRecepcion(){ const a=INI.active; if(a && a.data) openRecibir(a.data); }

/* ── Active envío (§6.7): the newest envios/{slug}/{area}/*.json ── */
async function findActiveEnvio(slug, area){
  let items;
  try{ items=await sbList(`envios/${slug}/${area}/`); }
  catch(e){ const m=latestMirror(slug, area); return m ? {offline:true, data:m.envio} : {offline:true}; }
  const names=(items||[]).map(o=>o.name).filter(n=>/\.json$/.test(n)).sort().reverse();
  if(!names.length) return {none:true};
  const path=`envios/${slug}/${area}/${names[0]}`;
  const data=JSON.parse(await sbFetch(path)); data._path=path;
  return { path, data, closed: await sessionClosedAt(data.session_id) };
}
async function sessionClosedAt(sessionId){
  // A 'cerrar' event closes the reception; a later admin 'reabrir' (§6.8) opens it again.
  // Unreachable → treated as open (never blocks resuming).
  try{
    const r=await pgSelect('rec_events', `session_id=eq.${encodeURIComponent(sessionId)}&tipo=in.(cerrar,admin)&select=ts,tipo,detalle&order=id.desc&limit=20`);
    for(const e of r){
      if(e.tipo==='cerrar') return e.ts;
      if(e.detalle && e.detalle.accion==='reabrir') return null;
    }
    return null;
  }catch(_){ return null; }
}
async function sessionHasScans(sessionId){
  if(OUTBOX.some(e=>e.session_id===sessionId && e.tipo==='scan')) return true;
  const r=await pgSelect('rec_events', `session_id=eq.${encodeURIComponent(sessionId)}&tipo=eq.scan&select=id&limit=1`);
  return r.length>0;
}

/* ════════════════════════════════════════════════════════════════════════════════════
   SUBIR ENVÍO (§5.2, §6.2)
   ════════════════════════════════════════════════════════════════════════════════════ */
let SUBIR=null; // { file, parsed, acks:Set, busy, error }
function openSubir(){
  SUBIR=null;
  document.getElementById('subir-title').textContent=`${hubName(INI.hub)} · ${areaName(INI.area)}`;
  document.getElementById('subir-result').innerHTML='';
  document.getElementById('envio-file').value='';
  showScreen('screen-subir');
}
async function onEnvioFile(input){
  const file=input.files && input.files[0]; if(!file) return;
  let text; try{ text=await file.text(); }catch(e){ text=''; }
  SUBIR={ file, parsed:parseEnvio(text), acks:new Set(), busy:false, error:null };
  renderSubir();
}
// §5.2 — verified on both fixtures (Abarrotes 105 lines / Carnes 132 lines, 26 Kg)
function parseEnvio(text){
  const out={ errors:[], warnings:[], lines:[], catalogo:[], stats:null, newestEnvio:null };
  const p=Papa.parse(stripBOM(String(text||'')), { header:true, dynamicTyping:false, skipEmptyLines:true });
  const fields=(p.meta && p.meta.fields)||[];
  const col=name=>fields.find(f=>normHeader(stripBOM(f))===normHeader(name));
  const C={ producto:col('Producto'), barcode:col('Código de barras'), kgpz:col('Kg/Pz'), envio:col('Envío (kg o pz)'),
            temp:col('Temp'), categoria:col('Categoría'), act:col('Actualización envío'), por:col('Envío registrado por'),
            reqConf:col('Requiere confirmar') };
  const missing=[['Producto',C.producto],['Código de barras',C.barcode],['Kg/Pz',C.kgpz],['Envío (kg o pz)',C.envio]].filter(x=>!x[1]).map(x=>x[0]);
  if(missing.length){
    out.errors.push(`Al archivo le falta${missing.length>1?'n las columnas':' la columna'} ${missing.map(m=>`«${m}»`).join(', ')}. ¿Es la exportación de Envío del sistema?`);
    return out;
  }
  const bySku=new Map(); let badNums=0, dupes=0;
  (p.data||[]).forEach((r, rowIndex)=>{
    const producto=String(r[C.producto]||'').trim(); if(!producto) return;
    const barcode=cleanBC(r[C.barcode]).replace(/\s+/g,'');
    const kgpz=normKgPz(r[C.kgpz]);
    const esperado=parseNum(r[C.envio]);
    if(isNaN(esperado)){ badNums++; return; }
    const sku_key=skuKeyOf(barcode, producto);
    if(!(esperado>0)){ out.catalogo.push([producto, barcode, kgpz]); return; }
    if(bySku.has(sku_key)){ // same product on two lines — counted together (never seen in real files)
      const l=bySku.get(sku_key); l.esperado=round2(l.esperado+esperado); dupes++; return;
    }
    const line={ rowIndex, producto, barcode, sku_key, kgpz, esperado:round2(esperado),
      temp:String(C.temp?r[C.temp]||'':'').trim(), categoria:String(C.categoria?r[C.categoria]||'':'').trim(),
      actualizacion_envio:String(C.act?r[C.act]||'':'').trim(), envio_registrado_por:String(C.por?r[C.por]||'':'').trim(),
      _reqConf:C.reqConf?String(r[C.reqConf]||'').trim().toLowerCase():'' };
    bySku.set(sku_key, line); out.lines.push(line);
  });
  if(!out.lines.length){
    out.errors.push('El archivo no trae ningún producto con «Envío (kg o pz)» mayor a 0. ¿Es el envío de este hub?');
    return out;
  }
  if(badNums) out.errors.push(`${badNums} renglón(es) tienen un número de envío que no se puede leer. Descarga el archivo otra vez.`);
  // Requiere confirmar flips to FALSE once the reception is registered in the system — a hint, never a filter.
  if(C.reqConf && out.lines.every(l=>l._reqConf==='false'))
    out.warnings.push({ id:'confirmado', html:'<b>Este envío parece ya confirmado en el sistema.</b> ¿Es el archivo correcto?' });
  let newest=null;
  for(const l of out.lines){ const t=Date.parse(l.actualizacion_envio); if(!isNaN(t) && (newest===null || t>newest)) newest=t; }
  if(newest!==null){
    out.newestEnvio=new Date(newest).toISOString();
    const age=daysBetween(localDateStr(new Date(newest)), todayStr());
    if(age>2) out.warnings.push({ id:'viejo', html:`<b>El envío del archivo se registró el ${fechaLarga(localDateStr(new Date(newest)))}</b> (hace ${age} días). ¿Es el envío correcto?` });
  }
  if(dupes) out.warnings.push({ id:'dupes', html:`${dupes} producto(s) aparecen en más de un renglón; se van a recibir juntos.` });
  out.lines.forEach(l=>delete l._reqConf);
  out.stats={ lineas:out.lines.length, kg:out.lines.filter(l=>l.kgpz==='Kg').length,
              sinCodigo:out.lines.filter(l=>!l.barcode).length, catalogo:out.catalogo.length, renglones:(p.data||[]).length };
  return out;
}
function renderSubir(){
  const el=document.getElementById('subir-result'); if(!SUBIR){ el.innerHTML=''; return; }
  const P=SUBIR.parsed;
  let h=`<div class="info-card" style="margin-top:14px"><b>${escapeHtml(SUBIR.file.name)}</b></div>`;
  if(P.errors.length){ el.innerHTML=h+P.errors.map(e=>`<div class="err-box">${escapeHtml(e)}</div>`).join(''); return; }
  const s=P.stats, reg=P.newestEnvio?new Date(P.newestEnvio):null;
  // Line counts only — the blind count never shows quantities (§2.3)
  h+=`<div class="stat-grid">
      <div class="stat"><div class="stat-n">${s.lineas}</div><div class="stat-l">productos en el envío</div></div>
      <div class="stat"><div class="stat-n">${s.kg}</div><div class="stat-l">se pesan (Kg)</div></div>
      <div class="stat"><div class="stat-n">${s.sinCodigo}</div><div class="stat-l">sin código de barras</div></div>
      <div class="stat"><div class="stat-n">${reg?fechaLarga(localDateStr(reg)).replace(/ de /,' '):'—'}</div><div class="stat-l">envío registrado${reg?' · '+localHM(reg):''}</div></div>
    </div>`;
  for(const w of P.warnings){
    const ok=SUBIR.acks.has(w.id);
    h+=`<div class="warn-box ${ok?'ok':''}">${w.html}${ok?'<div style="margin-top:6px;font-weight:700">✓ Confirmado</div>'
      :`<button class="btn btn-warn btn-block" onclick="SUBIR.acks.add('${w.id}');renderSubir()">Sí, es el archivo correcto</button>`}</div>`;
  }
  if(SUBIR.error) h+=`<div class="err-box">${escapeHtml(SUBIR.error)}</div>`;
  const ready=P.warnings.every(w=>SUBIR.acks.has(w.id)) && !SUBIR.busy;
  h+=`<button class="btn btn-primary btn-block" style="margin-top:12px" ${ready?'':'disabled'} onclick="startUpload()">${SUBIR.busy?'Subiendo…':'Cargar envío y empezar a recibir'}</button>`;
  el.innerHTML=h;
}
async function startUpload(){
  if(!SUBIR || SUBIR.busy) return;
  SUBIR.busy=true; SUBIR.error=null; renderSubir();
  try{ await doUpload(); }
  catch(e){ SUBIR.error=(isNetErr(e)?'Sin conexión: no se pudo subir el archivo. ':'No se pudo subir el archivo ('+e.message+'). ')+'Intenta de nuevo.'; }
  if(SUBIR){ SUBIR.busy=false; renderSubir(); }
}
async function doUpload(){
  const P=SUBIR.parsed, slug=INI.hub, area=INI.area;
  const now=serverNow(), epochMs=now.getTime(), fecha=localDateStr(now);
  // §6.7 — does this file belong to the reception already open for this hub+área?
  const prev=await findActiveEnvio(slug, area);
  if(prev.offline) throw new TypeError('offline');
  let reuse=false;
  if(prev.data && !prev.closed && prev.data.sinArchivo) reuse=true; // §6.2b — the file of the reception already started
  else if(prev.data && !prev.closed){
    if(await sessionHasScans(prev.data.session_id)){
      const v=await showModal({ title:'Esta recepción ya tiene productos escaneados',
        html:`<p>Lo escaneado es conteo físico: se conserva y se vuelve a comparar contra el archivo nuevo.</p>`,
        buttons:[{label:'Reemplazar el archivo y conservar lo escaneado', value:'replace', kind:'primary'},
                 {label:'Primero cerrar la recepción actual', value:'close', kind:'secondary'}], cancel:true });
      if(v==='close'){ SUBIR=null; openRecibir(prev.data); openResumen(); return; }
      if(v!=='replace') return;
      reuse=true;
    } else if(prev.data.session_fecha===fecha) reuse=true; // same day, nothing scanned → simply replaces
  }
  const session_id = reuse ? prev.data.session_id : `${slug}__${area}__${fecha}__${epochMs}`;
  const session_fecha = reuse ? prev.data.session_fecha : fecha;
  const base=`envios/${slug}/${area}/${fecha}__${epochMs}`;
  const data={ v:1, hub:slug, area, fecha, epochMs, uploadedAt:now.toISOString(), receptor:INI.receptor,
    sourceFile:SUBIR.file.name, csvPath:base+'.csv', session_id, session_fecha,
    stats:P.stats, newestEnvio:P.newestEnvio, lines:P.lines, catalogo:P.catalogo };
  await sbUpload(base+'.csv', SUBIR.file, 'text/csv; charset=utf-8'); // raw, verbatim
  await sbUpload(base+'.json', JSON.stringify(data), 'application/json'); // written last: its presence makes it active
  data._path=base+'.json';
  const fileName=SUBIR.file.name; SUBIR=null;
  const wasSinArchivo=reuse && prev.data.sinArchivo;
  openRecibir(data, { revisar:wasSinArchivo });
  recordEvent(makeEvent(reuse?'reemplazo':'abrir', { detalle:{ envio:base+'.json', csv:base+'.csv', archivo:fileName,
    lineas:P.stats.lineas, anterior:reuse?prev.path:undefined, tras_sin_archivo:wasSinArchivo||undefined } }));
  toast(wasSinArchivo?'✓ Archivo cargado — revisando lo escaneado':reuse?'✓ Archivo reemplazado — lo escaneado se conserva':'✓ Envío cargado. Empieza a escanear.');
}
// §6.2b — start receiving before the file exists. A placeholder envío JSON makes the reception visible to
// other phones; the real upload later reuses its session_id.
async function startSinArchivo(){
  const slug=INI.hub, area=INI.area, now=serverNow(), epochMs=now.getTime(), fecha=localDateStr(now);
  let prev; try{ prev=await findActiveEnvio(slug, area); }catch(_){ prev={offline:true}; }
  if(prev.offline){ toast('Sin conexión: conéctate para empezar la recepción'); return; }
  if(prev.data && !prev.closed && prev.data.session_fecha===fecha){ toast('Ya hay una recepción abierta hoy: continúala'); refreshActive(); return; }
  const session_id=`${slug}__${area}__${fecha}__${epochMs}`, base=`envios/${slug}/${area}/${fecha}__${epochMs}`;
  const data={ v:1, hub:slug, area, fecha, epochMs, uploadedAt:now.toISOString(), receptor:INI.receptor, sinArchivo:true,
    sourceFile:'', session_id, session_fecha:fecha, stats:{ lineas:0, kg:0, sinCodigo:0, catalogo:0, renglones:0 }, lines:[],
    // the previous file's whole catalog names the products (and their Kg/Pz) until today's file arrives
    catalogo:prev.data ? (prev.data.catalogo||[]).concat((prev.data.lines||[]).map(l=>[l.producto, l.barcode, l.kgpz])) : [] };
  try{ await sbUpload(base+'.json', JSON.stringify(data), 'application/json'); }
  catch(e){ toast(isNetErr(e)?'Sin conexión: intenta de nuevo':'No se pudo empezar ('+e.message+')'); return; }
  data._path=base+'.json';
  openRecibir(data);
  recordEvent(makeEvent('abrir', { detalle:{ envio:base+'.json', sin_archivo:true } }));
  toast('Recepción sin archivo: empieza a escanear');
}

/* ════════════════════════════════════════════════════════════════════════════════════
   EVENTS + OUTBOX (§8) — rec_events is append-only and the source of truth. Every event carries a
   client uid (detalle.uid) so a retried insert or the local mirror never double-counts.
   ════════════════════════════════════════════════════════════════════════════════════ */
const OUTBOX_KEY='mr_outbox', DEAD_KEY='mr_outbox_failed';
let OUTBOX=(()=>{ try{ return JSON.parse(localStorage.getItem(OUTBOX_KEY)||'[]'); }catch(_){ return []; } })();
let _outboxPersisted=true;
function saveOutbox(){ try{ localStorage.setItem(OUTBOX_KEY, JSON.stringify(OUTBOX)); _outboxPersisted=true; }catch(_){ _outboxPersisted=false; } }
const NET={ ok:true };
function makeEvent(tipo, f={}){
  return { session_id:S.session.id, hub:S.hub, area:S.area, fecha:S.session.fecha, tipo,
    sku_key:f.sku_key??null, producto:f.producto??null, cantidad:f.cantidad??null, metodo:f.metodo??null,
    detalle:Object.assign({ uid:newUid() }, f.detalle||{}), receptor:S.receptor, device_id:DEVICE_ID,
    ts:serverNow().toISOString() };
}
function recordEvent(ev){
  OUTBOX.push(ev); saveOutbox();
  if(!_outboxPersisted) toast('⚠ La memoria del teléfono está llena: no cierres la app hasta que se suba todo', 5000);
  addEvents([ev]); saveMirror();
  flushOutbox();
}
let _flushing=false;
async function flushOutbox(){
  if(_flushing || !OUTBOX.length){ renderNet(); return; }
  _flushing=true; renderNet();
  try{
    while(OUTBOX.length){
      const batch=OUTBOX.slice(0,100);
      try{ await pgInsert('rec_events', batch); }
      catch(e){
        if(isNetErr(e)) throw e;
        // A row the server rejects must not block every scan behind it: retry one by one, park the bad ones.
        for(const ev of batch){
          try{ await pgInsert('rec_events', [ev]); }
          catch(e2){ if(isNetErr(e2)) throw e2; parkDead(ev, e2); }
        }
      }
      const sent=new Set(batch.map(e=>e.detalle.uid));
      OUTBOX=OUTBOX.filter(e=>!sent.has(e.detalle.uid)); saveOutbox();
      NET.ok=true;
    }
  }catch(e){ NET.ok=false; }
  finally{
    _flushing=false; renderNet();
    // the close button depends on an empty outbox
    if(document.getElementById('screen-resumen').classList.contains('active') && !S.closing) renderResumen();
  }
}
function parkDead(ev, err){
  try{ const d=JSON.parse(localStorage.getItem(DEAD_KEY)||'[]'); d.push({ev, err:String(err&&err.message)}); localStorage.setItem(DEAD_KEY, JSON.stringify(d)); }catch(_){}
  console.error('rec_events rechazó un evento', ev, err);
}
function renderNet(){
  const el=document.getElementById('net-badge'); if(!el) return;
  const n=OUTBOX.length, off=!NET.ok || navigator.onLine===false;
  if(n){ el.className='net-badge '+(off?'off':'pend'); el.textContent=(off?'Sin conexión · ':'Subiendo · ')+n; }
  else if(off){ el.className='net-badge off'; el.textContent='Sin conexión'; }
  else { el.className='net-badge ok'; el.textContent='✓ Guardado'; }
}
window.addEventListener('online', ()=>{ NET.ok=true; flushOutbox(); });
window.addEventListener('offline', renderNet);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') flushOutbox(); });
setInterval(()=>{ if(OUTBOX.length) flushOutbox(); }, 15000);

/* ── Local mirror (§8): mr_session_{slug}_{area}_{fecha} = { envio, events }. Protects work; never picks a page. ── */
function mirrorPrefix(slug, area){ return `mr_session_${slug}_${area}_`; }
let _mirrorT=null;
function saveMirror(){
  clearTimeout(_mirrorT);
  _mirrorT=setTimeout(()=>{
    if(!S.session) return;
    const pre=mirrorPrefix(S.hub, S.area), key=pre+S.session.fecha;
    try{
      for(const k of Object.keys(localStorage)) if(k.startsWith(pre) && k!==key) localStorage.removeItem(k);
      localStorage.setItem(key, JSON.stringify({ envio:S.envio, events:S.events }));
    }catch(_){}
  }, 300);
}
function latestMirror(slug, area){
  try{
    const pre=mirrorPrefix(slug, area);
    const keys=Object.keys(localStorage).filter(k=>k.startsWith(pre)).sort();
    if(!keys.length) return null;
    const m=JSON.parse(localStorage.getItem(keys[keys.length-1])||'null');
    return m && m.envio ? m : null;
  }catch(_){ return null; }
}

/* ── Fold (§8): session state = scans + ajustes summed per sku_key. ── */
function addEvents(evs){
  let added=false;
  for(const e of evs||[]){
    const u=(e.detalle&&e.detalle.uid) || ('id'+e.id);
    if(S.eventUids.has(u)) continue;
    S.eventUids.add(u); S.events.push(e); added=true;
  }
  if(added){ S.events.sort((a,b)=>String(a.ts).localeCompare(String(b.ts))); fold(); }
  return added;
}
function fold(){
  const rec=new Map(), adj=new Map(), noEsp=new Map();
  for(const e of S.events){
    if(e.tipo!=='scan' && e.tipo!=='ajuste') continue;
    const q=Number(e.cantidad)||0;
    rec.set(e.sku_key, round2((rec.get(e.sku_key)||0)+q));
    if(e.tipo==='ajuste' && e.detalle && e.detalle.ref) adj.set(e.detalle.ref, round2((adj.get(e.detalle.ref)||0)+q));
    if(e.tipo==='scan' && !S.lines.has(e.sku_key) && !noEsp.has(e.sku_key))
      noEsp.set(e.sku_key, { producto:e.producto, kgpz:(e.detalle&&e.detalle.kgpz)||'Pz' });
  }
  S.recibido=rec; S.adjByRef=adj; S.noEsperados=noEsp; // noEsperados feed the Phase 3 summary
}
function recibidoDe(sku){ return S.recibido.get(sku)||0; }

/* ════════════════════════════════════════════════════════════════════════════════════
   RECIBIR (§6.3) — blind: the enviado number is never rendered on this screen.
   ════════════════════════════════════════════════════════════════════════════════════ */
Object.assign(S, { hub:null, area:null, receptor:null, envio:null, session:null, lines:new Map(), catalog:new Map(),
  catByCode:new Map(), events:[], eventUids:new Set(), recibido:new Map(), adjByRef:new Map(), noEsperados:new Map(),
  current:null, corrigiendo:null });
function setEnvio(data){
  S.envio=data;
  S.lines=new Map(data.lines.map(l=>[l.sku_key, Object.assign(l, { _n:normName(l.producto) })]));
  S.famLines=new Map();
  for(const l of S.lines.values()){ const f=familyKey(l.producto); if(f.length<4) continue; if(!S.famLines.has(f)) S.famLines.set(f,[]); S.famLines.get(f).push(l); }
}
function openRecibir(data, opts={}){
  S.hub=INI.hub; S.area=INI.area; S.receptor=INI.receptor;
  S.session={ id:data.session_id, fecha:data.session_fecha };
  setEnvio(data);
  S.events=[]; S.eventUids=new Set(); S.current=null; S.corrigiendo=null; S.staleAsked=false; S.lastId=0; S.closedInfo=null; S.armado=null;
  buildCatalog();
  const m=latestMirror(S.hub, S.area);
  if(m && m.envio && m.envio.session_id===S.session.id) addEvents(m.events);
  addEvents(OUTBOX.filter(e=>e.session_id===S.session.id));
  fold();
  document.getElementById('rec-hub').textContent=hubName(S.hub);
  document.getElementById('rec-area').textContent=areaName(S.area);
  document.getElementById('rec-receptor').textContent='👤 '+S.receptor;
  showScreen('screen-recibir');
  renderRecibir(); focusScan();
  loadSorting(S.hub).then(()=>{ buildCatalog(); renderRecibir(); });
  syncServerEvents().then(()=>{ if(opts.revisar && revisarItems().length) openRevisar(); });
  flushOutbox();
  staleCheck();
}
/* ── §6.7 stale warning: the active file was uploaded on an earlier day. Ignorar lasts for that file today. ── */
function staleIgnored(){ try{ return localStorage.getItem('mr_stale_ign_'+S.envio._path)===todayStr(); }catch(_){ return S.staleIgnMem===S.envio._path+todayStr(); } }
async function staleCheck(){
  if(!S.envio || S.envio.sinArchivo || !(S.envio.fecha<todayStr()) || staleIgnored() || modalOpen()) return true;
  S.staleAsked=true;
  const v=await showModal({ title:`Estás trabajando con el archivo cargado el ${fechaLarga(S.envio.fecha)}.`,
    html:'<p>Carga el archivo de hoy.</p>',
    buttons:[{label:'Cargar archivo de hoy', value:'subir', kind:'primary'}, {label:'Ignorar', value:'ign', kind:'secondary'}] });
  if(v==='subir'){ S.current=null; openSubir(); return false; }
  try{ localStorage.setItem('mr_stale_ign_'+S.envio._path, todayStr()); }catch(_){ S.staleIgnMem=S.envio._path+todayStr(); }
  return true;
}
// §8 multi-device: one full read on open, then every 15 s only rows newer than the last id seen
// (rec_events is append-only, so id=gt.{last} never misses a row once it is visible).
async function syncServerEvents(){
  if(!S.session) return;
  const sid=S.session.id, since=S.lastId||0;
  try{
    const rows=await pgSelectAll('rec_events', `session_id=eq.${encodeURIComponent(sid)}${since?`&id=gt.${since}`:''}&select=*`);
    if(!S.session || S.session.id!==sid) return;
    for(const r of rows) if(r.id>(S.lastId||0)) S.lastId=r.id;
    const fresh=rows.filter(r=>!S.eventUids.has((r.detalle&&r.detalle.uid)||('id'+r.id)));
    if(addEvents(rows)){ saveMirror(); await onRemoteEvents(fresh); renderRecibir(); if(screenActive('screen-resumen') && !S.closing) renderResumen(); }
    if(!NET.ok){ NET.ok=true; renderNet(); }
  }catch(_){ NET.ok=false; renderNet(); }
}
function screenActive(id){ return document.getElementById(id).classList.contains('active'); }
// What other phones did: closed the reception, reopened it (admin), or replaced the file
async function onRemoteEvents(evs){
  for(const e of evs){
    if(e.tipo==='reemplazo' && e.detalle && e.detalle.envio && e.detalle.envio!==S.envio._path){
      try{
        const data=JSON.parse(await sbFetch(e.detalle.envio)); data._path=e.detalle.envio;
        if(data.session_id!==S.session.id) continue;
        setEnvio(data); buildCatalog(); fold();
        toast(`${e.receptor||'Otro teléfono'} cargó un archivo nuevo — lo escaneado se conserva`, 4000);
        if(S.current && S.current.p.enEnvio!==undefined){ const l=S.lines.get(S.current.p.sku_key); if(l) S.current.p=Object.assign({}, l, { enEnvio:true }); }
      }catch(_){}
    }
  }
  S.closedInfo=closedState();
  if(S.closedInfo && S.current){ S.current=null; }
}
// Latest of cerrar / admin reabrir in this session's events
function closedState(){
  let st=null;
  for(const e of S.events){
    if(e.tipo==='cerrar') st=Object.assign({ ts:e.ts, fecha:e.fecha, hub:e.hub, area:e.area, receptor:e.receptor, session_id:e.session_id }, e.detalle||{});
    else if(e.tipo==='admin' && e.detalle && e.detalle.accion==='reabrir') st=null;
  }
  return st;
}
setInterval(()=>{
  if(!S.session || document.visibilityState!=='visible') return;
  if(screenActive('screen-recibir') || screenActive('screen-resumen')) syncServerEvents();
}, 15000);
function leaveRecibir(){ S.current=null; flushOutbox(); goInicio(); }

// Catalog = every product we can name: the file's non-envío rows + this hub's sorting. Used by
// "Sin código" (§7.3) and to name a scanned barcode that isn't in the envío (§7.1).
function buildCatalog(){
  const cat=new Map(), byCode=new Map();
  const add=(producto, barcode, kgpz)=>{
    const sku=skuKeyOf(barcode, producto); if(!producto || cat.has(sku) || S.lines.has(sku)) return;
    const c={ sku_key:sku, producto, barcode, kgpz:kgpz||'Pz', kgpzKnown:!!kgpz, _n:normName(producto) };
    cat.set(sku, c); if(barcode) byCode.set(codeKey(barcode), c);
  };
  for(const r of (S.envio&&S.envio.catalogo)||[]) add(r[0], r[1], r[2]);
  for(const it of S.sortBC.values()) add(String(it[0]||'').trim(), cleanBC(it[1]), null);
  S.catalog=cat; S.catByCode=byCode;
}
function renderRecibir(){
  const total=S.lines.size; let got=0;
  for(const k of S.lines.keys()) if(recibidoDe(k)>0) got++;
  const sinArch=!!S.envio.sinArchivo;
  if(sinArch){
    const n=[...S.recibido.values()].filter(q=>q>0).length;
    document.getElementById('rec-progress').innerHTML=`<b>${n}</b> productos escaneados · <span class="tag orange">sin archivo</span>`;
    document.getElementById('rec-bar').style.width='0%';
    document.getElementById('pend-count').textContent='';
  } else {
    document.getElementById('rec-progress').innerHTML=`<b>${got}</b> / ${total} productos recibidos`;
    document.getElementById('rec-bar').style.width=(total?Math.round(got*100/total):0)+'%';
    document.getElementById('pend-count').textContent=`(${total-got})`;
  }
  let banner='';
  if(sinArch) banner+=`<div class="note"><b>Recibiendo sin archivo.</b> Escanea y cuenta normal; cuando el envío esté listo, súbelo desde Inicio → Subir envío y la app revisará todo lo escaneado.</div>`;
  const rev=sinArch?[]:revisarItems();
  if(rev.length) banner+=`<button class="btn btn-warn btn-block" style="margin-bottom:10px" onclick="openRevisar()">⚠ Revisar ahora · ${rev.length}</button>`;
  if(S.sortStatus==='none') banner+=`<div class="note">${escapeHtml(hubName(S.hub))} todavía no tiene archivo en Sorting Hub: las tarjetas no mostrarán canasta.</div>`;
  else if(S.sortStatus==='err') banner+=`<div class="note">No se pudo cargar el sorting de este hub: las tarjetas no mostrarán canasta.</div>`;
  if(S.closedInfo) banner=`<div class="err-box"><b>Esta recepción ya se cerró</b> (${escapeHtml(S.closedInfo.receptor||'')}, ${localHM(new Date(S.closedInfo.ts))}). Ya no se puede escanear.
    <button class="btn btn-secondary btn-block" style="margin-top:8px" onclick="openRecepcion(S.closedInfo,'inicio')">📊 Ver resumen</button></div>`;
  const otros=receptoresDeSesion().filter(r=>r!==S.receptor);
  document.getElementById('rec-receptor').textContent='👤 '+S.receptor+(otros.length?` (+${otros.length})`:'');
  document.getElementById('rec-banner').innerHTML=banner;
  document.getElementById('rec-footer').innerHTML = S.closedInfo ? '' : sinArch
    ? `<div class="muted" style="text-align:center">Para cerrar la recepción, primero sube el archivo del envío.</div>`
    : `<button class="btn btn-primary btn-block" onclick="openResumen()">✅ Terminé: revisar y cerrar</button>`;
  renderCard(); renderRecent(); renderNet();
}

/* ── Scan input wiring (copied from sorting-hub): Enter, or a 300 ms pause, submits. ── */
const SCAN_AUTO_SUBMIT_MS=300;
let _scanT=null, _lastScan={ code:'', time:0 };
function stripScanArtifacts(raw){ return String(raw||'').replace(/[\r\n\t\x1d]/g,'').trim(); }
function extractEmbeddedGTIN(digitsOnly){ // GS1-128: a long scan may embed a 14-digit GTIN after AI "01"
  if(digitsOnly.length<=14) return null;
  const idx=digitsOnly.indexOf('01'); if(idx===-1) return null;
  const gtin=digitsOnly.slice(idx+2, idx+16);
  return gtin.length===14 ? gtin : null;
}
const scanEl=document.getElementById('scan-input');
scanEl.addEventListener('keydown', e=>{
  if(e.key==='Enter'){ e.preventDefault(); clearTimeout(_scanT); const v=scanEl.value; scanEl.value=''; processScan(v, scanMetodo()); }
});
scanEl.addEventListener('input', ()=>{
  clearTimeout(_scanT); const v=scanEl.value; if(!v) return;
  // Typing by hand (keyboard toggled on) waits for Enter; a scanner's burst auto-submits on the pause.
  if(scanEl.getAttribute('inputmode')!=='none') return;
  _scanT=setTimeout(()=>{ scanEl.value=''; processScan(v, 'scanner'); }, SCAN_AUTO_SUBMIT_MS);
});
scanEl.addEventListener('blur', ()=>setTimeout(()=>{ if(document.activeElement===document.body) focusScan(); }, 60));
document.getElementById('screen-recibir').addEventListener('click', e=>{
  if(!e.target.closest('button, a, input, select, label, textarea')) focusScan();
});
function scanMetodo(){ return scanEl.getAttribute('inputmode')==='none' ? 'scanner' : 'teclado'; }
function toggleKeyboard(){
  const on=scanEl.getAttribute('inputmode')==='none';
  scanEl.setAttribute('inputmode', on?'numeric':'none');
  document.getElementById('kb-toggle').style.borderColor=on?'var(--green)':'';
  scanEl.placeholder=on?'Escribe el código y pulsa Enter':'Escanea un código…';
  scanEl.blur(); setTimeout(()=>scanEl.focus(), 30);
}
function overlayOpen(){ return modalOpen() || document.getElementById('sheet').classList.contains('open') || document.getElementById('camera-overlay').classList.contains('open'); }
// The scan field gets focus back unless something the receptor is typing into is open.
function focusScan(){
  const go=()=>{
    if(!document.getElementById('screen-recibir').classList.contains('active') || overlayOpen() || S.corrigiendo) return;
    if(S.current){ const q=document.getElementById('qty-input'); if(q && document.activeElement!==q) q.focus(); return; }
    if(document.activeElement!==scanEl) scanEl.focus();
  };
  go(); setTimeout(go, 30);
}

/* ── Resolve a code to a product (§6.3) ── */
function resolveCode(raw){
  const k=codeKey(raw); if(!k) return null;
  if(S.lines.has(k)) return { line:S.lines.get(k) };
  const known=S.catByCode.get(k) || (()=>{ const n=imgName(S.imgDb[k]); return n ? { sku_key:k, producto:n, barcode:k, kgpz:'Pz' } : null; })();
  if(known){
    // A barcode the export left blank on an envío line: same product name → that line.
    const byName=S.lines.get('name:'+normName(known.producto));
    if(byName) return { line:byName };
    return { product:known };
  }
  return null;
}
async function processScan(raw, metodo){
  const code=stripScanArtifacts(raw); if(!code || overlayOpen()) return;
  if(code.length<4){ toast('Escaneo incompleto — vuelve a escanear'); return; } // no real barcode is this short
  if(S.closedInfo){ toast('Esta recepción ya se cerró'); return; }
  const now=Date.now();
  if(code===_lastScan.code && now-_lastScan.time<1500) return; // debounce a double trigger
  _lastScan={ code, time:now };
  // §6.7 — also at the first scan of the day (a page left open overnight)
  if(!S.staleAsked && !(await staleCheck())) return;
  let r=resolveCode(code);
  if(!r){ const g=extractEmbeddedGTIN(code.replace(/\D/g,'')); if(g) r=resolveCode(g); }
  const det={ codigo:code, teclado:metodo==='teclado'||undefined };
  const m=metodo==='teclado' ? 'scanner' : metodo;
  if(r && r.line){ vibrate(true); openCard({ ...r.line, enEnvio:true }, m, det); return; }
  // §6.2b — no file yet: nothing can be flagged; the unit is asked on the card
  if(r && r.product && S.envio.sinArchivo){ vibrate(true); openCard(sinArchivoProduct(r.product), m, det); return; }
  vibrate(false);
  if(r && r.product){ await notInEnvio(r.product, m, det); return; }
  // §6.3.3 — unknown barcode
  const v=await showModal({ title:'Código no reconocido', html:`<p>Vuelve a escanear o búscalo por nombre.</p><p style="font-size:12px;color:var(--gray-500)">Código: ${escapeHtml(code)}</p>`,
    buttons:[{label:'Volver a escanear', value:'again', kind:'primary'}, {label:'🔎 Buscar por nombre', value:'search', kind:'secondary'}]
      .concat(S.envio.sinArchivo?[{label:'Registrar este código sin nombre', value:'raw', kind:'secondary'}]:[]) });
  if(v==='search') openSinCodigo();
  // §6.2b — without a file an unknown code can still be counted; the file names it later (same sku_key)
  if(v==='raw'){ const k=codeKey(code); openCard(sinArchivoProduct({ sku_key:k, producto:'Código '+k, barcode:k }), m, det); }
}
function vibrate(ok){ try{ if(navigator.vibrate) navigator.vibrate(ok?70:[60,50,60]); }catch(_){} }
/* ── Families (§7.2): envío lines grouped by familyKey; built in openRecibir ── */
function siblingsOf(p){
  const f=familyKey(p.producto); if(f.length<4) return [];
  return (S.famLines.get(f)||[]).filter(l=>l.sku_key!==p.sku_key);
}
// §7.1 look-alikes: same family first, then envío lines sharing ≥2 significant words
function lookAlikes(p){
  const out=siblingsOf(p).slice(0,3); if(out.length>=3) return out;
  const words=new Set(normName(p.producto).split(' ').filter(w=>w.length>=4 && !/\d/.test(w)));
  if(words.size<2) return out;
  const scored=[];
  for(const l of S.lines.values()){
    if(out.includes(l) || l.sku_key===p.sku_key) continue;
    let n=0; for(const w of new Set(l._n.split(' '))) if(words.has(w)) n++;
    if(n>=2) scored.push({ l, n });
  }
  scored.sort((a,b)=>b.n-a.n || a.l._n.localeCompare(b.l._n));
  return out.concat(scored.slice(0,3-out.length).map(x=>x.l));
}
// §7.1 — not in the envío: photo of what was scanned + up to 3 envío look-alikes ("Era este otro")
async function notInEnvio(p, metodo, det){
  const looks=lookAlikes(p);
  const looksHtml=looks.length ? `<p style="margin:12px 0 0;font-weight:700;color:var(--gray-900)">¿Era alguno de estos? Sí vienen en el envío:</p>`
    +looks.map((l,i)=>{ const pos=positionOf(l.barcode, l.producto);
      return `<button class="look-item" data-mv="look:${i}">${imgTag(l.barcode, l.producto, 'thumb')}<div style="flex:1;min-width:0"><div class="res-name">${nameHtml(l.producto)}</div>`
        +`<div class="res-sub">${pos?escapeHtml(pos.palabra+' '+pos.full):'sin posición'}</div></div><span class="look-cta">Era este otro</span></button>`; }).join('') : '';
  const v=await showModal({ title:'Este producto no viene en el envío.',
    html:`<div class="modal-prod">${imgTag(p.barcode, p.producto, 'thumb')}<div class="res-name">${nameHtml(p.producto)}</div></div>${looksHtml}`,
    buttons:[{label:'Volver a escanear', value:'again', kind:'primary'}, {label:'Sí, llegó este producto', value:'yes', kind:'danger'}] });
  if(v==='yes') openCard({ ...p, enEnvio:false }, metodo, det);
  else if(v && v.startsWith('look:')){
    const l=looks[Number(v.slice(5))];
    // The scan is re-attributed to the chosen envío line; detalle keeps what was actually scanned
    if(l) openCard({ ...l, enEnvio:true }, metodo, Object.assign({}, det, { reatribuido_de:{ sku_key:p.sku_key, producto:p.producto } }));
  }
}

/* ── Product card ── */
// §6.2b — without a file the unit isn't known: the receptor picks Pz / Kg on the card
function sinArchivoProduct(p){ return p.kgpzKnown ? { ...p, enEnvio:null } : { ...p, enEnvio:null, kgpz:null, kgpzUnknown:true }; }
// Recontar (§6.2b Revisar ahora, §6.5): the receptor types the TOTAL counted now; stored as an ajuste
function openRecount(sku, origen, after){
  const l=S.lines.get(sku), ne=S.noEsperados.get(sku);
  const p=l ? { ...l, enEnvio:true } : { sku_key:sku, producto:ne?ne.producto:sku, barcode:sku.startsWith('name:')?'':sku, kgpz:ne?ne.kgpz:'Pz', enEnvio:false };
  if(!document.getElementById('screen-recibir').classList.contains('active')) showScreen('screen-recibir');
  closeSheet();
  S.current={ p, metodo:'recuento', det:{ recuento:true, origen }, recount:true, after };
  renderCard();
  const q=document.getElementById('qty-input'); if(q) setTimeout(()=>q.focus(), 40);
  document.getElementById('card-area').scrollIntoView({ block:'start', behavior:'smooth' });
}
function openCard(p, metodo, det={}){

}
function cancelCard(){ S.current=null; renderCard(); focusScan(); }
function renderCard(){

    <div id="sibling-slot">${sibs.length?`<div class="banner yellow">⚠️ Ojo: también vienen ${sibs.map(s=>'<b>'+escapeHtml(s.producto)+'</b>').join(', ')}. Cuenta por separado.
      ${sibs.slice(0,3).map(s=>`<div class="sib-row">${imgTag(s.barcode, s.producto, 'thumb')}<span>${nameHtml(s.producto)}</span></div>`).join('')}</div>`:''}</div>

    ${ya>0?`<div class="banner gray">Ya registraste ${fmtQty(ya,p.kgpz||'Kg')} ${p.kgpz?unitOf(p.kgpz):''} de este producto.</div>`:''}
    ${kg?'<div class="banner blue">⚖️ Pésalo en la báscula</div>':''}
    <label class="qty-label" for="qty-input">${c.recount?(kg?'Total en kg (báscula)':'Total de piezas contadas ahora'):kg?'kg (báscula)':'Piezas contadas'}</label>
    <input id="qty-input" class="qty-input" type="text" inputmode="${kg?'decimal':'numeric'}" autocomplete="off" placeholder="${kg?'0.00':'0'}">
    <div class="qty-err" id="qty-err"></div>
    <div class="pcard-actions"><button class="btn btn-secondary" onclick="cancelCard()">Cancelar</button><button class="btn btn-primary" onclick="confirmCard()">Registrar</button></div>
  </div>`;
  const q=document.getElementById('qty-input');
  q.value=c.val||''; // background re-renders (sorting loaded, server sync) keep what was typed
  wireQtyInput(q);
  if(hadFocus) q.focus();

// A scanner burst that lands in the quantity field is a new scan, not a quantity.
let _qtyScanT=null;
function wireQtyInput(q){
  q.addEventListener('keydown', e=>{
    if(e.key!=='Enter') return;
    e.preventDefault(); clearTimeout(_qtyScanT);
    if(/^\d{8,}$/.test(q.value.trim())){ const v=q.value; q.value=''; S.current=null; renderCard(); processScan(v,'scanner'); return; }
    confirmCard();
  });
  q.addEventListener('input', ()=>{
    if(S.current) S.current.val=q.value;
    document.getElementById('qty-err').textContent='';
    clearTimeout(_qtyScanT);
    if(/^\d{8,}$/.test(q.value.trim())) _qtyScanT=setTimeout(()=>{ const v=q.value; q.value=''; S.current=null; renderCard(); processScan(v,'scanner'); }, SCAN_AUTO_SUBMIT_MS);
  });
}
// Pz: whole pieces · Kg: up to 2 decimals (§7.4). allowZero for corrections.
function parseQty(raw, kgpz, allowZero=false){
  const s=String(raw||'').trim().replace(',','.');
  if(kgpz==='Kg' ? !/^\d+(\.\d{1,2})?$/.test(s) && !/^\.\d{1,2}$/.test(s) : !/^\d+$/.test(s)) return null;
  const n=round2(Number(s));
  return (n>0 || (allowZero && n===0)) ? n : null;
}
function pickUnit(u){ if(!S.current) return; S.current.p.kgpz=u; renderCard(); const q=document.getElementById('qty-input'); if(q) q.focus(); }
// §7.6 scale tolerance: ±5% of enviado or ±0.10 kg, whichever is larger
function kgTol(esperado){ return Math.max(0.05*esperado, 0.10); }
function overEnviado(line, total){ return line.kgpz==='Kg' ? total > round2(line.esperado+kgTol(line.esperado)) : total > line.esperado; }
// §7.2-qty + §7.4 — blocking only to stop a wrong number; the enviado number is never shown (still blind).
async function guardQty(c, qty){
  const p=c.p, line=p.enEnvio ? S.lines.get(p.sku_key) : null, kg=p.kgpz==='Kg', u=unitOf(p.kgpz);
  const total = c.recount ? qty : round2(recibidoDe(p.sku_key)+qty);
  if(line){
    if(overEnviado(line, total)){
      if(!c.overWarned){
        c.overWarned=true;
        await showModal({ title:'Esta cantidad es mayor a lo enviado. Vuelve a contar.',
          html:`<p>Cuenta otra vez ${kg?'(pésalo de nuevo)':'pieza por pieza'} y escribe la cantidad.</p>`,
          buttons:[{label:'Volver a contar', value:'again', kind:'primary'}] });
        const q=document.getElementById('qty-input'); if(q){ q.value=''; c.val=''; }
        return false;
      }
      c.det.sobrante=true; // counted twice and still above: stored and flagged Sobrante for the summary
    }
    // Typo guard: 120 instead of 12
    const big = kg ? (qty>3*line.esperado || qty>50) : (qty>3*line.esperado || qty>200);
    if(big && c.typoOk!==qty){
      const v=await showModal({ title:`¿Seguro que son ${fmtQty(qty,p.kgpz)} ${u}?`,
        html:`<p>Es mucho más de lo normal para este producto. Revisa que no sobre un número.</p>`,
        buttons:[{label:`Sí, son ${fmtQty(qty,p.kgpz)} ${u}`, value:'yes', kind:'warn'}, {label:'Corregir', value:'no', kind:'secondary'}] });
      if(v!=='yes') return false;
      c.typoOk=qty;
    }
    // §7.2-qty: sibling in the envío and more than one piece
    if(!kg && qty>1 && siblingsOf(p).length && c.sibOk!==qty){
      const pres=presentacion(p.producto);
      const v=await showModal({ title:`¿Revisaste pieza por pieza que las ${qty} son ${pres?pres.t:p.producto}?`,
        html:`<p>En este envío también viene ${siblingsOf(p).map(s=>'<b>'+escapeHtml(s.producto)+'</b>').join(', ')}.</p>`,
        buttons:[{label:'Sí, todas', value:'yes', kind:'primary'}, {label:'Voy a revisar', value:'no', kind:'secondary'}] });
      if(v!=='yes') return false;
      c.sibOk=qty; c.det.hermano_revisado=true;
    }
  } else {
    const big = kg ? qty>50 : qty>200;
    if(big && c.typoOk!==qty){
      const v=await showModal({ title:`¿Seguro que son ${fmtQty(qty,p.kgpz)} ${u}?`, html:'<p>Es una cantidad muy grande. Revisa que no sobre un número.</p>',
        buttons:[{label:`Sí, son ${fmtQty(qty,p.kgpz)} ${u}`, value:'yes', kind:'warn'}, {label:'Corregir', value:'no', kind:'secondary'}] });
      if(v!=='yes') return false;
      c.typoOk=qty;
    }
  }
  return true;
}
async function confirmCard(){
  const c=S.current; if(!c || c.busy) return;
  const q=document.getElementById('qty-input'), err=document.getElementById('qty-err');
  if(!c.p.kgpz){ err.textContent='Elige si se recibe por pieza o por peso.'; return; }
  const qty=parseQty(q.value, c.p.kgpz, c.recount);
  if(qty==null){
    err.textContent=c.p.kgpz==='Kg' ? 'Escribe el peso de la báscula (hasta 2 decimales).' : 'Escribe las piezas contadas (número entero).';
    q.focus(); return;
  }
  c.busy=true;
  const ok=await guardQty(c, qty);
  c.busy=false;
  if(S.current!==c) return;
  if(!ok){ const q2=document.getElementById('qty-input'); if(q2){ q2.focus(); q2.select(); } return; }
  const p=c.p;
  if(c.recount){
    const before=recibidoDe(p.sku_key);
    recordEvent(makeEvent('ajuste', { sku_key:p.sku_key, producto:p.producto, cantidad:round2(qty-before), metodo:'recuento',
      detalle:Object.assign({ antes:before, despues:qty, motivo:'Recuento', kgpz:p.kgpz }, c.det) }));
    toast(`✓ Recontado: ${fmtQty(qty,p.kgpz)} ${unitOf(p.kgpz)} · ${p.producto}`);
  } else {
    recordEvent(makeEvent('scan', { sku_key:p.sku_key, producto:p.producto, cantidad:qty, metodo:c.metodo,
      detalle:Object.assign({ esperado:p.enEnvio, kgpz:p.kgpz }, c.det) }));
    toast(`✓ ${fmtQty(qty,p.kgpz)} ${unitOf(p.kgpz)} · ${p.producto}`);
  }
  S.current=null;
  renderRecibir();
  focusScan();
  if(c.after) c.after();
}

/* ── Últimos 10 escaneos + Corregir (ajuste event, never a delete — rule 4) ── */
const MOTIVOS=['Conté mal','Escaneé el producto equivocado','Lo registré dos veces','Otro'];
function scanQtyNow(ev){ return round2((Number(ev.cantidad)||0)+(S.adjByRef.get(ev.detalle&&ev.detalle.uid)||0)); }
function kgpzOf(ev){ const l=S.lines.get(ev.sku_key); return l ? l.kgpz : ((ev.detalle&&ev.detalle.kgpz)||'Pz'); }
function renderRecent(){
  const el=document.getElementById('recent-list');
  const scans=S.events.filter(e=>e.tipo==='scan').slice(-10).reverse();
  if(!scans.length){ el.innerHTML='<div class="muted" style="font-size:13px">Todavía no hay escaneos.</div>'; return; }
  el.innerHTML=scans.map(ev=>{
    const u=ev.detalle&&ev.detalle.uid, kp=kgpzOf(ev), now=scanQtyNow(ev), orig=round2(ev.cantidad), line=S.lines.get(ev.sku_key);
    const meta=[localHM(new Date(ev.ts)), ev.receptor!==S.receptor?escapeHtml(ev.receptor):'', ev.metodo==='manual'?'sin código':ev.metodo==='camara'?'cámara':'', line?'':'<span style="color:var(--red);font-weight:700">no esperado</span>'].filter(Boolean).join(' · ');

    return `<div class="ritem"><div class="ritem-row">
