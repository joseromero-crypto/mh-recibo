/* FACTURA-PURE:BEGIN — invoice vs OC vs recibido (facturaProveedor-plan §7). No DOM, no globals: tests/factura.test.mjs
   evals this block. We pay only what was ordered AND received, in pieces (the read has no prices). */
// Exactly Invoice Reader's normCode (lean/match.ts): uppercase, keep 0-9A-Z, strip leading zeros of all-digit codes.
function facNormCode(v){ const s=String(v==null?'':v).toUpperCase().replace(/[^0-9A-Z]/g,''); return /^\d+$/.test(s)?s.replace(/^0+(?=\d)/,''):s; }
function facR2(n){ return Math.round(Number(n)*100)/100; }
// An OC line's codes: barcode, sku_key (not a 'name:' key) and the supplier's sku_marca, normalized. matchKeys come normalized.
function facLineKeys(l){
  const out=new Set();
  for(const v of [l.barcode, /^name:/.test(String(l.sku_key||''))?'':l.sku_key, l.sku_marca]){ const n=facNormCode(v); if(n) out.add(n); }
  return out;
}
// lines: the envío snapshot's OC lines; todas: cerrar.lineas_todas (pedido / recibido by sku_key); rows: the read's rows;
// picks: { sourceRow: sku_key | 'no_oc' } for rows the auxiliar identified by hand.
// → { lineas (every billed OC line), flagged (lines with something to look at), no_solicitados, no_identificados, conteo, ... }
function facComparar({ lines=[], todas=[], rows=[], picks={} }){
  const oc=lines.map(l=>({ l, keys:facLineKeys(l) }));
  const bySku=new Map(oc.map(o=>[o.l.sku_key, o]));
  const tBy=new Map(todas.map(t=>[t.sku_key, t]));
  const linked=new Map(), no_solicitados=[], no_identificados=[];
  const nombre=r=>r.productName || r.printedDescription || ('Renglón '+r.sourceRow);
  for(const r of rows){
    const mk=new Set(r.matchKeys||[]);
    const hits=oc.filter(o=>[...o.keys].some(k=>mk.has(k)));
    const pick=picks[r.sourceRow];
    let sku=null;
    if(hits.length===1) sku=hits[0].l.sku_key;
    else if(pick && pick!=='no_oc' && bySku.has(pick)) sku=pick;
    if(sku){ if(!linked.has(sku)) linked.set(sku, []); linked.get(sku).push(r); continue; }
    if(pick==='no_oc' || (!hits.length && r.confident)){
      no_solicitados.push({ sourceRow:r.sourceRow, producto:nombre(r), piezas:r.piezas, sku:r.sku||null, a_mano:pick==='no_oc'||undefined });
      continue;
    }
    // Suggestions first: the ambiguous hits, then OC lines a candidate's Masterview codes point to.
    const sug=hits.map(o=>o.l.sku_key);
    for(const c of (r.candidates||[])){
      const ck=new Set([...(c.barcodes||[]), ...(c.supplierSku?[c.supplierSku]:[])]);
      for(const o of oc) if(!sug.includes(o.l.sku_key) && [...o.keys].some(k=>ck.has(k))) sug.push(o.l.sku_key);
    }
    no_identificados.push({ sourceRow:r.sourceRow, descripcion:r.printedDescription||'', codigos:(r.printedCodes||[]).map(c=>c.value), piezas:r.piezas,
      ambiguo:hits.length>1, sugeridas:sug });
  }
  const lineas=[];
  for(const [sku, rs] of linked){
    const l=bySku.get(sku).l, t=tBy.get(sku)||{};
    const pedido=facR2(t.pedido!=null?t.pedido:(l.esperado||0)), recibido=facR2(t.recibido||0);
    const kg=(t.kgpz||l.kgpz)==='Kg', dudosa=rs.some(r=>r.piezas==null || r.quantityOk===false);
    const x={ sku_key:sku, producto:l.producto, kgpz:kg?'Kg':'Pz', pedido, recibido, filas:rs.map(r=>r.sourceRow) };
    if(kg || dudosa){ x.revisar=kg?'kg':'cantidad'; x.facturado=dudosa?null:facR2(rs.reduce((s,r)=>s+Number(r.piezas),0)); }
    else{
      x.facturado=facR2(rs.reduce((s,r)=>s+Number(r.piezas),0));
      x.de_mas=Math.max(0, facR2(x.facturado-pedido));
      x.no_fisico=Math.max(0, facR2(Math.min(x.facturado, pedido)-recibido));
    }
    lineas.push(x);
  }
  const order=new Map(lines.map((l,i)=>[l.sku_key,i]));
  lineas.sort((a,b)=>order.get(a.sku_key)-order.get(b.sku_key));
  const flagged=lineas.filter(x=>x.revisar || x.de_mas>0 || x.no_fisico>0);
  const sum=(a,k)=>facR2(a.reduce((s,x)=>s+(Number(x[k])||0),0));
  return { lineas, flagged, no_solicitados, no_identificados,
    conteo:{ no_solicitado:no_solicitados.length, de_mas:lineas.filter(x=>x.de_mas>0).length, no_fisico:lineas.filter(x=>x.no_fisico>0).length,
      por_revisar:lineas.filter(x=>x.revisar).length, no_identificado:no_identificados.length },
    // pieces only: rows billing a Kg line are left out of the total
    piezas:{ facturadas:sum(rows.filter(r=>r.piezas!=null && !lineas.some(x=>x.kgpz==='Kg' && x.filas.includes(r.sourceRow))),'piezas'), de_mas:sum(lineas,'de_mas'), no_fisico:sum(lineas,'no_fisico'), no_solicitado:sum(no_solicitados,'piezas') },
    limpia:!flagged.length && !no_solicitados.length && !no_identificados.length };
}
// read_ids another reception has linked: each session's latest 'factura' event counts (a later one, or a bypass,
// frees the read it replaced). events: factura rows in id order; sid: the reception asking (its own link never hides).
function facLigadas(events, sid){
  const last=new Map(); for(const e of events) last.set(e.session_id, e);
  const out=new Set(); for(const [s, e] of last) if(s!==sid && e.detalle && e.detalle.read_id && !e.detalle.manual) out.add(e.detalle.read_id);
  return out;
}
// Supplier names from the order vs the read: norm, company suffixes out, any shared significant word counts.
function facMismoProveedor(a, b){
  const STOP=new Set('s a de c v sa cv rl r l sab sapi s.a. del la el y grupo distribuidora comercializadora mexico'.split(' '));
  const w=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(x=>x.length>2 && !STOP.has(x));
  const A=new Set(w(a)); return w(b).some(x=>A.has(x));
}
/* FACTURA-PURE:END */

/* ════════════════════════════════════════════════════════════════════════════════════
   FACTURA DEL PROVEEDOR (facturaProveedor-plan §7). Invoice Reader reads the photos; this app never touches its
   tables, only POST /api/recepcion (start → PUT each photo → submit → read; list). The comparison is ours
   (facComparar above) and is saved as a 'factura' rec_events row (latest wins). Recibir only ever shows a status,
   never what the invoice says (blind count).
   ════════════════════════════════════════════════════════════════════════════════════ */
const IR_URL='https://invoicereader.joseromero.co/api/recepcion';
// CORS only lets https://mh-recibo.joseromero.co in, so localhost uses a stub fed by fixtures/factura_stub.json
const IR_LOCAL = IS_LOCAL && !DEMO && !/[?&]irlive=1/.test(location.search);
const FAC_MAX=8, FAC_PX=2576, FAC_Q=0.85, FAC_POLL_MS=4000, FAC_HORAS=24;
const FAC={}; // session_id → { sid, hub, fotos:[Blob], urls:[], estado, documentId, subido, error, reads, poll, esperando, busy }
let FACV=null; // closed-view box: { info, lines, saved, savedLocal, lista, elegida, picks, ack, cambiando, manual, error, saving }

async function irPost(body){
  if(IR_LOCAL) return irStub(body);
  const r=await fetch(IR_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  let j=null; try{ j=await r.json(); }catch(_){}
  if(!r.ok){ const e=new Error((j&&j.error)||('Error '+r.status)); e.status=r.status; throw e; }
  return j||{};
}
async function irPut(url, blob){
  if(IR_LOCAL) return;
  const r=await fetch(url, { method:'PUT', headers:{'Content-Type':'image/jpeg'}, body:blob });
  if(!r.ok){ const e=new Error('No se pudo subir la foto ('+r.status+')'); e.status=r.status; throw e; }
}
const IR_STUB={ docs:[], rec:undefined };
async function irStub(b){
  await new Promise(r=>setTimeout(r, 300));
  if(IR_STUB.rec===undefined){ try{ IR_STUB.rec=await (await fetch('fixtures/factura_stub.json',{cache:'no-store'})).json(); }catch(_){ IR_STUB.rec=null; } }
  const asRead=(d)=>Object.assign({ read_id:d.id, status:Date.now()-d.t<6000?'processing':IR_STUB.rec?'done':'failed', error:IR_STUB.rec?null:'Sin fixtures/factura_stub.json',
    invoice_date:todayStr(), external_ref:d.sid }, IR_STUB.rec&&Date.now()-d.t>=6000?IR_STUB.rec:{ rows:[], warnings:[] });
  if(b.action==='start'){ const id=crypto.randomUUID(); IR_STUB.docs.unshift({ id, sid:b.sessionId, t:Infinity });
    return { documentId:id, uploads:Array.from({ length:b.photoCount }, (_,i)=>({ page:i+1, signedUrl:'stub:', token:'', path:'' })) }; }
  if(b.action==='submit'){ const d=IR_STUB.docs.find(x=>x.id===b.documentId); if(d) d.t=Date.now(); return { status:'queued' }; }
  if(b.action==='read') return { reads:IR_STUB.docs.filter(d=>d.sid===b.sessionId && d.t!==Infinity).map(asRead) };
  if(b.action==='list') return { reads:IR_STUB.rec?[Object.assign({ read_id:'stub-list', status:'done', error:null, invoice_date:todayStr(), external_ref:null, purpose:'captura',
    created_at:new Date(Date.now()-3600e3).toISOString(), scanned_by:'Auxiliar de prueba' }, IR_STUB.rec)]:[] };
  if(b.action==='photos') return { photos:[{ page:1, url:'icon-512.png' }] };
}

/* ── Photos waiting to be sent live in IndexedDB, so a reload or a lost signal never loses them ── */
function facDb(){ return new Promise((ok,ko)=>{ const r=indexedDB.open(DEMO?'mr_factura_demo':'mr_factura', 1); r.onupgradeneeded=()=>r.result.createObjectStore('fotos'); r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); }); }
async function facIdb(mode, fn){
  try{ const db=await facDb(); return await new Promise((ok,ko)=>{ const tx=db.transaction('fotos', mode), req=fn(tx.objectStore('fotos')); tx.oncomplete=()=>ok(req&&req.result); tx.onerror=()=>ko(tx.error); }); }
  catch(_){ return undefined; }
}
async function facSave(f){
  const ok=await facIdb('readwrite', st=>st.put({ sid:f.sid, hub:f.hub, fotos:f.fotos, documentId:f.documentId, subido:f.subido, enviar:!!f.enviar, ts:Date.now() }, f.sid));
  if(ok===undefined && f.fotos.length) toast('No se pudieron guardar las fotos en el teléfono: no cierres la app hasta que se suban', 5000);
}
const facDrop=sid=>facIdb('readwrite', st=>st.delete(sid));

function facOf(sid, hub){ return FAC[sid] || (FAC[sid]={ sid, hub, fotos:[], urls:[], estado:'sin', documentId:null, subido:false, error:null, reads:null, poll:null, esperando:null, busy:false }); }
function facSetFotos(f, fotos){ f.urls.forEach(u=>URL.revokeObjectURL(u)); f.fotos=fotos; f.urls=fotos.map(b=>URL.createObjectURL(b)); }
// 24 h from the session's start (its id ends with the epoch ms): Invoice Reader refuses start after that.
function facVigente(sid){ const t=Number(String(sid).split('__').pop()); return !t || serverNow().getTime()-t < FAC_HORAS*3600e3; }
async function facInit(sid, hub){
  const f=facOf(sid, hub);
  if(!f.fotos.length){
    const s=await facIdb('readonly', st=>st.get(sid));
    // photos taken but never sent wait for the auxiliar; photos they sent (offline) go out on their own
    if(s && s.fotos && s.fotos.length){ facSetFotos(f, s.fotos); f.documentId=s.documentId||null; f.subido=!!s.subido; f.enviar=!!s.enviar; f.estado=f.enviar?'pendiente':'fotos';
      facRender(sid); if(f.enviar) facEnviar(sid); else await facRefresh(sid); return; }
  }
  await facRefresh(sid);
}
// Photos left from a visit that reloaded or lost signal: send them on start and whenever the signal returns.
async function facRetryAll(){
  const keys=await facIdb('readonly', st=>st.getAllKeys()); if(!keys) return;
  for(const sid of keys){ const f=FAC[sid];
    if(!f) await facInit(sid, String(sid).split('__')[0]);
    else if(f.fotos.length && f.enviar && !f.busy && f.estado!=='error') await facEnviar(sid); }
}
window.addEventListener('online', ()=>{ facRetryAll(); });
setTimeout(facRetryAll, 3000);

function facEstado(f){
  if(f.busy) return 'subiendo';
  if(f.fotos.length) return ['pendiente','error'].includes(f.estado)?f.estado:'fotos';
  if(f.estado==='vencida') return 'vencida';
  const r=(f.reads||[])[0];
  if(f.esperando && (!r || r.read_id!==f.esperando.id || (r.status!=='done' && Date.now()-f.esperando.t<8000))) return 'leyendo';
  if(!r) return 'sin';
  return r.status==='done'?'lista':r.status==='failed'?'fallo':'leyendo';
}
async function facRefresh(sid){
  const f=FAC[sid]; if(!f) return;
  try{ f.reads=(await irPost({ action:'read', sessionId:sid })).reads||[]; f.readErr=null; }
  catch(e){ f.readErr=isNetErr(e)?'Sin conexión':e.message; }
  const st=facEstado(f);
  if(st==='leyendo' && !(f.esperando && Date.now()-f.esperando.t>180000)) facPoll(sid); else facStopPoll(f);
  if(st!=='leyendo') f.esperando=null;
  facRender(sid);
}
function facPoll(sid){ const f=FAC[sid]; if(!f || f.poll) return; f.poll=setInterval(()=>{ if(document.visibilityState==='visible') facRefresh(sid); }, FAC_POLL_MS); }
function facStopPoll(f){ if(f.poll){ clearInterval(f.poll); f.poll=null; } }

/* ── Taking the photos: camera or files, downscaled here to ≤2576 px, JPEG q85 ── */
function facAbrir(sid){ const f=FAC[sid]; if(f){ f.abierto=true; facRender(sid); } }
function facPick(sid, cam){
  let inp=document.getElementById('fac-input');
  if(!inp){ inp=document.createElement('input'); inp.type='file'; inp.id='fac-input'; inp.accept='image/*'; inp.hidden=true; inp.onchange=()=>facAddFiles(inp); document.body.appendChild(inp); }
  inp.dataset.sid=sid; inp.multiple=!cam; if(cam) inp.setAttribute('capture','environment'); else inp.removeAttribute('capture');
  inp.value=''; inp.click();
}
async function facReduce(file){
  let src, w, h, url=null;
  try{ src=await createImageBitmap(file, { imageOrientation:'from-image' }); w=src.width; h=src.height; }
  catch(_){ url=URL.createObjectURL(file); src=await new Promise((ok,ko)=>{ const im=new Image(); im.onload=()=>ok(im); im.onerror=()=>ko(new Error('No se pudo abrir la foto')); im.src=url; }); w=src.naturalWidth; h=src.naturalHeight; }
  const k=Math.min(1, FAC_PX/Math.max(w,h)), c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  if(src.close) src.close(); if(url) URL.revokeObjectURL(url);
  return await new Promise((ok,ko)=>c.toBlob(b=>b?ok(b):ko(new Error('No se pudo preparar la foto')), 'image/jpeg', FAC_Q));
}
async function facAddFiles(inp){
  const sid=inp.dataset.sid, f=FAC[sid]; if(!f) return;
  const files=[...(inp.files||[])]; if(!files.length) return;
  const room=FAC_MAX-f.fotos.length; if(files.length>room) toast(`Máximo ${FAC_MAX} fotos por factura`);
  f.preparando=true; facRender(sid);
  const out=f.fotos.slice();
  for(const file of files.slice(0, Math.max(0, room))){ try{ out.push(await facReduce(file)); }catch(e){ toast(e.message); } }
  f.preparando=false; f.estado='fotos'; f.error=null; f.documentId=null; f.subido=false; f.enviar=false; facSetFotos(f, out);

}
async function facQuitar(sid, i){ const f=FAC[sid]; if(!f || f.busy) return; const a=f.fotos.slice(); a.splice(i,1); facSetFotos(f, a); f.documentId=null; f.subido=false;
  if(a.length) await facSave(f); else { await facDrop(sid); f.estado='sin'; } facRender(sid); }
async function facEnviar(sid){
  const f=FAC[sid]; if(!f || f.busy || !f.fotos.length) return;
  f.busy=true; f.error=null; f.enviar=true; facRender(sid); await facSave(f);
  try{
    // start needs this session's 'abrir' on the server
    if(OUTBOX.some(e=>e.session_id===sid)){ await flushAndWait(); if(OUTBOX.some(e=>e.session_id===sid)) throw new TypeError('offline'); }
    if(!(f.documentId && f.subido)){
      const st=await irPost({ action:'start', sessionId:sid, photoCount:f.fotos.length });
      f.documentId=st.documentId; f.subido=false;
      for(const u of (st.uploads||[]).slice().sort((a,b)=>a.page-b.page)) await irPut(u.signedUrl, f.fotos[u.page-1]);
      f.subido=true; await facSave(f);
    }
    await irPost({ action:'submit', sessionId:sid, documentId:f.documentId });
    f.esperando={ id:f.documentId, t:Date.now() };
    facSetFotos(f, []); f.documentId=null; f.subido=false; f.enviar=false; f.estado='sin'; await facDrop(sid);
    if(FACV && FACV.info.session_id===sid){ FACV.cambiando=false; FACV.elegida=null; FACV.picks={}; FACV.ack=false; }
    f.busy=false; await facRefresh(sid);
  }catch(e){
    f.busy=false;
    if(isNetErr(e)) f.estado='pendiente';
    else if(e.status===410){ f.estado='vencida'; f.error=e.message; facSetFotos(f, []); await facDrop(sid); }

// Same photos, read again (a failed read): submit on the same documentId
async function facReleer(sid, documentId){

  catch(e){ toast(isNetErr(e)?'Sin conexión: intenta de nuevo':e.message, 4000); }
  f.busy=false; await facRefresh(sid);
}

/* ── Closed reception: compare, ask, save ── */
async function facBoxLoad(info, opts={}){
  const sid=info.session_id;
  FACV={ info, lines:null, saved:null, lista:null, elegida:null, picks:{}, ack:false, cambiando:false, manual:false, motivo:'', error:null, saving:false, recomparar:null, compStart:0 };
  facOf(sid, info.hub); facBoxRender();
  try{
    const [ev, env]=await Promise.all([
      pgSelect('rec_events', `session_id=eq.${encodeURIComponent(sid)}&tipo=eq.factura&select=detalle,ts,receptor&order=id.desc&limit=1`),
      info.envio?sbFetch(info.envio).then(t=>JSON.parse(t)):Promise.resolve(null)]);
    if(!FACV || FACV.info.session_id!==sid) return;
    const local=OUTBOX.filter(e=>e.session_id===sid && e.tipo==='factura').pop();
    FACV.saved=local?{ detalle:local.detalle, ts:local.ts, receptor:local.receptor }:ev[0]||null;
    FACV.lines=(env&&env.lines)||[];
  }catch(e){ if(FACV) FACV.error=isNetErr(e)?'Sin conexión: no se pudo cargar la revisión de la factura.':'No se pudo cargar la orden ('+e.message+').'; }
  // After «Corregir lo recibido»: compare the same invoice again against the new close (manual reviews only get their CSV columns back)
  const sv=FACV && FACV.saved && FACV.saved.detalle;
  if(opts.recomparar && sv && !FACV.error){
    if(sv.manual || !sv.read_id) facReporte(info, sv).catch(()=>{});
    else Object.assign(FACV, { recomparar:sv.read_id, cambiando:true, ack:true, picks:Object.assign({}, sv.picks||{}) });
  }
  await facInit(sid, info.hub);
  facBoxRender();
}
function facBoxRender(){
  const el=document.getElementById('fac-box'); if(!el || !FACV) return;
  el.innerHTML=facBoxInner();
  facAutoGuardar();
}
const facDone=f=>(f.reads||[]).find(r=>r.status==='done')||null;
// The read to compare: one picked from the list, else this session's newest done read (while changing the invoice, not the
// one already saved — the auxiliar is choosing another).
function facLectura(){
  if(FACV.elegida) return FACV.elegida;
  const f=FAC[FACV.info.session_id], d=f && facDone(f);
  if(FACV.recomparar){ const id=FACV.recomparar; return (f&&f.reads||[]).find(x=>x.read_id===id && x.status==='done') || (FACV.lista||[]).find(x=>x.read_id===id && x.status==='done') || null; }
  if(!d) return null;
  if(FACV.cambiando && FACV.saved && FACV.saved.detalle && FACV.saved.detalle.read_id===d.read_id) return null;
  return d;
}
function facAvisos(r){ return r && (r.totals_ok===false || (r.warnings||[]).length>0); }
function facCmp(r){ return facComparar({ lines:FACV.lines||[], todas:FACV.info.lineas_todas||[], rows:r.rows||[], picks:FACV.picks }); }
// No question left (no page warning, nobody to identify) → save right away; with questions, the auxiliar saves.
function facAutoGuardar(){
  if(FACV.saving || (FACV.saved && !FACV.cambiando) || !FACV.lines) return;
  const f=FAC[FACV.info.session_id], r=facLectura(); if(!r || !f || ['fotos','subiendo','pendiente','error'].includes(facEstado(f))) return;
  if(facAvisos(r) && !FACV.ack) return;
  if(FACV.saved && FACV.saved.detalle && FACV.saved.detalle.read_id===r.read_id && !FACV.cambiando) return;
  if(facComparando()) return;
  const c=facCmp(r); if(c.no_identificados.length || (Object.keys(FACV.picks).length && !FACV.recomparar)) return;
  facGuardar(r, c);
}
// «Comparando…» stays up at least FAC_COMP_MS, so the receptor sees the reception being checked against the invoice
const FAC_COMP_MS=1600;
function facComparando(){
  if(!FACV.compStart) FACV.compStart=Date.now();
  const left=FAC_COMP_MS-(Date.now()-FACV.compStart); if(left<=0) return false;
  clearTimeout(FACV._compT); FACV._compT=setTimeout(()=>{ if(FACV) facBoxRender(); }, left+30);
  return true;
}
function facLoaderHtml(t, sub){ return `<div class="fac-load"><div class="spin"></div><div>${t}${sub?`<small>${sub}</small>`:''}</div></div>`; }

    invoice_date:r.invoice_date||null, totals_ok:r.totals_ok==null?null:r.totals_ok, warnings:(r.warnings||[]).length?r.warnings:undefined, avisos_aceptados:facAvisos(r)||undefined,
    filas:(r.rows||[]).length, piezas:c.piezas, conteo:c.conteo, limpia:c.limpia, lineas:c.lineas, no_solicitados:c.no_solicitados,

async function facGuardar(r, c){ await facGuardarDetalle(facDetalle(r, c)); }
async function facGuardarDetalle(detalle){
  const V=FACV; if(!V || V.saving) return; V.saving=true;
  const I=V.info;
  const ev={ session_id:I.session_id, hub:I.hub, area:I.area, fecha:I.fecha, tipo:'factura', sku_key:null, producto:null, cantidad:null, metodo:null,
    detalle:Object.assign({ uid:newUid() }, detalle), receptor:S.receptor||INI.receptor||null, device_id:DEVICE_ID, ts:serverNow().toISOString() };

// The stored report gets three columns (Folio factura, Facturado, Revisión factura) plus one row per invoice line that
// isn't on the order (Estado «Facturado sin pedir», which the closed view and Admin → Proveedores skip).
const FAC_COLS=['Folio factura','Facturado','Revisión factura'], FAC_ESTADO_SIN_PEDIR='Facturado sin pedir';
function facLineaTxt(x, kgpz){
  if(!x) return 'No facturado';
  const q=v=>fmtQty(v, kgpz||x.kgpz), u=unitOf(kgpz||x.kgpz);
  if(x.revisar) return x.revisar==='kg'?'Kg: revisar a mano':'Cantidad por revisar';
  const t=[]; if(x.de_mas>0) t.push(`Cobra ${q(x.de_mas)} ${u} de más`); if(x.no_fisico>0) t.push(`Cobra ${q(x.no_fisico)} ${u} no recibidas`);
  return t.join(' · ')||'OK';
}
async function facReporte(I, d){
  const csv=(RV && RV.info.reporte===I.reporte)?RV.csv:await sbFetch(I.reporte);
  const p=Papa.parse(stripBOM(csv), { header:true, skipEmptyLines:true });
  const fields=(p.meta.fields||[]).filter(k=>!FAC_COLS.includes(k)), cols=fields.concat(FAC_COLS);
  const by=new Map((d.lineas||[]).map(x=>[x.sku_key, x]));
  const rows=(p.data||[]).filter(r=>pickCol(r,'Estado')!==FAC_ESTADO_SIN_PEDIR).map(r=>{
    const k=skuKeyOf(cleanBC(pickCol(r,'Código')||''), pickCol(r,'Producto')||''), x=by.get(k), kgpz=pickCol(r,'Und')==='Kg'?'Kg':'Pz';
    const extra=d.manual?['', '', 'Sin revisión de factura: '+(d.motivo||'')]:[d.reference||'', x&&x.facturado!=null?fmtQty(x.facturado,kgpz):'', pickCol(r,'Estado')==='No solicitado'?'':facLineaTxt(x, kgpz)];
    return fields.map(k=>r[k]).concat(extra);
  });
  if(!d.manual) for(const n of (d.no_solicitados||[])){
    const o=Object.fromEntries(fields.map(k=>[k,'']));
    const f0=(p.data||[])[0]||{}; for(const k of ['Hub','Proveedor','Orden de compra','Fecha']) if(k in o) o[k]=f0[k]||'';
    o['Producto']=n.producto; o['Und']='Pz'; o['Pedido']='0'; o['Recibido']='0'; o['Estado']=FAC_ESTADO_SIN_PEDIR;
    rows.push(fields.map(k=>o[k]).concat([d.reference||'', n.piezas!=null?String(n.piezas):'', 'Producto no solicitado en OC']));
  }
  const out=[cols.map(csvCell).join(',')].concat(rows.map(r=>r.map(csvCell).join(','))).join('\r\n')+'\r\n';
  await sbUpload(I.reporte, out, 'text/csv; charset=utf-8');
  if(RV && RV.info.reporte===I.reporte) RV.csv=out;
}

        ${sug.length?`<optgroup label="Sugeridos">${sug.map(k=>o(k,name(k))).join('')}</optgroup>`:''}<optgroup label="${sug.length?'Otros de la orden':'Productos de la orden'}">${rest.map(l=>o(l.sku_key,l.producto)).join('')}</optgroup>
        ${o('no_oc','No está en la OC')}</select>`; };
    const pend=facComparar({ lines:FACV.lines, todas:I.lineas_todas||[], rows:r.rows||[], picks:{} }).no_identificados;
    const faltan=c.no_identificados.length;
    return h+`<div class="note">${pend.length===1?'Un renglón':pend.length+' renglones'} de la factura no se pudieron identificar. Elige a qué producto de la orden corresponde cada uno.</div>`
      +pend.map(n=>`<div class="info-card"><b>${escapeHtml(n.descripcion||'Renglón '+n.sourceRow)}</b><div class="muted">${n.codigos.length?'Código '+escapeHtml(n.codigos.join(', '))+' · ':''}${n.piezas!=null?fmtQty(n.piezas,'Pz')+' pz':'cantidad sin leer'}${n.ambiguo?' · coincide con varios productos':''}</div>${opts(n)}</div>`).join('')
      +`<button class="btn btn-warn btn-block" style="margin-bottom:12px" ${faltan||FACV.saving?'disabled':''} onclick="facGuardarPicks()">${faltan?`Faltan ${faltan} por elegir`:'Guardar revisión de la factura'}</button>`;
  }
  if(st==='leyendo' && !FACV.recomparar) return h+facLoaderHtml('Leyendo la factura…', 'Unos 15 segundos. Después se compara contra la recepción.');
  if(st==='fallo' && !FACV.recomparar){
    const fallas=(f.reads||[]).filter(x=>x.status==='failed').length;
    return h+facStripHtml(sid, true)+(fallas>=2?`<button class="link-btn" onclick="facManual()">Comparar a mano</button>`:'');
  }

  if(FACV.lista===null){ facCargarLista(); return h+(FACV.recomparar?facLoaderHtml('Comparando la recepción contra la factura…', 'Con lo que corregiste.'):'<div class="muted">Buscando facturas del proveedor…</div>'); }
  if(FACV.recomparar){ FACV.recomparar=null; FACV.picks={}; } // that read is gone: pick the invoice again
  const prov=I.proveedor||areaName(I.area), mine=FACV.lista.filter(x=>x.status==='done' && (facMismoProveedor(prov, x.supplier) || facMismoProveedor(prov, x.printed_supplier)));
  const otras=FACV.lista.filter(x=>x.status==='done' && !mine.includes(x));
  const opt=x=>`<div class="fac-opt"><button class="res-item" onclick="facElegir(${facJs(x.read_id)})"><div style="flex:1"><div class="res-name">${escapeHtml(facNombre(x))}</div>
    <div class="res-sub">${facSub(x)}</div></div><span style="font-size:20px">›</span></button>${facFotoLink(x.read_id)}</div>`;
  h+=f.readErr?`<div class="err-box">${escapeHtml(f.readErr)}</div>`:'';
  if(mine.length===1){ const x=mine[0];
    h+=`<div class="info-card"><div class="muted">Factura de ${escapeHtml(prov)} escaneada en Invoice Reader:</div><div class="res-name" style="margin-top:4px">${escapeHtml(facNombre(x))}</div>
      <div class="muted">${facSub(x)}</div>${facFotoLink(x.read_id)}
      <button class="btn btn-warn btn-block" style="margin-top:10px" onclick="facElegir(${facJs(x.read_id)})">Sí, es esta factura</button></div>`; }
  else if(mine.length) h+=`<div class="muted" style="margin-bottom:8px">Facturas de ${escapeHtml(prov)} escaneadas en Invoice Reader:</div>`+mine.map(opt).join('');
  else h+=`<div class="muted" style="margin-bottom:8px">No hay factura leída de ${escapeHtml(prov)}.</div>`;
  if(otras.length) h+=`<details style="margin:8px 0"><summary class="muted" style="cursor:pointer">${mine.length===1?'No es esta: ver o':'O'}tras facturas del hub · ${otras.length}</summary>${otras.map(opt).join('')}</details>`;
  if(FACV.ligadas) h+=`<div class="muted" style="margin:4px 0 8px">${FACV.ligadas===1?'Una factura ya está ligada':FACV.ligadas+' facturas ya están ligadas'} a otra recepción y no se muestra${FACV.ligadas===1?'':'n'}.</div>`;
  if(facVigente(sid) && st!=='vencida') h+=`<div class="muted" style="margin-top:10px">O tómale foto ahora:</div>`+facStripHtml(sid, true);
  return h+`<button class="link-btn" onclick="facCargarLista(true)">Actualizar</button>`
    +(FACV.cambiando?`<button class="link-btn" onclick="FACV.cambiando=false;facBoxRender()">Dejar la revisión guardada</button>`:`<button class="link-btn" onclick="facManual()">Comparar a mano (sin factura leída)</button>`);
}
async function facCargarLista(force){
  if(!FACV || (FACV._listando && !force)) return; FACV._listando=true;
  if(force){ FACV.lista=null; facBoxRender(); const f=FAC[FACV.info.session_id]; if(f) await facRefresh(f.sid); }
  try{
    const I=FACV.info, [l, evs]=await Promise.all([irPost({ action:'list', hubSlug:I.hub, since:I.fecha+'T00:00:00-06:00' }),
      pgSelectAll('rec_events', `hub=eq.${encodeURIComponent(I.hub)}&tipo=eq.factura&fecha=gte.${ymdAdd(I.fecha,-30)}&select=id,session_id,detalle&order=id.asc`)]);
    const ligadas=facLigadas(evs.concat(OUTBOX.filter(e=>e.tipo==='factura' && e.hub===I.hub)), I.session_id);
    FACV.ligadas=(l.reads||[]).filter(x=>ligadas.has(x.read_id)).length;
    FACV.lista=(l.reads||[]).filter(x=>!ligadas.has(x.read_id));
  }
  catch(e){ FACV.lista=[]; const f=FAC[FACV.info.session_id]; if(f) f.readErr=isNetErr(e)?'Sin conexión: no se pudieron buscar facturas.':e.message; }
  FACV._listando=false; facBoxRender();
}

async function pgUpsert(table, rows, onConflict){

/* ── Recepciones: every hub+área, open and closed, by day (last 14 days) ── */
let _admRecep=[];
async function admRecepciones(){

    if(!r){ r={ session_id:e.session_id, hub:e.hub, area:e.area, fecha:e.fecha, abierta:e.ts, receptores:new Set(), cerrada:null, sinArchivo:false, envio:null, parciales:[] }; by.set(e.session_id, r); }
    if(e.receptor && e.receptor!=='Admin') r.receptores.add(e.receptor);
    const d=e.detalle||{};

    if(e.tipo==='abrir' || e.tipo==='reemplazo'){ if(d.envio) r.envio=d.envio; if(d.sin_archivo) r.sinArchivo=true; if(d.tras_sin_archivo) r.sinArchivo=false; }
    if(e.tipo==='cerrar') r.cerrada=Object.assign({ ts:e.ts, fecha:e.fecha, hub:e.hub, area:e.area, receptor:e.receptor, session_id:e.session_id }, d);
    if(e.tipo==='admin' && d.accion==='reabrir') r.cerrada=null;
    if(e.tipo==='admin' && d.accion==='borrar') r.borrada={ ts:e.ts, receptor:e.receptor, escaneos:d.escaneos||0 };
    if(e.tipo==='parcial') r.parciales.push(Object.assign({ ts:e.ts, fecha:e.fecha, hub:e.hub, area:e.area, receptor:e.receptor, session_id:e.session_id, parcial:true }, d));
  }
  _admRecep=[...by.values()].sort((a,b)=>b.fecha.localeCompare(a.fecha) || a.hub.localeCompare(b.hub) || a.area.localeCompare(b.area));
  let h='<div class="muted" style="margin-bottom:8px">Últimos 14 días. Una recepción abierta se reconstruye sola desde los eventos al abrirla en cualquier teléfono (Continuar recepción).</div>', day='';
  _admRecep.forEach((r,i)=>{
    if(r.fecha!==day){ day=r.fecha; h+=`<div class="section-title">${fechaLarga(day)}</div>`; }
    const c=r.borrada?null:r.cerrada;
    h+=`<div class="adm-row"><b>${escapeHtml(hubName(r.hub))} · ${isPdArea(r.area)?'Proveedor ':''}${escapeHtml(areaName(r.area))}</b> — ${r.borrada?`<span class="tag red">envío borrado ${localHM(new Date(r.borrada.ts))} por ${escapeHtml(r.borrada.receptor||'')}${r.borrada.escaneos?` · ${r.borrada.escaneos} escaneos descartados`:''}</span>`:c?`<span class="tag green">✓ cerrada ${localHM(new Date(c.ts))}</span>`:`<span class="tag orange">abierta desde ${localHM(new Date(r.abierta))}</span>`}${r.sinArchivo?' <span class="tag red">sin archivo</span>':''}${r.parciales.length?` <span class="tag orange">${r.parciales.length} entrega${r.parciales.length===1?'':'s'} parcial${r.parciales.length===1?'':'es'}</span>`:''}
      <div class="muted" style="font-size:12px">${escapeHtml([...r.receptores].join(', ')||'—')}${c?` · ${c.lineas||0} productos · ${c.diferencias||0} con diferencia`:''}</div>
      ${c?(c.badges||[]).map(b=>`<span class="badge-warn">${escapeHtml(b)}</span>`).join(''):''}
      <div class="btns">${c?`<button class="btn btn-secondary" onclick="openRecepcion(_admRecep[${i}].cerrada,'admin')">Ver</button>
        <button class="btn btn-secondary" onclick="admDescargar(${i})">CSV</button><button class="btn btn-warn" onclick="admReabrir(${i})">Reabrir</button>`:''}
        ${r.parciales.map((p,j)=>`<button class="btn btn-secondary" onclick="openRecepcion(_admRecep[${i}].parciales[${j}],'admin')">Entrega ${p.entrega}</button>`).join('')}</div></div>`;
  });

}
/* ── Calendario: view only. One hub, one month; every reception is a bar from the day it opened (session fecha) to
   the day it closed (Monterrey date of the cerrar). Still open: dashed, up to today if it's that área's newest
   session, else only its first day (abandoned). Borrar → not shown (it wasn't a reception). ── */
let _admCal=[];
function ymdAdd(ymd, n){ const d=new Date(Date.parse(ymd+'T12:00:00Z')+n*86400000); return d.toISOString().slice(0,10); }
function ymdDow(ymd){ return (new Date(Date.parse(ymd+'T12:00:00Z')).getUTCDay()+6)%7; } // 0 = lunes
function admCalMes(n){ const [y,m]=ADM.calMes.split('-').map(Number), d=new Date(Date.UTC(y,m-1+n,1)); ADM.calMes=d.toISOString().slice(0,7); renderAdmin(); }
async function admCalendario(){
  const today=todayStr(); if(!ADM.calMes) ADM.calMes=today.slice(0,7);
  const ini=ADM.calMes+'-01', fin=ymdAdd(ymdAdd(ini,32).slice(0,7)+'-01',-1);
  const gridIni=ymdAdd(ini,-ymdDow(ini)), gridFin=ymdAdd(fin,6-ymdDow(fin));
  // a session that opened up to 14 days before the grid can still reach into it
  const evs=await pgSelectAll('rec_events', `hub=eq.${encodeURIComponent(ADM.hub)}&tipo=in.(abrir,reemplazo,cerrar,admin,parcial)&fecha=gte.${ymdAdd(gridIni,-14)}&fecha=lte.${gridFin}&select=id,session_id,area,fecha,tipo,receptor,detalle,ts`);
  const by=new Map();
  for(const e of evs){
    let r=by.get(e.session_id);
    if(!r){ r={ session_id:e.session_id, hub:ADM.hub, area:e.area, fecha:e.fecha, receptores:new Set(), cerrada:null, borrada:false, parciales:0 }; by.set(e.session_id, r); }
    if(e.fecha<r.fecha) r.fecha=e.fecha;
    if(e.receptor && e.receptor!=='Admin') r.receptores.add(e.receptor);
    const d=e.detalle||{};
    if(d.proveedor && isPdArea(e.area)) PD_NAMES[e.area]=d.proveedor;
    if(e.tipo==='cerrar') r.cerrada=Object.assign({ ts:e.ts, fecha:e.fecha, hub:e.hub||ADM.hub, area:e.area, receptor:e.receptor, session_id:e.session_id }, d);
    if(e.tipo==='admin' && d.accion==='reabrir') r.cerrada=null;   // events come in id order: latest wins
    if(e.tipo==='admin' && d.accion==='borrar') r.borrada=true;
    if(e.tipo==='parcial') r.parciales++;
  }
  // Proveedor directo: one group for every supplier área (teal-light bars labelled with the supplier)
  const GRUPOS=AREAS.concat([{ id:'pd', name:'Proveedores' }]), grp=r=>isPdArea(r.area)?'pd':r.area, gi=r=>GRUPOS.findIndex(x=>x.id===grp(r));
  const ses=[...by.values()].filter(r=>!r.borrada && gi(r)>=0);
  const newest={}; ses.forEach(r=>{ if(!newest[r.area] || r.session_id>newest[r.area]) newest[r.area]=r.session_id; }); // ids end in epoch ms
  ses.forEach(r=>{
    r.desde=r.fecha;
    r.hasta=r.cerrada ? localDateStr(new Date(r.cerrada.ts)) : (newest[r.area]===r.session_id ? today : r.fecha);
    if(r.hasta<r.desde) r.hasta=r.desde;
  });
  ses.sort((a,b)=>gi(a)-gi(b) || a.desde.localeCompare(b.desde));
  _admCal=ses;
  // Days of this month (up to today) with a reception of each área
  const cubre={}; GRUPOS.forEach(a=>cubre[a.id]=new Set());
  ses.forEach(r=>{ for(let d=r.desde; d<=r.hasta; d=ymdAdd(d,1)) if(d>=ini && d<=fin) cubre[grp(r)].add(d); });
  const grupos=GRUPOS.filter(a=>a.id!=='pd' || ses.some(r=>grp(r)==='pd'));
  const diasMes=Math.max(0, daysBetween(ini, today<fin?today:fin)+1);
  let h=`<div class="filters">${hubSelectHtml('adm-hub', ADM.hub)}</div>
    <div class="cal-nav"><button onclick="admCalMes(-1)" aria-label="Mes anterior">‹</button><b>${MESES[Number(ADM.calMes.slice(5))-1]} ${ADM.calMes.slice(0,4)}</b><button onclick="admCalMes(1)" aria-label="Mes siguiente">›</button></div>
    <div class="cal-dow">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div>${d}</div>`).join('')}</div>`;
  for(let w=gridIni; w<=gridFin; w=ymdAdd(w,7)){
    const wEnd=ymdAdd(w,6);
    h+=`<div class="cal-week">`;
    for(let i=0;i<7;i++){ const d=ymdAdd(w,i);
      h+=`<div class="cal-day${d.slice(0,7)!==ADM.calMes?' out':''}${d>today?' fut':''}${d===today?' today':''}" style="grid-column:${i+1}"><span>${Number(d.slice(8))}</span></div>`; }
    // lanes: Abarrotes first, then Carnes; overlapping receptions of the same área take another lane
    let row=2;
    grupos.forEach(a=>{
      const lanes=[];
      ses.forEach((r,idx)=>{
        if(grp(r)!==a.id || r.hasta<w || r.desde>wEnd) return;
        const s=r.desde<w?w:r.desde, e=r.hasta>wEnd?wEnd:r.hasta;
        let l=lanes.findIndex(end=>end<s); if(l<0){ l=lanes.length; lanes.push(e); } else lanes[l]=e;
        const c0=daysBetween(w,s)+1, span=daysBetween(s,e)+1;
        const nm=a.id==='pd'?areaName(r.area):a.name;
        const tip=`${nm} · ${r.cerrada?'cerrada':'abierta'} · ${fechaLarga(r.desde)}${r.hasta!==r.desde?' – '+fechaLarga(r.hasta):''}`;
        h+=`<button class="cal-bar ${a.id}${r.cerrada?'':' open'}${s===r.desde?' s':''}${e===r.hasta?' e':''}" style="grid-row:${row+l};grid-column:${c0} / span ${span}" title="${escapeHtml(tip)}" onclick="admCalVer(${idx})" aria-label="${escapeHtml(tip)}">${span>1||a.id==='pd'?escapeHtml(nm):''}</button>`;
      });
      row+=Math.max(1,lanes.length);
    });
    h+=`</div>`;
  }
  h+=`<div class="cal-legend">${grupos.map(a=>`<span><i class="cal-sw ${a.id}"></i>${a.name}: ${cubre[a.id].size} de ${diasMes} días</span>`).join('')}<span><i class="cal-sw open"></i>abierta / sin cerrar</span></div>
    <div id="cal-detalle"><div class="muted" style="font-size:13px">Toca una barra para ver la recepción.</div></div>`;
  document.getElementById('adm-tab').innerHTML=h;
}

/* ── Códigos incorrectos: scans the receptor re-assigned by name because the barcode didn't match the product
   ("Código incorrecto en sistema"). Weekly / monthly list, grouped per product + scanned code, for comercial. ── */

    +(_admCod.length ? `<button class="btn btn-secondary btn-block" style="margin-bottom:10px" onclick="admCodigosCsv()">Descargar CSV para comercial</button>`
      +_admCod.map(r=>`<div class="adm-row"><div style="display:flex;gap:10px;align-items:center">${imgTag(r.sistema, r.producto, 'thumb')}<b style="flex:1;min-width:0">${nameHtml(r.producto)}</b></div>
        <div class="muted" style="font-size:13px;margin-top:4px">Escaneado: <b>${escapeHtml(r.escaneado)}</b> · En sistema: <b>${escapeHtml(r.sistema||'sin código')}</b>${r.dice?` · el código escaneado aparece como «${escapeHtml(r.dice)}»`:''}</div>
        <div class="muted" style="font-size:12px">${r.veces} vez${r.veces===1?'':'es'} · ${escapeHtml([...r.hubs].join(', '))} · última ${fechaLarga(r.ultima)}</div></div>`).join('')
      : '<div class="empty-hint">Sin códigos incorrectos en este periodo.</div>');
}
function admCodigosCsv(){

/* ── Proveedores: supplier insights for comercial (view only). Closed pd-* receptions whose session fecha falls in the
   range; latest close per session (a later reabrir / borrar hides it, as listCerradas). Lines come from
   cerrar.lineas_todas; closes saved before it existed read their report CSV (PD_REPORT_COLS); if that can't be read the
   reception still counts (recepciones, puntualidad) but is «sin detalle». Fill rate = Σ min(recibido, pedido) ÷ Σ pedido
   over order lines (pz and kg summed as they come). Excedente in modo botones is a flag without a quantity. ── */
const PV={ data:null, key:'', csv:new Map(), recs:[], prods:[] };
const PV_MOTIVO_INV={ 'fecha corta':'fecha_corta', 'dañada':'danada' };
function pvDefaults(){ if(!ADM.pvHasta){ const t=todayStr(); ADM.pvHasta=t; ADM.pvDesde=ymdAdd(t,-27); } if(ADM.pvHub==null) ADM.pvHub=''; }
function pvLinesFromCsv(text){
  const p=Papa.parse(stripBOM(String(text||'')), { header:true, skipEmptyLines:true });
  return (p.data||[]).map(r=>{
    const g=n=>String(pickCol(r,n)||'').trim(), num=n=>{ const v=parseNum(g(n)); return isNaN(v)?0:v; };
    const exc=g('Excedente'), mot=g('Motivo').toLowerCase();
    return { sku_key:skuKeyOf(cleanBC(g('Código')), g('Producto')), producto:g('Producto'), kgpz:g('Und')==='Kg'?'Kg':'Pz',
      pedido:num('Pedido'), recibido:num('Recibido'), excedente:exc==='Sí'?true:(num('Excedente')||undefined),
      rechazadas:num('Rechazadas')||undefined, motivo:PV_MOTIVO_INV[mot]||mot||undefined,
      faltante:num('Faltante')||undefined, no_solicitado:g('Estado')==='No solicitado'||undefined, _fac:g('Estado')===FAC_ESTADO_SIN_PEDIR };
  }).filter(l=>l.producto && !l._fac).map(({ _fac, ...l })=>l);
}
async function pvLoad(){
  const key=[ADM.pvDesde, ADM.pvHasta, ADM.pvHub].join('|');
  if(PV.data && PV.key===key) return PV.data;
  const evs=await pgSelectAll('rec_events', `tipo=in.(cerrar,admin)&area=like.pd-*&fecha=gte.${ADM.pvDesde}&fecha=lte.${ADM.pvHasta}`
    +`${ADM.pvHub?`&hub=eq.${encodeURIComponent(ADM.pvHub)}`:''}&select=id,session_id,hub,area,fecha,tipo,receptor,detalle,ts&order=id.desc`);
  const seen=new Map();
  for(const e of evs){
    if(seen.has(e.session_id) || (e.hub==='test-hub' && !IS_LOCAL)) continue;
    const d=e.detalle||{};
    if(e.tipo==='cerrar'){ if(d.proveedor) PD_NAMES[e.area]=d.proveedor; seen.set(e.session_id, Object.assign({ ts:e.ts, fecha:e.fecha, hub:e.hub, area:e.area, receptor:e.receptor, session_id:e.session_id }, d)); }
    else if(d.accion==='reabrir' || d.accion==='borrar') seen.set(e.session_id, null);
  }
  const recs=[...seen.values()].filter(Boolean).map(c=>({ info:c, prov:c.proveedor||areaName(c.area), lines:Array.isArray(c.lineas_todas)?c.lineas_todas:null, fuente:Array.isArray(c.lineas_todas)?'evento':null }));
  await Promise.all(recs.filter(r=>!r.lines && r.info.reporte).map(async r=>{
    if(!PV.csv.has(r.info.reporte)){ try{ PV.csv.set(r.info.reporte, pvLinesFromCsv(await sbFetch(r.info.reporte))); }catch(e){ if(isNetErr(e)) throw e; PV.csv.set(r.info.reporte, null); } }
    r.lines=PV.csv.get(r.info.reporte); if(r.lines) r.fuente='reporte';
  }));
  recs.sort((a,b)=>b.info.fecha.localeCompare(a.info.fecha) || Date.parse(b.info.ts)-Date.parse(a.info.ts));
  PV.key=key; PV.data=recs; return recs;
}
function pvNew(){ return { recs:0, sinDet:0, hubs:new Set(), lineas:0, completas:0, ped:0, ok:0, excL:0, excFlag:0, excQ:{}, rech:{}, rechL:0, faltL:0, faltQ:{}, pnsL:0, antes:0, aTiempo:0, tarde:0, diasTarde:0, sinFecha:0 }; }
function pvAddQ(o,k,v){ o[k]=round2((o[k]||0)+(Number(v)||0)); }
// Days between the order's delivery date and the reception (closest of the ticked OCs): <0 early, 0 on time, >0 late
function pvDias(info){
  let best=null; for(const f of (info.fechas_entrega||[]).filter(Boolean)){ const d=daysBetween(f, info.fecha); if(best==null || Math.abs(d)<Math.abs(best)) best=d; }
  return best;
}
function pvAddRec(a, r){
  a.recs++; a.hubs.add(r.info.hub);
  const d=pvDias(r.info);
  if(d==null) a.sinFecha++; else if(d<0) a.antes++; else if(d===0) a.aTiempo++; else { a.tarde++; a.diasTarde+=d; }
  if(!r.lines){ a.sinDet++; return; }
  for(const l of r.lines) pvAddLine(a, l);
}
function pvAddLine(a, l){
  if(l.no_solicitado){ a.pnsL++; return; }
  const P=Number(l.pedido)||0;
  a.lineas++; a.ped+=P; a.ok+=Math.min(Number(l.recibido)||0, P);
  if(!l.faltante && !l.rechazadas) a.completas++;
  if(l.excedente){ a.excL++; if(typeof l.excedente==='number') pvAddQ(a.excQ, l.kgpz, l.excedente); else a.excFlag++; }
  if(l.rechazadas){ const m=l.motivo||'otro', x=a.rech[m]||(a.rech[m]={ l:0, q:{} }); x.l++; a.rechL++; pvAddQ(x.q, l.kgpz, l.rechazadas); }
  if(l.faltante){ a.faltL++; pvAddQ(a.faltQ, l.kgpz, l.faltante); }
}
const pvFr=a=>a.ped>0 ? a.ok/a.ped : null;
const pvPct=(n,d)=>d ? (Math.round(n*1000/d)/10)+'%' : '—';
function pvFrTxt(a){ const f=pvFr(a); return f==null?'—':(Math.round(f*1000)/10)+'%'; }
function pvQ(o){ const p=[]; if(o.Pz) p.push(fmtQty(o.Pz,'Pz')+' pz'); if(o.Kg) p.push(fmtQty(o.Kg,'Kg')+' kg'); return p.join(' + ')||'0'; }
const pvWeek=ymd=>ymdAdd(ymd, -ymdDow(ymd));
const PV_RECH=[['fecha_corta','Fecha corta'],['danada','Dañada']];
function pvRechL(a, m){ return a.rech[m]?a.rech[m].l:0; }
// Chips for one supplier / product: only what happened
function pvChips(a, prod){
  const c=[];
  if(a.excL) c.push(prod?`Excedente ${a.excL}`:`Excedente ${a.excL} de ${a.lineas} línea${a.lineas===1?'':'s'}`);
  for(const [m,n] of PV_RECH) if(pvRechL(a,m)) c.push(`${n} ${a.rech[m].l}`);
  for(const m of Object.keys(a.rech)) if(!PV_RECH.some(x=>x[0]===m)) c.push(`Rechazo ${a.rech[m].l}`);
  if(a.faltL) c.push(`Faltante ${a.faltL}`);
  if(a.pnsL) c.push(`No solicitados ${a.pnsL}`);
  if(a.tarde) c.push(`Tarde ${a.tarde} de ${a.recs}`);
  return c.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join(' ');
}
function pvBar(a){ const f=pvFr(a); return `<div class="pv-bar"><i style="width:${f==null?0:Math.min(100,f*100).toFixed(1)}%"></i></div>`; }
function pvByProv(recs){
  const m=new Map();
  for(const r of recs){ if(!m.has(r.prov)) m.set(r.prov, pvNew()); pvAddRec(m.get(r.prov), r); }
  return m;
}
// Per product of the given receptions: aggregate + history (key = proveedor|sku_key; latest name wins)
function pvProducts(recs){
  const m=new Map();
  for(const r of recs){ if(!r.lines) continue;
    for(const l of r.lines){
      const k=r.prov+'|'+l.sku_key;
      let p=m.get(k); if(!p){ p=Object.assign(pvNew(), { prov:r.prov, sku:l.sku_key, producto:l.producto, kgpz:l.kgpz, veces:0, hist:[] }); m.set(k, p); }
      p.veces++; pvAddLine(p, l); p.hist.push({ r, l });
    }
  }
  return [...m.values()];
}
const pvIssues=p=>p.excL+p.rechL+p.faltL+p.pnsL;
function pvLineTxt(l){
  const q=v=>fmtQty(v,l.kgpz), u=unitOf(l.kgpz);
  if(l.no_solicitado) return 'No solicitado'+(typeof l.excedente==='number'?` · ${q(l.excedente)} ${u} devueltas`:'')+' (se rechazó)';
  const p=[`Pedido ${q(l.pedido)} ${u}`, `Recibido ${q(l.recibido)}`];
  if(l.excedente) p.push(typeof l.excedente==='number'?`Excedente ${q(l.excedente)} (devuelto)`:'Llegó excedente (rechazado)');
  if(l.rechazadas) p.push(`Rechazadas ${q(l.rechazadas)} (${PD_MOTIVO[l.motivo]||l.motivo||'sin motivo'})`);
  if(l.faltante) p.push(`Faltan ${q(l.faltante)}`);
  return p.join(' · ');
}
function pvFecha(k, v){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
  if(k==='desde') ADM.pvDesde=v; else ADM.pvHasta=v;
  if(ADM.pvDesde>ADM.pvHasta){ if(k==='desde') ADM.pvHasta=v; else ADM.pvDesde=v; }
  renderAdmin();
}
function pvRango(v){
  const t=todayStr();
  if(v==='mes'){ ADM.pvDesde=t.slice(0,7)+'-01'; ADM.pvHasta=t; }
  else if(v==='mesant'){ const ini=ymdAdd(t.slice(0,7)+'-01',-1).slice(0,7)+'-01'; ADM.pvDesde=ini; ADM.pvHasta=ymdAdd(t.slice(0,7)+'-01',-1); }
  else if(v){ ADM.pvDesde=ymdAdd(t,-(Number(v)-1)); ADM.pvHasta=t; }
  renderAdmin();
}
function pvVer(i){ ADM.pvSel=PV.provs[i]; renderAdmin(); window.scrollTo(0,0); }
function pvVolver(){ ADM.pvSel=null; renderAdmin(); }
async function admProveedores(){
  pvDefaults();
  const el=document.getElementById('adm-tab'), t=todayStr();
  const pre=[['28','Últimas 4 semanas'],['56','Últimas 8 semanas'],['91','Últimas 13 semanas'],['mes','Este mes'],['mesant','Mes pasado']];
  const preSel=pre.find(([k])=>k==='mes'?ADM.pvDesde===t.slice(0,7)+'-01'&&ADM.pvHasta===t:k==='mesant'?false:ADM.pvHasta===t&&ADM.pvDesde===ymdAdd(t,-(Number(k)-1)));
  const filtros=`<div class="filters"><select onchange="ADM.pvHub=this.value;renderAdmin()" aria-label="Hub"><option value="">Todos los hubs</option>${ADM_HUBS().map(x=>`<option value="${x.slug}" ${ADM.pvHub===x.slug?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}</select>
      <select onchange="pvRango(this.value)" aria-label="Periodo"><option value="">${preSel?'Otro periodo':'Periodo elegido'}</option>${pre.map(([k,n])=>`<option value="${k}" ${preSel&&preSel[0]===k?'selected':''}>${n}</option>`).join('')}</select></div>
    <div class="adm-field pv-fechas" style="margin:0 0 6px"><span>Del</span><input type="date" value="${ADM.pvDesde}" onchange="pvFecha('desde',this.value)" aria-label="Desde"><span>al</span><input type="date" value="${ADM.pvHasta}" onchange="pvFecha('hasta',this.value)" aria-label="Hasta"></div>`;
  el.innerHTML=filtros+'<div class="muted">Cargando recepciones…</div>';
  const recs=await pvLoad();
  if(ADM.tab!=='prov') return;
  const byProv=pvByProv(recs);
  PV.provs=[...byProv.keys()];
  if(ADM.pvSel && byProv.has(ADM.pvSel)) return pvDetalle(el, filtros, recs.filter(r=>r.prov===ADM.pvSel), byProv.get(ADM.pvSel));
  ADM.pvSel=null;
  const tot=pvNew(); recs.forEach(r=>pvAddRec(tot, r));
  let h=filtros+`<div class="muted" style="font-size:13px">Recepciones de proveedor directo cerradas, por fecha de la recepción. Fill rate = lo recibido (sin pasar de lo pedido) ÷ lo pedido.</div>`;
  if(!recs.length){ el.innerHTML=h+'<div class="empty-hint" style="margin-top:12px">Sin recepciones de proveedor cerradas en este periodo.</div>'; return; }
  h+=`<div class="stat-grid">
    <div class="stat"><div class="stat-n" style="color:var(--c-teal-dark)">${pvFrTxt(tot)}</div><div class="stat-l">fill rate</div></div>
    <div class="stat"><div class="stat-n">${tot.recs}</div><div class="stat-l">recepciones · ${byProv.size} proveedor${byProv.size===1?'':'es'}</div></div>
    <div class="stat"><div class="stat-n">${pvPct(tot.excL, tot.lineas)}</div><div class="stat-l">líneas con excedente</div></div>
    <div class="stat"><div class="stat-n">${pvPct(tot.aTiempo, tot.recs-tot.sinFecha)}</div><div class="stat-l">entregas el día programado</div></div></div>`;
  if(tot.sinDet) h+=`<div class="warn-box">${tot.sinDet} recepción(es) sin detalle por producto (no se pudo leer su reporte): cuentan en recepciones y puntualidad, no en fill rate.</div>`;
  h+=`<div class="row2" style="margin-bottom:6px"><button class="btn btn-secondary" onclick="pvCsv('prov')">CSV por proveedor</button><button class="btn btn-secondary" onclick="pvCsv('prod')">CSV por producto</button></div>`;
  const orden=[...byProv.entries()].map(([p,a],i)=>({ p, a, i:PV.provs.indexOf(p) })).sort((x,y)=>(pvFr(x.a)??2)-(pvFr(y.a)??2) || y.a.recs-x.a.recs || x.p.localeCompare(y.p));
  h+=`<div class="section-title">Proveedores · peor fill rate primero</div>`+orden.map(({p,a,i})=>`<div class="adm-row pv-row" role="button" tabindex="0" onclick="pvVer(${i})" onkeydown="if(event.key==='Enter')pvVer(${i})">

function pvDetalle(el, filtros, recs, a){
  const prov=ADM.pvSel, prods=pvProducts(recs);
  prods.sort((x,y)=>(pvFr(x)??2)-(pvFr(y)??2) || pvIssues(y)-pvIssues(x) || x.producto.localeCompare(y.producto));
  PV.recs=recs; PV.prods=prods;
  const conFecha=a.recs-a.sinFecha;
  let h=`<button class="link-btn" style="margin:0 0 4px;padding-left:0" onclick="pvVolver()">← Todos los proveedores</button>${filtros}
    <h2>${escapeHtml(prov)}</h2><div class="muted" style="font-size:13px">${fechaLarga(ADM.pvDesde)} – ${fechaLarga(ADM.pvHasta)} · ${escapeHtml([...a.hubs].map(hubName).join(', '))}</div>
    <div class="stat-grid">
    <div class="stat"><div class="stat-n" style="color:var(--c-teal-dark)">${pvFrTxt(a)}</div><div class="stat-l">fill rate · ${a.lineas} líneas</div></div>
    <div class="stat"><div class="stat-n">${a.recs}</div><div class="stat-l">recepciones${a.sinDet?` · ${a.sinDet} sin detalle`:''}</div></div>

    <div class="stat"><div class="stat-n">${pvPct(a.excL, a.lineas)}</div><div class="stat-l">líneas con excedente · ${a.excL} de ${a.lineas}${Object.keys(a.excQ).length?` · ${pvQ(a.excQ)} de más`:''}</div></div>
    ${PV_RECH.map(([m,n])=>`<div class="stat"><div class="stat-n">${pvRechL(a,m)}</div><div class="stat-l">líneas con rechazo: ${n.toLowerCase()}${pvRechL(a,m)?' · '+pvQ(a.rech[m].q):''}</div></div>`).join('')}
    <div class="stat"><div class="stat-n">${a.faltL}</div><div class="stat-l">líneas con faltante${a.faltL?' · '+pvQ(a.faltQ):''}</div></div>
    <div class="stat"><div class="stat-n">${a.pnsL}</div><div class="stat-l">productos no solicitados</div></div>
    <div class="stat" style="grid-column:1 / -1"><div class="stat-n">${pvPct(a.aTiempo, conFecha)}</div><div class="stat-l">el día programado (${a.aTiempo} de ${conFecha}) · ${a.antes} antes · ${a.tarde} tarde${a.tarde?` (promedio ${Math.round(a.diasTarde*10/a.tarde)/10} día${a.diasTarde===a.tarde?'':'s'})`:''}</div></div></div>`
    +(a.excFlag?`<div class="muted" style="font-size:12px">${a.excFlag} línea${a.excFlag===1?'':'s'} con excedente sin cantidad: en las recepciones con botones el excedente se marca, no se cuenta.</div>`:'');
  // Weekly trend: every week of the range, Monday first
  const wk=new Map(); recs.forEach(r=>{ const w=pvWeek(r.info.fecha); if(!wk.has(w)) wk.set(w, pvNew()); pvAddRec(wk.get(w), r); });
  h+=`<div class="section-title">Por semana (fill rate)</div>`;
  for(let w=pvWeek(ADM.pvHasta); w>=pvWeek(ADM.pvDesde); w=ymdAdd(w,-7)){
    const x=wk.get(w);
    h+=`<div class="pv-week"><span>${fechaLarga(w).replace(/ de (\w{3})\w*/,' $1')}</span>${x?pvBar(x):'<div class="pv-bar"></div>'}<b>${x?pvFrTxt(x):''}</b></div>
      <div class="pv-week-sub">${x?`${x.recs} recepci${x.recs===1?'ón':'ones'}${x.excL?` · excedente ${x.excL}`:''}${x.rechL?` · rechazo ${x.rechL}`:''}${x.faltL?` · faltante ${x.faltL}`:''}${x.tarde?` · ${x.tarde} tarde`:''}`:'sin entregas'}</div>`;
  }
  h+=`<div class="section-title">Recepciones · ${recs.length}</div>`+recs.map((r,i)=>{ const x=pvNew(); pvAddRec(x, r); const d=pvDias(r.info);
    return `<div class="adm-row"><div class="pv-head"><b>${fechaLarga(r.info.fecha)} · ${escapeHtml(hubName(r.info.hub))}</b><span class="pv-fr">${pvFrTxt(x)}</span></div>
      <div class="muted" style="font-size:12px">${r.info.num_oc&&r.info.num_oc.length?'OC '+r.info.num_oc.map(escapeHtml).join(', ')+' · ':''}${d==null?'sin fecha programada':d===0?'el día programado':d<0?`${-d} día${d===-1?'':'s'} antes`:`${d} día${d===1?'':'s'} tarde`}${r.info.modo==='botones'?' · botones':''}${!r.lines?' · sin detalle':r.fuente==='reporte'?' · leído del reporte':''}</div>
      <div class="pv-chips">${pvChips(Object.assign(x,{tarde:0}))}</div>
      <div class="btns"><button class="btn btn-secondary" onclick="openRecepcion(PV.recs[${i}].info,'admin')">Ver</button></div></div>`; }).join('');
  h+=`<div class="section-title">Productos · ${prods.length} · peor fill rate primero</div>
    <button class="btn btn-secondary btn-block" style="margin-bottom:8px" onclick="pvCsv('prod', ${PV.provs.indexOf(prov)})">CSV de productos de ${escapeHtml(prov)}</button>`
    +prods.map(p=>`<details class="adm-row pv-prod"><summary><div class="pv-head"><b>${nameHtml(p.producto)}</b><span class="pv-fr">${p.lineas?pvFrTxt(p):'—'}</span></div>
      <div class="muted" style="font-size:12px">${p.lineas?`Pedido ${p.lineas} ve${p.lineas===1?'z':'ces'} · ${pvQ({[p.kgpz]:p.ped})} pedidas · ${pvQ({[p.kgpz]:p.ok})} recibidas`:'No estaba en la orden'}</div>
      <div class="pv-chips">${pvChips(p, true)}</div></summary>
      ${p.hist.map(({r,l})=>`<div class="pv-hist"><b>${fechaLarga(r.info.fecha)} · ${escapeHtml(hubName(r.info.hub))}</b> — ${escapeHtml(pvLineTxt(l))}</div>`).join('')}</details>`).join('');
  el.innerHTML=h;
}
function pvCsv(kind, provIdx){
  const recs=PV.data||[], rango=`${ADM.pvDesde}_${ADM.pvHasta}`, hub=ADM.pvHub?hubName(ADM.pvHub):'Todos los hubs';

  let cols, rows, name;
  if(kind==='prov'){
    cols=['Proveedor','Hubs','Desde','Hasta','Recepciones','Recepciones sin detalle','Líneas pedidas','Pedido','Recibido (hasta lo pedido)','Fill rate %','Líneas completas %',
      'Líneas con excedente','Líneas con excedente %','Excedente contado pz','Excedente contado kg','Excedente sin cantidad (líneas)',
      'Rechazo fecha corta (líneas)','Rechazo fecha corta pz','Rechazo fecha corta kg','Rechazo dañada (líneas)','Rechazo dañada pz','Rechazo dañada kg',
      'Faltante (líneas)','Faltante pz','Faltante kg','No solicitados (líneas)','Entregas el día programado','Entregas antes','Entregas tarde','Días tarde promedio'];
    rows=[...pvByProv(recs).entries()].sort((x,y)=>x[0].localeCompare(y[0])).map(([p,a])=>{ const R=m=>a.rech[m]||{ l:0, q:{} };
      return [p, [...a.hubs].map(hubName).join(', '), ADM.pvDesde, ADM.pvHasta, a.recs, a.sinDet, a.lineas, n(a.ped), n(a.ok), a.ped?pct(a.ok,a.ped):'', pct(a.completas,a.lineas),
        a.excL, pct(a.excL,a.lineas), q(a.excQ,'Pz'), q(a.excQ,'Kg'), a.excFlag||'',
        R('fecha_corta').l, q(R('fecha_corta').q,'Pz'), q(R('fecha_corta').q,'Kg'), R('danada').l, q(R('danada').q,'Pz'), q(R('danada').q,'Kg'),
        a.faltL, q(a.faltQ,'Pz'), q(a.faltQ,'Kg'), a.pnsL, a.aTiempo, a.antes, a.tarde, a.tarde?String(Math.round(a.diasTarde*10/a.tarde)/10):'']; });
    name=`proveedores_${fileSafe(hub)}_${rango}.csv`;
  } else {
    const prov=provIdx==null?null:PV.provs[provIdx];
    cols=['Proveedor','Código','Producto','Und','Veces pedido','Pedido','Recibido (hasta lo pedido)','Fill rate %','Veces completo','Veces con excedente','Excedente contado',
      'Veces con rechazo fecha corta','Rechazadas fecha corta','Veces con rechazo dañada','Rechazadas dañada','Veces con faltante','Faltante','Veces no solicitado','Hubs','Desde','Hasta'];
    rows=pvProducts(prov?recs.filter(r=>r.prov===prov):recs).sort((x,y)=>x.prov.localeCompare(y.prov) || x.producto.localeCompare(y.producto)).map(p=>{ const R=m=>p.rech[m]||{ l:0, q:{} };
      return [p.prov, p.sku.startsWith('name:')?'':p.sku, p.producto, p.kgpz, p.lineas, n(p.ped), n(p.ok), p.ped?pct(p.ok,p.ped):'', p.completas, p.excL, q(p.excQ,p.kgpz),
        R('fecha_corta').l, q(R('fecha_corta').q,p.kgpz), R('danada').l, q(R('danada').q,p.kgpz), p.faltL, q(p.faltQ,p.kgpz), p.pnsL,
        [...new Set(p.hist.map(x=>hubName(x.r.info.hub)))].join(', '), ADM.pvDesde, ADM.pvHasta]; });
    name=`productos-proveedor_${fileSafe(prov||hub)}_${rango}.csv`;
  }
  downloadText(name, [cols.map(csvCell).join(',')].concat(rows.map(r=>r.map(csvCell).join(','))).join('\r\n')+'\r\n');
}

/* ════════════════════════════════════════════════════════════════════════════════════
   CAMERA (copied from sorting-hub — BarcodeDetector, html5-qrcode fallback)
   ════════════════════════════════════════════════════════════════════════════════════ */
const CAMERA_FORMATS_NATIVE=['ean_13','ean_8','upc_a','upc_e','code_128'];
let _cameraStream=null, _cameraRAF=null, _cameraDetecting=false, _html5Qrcode=null, _html5QrcodeLoaded=false;
let _activeTrack=null, _torchMode=null, _torchOn=false, _cameraSession=0;
function loadHtml5Qrcode(){
  if(_html5QrcodeLoaded) return Promise.resolve();
  return new Promise((resolve, reject)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
    s.onload=()=>{ _html5QrcodeLoaded=true; resolve(); };
    s.onerror=()=>reject(new Error('load-failed'));
    document.head.appendChild(s);
  });
}
function showCameraError(e){
  const hint=document.getElementById('camera-hint'), name=e && e.name;
  if(name==='NotAllowedError' || name==='PermissionDeniedError') hint.textContent='Permite la cámara en la configuración del navegador.';
  else if(name==='NotFoundError' || name==='DevicesNotFoundError') hint.textContent='No se encontró una cámara en este dispositivo.';
  else if(name==='NotSupportedError') hint.textContent='Este navegador no soporta la cámara aquí. Usa el escáner o el teclado.';
  else hint.textContent='No se pudo abrir la cámara. Intenta de nuevo.';
}
function setTorchAvailability(caps){ document.getElementById('camera-torch-btn').style.display=(caps && caps.torch)?'inline-flex':'none'; _torchOn=false; }
async function toggleTorch(){
  _torchOn=!_torchOn;
  try{
    if(_torchMode==='native' && _activeTrack) await _activeTrack.applyConstraints({ advanced:[{ torch:_torchOn }] });
    else if(_torchMode==='html5qrcode' && _html5Qrcode) await _html5Qrcode.applyVideoConstraints({ advanced:[{ torch:_torchOn }] });
  }catch(_){ _torchOn=!_torchOn; }
}
function onCameraDetect(code){ closeCamera(); processScan(code, 'camara'); }
async function openCamera(){

async function startNativeDetector(session){

    if(session!==_cameraSession){ stream.getTracks().forEach(t=>t.stop()); return; }

      try{ const codes=await detector.detect(video); if(codes && codes.length){ onCameraDetect(codes[0].rawValue); return; } }catch(_){}

    };

  }catch(e){ if(session===_cameraSession) showCameraError(e); }
}
async function startHtml5Qrcode(session){
  try{
    await loadHtml5Qrcode();

    const F=Html5QrcodeSupportedFormats;

}

// Code 128-B, for the printable list (any scanner or the app's camera reads it)
const C128='212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112'.split(' ');
function demoC128(text, h=56){
  const v=[104, ...[...String(text)].map(c=>c.charCodeAt(0)-32)]; let sum=104; for(let i=1;i<v.length;i++) sum+=v[i]*i; v.push(sum%103, 106);
  let x=12, bars='';
  for(const n of v){ const w=C128[n]; for(let i=0;i<w.length;i++){ const k=+w[i]; if(i%2===0) bars+=`<rect x="${x}" y="0" width="${k}" height="${h}"/>`; x+=k; } }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${x+12} ${h}" width="${(x+12)*2}" height="${h}" style="max-width:100%"><rect width="100%" height="100%" fill="#fff"/><g fill="#000">${bars}</g></svg>`;
}

  chip.textContent=`Llegaron ${fmtQty(x.llego,x.kgpz)} ${unitOf(x.kgpz)}${x.nota?' · '+x.nota:''}`; chip.style.display='block';
  clearTimeout(DUI.chipT); DUI.chipT=setTimeout(()=>{ chip.style.display='none'; }, 20000);

async function boot(){
